        if (inventoryViewport.hasPointerCapture(event.pointerId)) {
          inventoryViewport.releasePointerCapture(event.pointerId);
        }

        inventoryPageDragState.active = false;
        inventoryPageDragState.moved = false;
        inventoryPageDragState.pointerId = null;

        /*
          단순 탭에서는 페이지 위치나 pagination DOM을 갱신하지 않습니다.
          iOS Safari는 pointerup 중 조상 트랙의 transform이 다시 적용되면
          버튼에 이어서 발생해야 할 click을 취소할 수 있습니다.
        */
        if (!didMove) return;

        const pageWidth = getInventoryPageWidth();
        let targetPage = inventoryCurrentPage;

        if (Math.abs(deltaX) >= Math.max(42, pageWidth * 0.18)) {
          targetPage += deltaX < 0 ? 1 : -1;
        }

        suppressInventoryClickUntil = performance.now() + 300;
        goToInventoryPage(targetPage, true);
      }

      inventoryViewport.addEventListener("pointerdown", startInventoryPageDrag);
      inventoryViewport.addEventListener("pointermove", moveInventoryPageDrag);
      inventoryViewport.addEventListener("pointerup", endInventoryPageDrag);
      inventoryViewport.addEventListener("pointercancel", endInventoryPageDrag);

      function activateInventoryItem(item) {
        const itemType = item.dataset.item || "";
        clearInventoryItemNewState(itemType);

        if (itemType === "handgunAmmo" && hasHandgunAmmo) {
          playSound(INVENTORY_SET_SOUND);
          showToast(HANDGUN_AMMO_SELECTED_TOAST_MESSAGE);
          return;
        }

        if (itemType === "shotgunAmmo" && hasShotgunAmmo) {
          playSound(INVENTORY_SET_SOUND);
          showToast(SHOTGUN_AMMO_SELECTED_TOAST_MESSAGE);
          return;
        }

        if (itemType === "rifleAmmo" && hasRifleAmmo) {
          playSound(INVENTORY_SET_SOUND);
          showToast(RIFLE_AMMO_SELECTED_TOAST_MESSAGE);
          return;
        }

        if (itemType === "chainsawBattery" && hasChainsawBattery) {
          playSound(INVENTORY_SET_SOUND);
          showToast(CHAINSAW_BATTERY_SELECTED_TOAST_MESSAGE);
          return;
        }

        if (itemType === "axe" && hasAxe) {
          const willEquip = getEquippedWeapon() !== "axe";
          playSound(willEquip ? GET_AXE_SOUND : INVENTORY_SET_SOUND, willEquip ? 0.7 : 1);
          setEquippedWeapon(willEquip ? "axe" : "");
          if (willEquip) showToast(AXE_SELECTED_TOAST_MESSAGE);
          return;
        }

        if (itemType === "handgun" && hasHandgun) {
          const willEquip = getEquippedWeapon() !== "handgun";
          playSound(willEquip ? HANDGUN_EQUIP_SOUND : INVENTORY_SET_SOUND);
          setEquippedWeapon(willEquip ? "handgun" : "");
          if (willEquip) showToast(HANDGUN_SELECTED_TOAST_MESSAGE);
          return;
        }

        if (itemType === "shotgun" && hasShotgun) {
          const willEquip = getEquippedWeapon() !== "shotgun";
          playSound(willEquip ? SHOTGUN_EQUIP_SOUND : INVENTORY_SET_SOUND);
          setEquippedWeapon(willEquip ? "shotgun" : "");
          if (willEquip) showToast(SHOTGUN_SELECTED_TOAST_MESSAGE);
          return;
        }

        if (itemType === "rifle" && hasRifle) {
          const willEquip = getEquippedWeapon() !== "rifle";
          playSound(willEquip ? RIFLE_EQUIP_SOUND : INVENTORY_SET_SOUND);
          setEquippedWeapon(willEquip ? "rifle" : "");
          if (willEquip) showToast(RIFLE_SELECTED_TOAST_MESSAGE);
          return;
        }

        if (itemType === "chainsaw" && hasChainsaw) {
          if (chainsawBatteryPercent <= 0) {
            showChainsawNoPowerFeedback();
            setEquippedWeapon("");
            return;
          }
          const willEquip = getEquippedWeapon() !== "chainsaw";
          if (!willEquip) playSound(INVENTORY_SET_SOUND);
          setEquippedWeapon(willEquip ? "chainsaw" : "", { startChainsaw: false });
          if (willEquip) {
            startChainsawBatteryDrain();
            playChainsawEquipThenIdle();
            showToast(CHAINSAW_SELECTED_TOAST_MESSAGE);
          }
          return;
        }

        if (itemType === "musicBox" && hasMusicBox) {
          const willTurnMusicOn = !isMusicOn;
          playSound(INVENTORY_SET_SOUND);
          setMusicOn(willTurnMusicOn);
          if (willTurnMusicOn) {
            showToast(MUSIC_BOX_SELECTED_TOAST_MESSAGE);
          }
          return;
        }

        if (itemType === "strangerLetter" && hasStrangerLetter) {
          const willTurnLetterOn = !isStrangerLetterOn;
          playSound(INVENTORY_SET_SOUND);
          isStrangerLetterOn = willTurnLetterOn;
          if (willTurnLetterOn) {
            showToast(STRANGER_LETTER_SELECTED_TOAST_MESSAGE);
          }
          updateTodoListUI();
          applyInventoryState();
          saveResourceState();
          return;
        }

        if (itemType === "compass" && hasCompass) {
          playSound(INVENTORY_SET_SOUND);
          showToast(COMPASS_SELECTED_TOAST_MESSAGE);
          return;
        }

        if (itemType === "carParts" && carPartsCount > 0) {
          playSound(INVENTORY_SET_SOUND);
          showToast(CAR_PARTS_SELECTED_TOAST_MESSAGE);
          return;
        }

        if (itemType === "fuel" && fuelCount > 0) {
          playSound(INVENTORY_SET_SOUND);
          showToast(FUEL_SELECTED_TOAST_MESSAGE);
          return;
        }

        if (itemType === "repairKit" && repairKitCount > 0) {
          playSound(INVENTORY_SET_SOUND);
          showToast(REPAIR_KIT_SELECTED_TOAST_MESSAGE);
          return;
        }

        if (itemType === "map" && hasMap) {
          playSound(INVENTORY_SET_SOUND);
          showToast(MAP_SELECTED_TOAST_MESSAGE);
          return;
        }

        if (itemType === "flowers" && flowerCount > 0) {
          playSound(INVENTORY_SET_SOUND);
          return;
        }

        if (itemType in paintCounts && paintCounts[itemType] > 0) {
          playSound(INVENTORY_SET_SOUND);
          showToast(PAINT_SELECTED_TOAST_MESSAGE);
        }
      }

      for (const item of inventoryItems) {
        let touchPointerId = null;

        item.addEventListener("mouseenter", () => {
          clearInventoryItemNewState(item.dataset.item || "");
        });

        /*
          이동된 페이지의 버튼은 일부 모바일 브라우저에서 pointerup 뒤에
          click이 생성되지 않을 수 있으므로 터치 입력은 pointerup에서 직접 처리합니다.
          실제 페이지 드래그로 판정된 입력은 실행하지 않습니다.
        */
        item.addEventListener("pointerdown", (event) => {
          if (event.pointerType === "mouse" || !event.isPrimary) return;
          touchPointerId = event.pointerId;
        });

        item.addEventListener("pointercancel", (event) => {
          if (event.pointerId === touchPointerId) touchPointerId = null;
        });

        item.addEventListener("pointerup", (event) => {
          if (
            event.pointerType === "mouse" ||
            event.pointerId !== touchPointerId
          ) {
            return;
          }

          touchPointerId = null;
          if (inventoryPageDragState.moved) return;

          // 뒤이어 click이 생성되는 브라우저에서는 같은 탭이 두 번 실행되지 않게 합니다.
          suppressInventoryClickUntil = performance.now() + 500;
          activateInventoryItem(item);
        });

        item.addEventListener("click", () => {
          if (performance.now() < suppressInventoryClickUntil) return;
          activateInventoryItem(item);
        });
      }

      // 저장된 Music Box가 On인데 브라우저가 자동 재생을 막은 경우,
      // 다음 일반 클릭에서 현재 낮/밤 트랙 재생을 다시 시도합니다.
      document.addEventListener("click", () => {
        if (hasMusicBox && isMusicOn && !bgmStarted) {
          startBgmPlayback();
        }
        if (
          document.body.classList.contains("is-rainy") &&
          !rainAmbientStarted
        ) {
          startRainAmbientPlayback();
        }
        if (
          isChainsawEquipped &&
          chainsawBatteryPercent > 0 &&
          chainsawIdleAudio.paused
        ) {
          startChainsawIdleSound();
        }
      });

      document.addEventListener("keydown", (event) => {
        if (event.key !== "Escape") return;
        closeExplorationMenu();
        closeInventory();
        closeRepair();
      });

      for (const option of explorationOptions) {
        const destination = option.dataset.destination || "";

        option.addEventListener("mouseenter", () => {
          clearExplorationDestinationNewState(destination);
        });

        option.addEventListener("click", () => {
          clearExplorationDestinationNewState(destination);
          handleExplorationDestination(destination);
        });
      }

      versionNumber.textContent = GAME_VERSION;
      versionTestButton.classList.toggle("is-test-active", TEST_MODE);
      versionTestButton.tabIndex = TEST_MODE ? 0 : -1;
      versionTestButton.addEventListener("pointerdown", handleVersionLabelTestAction);

      viewport.addEventListener("pointerdown", startBackgroundDrag);
      viewport.addEventListener("pointermove", moveBackgroundDrag);
      viewport.addEventListener("pointerup", endBackgroundDrag);
      viewport.addEventListener("pointercancel", endBackgroundDrag);

      window.addEventListener("resize", () => {
        updateWorldScale();
        syncRainDropCount();
        updateRainDropViewportMotion();
        refreshStructureSafeZones();
        updateInventoryPagePosition(false);
        if (isRepairOpen) applyRepairState();
        scheduleEmptyFieldZombieSpawn();
        scheduleEmptyFieldDeerSpawn();
      });

      function handlePopulationVisibilityChange() {
        if (document.visibilityState === "hidden") {
          pausePopulationTimersForBackground();
          pauseChainsawForBackground();
          return;
        }

        refreshPopulationAfterResume();
        resumeChainsawAfterBackground();
      }

      window.addEventListener("pagehide", () => {
        pausePopulationTimersForBackground();
        pauseChainsawForBackground();
      });
      window.addEventListener("pageshow", () => {
        refreshPopulationAfterResume();
        resumeChainsawAfterBackground();
      });
      window.addEventListener("blur", () => {
        pausePopulationTimersForBackground();
        pauseChainsawForBackground();
      });
      window.addEventListener("focus", () => {
        refreshPopulationAfterResume();
        resumeChainsawAfterBackground();
      });
      document.addEventListener(
        "visibilitychange",
        handlePopulationVisibilityChange
      );
      // 구형 iOS Safari 대응용 이벤트입니다.
      document.addEventListener(
        "webkitvisibilitychange",
        handlePopulationVisibilityChange
      );
      // 지원 브라우저에서는 Page Lifecycle API도 함께 사용합니다.
      document.addEventListener("freeze", () => {
        pausePopulationTimersForBackground();
        pauseChainsawForBackground();
      });
      document.addEventListener("resume", () => {
        refreshPopulationAfterResume();
        resumeChainsawAfterBackground();
      });

      async function initializeGame() {
        // 이미지 로딩 전에도 개별 빗줄기를 만듭니다.
        initializeRainDrops();

        // 공격에 쓰이는 좀비/사슴 스프라이트까지 디코딩된 뒤 게임을 시작합니다.
        await preloadGameSprites();

        // 구조물 안전영역은 개체 복원·생성 전에 한 번 계산해 공유합니다.
        refreshStructureSafeZones();
        loadResourceState();

        // 저장된 날씨까지 복원한 뒤 첫 화면의 날씨 전환을 활성화합니다.
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            document.body.classList.remove("is-initializing-weather");
          });
        });

        if (isChainsawEquipped && chainsawBatteryPercent > 0) {
          startChainsawBatteryDrain();
          startChainsawIdleSound();
        }
        restoreStoredPopulation();
        updateWorldScale();
        createDog();
        initializeClouds();
        startSpawner();
        hasGameInitialized = true;
        updateTodoListUI();
        scheduleEmptyFieldZombieSpawn();
        scheduleEmptyFieldDeerSpawn();

        if (hasMusicBox && isMusicOn) {
          startBgmPlayback();
        }

        if (document.body.classList.contains("is-restored-night")) {
          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              document.body.classList.remove("is-restored-night");
            });
          });
        }

        // 초기 저장 상태가 화면에 적용된 다음부터만 우하단 등장 페이드를 허용합니다.
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            document.body.classList.remove("is-initializing-status");
          });
        });

        lastFrameTime = performance.now();
        requestAnimationFrame(gameLoop);
      }

      initializeGame();
    })();
  </script>
</body>
</html>
