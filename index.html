      function applyInventoryItemNewTagState() {
        for (const item of inventoryItems) {
          const badge = item.querySelector(".inventory-item-new-badge");
          if (!badge) continue;
          badge.hidden = !newInventoryItemTypes.has(item.dataset.item || "");
        }
      }

      function markInventoryItemAsNew(itemType) {
        newInventoryItemTypes.add(itemType);
        hasNewInventoryItem = true;
        applyInventoryItemNewTagState();
        applyInventoryNewBadgeState();
      }

      function clearInventoryItemNewState(itemType) {
        if (!newInventoryItemTypes.delete(itemType)) return;
        applyInventoryItemNewTagState();
        saveResourceState();
      }

      function applyInventoryNewBadgeState() {
        if (!inventoryNewBadge) return;

        const shouldShow = hasNewInventoryItem;
        const wasHidden = inventoryNewBadge.hidden;
        inventoryNewBadge.hidden = !shouldShow;

        // 저장 상태를 처음 반영할 때는 기존 배지를 정적으로 표시하고,
        // 플레이 중 새로 생기는 순간에만 등장 애니메이션을 재생합니다.
        if (!inventoryNewBadgeStateInitialized) {
          inventoryNewBadgeStateInitialized = true;
          return;
        }

        if (shouldShow && wasHidden) {
          inventoryNewBadge.classList.remove("is-appearing");
          void inventoryNewBadge.offsetWidth;
          inventoryNewBadge.classList.add("is-appearing");
        } else if (!shouldShow) {
          inventoryNewBadge.classList.remove("is-appearing");
        }
      }

      function stopBgmPlayback() {
        bgmFadeToken += 1;

        if (bgmStartTimerId !== null) {
          clearTimeout(bgmStartTimerId);
          bgmStartTimerId = null;
        }

        if (bgmFadeFrameId !== null) {
          cancelAnimationFrame(bgmFadeFrameId);
          bgmFadeFrameId = null;
        }

        dayBgmAudio.pause();
        nightBgmAudio.pause();
        try {
          dayBgmAudio.currentTime = 0;
          nightBgmAudio.currentTime = 0;
        } catch (_) {}
        dayBgmAudio.volume = document.body.classList.contains("is-night")
          ? 0
          : 1;
        nightBgmAudio.volume = document.body.classList.contains("is-night")
          ? 1
          : 0;
        bgmStartScheduled = false;
        bgmStarted = false;
      }

      async function startBgmPlayback() {
        if (
          !hasMusicBox ||
          !isMusicOn ||
          bgmStarted ||
          bgmStartScheduled
        ) {
          return;
        }

        bgmStartScheduled = true;
        const isNight = document.body.classList.contains("is-night");
        const incomingAudio = isNight ? nightBgmAudio : dayBgmAudio;
        const outgoingAudio = isNight ? dayBgmAudio : nightBgmAudio;

        dayBgmAudio.volume = isNight ? 0 : 1;
        nightBgmAudio.volume = isNight ? 1 : 0;
        outgoingAudio.pause();
        try {
          outgoingAudio.currentTime = 0;
          incomingAudio.currentTime = 0;
        } catch (_) {}

        try {
          await incomingAudio.play();
          bgmStarted = true;
        } catch (_) {
          // 저장 상태가 On이어도 자동 재생이 차단될 수 있습니다.
          // 이후 사용자 클릭에서 다시 재생을 시도합니다.
          bgmStarted = false;
        } finally {
          bgmStartScheduled = false;
        }
      }

      function setMusicOn(enabled) {
        isMusicOn = hasMusicBox && enabled;
        applyInventoryState();
        saveResourceState();

        if (isMusicOn) {
          startBgmPlayback();
        } else {
          stopBgmPlayback();
        }
      }

      function awardMusicBox() {
        if (hasMusicBox) return;

        hasMusicBox = true;
        isMusicOn = true;
        applyInventoryState();
        saveResourceState();
        window.setTimeout(() => {
          showToast(MUSIC_BOX_FOUND_TOAST_MESSAGE);
        }, MUSIC_BOX_FOUND_TOAST_DELAY_MS);
        scheduleBgmAfterFirstPlayerKill();
      }

      function collectAxe(event) {
        if (isExploring) {
          showExploringBusyToast(event);
          return;
        }

        if (hasAxe) return;

        if (event) {
          event.preventDefault();
        }

        hasAxe = true;
        isAxeEquipped = true;
        isHandgunEquipped = false;
        markInventoryItemAsNew("axe");
        applyAxeState();
        applyInventoryState();
        saveResourceState();
        playSound(GET_AXE_SOUND, 0.7);
      }

      function handleAxePickupKeydown(event) {
        if (event.key !== "Enter" && event.key !== " ") return;
        collectAxe(event);
      }


      function getTreePersistentVisualStage() {
        if (treeGrowthState === TREE_GROWTH_DEPLETED) return 3;
        if (treeGrowthState === TREE_GROWTH_REGROWING) return 2;
        if (treeChopCount >= 2) return 3;
        if (treeChopCount >= 1) return 2;
        return 1;
      }

      function setTreeNightFrame(stage) {
        const frameIndex = stage === 3 ? 2 : (stage === 2 ? 1 : 0);
        const column = frameIndex % TREE_SHEET_COLUMNS;
        const row = Math.floor(frameIndex / TREE_SHEET_COLUMNS);
        const backgroundPosition =
          `${-column * TREE_FRAME_SIZE}px ${-row * TREE_FRAME_SIZE}px`;

        treeNightVisual.style.backgroundPosition = backgroundPosition;
        treeCanopyNight.style.backgroundPosition = backgroundPosition;
      }

      function getTreeDaySheetForStage(stage) {
        if (stage === 2) return TREE_DAY_STAGE_TWO_IMAGE;
        if (stage === 3) return TREE_DAY_STAGE_THREE_IMAGE;
        return TREE_DAY_SHEET;
      }

      function applyTreeFrameToVisuals(visuals, image, frameIndex) {
        const normalizedFrame = clamp(
          Math.round(Number(frameIndex) || 0),
          0,
          TREE_SHEET_COLUMNS * TREE_SHEET_COLUMNS - 1
        );
        const column = normalizedFrame % TREE_SHEET_COLUMNS;
        const row = Math.floor(normalizedFrame / TREE_SHEET_COLUMNS);
        const backgroundPosition =
          `${-column * TREE_FRAME_SIZE}px ${-row * TREE_FRAME_SIZE}px`;

        for (const visual of visuals) {
          visual.style.backgroundImage = `url("${image}")`;
          visual.style.backgroundSize = "1024px 1024px";
          visual.style.backgroundPosition = backgroundPosition;
        }
      }

      function applyTreeDayFrame(image, frameIndex) {
        applyTreeFrameToVisuals(
          [treeDayVisual, treeCanopyDay],
          image,
          frameIndex
        );
      }

      function applyTreeVisualState() {
        const stage = getTreePersistentVisualStage();
        const image = getTreeDaySheetForStage(stage);
        applyTreeDayFrame(image, TREE_DEFAULT_FRAME);
        setTreeNightFrame(stage);
      }

      function setTreeAnimationFrameForStage(frameIndex, stage) {
        applyTreeDayFrame(getTreeDaySheetForStage(stage), frameIndex);
      }

      function setTreeAnimationFrame(frameIndex) {
        const stage = getTreePersistentVisualStage();
        setTreeAnimationFrameForStage(frameIndex, stage);
      }

      function randomBetween(min, max) {
        return min + Math.random() * (max - min);
      }

      function easeInCubic(progress) {
        const normalized = clamp(progress, 0, 1);
        return normalized * normalized * normalized;
      }

      function easeOutCubic(progress) {
        const normalized = clamp(progress, 0, 1);
        return 1 - Math.pow(1 - normalized, 3);
      }

      function spawnTreeFallingPart(hitNumber) {
        if (!treePartLayer || !treePartShadowLayer) return;

        // 이동용 부모 → 회전용 부모 → 이미지의 3단 구조입니다.
        // 이동과 회전을 같은 요소에서 처리하지 않아 회전축이 바닥으로 끌려가지 않습니다.
        const shadow = document.createElement("div");
        shadow.className = "tree-falling-part-shadow";
        shadow.setAttribute("aria-hidden", "true");
        shadow.style.width = `${TREE_PART_SHADOW_WIDTH}px`;
        shadow.style.height = `${TREE_PART_SHADOW_HEIGHT}px`;

        const part = document.createElement("div");
        part.className = "tree-falling-part";
        part.setAttribute("aria-hidden", "true");

        const rotator = document.createElement("div");
        rotator.className = "tree-falling-part-rotator";
        rotator.style.transformOrigin =
          `${TREE_PART_ROTATION_PIVOT_X}px ${TREE_PART_ROTATION_PIVOT_Y}px`;

        const image = document.createElement("div");
        image.className = "tree-falling-part-image";
        image.style.backgroundImage = `url("${TREE_PART_IMAGE}")`;

        rotator.appendChild(image);
        part.appendChild(rotator);

        const treeLeft = 1103;
        const treeTop = 562;
        const treeScale = 0.6;
        const treeWidth = 512 * treeScale;
        const treeHeight = 512 * treeScale;
        const startAnchorX = treeLeft + treeWidth * TREE_PART_START_X_RATIO;
        const startAnchorY = treeTop + treeHeight * TREE_PART_START_Y_RATIO;
        const offsetIndex = clamp(
          Math.round(Number(hitNumber) || 1) - 1,
          0,
          TREE_PART_HIT_OFFSETS.length - 1
        );
        const hitOffset = TREE_PART_HIT_OFFSETS[offsetIndex];
        const hitScale = TREE_PART_HIT_SCALES[
          Math.min(offsetIndex, TREE_PART_HIT_SCALES.length - 1)
        ];
        const baseHitOffset = TREE_PART_HIT_OFFSETS[0] || { x: 0, y: 0 };
        const groundOffsetX = hitOffset.x - baseHitOffset.x;
        const groundOffsetY = hitOffset.y - baseHitOffset.y;

        // 두 번째 파츠만 이미지 자체를 좌우 반전합니다.
        // 회전용 부모와 분리되어 반전이 회전축 위치에 영향을 주지 않습니다.
        const horizontalFlip = offsetIndex === 1 ? -1 : 1;
        image.style.transform = `scaleX(${horizontalFlip})`;

        // 타격 직후 빠르게 튀어나온 뒤 높은 포물선을 그리며 더 멀리 날아갑니다.
        const startJitterX = randomBetween(-10, 10);
        const startJitterY = randomBetween(-6, 5);
        // 나무 파츠는 항상 오른쪽으로만 날아갑니다.
        const flightDistance = randomBetween(72, 122);
        const arcHeight = randomBetween(58, 96);
        const landingJitterX = randomBetween(-7, 7);
        const groundJitterY = randomBetween(-3, 3);
        // 비행 종료 회전은 한 가지 범위만 사용합니다.
        const dropEndRotation = randomBetween(250, 520);
        const dropDurationMs = randomBetween(560, 760);
        const toppleDurationMs = randomBetween(180, 290);

        const dropX = flightDistance * 0.9 - groundOffsetX;
        const dropY = TREE_PART_DROP_Y - groundOffsetY + groundJitterY;
        const desiredToppleGroundX =
          flightDistance - groundOffsetX + landingJitterX;
        const desiredToppleGroundY =
          TREE_PART_TOPPLE_Y - groundOffsetY + groundJitterY;

        // 회전용 부모 안에서 지정한 앵커가 현재 회전·스케일 후
        // 어느 로컬 좌표에 놓이는지 계산합니다. 바닥 위치 체크에만 사용합니다.
        const getTransformedAnchor = (anchorX, anchorY, rotation, scale) => {
          const radians = rotation * Math.PI / 180;
          const cos = Math.cos(radians);
          const sin = Math.sin(radians);
          const offsetX =
            (anchorX - TREE_PART_ROTATION_PIVOT_X) * scale;
          const offsetY =
            (anchorY - TREE_PART_ROTATION_PIVOT_Y) * scale;

          return {
            x:
              TREE_PART_ROTATION_PIVOT_X +
              offsetX * cos -
              offsetY * sin,
            y:
              TREE_PART_ROTATION_PIVOT_Y +
              offsetX * sin +
              offsetY * cos
          };
        };

        const initialGroundAnchor = getTransformedAnchor(
          TREE_PART_GROUND_CONTACT_X,
          TREE_PART_GROUND_CONTACT_Y,
          0,
          hitScale
        );
        const dropBottomAnchor = getTransformedAnchor(
          TREE_PART_GROUND_CONTACT_X,
          TREE_PART_GROUND_CONTACT_Y,
          dropEndRotation,
          hitScale
        );
        const dropTopAnchor = getTransformedAnchor(
          TREE_PART_TOP_CONTACT_X,
          TREE_PART_TOP_CONTACT_Y,
          dropEndRotation,
          hitScale
        );
        const activeContactAnchorAtDrop =
          dropBottomAnchor.y >= dropTopAnchor.y
            ? {
                key: "bottom",
                x: TREE_PART_GROUND_CONTACT_X,
                y: TREE_PART_GROUND_CONTACT_Y
              }
            : {
                key: "top",
                x: TREE_PART_TOP_CONTACT_X,
                y: TREE_PART_TOP_CONTACT_Y
              };

        const getNearestHorizontalRotation = (rotation) => {
          const candidates = [-270, -90, 90, 270, 450, 630];
          let nearest = candidates[0];
          let nearestDistance = Math.abs(rotation - nearest);

          for (let index = 1; index < candidates.length; index += 1) {
            const candidate = candidates[index];
            const distance = Math.abs(rotation - candidate);
            if (distance < nearestDistance) {
              nearest = candidate;
              nearestDistance = distance;
            }
          }

          return nearest;
        };

        const toppleRotation = getNearestHorizontalRotation(dropEndRotation);
        const startGroundX = startAnchorX + hitOffset.x + startJitterX;
        const startGroundY = startAnchorY + hitOffset.y + startJitterY;
        const startLeft = startGroundX - initialGroundAnchor.x;
        const startTop = startGroundY - initialGroundAnchor.y;

        // 비행이 끝나는 순간 실제로 바닥에 먼저 닿은 접지 앵커의 화면 좌표를 구합니다.
        // 이후 넘어질 때는 이 접지점이 회전 기준이 되며, 회전 중에도 같은 바닥 점에 붙어 있습니다.
        const dropContactAnchor = getTransformedAnchor(
          activeContactAnchorAtDrop.x,
          activeContactAnchorAtDrop.y,
          dropEndRotation,
          hitScale
        );
        const toppleGroundX = startLeft + dropX + dropContactAnchor.x;
        const toppleGroundY = startTop + dropY + dropContactAnchor.y;

        const getTopplePose = (rotation, scale) => {
          const currentContactAnchor = getTransformedAnchor(
            activeContactAnchorAtDrop.x,
            activeContactAnchorAtDrop.y,
            rotation,
            scale
          );

          return {
            x: toppleGroundX - startLeft - currentContactAnchor.x,
            y: toppleGroundY - startTop - currentContactAnchor.y
          };
        };

        const finalTopplePose = getTopplePose(toppleRotation, hitScale);
        const toppleTranslateX = finalTopplePose.x;
        const toppleTranslateY = finalTopplePose.y;
        // 그림자 오프셋은 바닥 접지점이 아니라 비행 때 사용하는 회전축을 기준으로 합니다.
        const toppleRotationPivotX =
          startLeft + toppleTranslateX + TREE_PART_ROTATION_PIVOT_X;
        const toppleRotationPivotY =
          startTop + toppleTranslateY + TREE_PART_ROTATION_PIVOT_Y;

        part.style.left = `${startLeft}px`;
        part.style.top = `${startTop}px`;
        part.style.opacity = "1";
        part.style.transform = "translate3d(0, 0, 0)";
        rotator.style.transform = `rotate(0deg) scale(${hitScale})`;

        // 그림자는 낙하 중에는 숨기고 최종 자세의 회전 중심축을 기준으로 배치합니다.
        shadow.style.left =
          `${toppleRotationPivotX + TREE_PART_SHADOW_OFFSET_X}px`;
        shadow.style.top =
          `${toppleRotationPivotY + TREE_PART_SHADOW_OFFSET_Y}px`;
        shadow.style.opacity = "0";

        treePartShadowLayer.appendChild(shadow);
        treePartLayer.appendChild(part);

        const setPartPose = (x, y, rotation, scale, opacity = 1) => {
          // 바깥 부모는 위치 이동만 담당합니다.
          part.style.transform = `translate3d(${x}px, ${y}px, 0)`;
          part.style.opacity = `${opacity}`;
          // 안쪽 부모는 중앙 회전축을 기준으로 회전과 크기만 담당합니다.
          rotator.style.transform = `rotate(${rotation}deg) scale(${scale})`;
        };

        const startTime = performance.now();
        const dropEndTime = startTime + dropDurationMs;
        const toppleEndTime = dropEndTime + toppleDurationMs;
        const holdEndTime = toppleEndTime + TREE_PART_HOLD_MS;
        const fadeEndTime = holdEndTime + TREE_PART_FADE_MS;
        let hasPlayedGroundHitSound = false;

        const step = (now) => {
          if (now < dropEndTime) {
            const rawProgress = clamp(
              (now - startTime) / dropDurationMs,
              0,
              1
            );
            // 가로 위치는 일정한 속도의 선형 그래프로 이동합니다.
            const currentX = dropX * rawProgress;
            const currentY =
              dropY * rawProgress -
              Math.sin(rawProgress * Math.PI) * arcHeight;
            // 회전 각도를 선형으로 증가시켜 반시계 방향 되감김이 생기지 않습니다.
            const currentRotation = dropEndRotation * rawProgress;

            setPartPose(
              currentX,
              currentY,
              currentRotation,
              hitScale,
              1
            );
            window.requestAnimationFrame(step);
            return;
          }

          if (!hasPlayedGroundHitSound) {
            hasPlayedGroundHitSound = true;
            shadow.style.opacity = `${TREE_PART_SHADOW_OPACITY}`;
            playSound(TREE_FALL_SOUND);
          }

          if (now < toppleEndTime) {
            const rawProgress = clamp(
              (now - dropEndTime) / toppleDurationMs,
              0,
              1
            );
            const currentRotation =
              dropEndRotation +
              (toppleRotation - dropEndRotation) * rawProgress;
            const currentTopplePose = getTopplePose(
              currentRotation,
              hitScale
            );

            setPartPose(
              currentTopplePose.x,
              currentTopplePose.y,
              currentRotation,
              hitScale,
              1
            );
            window.requestAnimationFrame(step);
            return;
          }

          if (now < holdEndTime) {
            setPartPose(
              toppleTranslateX,
              toppleTranslateY,
              toppleRotation,
              hitScale,
              1
            );
            window.requestAnimationFrame(step);
            return;
          }

          if (now < fadeEndTime) {
            const rawProgress = clamp(
              (now - holdEndTime) / TREE_PART_FADE_MS,
              0,
              1
            );
            const opacity = 1 - rawProgress;
            const currentScale =
              hitScale *
              (1 - (1 - TREE_PART_FADE_END_SCALE_MULTIPLIER) * rawProgress);
            shadow.style.opacity = `${TREE_PART_SHADOW_OPACITY * opacity}`;

            setPartPose(
              toppleTranslateX,
              toppleTranslateY,
              toppleRotation,
              currentScale,
              opacity
            );
            window.requestAnimationFrame(step);
            return;
          }

          shadow.remove();
          part.remove();
        };

        window.requestAnimationFrame(step);
      }

      function playTreeChopAnimation(event) {
        if (event) {
          event.preventDefault();
        }

        if (isExploring || document.body.classList.contains("is-night")) {
          return;
        }

        if (
          treeGrowthState !== TREE_GROWTH_READY ||
          treeChopCount >= TREE_MAX_CHOPS_PER_GROWTH
        ) {
          showToast(TREE_GROW_TOAST_MESSAGE);
          return;
        }

        if (!hasAxe || !isAxeEquipped) {
          showToast(TREE_NEEDS_AXE_TOAST_MESSAGE);
          return;
        }

        if (woodCount >= getMaxWoodCount()) {
          showToast(CARRY_FULL_TOAST_MESSAGE);
          return;
        }

        // 이전 흔들림이 재생 중이어도 새 입력을 받습니다.
        // 기존 타이머를 취소하고 현재 단계의 타격 애니메이션을 처음부터 다시 재생합니다.
        if (treeAnimationTimerId !== null) {
          clearTimeout(treeAnimationTimerId);
          treeAnimationTimerId = null;
        }

        isTreeAnimating = true;
        treeChopCount += 1;
        woodCount = Math.min(getMaxWoodCount(), woodCount + 1);

        if (treeChopCount >= TREE_MAX_CHOPS_PER_GROWTH) {
          treeGrowthState = TREE_GROWTH_DEPLETED;
        }

        const nextStage = getTreePersistentVisualStage();

        updateResourceHud();
        saveResourceState();
        playSound(TREE_CHOP_SOUND);
        spawnTreeFallingPart(treeChopCount);

        let sequenceIndex = 0;
        const firstFrameIndex = TREE_CHOP_SEQUENCE[sequenceIndex];

        // 새 단계 이미지의 첫 흔들림 프레임으로 즉시 교체합니다.
        setTreeAnimationFrameForStage(firstFrameIndex, nextStage);
        setTreeNightFrame(nextStage);

        const advanceFrame = () => {
          sequenceIndex += 1;

          if (sequenceIndex >= TREE_CHOP_SEQUENCE.length) {
            treeAnimationTimerId = null;
            isTreeAnimating = false;
            applyTreeVisualState();
            return;
          }

          const frameIndex = TREE_CHOP_SEQUENCE[sequenceIndex];
          setTreeAnimationFrameForStage(frameIndex, nextStage);

          treeAnimationTimerId = window.setTimeout(
            advanceFrame,
            TREE_CHOP_FRAME_MS
          );
        };

        treeAnimationTimerId = window.setTimeout(
          advanceFrame,
          TREE_CHOP_FRAME_MS
        );
      }

      function handleTreeKeydown(event) {
        if (event.key !== "Enter" && event.key !== " ") return;
        playTreeChopAnimation(event);
      }

      function scheduleBgmAfterFirstPlayerKill() {
        if (
          !hasMusicBox ||
          !isMusicOn ||
          bgmStartScheduled ||
          bgmStarted ||
          bgmStartTimerId !== null
        ) {
          return;
        }

        bgmStartScheduled = true;
        bgmStartTimerId = window.setTimeout(() => {
          bgmStartTimerId = null;
          bgmStartScheduled = false;
          dayBgmAudio.currentTime = 0;
          nightBgmAudio.currentTime = 0;
          startBgmPlayback();
        }, FIRST_KILL_BGM_DELAY_MS);
      }

      function playBirdFlySound() {
        let candidateIndex = 0;

        const tryNext = () => {
          if (candidateIndex >= BIRD_FLY_SOUND_CANDIDATES.length) return;

          const audio = new Audio(
            BIRD_FLY_SOUND_CANDIDATES[candidateIndex]
          );
          candidateIndex += 1;
          audio.volume = 1;

          audio.addEventListener("error", tryNext, { once: true });
          audio.play().catch(() => {});
        };

        tryNext();
      }

      function playFallSound() {
        let candidateIndex = 0;

        const tryNext = () => {
          if (candidateIndex >= FALL_SOUND_CANDIDATES.length) return;

          const audio = new Audio(FALL_SOUND_CANDIDATES[candidateIndex]);
          candidateIndex += 1;
          audio.volume = 1;

          audio.addEventListener("error", tryNext, { once: true });
          audio.play().catch(() => {});
        };

        tryNext();
      }

      function setFacing(zombie) {
        if (zombie.direction.x > 0.000001) {
          zombie.facing = 1;
        } else if (zombie.direction.x < -0.000001) {
          zombie.facing = -1;
        }

        // 원본은 왼쪽을 향하므로 오른쪽 이동 시에만 반전합니다.
        const facingTransform =
          zombie.facing === 1 ? "scaleX(-1)" : "scaleX(1)";

        zombie.sprite.style.transform = facingTransform;
        zombie.overlay.style.transform = facingTransform;
      }

      function renderZombie(zombie) {
        zombie.element.style.left = `${zombie.x}px`;
        zombie.element.style.top = `${zombie.y}px`;

        // 화면 아래쪽에 있는 좀비일수록 앞에 보이도록
        // 세로 위치(y)를 기준으로 개별 뎁스를 갱신합니다.
        zombie.element.style.zIndex = String(
          Math.round(zombie.y)
        );
      }

      function showSingleFrame(zombie, sheet, frameIndex) {
        zombie.sprite.style.backgroundImage = `url("${sheet}")`;
        zombie.sprite.style.backgroundPosition =
          framePosition(frameIndex);
        zombie.sprite.style.opacity = "1";

        zombie.overlay.style.opacity = "0";
      }

      function showCrossfade(
        zombie,
        fromSheet,
        fromFrameIndex,
        toSheet,
        toFrameIndex,
        progress
      ) {
        const clampedProgress = clamp(progress, 0, 1);

        zombie.sprite.style.backgroundImage = `url("${fromSheet}")`;
        zombie.sprite.style.backgroundPosition =
          framePosition(fromFrameIndex);
        zombie.sprite.style.opacity =
          String(1 - clampedProgress);

        zombie.overlay.style.backgroundImage = `url("${toSheet}")`;
        zombie.overlay.style.backgroundPosition =
          framePosition(toFrameIndex);
        zombie.overlay.style.opacity =
          String(clampedProgress);
      }

      function setDeerFacing(deer) {
        const facingTransform =
          deer.facing === "left" ? "scaleX(-1)" : "scaleX(1)";

        deer.sprite.style.transform = facingTransform;
        deer.overlay.style.transform = facingTransform;
      }

      function renderDeer(deer) {
        deer.element.style.left = `${deer.x}px`;
        deer.element.style.top = `${deer.y}px`;
        deer.element.style.zIndex = String(Math.round(deer.y));
      }

      function showSingleDeerFrame(deer, frameIndex) {
        deer.sprite.style.backgroundImage = `url("${DEER_SHEET}")`;
        deer.sprite.style.backgroundPosition =
          deerFramePosition(frameIndex);
        deer.sprite.style.opacity = "1";
        deer.overlay.style.opacity = "0";
      }

      function showDeerCrossfade(
        deer,
        fromFrameIndex,
        toFrameIndex,
        progress
      ) {
        const clampedProgress = clamp(progress, 0, 1);

        deer.sprite.style.backgroundImage = `url("${DEER_SHEET}")`;
        deer.sprite.style.backgroundPosition =
          deerFramePosition(fromFrameIndex);
        deer.sprite.style.opacity = String(1 - clampedProgress);

        deer.overlay.style.backgroundImage = `url("${DEER_SHEET}")`;
        deer.overlay.style.backgroundPosition =
          deerFramePosition(toFrameIndex);
        deer.overlay.style.opacity = String(clampedProgress);
      }

      function scheduleNextDeerIdleAnimation(deer, now = performance.now()) {
        deer.nextIdleAnimationAt = now + getRandomDeerIdleDelay();
      }

      function startDeerIdleAnimation(deer, sequence, durations, now) {
        deer.idleAnimation = { sequence, durations };
        deer.idleAnimationStartedAt = now;
      }

      function startRandomDeerIdleAnimation(deer, now) {
        if (Math.random() < 0.5) {
          startDeerIdleAnimation(
            deer,
            DEER_LOOK_SEQUENCE,
            DEER_LOOK_DURATIONS_MS,
            now
          );
        } else {
          startDeerIdleAnimation(
            deer,
            DEER_GRAZE_SEQUENCE,
            DEER_GRAZE_DURATIONS_MS,
            now
          );
        }
      }

      function updateActiveDeerIdleAnimation(deer, now) {
        if (!deer.idleAnimation) {
          showSingleDeerFrame(deer, DEER_IDLE_FRAME);
          return;
        }

        const elapsed = now - deer.idleAnimationStartedAt;
        let phaseStart = 0;

        for (let index = 0; index < deer.idleAnimation.sequence.length; index += 1) {
          const holdEnd =
            phaseStart + deer.idleAnimation.durations[index];

          if (elapsed < holdEnd) {
            showSingleDeerFrame(
              deer,
              deer.idleAnimation.sequence[index]
            );
            return;
          }

          phaseStart = holdEnd;
        }

        deer.idleAnimation = null;
        scheduleNextDeerIdleAnimation(deer, now);
        showSingleDeerFrame(deer, DEER_IDLE_FRAME);
      }

      function removeDeer(deer) {
        if (deer.state === "removed") return;

        deer.state = "removed";
        deer.element.remove();
        deerMap.delete(deer.id);
        saveResourceState();
        scheduleEmptyFieldDeerSpawn();
      }

      function isDeerOutsideVisibleArea(deer) {
        const visibleBounds = getVisibleWorldBounds();
        const margin = DEER_HALF_W + 16;

        return (
          deer.x + margin < visibleBounds.left ||
          deer.x - margin > visibleBounds.right
        );
      }

      function createDeer(options = {}) {
        const force = options.force === true;
        if (
          (!force && isExploring) ||
          deerMap.size >= MAX_ACTIVE_DEER ||
          !hasActivePopulationCapacity()
        ) {
          return false;
        }

        const position = getRandomDeerSpawnPosition(options);
        if (!position) {
          return false;
        }

        const now = performance.now();

        const element = document.createElement("div");
        element.className = "deer";
        element.setAttribute("role", "button");
        element.setAttribute("aria-label", "Deer");
        element.style.opacity = "0";

        const sprite = document.createElement("div");
        sprite.className = "deer-sprite";

        const overlay = document.createElement("div");
        overlay.className = "deer-sprite-overlay";

        const hitbox = document.createElement("div");
        hitbox.className = "deer-hitbox";
        hitbox.setAttribute("role", "button");
        hitbox.setAttribute("tabindex", "0");
        hitbox.setAttribute("aria-label", "Attack deer");

        element.appendChild(sprite);
        element.appendChild(overlay);
        element.appendChild(hitbox);
        entities.appendChild(element);

        const skipBirth = options.skipBirth === true;
        const deer = {
          id: nextDeerId++,
          element,
          sprite,
          overlay,
          hitbox,
          x: position.x,
          y: position.y,
          facing: Math.random() < 0.5 ? "left" : "right",
          state: skipBirth ? "idle" : "birthing",
          birthStartedAt: now,
          idleAnimation: null,
          idleAnimationStartedAt: 0,
          nextIdleAnimationAt: now + getRandomDeerIdleDelay(),
          health: DEER_MAX_HEALTH,
          axeAttackCount: 0,
          evadeCount: 0,
          evadeDirection: 0,
          runElapsed: 0,
          runFrame: 0,
          runIntroComplete: false,
          turnStartedAt: 0,
          turnDirection: 0,
          turnNextDirection: 0,
          deathStartedAt: 0,
          deathStartX: 0,
          deathSlideDirection: 0,
          counted: false
        };

        deerMap.set(deer.id, deer);
        setDeerFacing(deer);

        if (skipBirth) {
          deer.element.style.opacity = "1";
          scheduleNextDeerIdleAnimation(deer, now);
          showSingleDeerFrame(deer, DEER_IDLE_FRAME);
        } else {
          showSingleDeerFrame(deer, DEER_BIRTH_FRAME_SEQUENCE[0]);
        }

        renderDeer(deer);

        hitbox.addEventListener("pointerup", (event) => {
          if (!shouldActivateFieldObject(event, hitbox)) return;
          event.preventDefault();
          attackDeer(deer);
        });

        if (options.persist !== false) {
          saveResourceState();
        }

        return true;
      }

      function beginDeerRunInDirection(
        deer,
        direction,
        state = "evading"
      ) {
        deer.state = state;
        deer.idleAnimation = null;
        deer.evadeDirection = direction < 0 ? -1 : 1;
        deer.facing = deer.evadeDirection < 0 ? "left" : "right";
        deer.runElapsed = 0;
        deer.runFrame = 0;
        deer.runIntroComplete = false;
        setDeerFacing(deer);
      }

      function beginDeerEvadeInDirection(deer, direction) {
        beginDeerRunInDirection(deer, direction, "evading");
      }

      function startDeerEvade(deer) {
        const oppositeDirection = deer.facing === "left" ? 1 : -1;
        beginDeerEvadeInDirection(deer, oppositeDirection);
      }

      function startDeerTurnaround(deer) {
        const currentDirection = deer.state === "evading"
          ? deer.evadeDirection
          : (deer.state === "turning"
            ? deer.turnDirection
            : (deer.facing === "left" ? -1 : 1));

        deer.state = "turning";
        deer.idleAnimation = null;
        deer.turnStartedAt = performance.now();
        deer.turnDirection = currentDirection < 0 ? -1 : 1;
        deer.turnNextDirection = deer.turnDirection * -1;
        deer.facing = deer.turnDirection < 0 ? "left" : "right";
        setDeerFacing(deer);
      }

      function beginDeerDeath(deer) {
        if (deer.state === "dying" || deer.state === "removed") return;

        const slideDirection = (
          deer.state === "evading" || deer.state === "leaving"
        )
          ? deer.evadeDirection
          : (deer.state === "turning"
            ? deer.turnDirection
            : (deer.facing === "left" ? -1 : 1));

        deer.state = "dying";
        deer.element.classList.add("is-dead");
        deer.idleAnimation = null;
        deer.deathStartedAt = performance.now();
        deer.deathStartX = deer.x;
        deer.deathSlideDirection = slideDirection || 1;
        deer.element.style.opacity = "1";
        showSingleDeerFrame(deer, DEER_DEATH_FRAME_SEQUENCE[0]);

        if (!deer.counted) {
          deer.counted = true;
          foodCount = Math.min(getMaxFoodCount(), foodCount + 1);
          setTodoProgress(1, "item2", true);
          commitResourceState();
        }
      }

      function makeDeerEvade(deer) {
        deer.evadeCount += 1;

        if (deer.evadeCount === 1) {
          const currentDirection = deer.facing === "left" ? -1 : 1;
          beginDeerEvadeInDirection(deer, currentDirection);
          return;
        }

        startDeerTurnaround(deer);
      }

      function attackDeer(deer) {
        if (isExploring) {
          showExploringBusyToast();
          return;
        }

        if (
          deer.state === "dying" ||
          deer.state === "leaving" ||
          deer.state === "removed"
        ) {
          return;
        }

        if (foodCount >= getMaxFoodCount()) {
          showToast(DEER_FOOD_FULL_TOAST_MESSAGE);
          return;
        }

        const weapon = isHandgunEquipped
          ? "handgun"
          : (isAxeEquipped ? "axe" : "");

        if (!weapon) {
          showToast(UNARMED_TOAST_MESSAGE);
          return;
        }

        let damage = 0;

        if (weapon === "axe") {
          deer.axeAttackCount += 1;

          // 사슴은 첫 두 번의 도끼 공격을 반드시 피하고, 세 번째는 반드시 맞습니다.
          if (deer.axeAttackCount <= 2) {
            playSound(AXE_MISS_SOUND, 0.7);
            makeDeerEvade(deer);
            return;
          }

          playSound(HIT_SOUND, 0.5);
          damage = AXE_DAMAGE;
        } else {
          if (handgunAmmoCount <= 0) {
            playSound(HANDGUN_NO_AMMO_SOUND);
            showToast(HANDGUN_EMPTY_TOAST_MESSAGE);
            return;
          }

          handgunAmmoCount -= 1;
          applyInventoryState();
          saveResourceState();
          playSound(HANDGUN_SOUND);

          if (Math.random() < HANDGUN_MISS_CHANCE) {
            makeDeerEvade(deer);
            return;
          }

          damage = HANDGUN_DAMAGE;
          if (Math.random() < HANDGUN_CRITICAL_CHANCE) {
            damage *= 2;
          }
        }

        deer.health = Math.max(0, deer.health - damage);
        if (deer.health <= 0) {
          beginDeerDeath(deer);
        }
      }

      function updateDeerBirthing(deer, now) {
        const elapsed = now - deer.birthStartedAt;

        // 생성 프레임은 1 → 2 → 3 순서로 크로스페이드 없이 전환하고,
        // 이후 기본 대기 프레임 13으로 전환합니다.
        const firstFrameEnd =
          DEER_BIRTH_FRAME_FADE_MS + DEER_BIRTH_FRAME_ONE_HOLD_MS;
        const secondFrameEnd =
          firstFrameEnd + DEER_BIRTH_FRAME_TWO_MS;
        const thirdFrameEnd =
          secondFrameEnd + DEER_BIRTH_FRAME_THREE_MS;

        deer.element.style.opacity = String(
          clamp(elapsed / DEER_BIRTH_FRAME_FADE_MS, 0, 1)
        );

        if (elapsed < firstFrameEnd) {
          showSingleDeerFrame(deer, DEER_BIRTH_FRAME_SEQUENCE[0]);
          renderDeer(deer);
          return;
        }

        if (elapsed < secondFrameEnd) {
          showSingleDeerFrame(deer, DEER_BIRTH_FRAME_SEQUENCE[1]);
          renderDeer(deer);
          return;
        }

        if (elapsed < thirdFrameEnd) {
          showSingleDeerFrame(deer, DEER_BIRTH_FRAME_SEQUENCE[2]);
          renderDeer(deer);
          return;
        }

        deer.state = "idle";
        deer.element.style.opacity = "1";
        deer.idleAnimation = null;
        scheduleNextDeerIdleAnimation(deer, now);
        showSingleDeerFrame(deer, DEER_IDLE_FRAME);
        renderDeer(deer);
      }

      function updateDeerIdle(deer, now) {
        if (!deer.idleAnimation && now >= deer.nextIdleAnimationAt) {
          startRandomDeerIdleAnimation(deer, now);
        }

        updateActiveDeerIdleAnimation(deer, now);
        deer.element.style.opacity = "1";
        renderDeer(deer);
      }

      function updateDeerTurning(deer, deltaMs) {
        const elapsed = performance.now() - deer.turnStartedAt;
        const slowProgress = clamp(elapsed / DEER_TURN_SLOWDOWN_MS, 0, 1);
        const speedFactor = 1 - slowProgress;

        deer.x +=
          deer.turnDirection *
          DEER_EVADE_SPEED_PX_PER_MS *
          deltaMs *
          speedFactor;

        const frameOneEnd = DEER_TURN_FRAME_ONE_MS;
        const frameTwoEnd = frameOneEnd + DEER_TURN_FRAME_TWO_MS;
        const turnEnd = frameTwoEnd + DEER_TURN_FRAME_THREE_MS;

        if (elapsed < frameOneEnd) {
          showSingleDeerFrame(deer, DEER_TURN_FRAME_SEQUENCE[0]);
          renderDeer(deer);
        } else if (elapsed < frameTwoEnd) {
          showSingleDeerFrame(deer, DEER_TURN_FRAME_SEQUENCE[1]);
          renderDeer(deer);
        } else if (elapsed < turnEnd) {
          showSingleDeerFrame(deer, DEER_TURN_FRAME_SEQUENCE[2]);
          renderDeer(deer);
        } else {
          beginDeerEvadeInDirection(deer, deer.turnNextDirection);
          showSingleDeerFrame(deer, DEER_RUN_INTRO_FRAME_START);
          renderDeer(deer);
          return;
        }

        if (isDeerOutsideVisibleArea(deer)) {
          removeDeer(deer);
        }
      }

      function updateDeerEvading(deer, deltaMs) {
        deer.x += deer.evadeDirection * DEER_EVADE_SPEED_PX_PER_MS * deltaMs;
        deer.runElapsed += deltaMs;

        const frameDuration = 1000 / DEER_RUN_FPS;
        if (deer.runElapsed >= frameDuration) {
          const advancedFrames = Math.floor(deer.runElapsed / frameDuration);
          deer.runElapsed %= frameDuration;
          deer.runFrame += advancedFrames;

          if (!deer.runIntroComplete &&
              deer.runFrame >= DEER_RUN_INTRO_FRAME_COUNT) {
            deer.runIntroComplete = true;
            deer.runFrame =
              (deer.runFrame - DEER_RUN_INTRO_FRAME_COUNT) %
              DEER_RUN_LOOP_FRAME_COUNT;
          } else if (deer.runIntroComplete) {
            deer.runFrame %= DEER_RUN_LOOP_FRAME_COUNT;
          }
        }

        const currentRunFrame = deer.runIntroComplete
          ? DEER_RUN_LOOP_FRAME_START + deer.runFrame
          : DEER_RUN_INTRO_FRAME_START + deer.runFrame;

        showSingleDeerFrame(deer, currentRunFrame);
        renderDeer(deer);

        if (isDeerOutsideVisibleArea(deer)) {
          removeDeer(deer);
        }
      }

      function updateDeerDying(deer, now) {
        const elapsed = now - deer.deathStartedAt;
        const frameOneEnd = DEER_DEATH_FRAME_ONE_MS;
        const frameTwoEnd = frameOneEnd + DEER_DEATH_FRAME_TWO_MS;
        const frameThreeHoldEnd =
          frameTwoEnd + DEER_DEATH_FRAME_THREE_HOLD_MS;
        const transitionOneEnd =
          frameThreeHoldEnd + DEER_DEATH_TRANSITION_ONE_MS;
        const frameFourHoldEnd =
          transitionOneEnd + DEER_DEATH_FRAME_FOUR_HOLD_MS;
        const transitionTwoEnd =
          frameFourHoldEnd + DEER_DEATH_TRANSITION_TWO_MS;
        const frameFiveHoldEnd =
          transitionTwoEnd + DEER_DEATH_FRAME_FIVE_HOLD_MS;
        const fadeEnd = frameFiveHoldEnd + DEER_DEATH_FADE_MS;
        const slideProgress = easeOutSine(elapsed / DEER_DEATH_SLIDE_MS);

        deer.x =
          deer.deathStartX +
          deer.deathSlideDirection *
            DEER_DEATH_SLIDE_DISTANCE_PX * slideProgress;

        deer.element.style.opacity = "1";

        if (elapsed < frameOneEnd) {
          showSingleDeerFrame(deer, DEER_DEATH_FRAME_SEQUENCE[0]);
          renderDeer(deer);
          return;
        }

        if (elapsed < frameTwoEnd) {
          showSingleDeerFrame(deer, DEER_DEATH_FRAME_SEQUENCE[1]);
          renderDeer(deer);
          return;
        }

        if (elapsed < frameThreeHoldEnd) {
          showSingleDeerFrame(deer, DEER_DEATH_FRAME_SEQUENCE[2]);
          renderDeer(deer);
          return;
        }

        if (elapsed < transitionOneEnd) {
          const progress =
            (elapsed - frameThreeHoldEnd) /
            DEER_DEATH_TRANSITION_ONE_MS;
          showDeerCrossfade(
            deer,
            DEER_DEATH_FRAME_SEQUENCE[2],
            DEER_DEATH_FRAME_SEQUENCE[3],
            progress
          );
          renderDeer(deer);
          return;
        }

        if (elapsed < frameFourHoldEnd) {
          showSingleDeerFrame(deer, DEER_DEATH_FRAME_SEQUENCE[3]);
          renderDeer(deer);
          return;
        }

        if (elapsed < transitionTwoEnd) {
          const progress =
            (elapsed - frameFourHoldEnd) /
            DEER_DEATH_TRANSITION_TWO_MS;
          showDeerCrossfade(
            deer,
            DEER_DEATH_FRAME_SEQUENCE[3],
            DEER_DEATH_FRAME_SEQUENCE[4],
            progress
          );
          renderDeer(deer);
          return;
        }

        if (elapsed < frameFiveHoldEnd) {
          showSingleDeerFrame(deer, DEER_DEATH_FRAME_SEQUENCE[4]);
          renderDeer(deer);
          return;
        }

        if (elapsed < fadeEnd) {
          const fadeProgress =
            (elapsed - frameFiveHoldEnd) /
            DEER_DEATH_FADE_MS;
          showSingleDeerFrame(deer, DEER_DEATH_FRAME_SEQUENCE[4]);
          deer.element.style.opacity = String(Math.max(0, 1 - fadeProgress));
          renderDeer(deer);
          return;
        }

        removeDeer(deer);
      }

      function createZombie(options = {}) {
        // 처치 수와 살아 있는 좀비 수의 합이 최대값을 넘지 않게 합니다.
        const force = options.force === true;
        if (force) {
          if (
            !hasActivePopulationCapacity() ||
            zombieCount + getLivingZombieCount() >= zombieKillRequirement
          ) {
            return false;
          }
        } else if (!canCreateZombie()) {
          return false;
        }

        const position = getRandomSpawnPosition();
        const direction = randomDirection();

        const element = document.createElement("div");
        element.className = "zombie";
        element.setAttribute("role", "button");
        element.setAttribute("aria-label", "Zombie");
        element.style.opacity = "0";

        const sprite = document.createElement("div");
        sprite.className = "zombie-sprite";
        sprite.style.backgroundImage =
          `url("${BIRTH_DEATH_SHEET}")`;

        const overlay = document.createElement("div");
        overlay.className = "zombie-sprite-overlay";

        element.appendChild(sprite);
        element.appendChild(overlay);
        entities.appendChild(element);

        const skipBirth = options.skipBirth === true;
        const zombie = {
          id: nextZombieId++,
          element,
          sprite,
          overlay,
          x: position.x,
          y: position.y,
          direction,
          facing: Math.random() < 0.5 ? -1 : 1,
          health: ZOMBIE_MAX_HEALTH,
          state: skipBirth ? "walking" : "birthing",
          birthStartedAt: performance.now(),
          walkElapsed: 0,
          walkFrame: Math.floor(Math.random() * 8),
          hitReactionEnd: 0,
          hitReactionFrame: 0,
          deathStartFrame: randomDeathStartFrame(),
          deathStartedAt: 0,
          counted: false,
          fallSoundTimer: null
        };

        zombies.set(zombie.id, zombie);

        setFacing(zombie);

        if (skipBirth) {
          zombie.element.style.opacity = "1";
          showSingleFrame(zombie, WALK_SHEET, zombie.walkFrame);
        } else {
          zombie.sprite.style.backgroundPosition = framePosition(0);
        }

        renderZombie(zombie);
        if (!skipBirth && !options.silent) {
          playSound(BIRTH_SOUND, 0.5);
        }

        element.addEventListener("pointerup", (event) => {
          if (!shouldActivateFieldObject(event, element)) return;
          event.preventDefault();
          attackZombie(zombie);
        });

        if (options.persist !== false) {
          saveResourceState();
        }

        return true;
      }

      function attackZombie(zombie) {
        if (isExploring) {
          showExploringBusyToast();
          return;
        }

        if (
          zombie.state === "dying" ||
          zombie.state === "removed"
        ) {
          return;
        }

        const weapon = isHandgunEquipped
          ? "handgun"
          : (isAxeEquipped ? "axe" : "");

        if (!weapon) {
          showToast(UNARMED_TOAST_MESSAGE);
          return;
        }

        let damage = 0;

        if (weapon === "axe") {
          if (Math.random() < AXE_MISS_CHANCE) {
            playSound(AXE_MISS_SOUND, 0.7);
            return;
          }

          playSound(HIT_SOUND, 0.5);
          damage = AXE_DAMAGE;
        } else {
          if (handgunAmmoCount <= 0) {
            playSound(HANDGUN_NO_AMMO_SOUND);
            showToast(HANDGUN_EMPTY_TOAST_MESSAGE);
            return;
          }

          handgunAmmoCount -= 1;
          applyInventoryState();
          saveResourceState();
          playSound(HANDGUN_SOUND);

          if (Math.random() < HANDGUN_MISS_CHANCE) {
            return;
          }

          damage = HANDGUN_DAMAGE;
          if (Math.random() < HANDGUN_CRITICAL_CHANCE) {
            damage *= 2;
          }
          const isOneShotHeadshot = damage >= zombie.health;

          zombie.health = Math.max(0, zombie.health - damage);

          if (zombie.health <= 0) {
            if (isOneShotHeadshot) {
              setTodoProgress(3, "item1", true);
            }
            beginDeath(zombie, true);
            return;
          }

          zombie.state = "hit";
          zombie.deathStartFrame = randomDeathStartFrame();
          zombie.hitReactionFrame = zombie.deathStartFrame;
          zombie.hitReactionEnd = performance.now() + HIT_REACTION_MS;

          showSingleFrame(
            zombie,
            ZOMBIE_HIT_REACTION_SEQUENCE[zombie.hitReactionFrame]
          );
          saveResourceState();
          return;
        }

        zombie.health = Math.max(0, zombie.health - damage);

        if (zombie.health <= 0) {
          beginDeath(zombie, true);
          return;
        }

        zombie.state = "hit";
        zombie.deathStartFrame = randomDeathStartFrame();
        zombie.hitReactionFrame = zombie.deathStartFrame;
        zombie.hitReactionEnd = performance.now() + HIT_REACTION_MS;

        showSingleFrame(
          zombie,
          DEAD_SHEET,
          zombie.hitReactionFrame
        );
      }

      function beginDeath(zombie, wasPlayerKill = false) {
        if (zombie.state === "dying" || zombie.state === "removed") return;

        zombie.state = "dying";
        zombie.element.classList.add("is-dead");
        zombie.deathStartFrame = randomDeathStartFrame();
        zombie.deathStartedAt = performance.now();
        playSound(DEATH_SOUND, 0.5);

        if (wasPlayerKill) {
          awardMusicBox();
          const isFirstZombieKill = triggerFirstKillBirdFlock();
          if (isFirstZombieKill) {
            lastDeerSpawnAt = Date.now();
            createDeer();
            scheduleNextDeerSpawnTick();
          }
        }

        zombie.element.style.opacity = "1";
        showSingleFrame(
          zombie,
          DEAD_SHEET,
          zombie.deathStartFrame
        );

        if (wasPlayerKill && !zombie.counted) {
          zombie.counted = true;
          setTodoProgress(1, "item1", true);
          const previousZombieCount = zombieCount;
          zombieCount = Math.min(
            zombieKillRequirement,
            zombieCount + 1
          );
          commitResourceState();

          if (
            previousZombieCount < zombieKillRequirement &&
            zombieCount >= zombieKillRequirement
          ) {
            window.setTimeout(() => {
              if (
                !isExploring &&
                zombieCount >= zombieKillRequirement
              ) {
                showToast(FIELD_CLEAR_TOAST_MESSAGE);
              }
            }, FIELD_CLEAR_TOAST_DELAY_MS);
          }
        }

        zombie.fallSoundTimer = window.setTimeout(() => {
          playFallSound();
        }, 500);
      }

      function removeZombie(zombie) {
        if (zombie.state === "removed") return;

        zombie.state = "removed";

        if (zombie.fallSoundTimer !== null) {
          clearTimeout(zombie.fallSoundTimer);
        }

        zombie.element.remove();
        zombies.delete(zombie.id);
        saveResourceState();
        scheduleEmptyFieldZombieSpawn();
      }

      function resolveOuterBounds(zombie) {
        const minX = GAME_ZONE.left + HALF_W;
        const maxX = GAME_ZONE.right - HALF_W;
        const minY = GAME_ZONE.top + HALF_H;
        const maxY = GAME_ZONE.bottom - HALF_H;

        if (zombie.x < minX) {
          zombie.x = minX;
          zombie.direction.x = Math.abs(zombie.direction.x);
        } else if (zombie.x > maxX) {
          zombie.x = maxX;
          zombie.direction.x = -Math.abs(zombie.direction.x);
        }

        if (zombie.y < minY) {
          zombie.y = minY;
          zombie.direction.y = Math.abs(zombie.direction.y);
        } else if (zombie.y > maxY) {
          zombie.y = maxY;
          zombie.direction.y = -Math.abs(zombie.direction.y);
        }
      }

      function resolveSafeZoneFor(
        zombie,
        zone,
        previousX,
        previousY
      ) {
        if (
          !isInsideInflatedZoneFor(
            zone,
            zombie.x,
            zombie.y,
            HALF_W,
            HALF_H
          )
        ) {
          return false;
        }

        const left = zone.left - HALF_W;
        const right = zone.right + HALF_W;
        const top = zone.top - HALF_H;
        const bottom = zone.bottom + HALF_H;

        const enteredFromLeft = previousX <= left;
        const enteredFromRight = previousX >= right;
        const enteredFromTop = previousY <= top;
        const enteredFromBottom = previousY >= bottom;

        if (enteredFromLeft) {
          zombie.x = left;
          zombie.direction.x = -Math.abs(zombie.direction.x);
        } else if (enteredFromRight) {
          zombie.x = right;
          zombie.direction.x = Math.abs(zombie.direction.x);
        } else if (enteredFromTop) {
          zombie.y = top;
          zombie.direction.y = -Math.abs(zombie.direction.y);
        } else if (enteredFromBottom) {
          zombie.y = bottom;
          zombie.direction.y = Math.abs(zombie.direction.y);
        } else {
          // 모서리 진입 등 예외 상황에서는 가장 가까운 경계로 밀어냅니다.
          const distances = [
            { side: "left", value: Math.abs(zombie.x - left) },
            { side: "right", value: Math.abs(right - zombie.x) },
            { side: "top", value: Math.abs(zombie.y - top) },
            { side: "bottom", value: Math.abs(bottom - zombie.y) }
          ].sort((a, b) => a.value - b.value);

          switch (distances[0].side) {
            case "left":
              zombie.x = left;
              zombie.direction.x = -Math.abs(zombie.direction.x);
              break;
            case "right":
              zombie.x = right;
              zombie.direction.x = Math.abs(zombie.direction.x);
              break;
            case "top":
              zombie.y = top;
              zombie.direction.y = -Math.abs(zombie.direction.y);
              break;
            default:
              zombie.y = bottom;
              zombie.direction.y = Math.abs(zombie.direction.y);
          }
        }

        return true;
      }

      function resolveSafeZones(zombie, previousX, previousY) {
        const safeZones = getZombieSafeZones();
        const previousWasSafe = !safeZones.some((zone) =>
          isInsideInflatedZoneFor(
            zone,
            previousX,
            previousY,
            HALF_W,
            HALF_H
          )
        );
        const attemptedX = zombie.x;
        const attemptedY = zombie.y;

        // 중앙과 자동차 안전 구역처럼 확장 판정이 일부 겹치는 경우에도
        // 어느 안전 구역 안에도 남지 않도록 여러 번 확인합니다.
        for (let pass = 0; pass <= safeZones.length; pass += 1) {
          let resolved = false;

          for (const zone of safeZones) {
            if (
              resolveSafeZoneFor(
                zombie,
                zone,
                previousX,
                previousY
              )
            ) {
              resolved = true;
            }
          }

          if (!resolved) return;
        }

        const stillInsideSafeZone = safeZones.some((zone) =>
          isInsideInflatedZoneFor(
            zone,
            zombie.x,
            zombie.y,
            HALF_W,
            HALF_H
          )
        );

        // 겹친 경계의 드문 예외에서는 진입 전 위치로 되돌려
        // 안전 구역 안에 머무르는 상황을 확실히 방지합니다.
        if (stillInsideSafeZone && previousWasSafe) {
          zombie.x = previousX;
          zombie.y = previousY;

          const movedX = attemptedX - previousX;
          const movedY = attemptedY - previousY;

          if (Math.abs(movedX) >= Math.abs(movedY)) {
            zombie.direction.x = movedX >= 0
              ? -Math.abs(zombie.direction.x)
              : Math.abs(zombie.direction.x);
          } else {
            zombie.direction.y = movedY >= 0
              ? -Math.abs(zombie.direction.y)
              : Math.abs(zombie.direction.y);
          }

          return;
        }

        // 수정 전에 이미 구조물과 겹쳐 있던 좀비도 다음 이동 프레임에
        // 모든 안전 구역 밖의 가장 가까운 경계점으로 밀어냅니다.
        if (stillInsideSafeZone) {
          const minX = GAME_ZONE.left + HALF_W;
          const maxX = GAME_ZONE.right - HALF_W;
          const minY = GAME_ZONE.top + HALF_H;
          const maxY = GAME_ZONE.bottom - HALF_H;
          const xCandidates = [zombie.x];
          const yCandidates = [zombie.y];

          for (const zone of safeZones) {
            xCandidates.push(
              zone.left - HALF_W,
              zone.right + HALF_W
            );
            yCandidates.push(
              zone.top - HALF_H,
              zone.bottom + HALF_H
            );
          }

          let nearestCandidate = null;
          let nearestDistance = Infinity;

          for (const candidateX of xCandidates) {
            for (const candidateY of yCandidates) {
              if (
                candidateX < minX ||
                candidateX > maxX ||
                candidateY < minY ||
                candidateY > maxY
              ) {
                continue;
              }

              const candidateIsBlocked = safeZones.some((zone) =>
                isInsideInflatedZoneFor(
                  zone,
                  candidateX,
                  candidateY,
                  HALF_W,
                  HALF_H
                )
              );

              if (candidateIsBlocked) continue;

              const distance = Math.hypot(
                candidateX - zombie.x,
                candidateY - zombie.y
              );

              if (distance < nearestDistance) {
                nearestDistance = distance;
                nearestCandidate = {
                  x: candidateX,
                  y: candidateY
                };
              }
            }
          }

          if (nearestCandidate) {
            const pushedX = nearestCandidate.x - zombie.x;
            const pushedY = nearestCandidate.y - zombie.y;
            zombie.x = nearestCandidate.x;
            zombie.y = nearestCandidate.y;

            if (Math.abs(pushedX) >= Math.abs(pushedY)) {
              zombie.direction.x = pushedX >= 0
                ? Math.abs(zombie.direction.x)
                : -Math.abs(zombie.direction.x);
            } else {
              zombie.direction.y = pushedY >= 0
                ? Math.abs(zombie.direction.y)
                : -Math.abs(zombie.direction.y);
            }
          }
        }
      }

      function updateBirthing(zombie, now) {
        const elapsed = now - zombie.birthStartedAt;

        // 1번 프레임의 처음 1초 동안 좀비와 그림자를 함께 페이드인합니다.
        zombie.element.style.opacity = String(
          clamp(elapsed / BIRTH_FADE_IN_MS, 0, 1)
        );

        let phaseStart = 0;

        for (
          let index = 0;
          index < BIRTH_FRAME_DURATIONS_MS.length;
          index += 1
        ) {
          const holdEnd =
            phaseStart + BIRTH_FRAME_DURATIONS_MS[index];

          if (elapsed < holdEnd) {
            showSingleFrame(
              zombie,
              BIRTH_DEATH_SHEET,
              index
            );
            return;
          }

          phaseStart = holdEnd;
        }

        // 마지막 생성 프레임에서 걷기 프레임으로도 즉시 전환합니다.
        zombie.state = "walking";
        zombie.walkElapsed = 0;
        zombie.element.style.opacity = "1";
        showSingleFrame(
          zombie,
          WALK_SHEET,
          zombie.walkFrame
        );
      }

      function updateWalking(zombie, deltaMs, now) {
        if (zombie.state === "hit") {
          if (now >= zombie.hitReactionEnd) {
            zombie.state = "walking";
            zombie.sprite.style.backgroundImage = `url("${WALK_SHEET}")`;
            zombie.sprite.style.opacity = "1";
            zombie.overlay.style.opacity = "0";
          } else {
            showSingleFrame(
              zombie,
              DEAD_SHEET,
              zombie.hitReactionFrame
            );
            return;
          }
        }

        const previousX = zombie.x;
        const previousY = zombie.y;

        zombie.x += zombie.direction.x * MOVE_SPEED_PX_PER_MS * deltaMs;
        zombie.y += zombie.direction.y * MOVE_SPEED_PX_PER_MS * deltaMs;

        resolveOuterBounds(zombie);
        resolveSafeZones(zombie, previousX, previousY);
        setFacing(zombie);

        zombie.walkElapsed += deltaMs;
        const frameDuration = 1000 / WALK_FPS;

        if (zombie.walkElapsed >= frameDuration) {
          const advancedFrames = Math.floor(zombie.walkElapsed / frameDuration);
          zombie.walkElapsed %= frameDuration;
          zombie.walkFrame = (zombie.walkFrame + advancedFrames) % 8;
        }

        showSingleFrame(
          zombie,
          WALK_SHEET,
          zombie.walkFrame
        );

        renderZombie(zombie);
      }

      function updateDying(zombie, now) {
        const elapsed = now - zombie.deathStartedAt;
        const deathFrameDuration = 1000 / DEATH_FPS;
        const deathAnimationEnd = 4 * deathFrameDuration;
        const lastDeathFrameHoldEnd =
          deathAnimationEnd + DEATH_LAST_FRAME_HOLD_MS;
        const transitionOneEnd =
          lastDeathFrameHoldEnd + DEATH_TRANSITION_MS;
        const extraFrameOneHoldEnd =
          transitionOneEnd + DEATH_EXTRA_FRAME_MS;
        const transitionTwoEnd =
          extraFrameOneHoldEnd + DEATH_TRANSITION_MS;
        const extraFrameTwoHoldEnd =
          transitionTwoEnd + DEATH_EXTRA_FRAME_MS;
        const fadeEnd =
          extraFrameTwoHoldEnd + FADE_DURATION_MS;

        const isBackwardDeath = zombie.deathStartFrame === 0;
        const deadLastFrame = zombie.deathStartFrame + 3;
        const extraFrameOne = isBackwardDeath ? 4 : 6;
        const extraFrameTwo = extraFrameOne + 1;

        zombie.element.style.opacity = "1";

        if (elapsed < deathAnimationEnd) {
          const localFrame = Math.min(
            3,
            Math.floor(elapsed / deathFrameDuration)
          );

          showSingleFrame(
            zombie,
            DEAD_SHEET,
            zombie.deathStartFrame + localFrame
          );
          return;
        }

        if (elapsed < lastDeathFrameHoldEnd) {
          showSingleFrame(
            zombie,
            DEAD_SHEET,
            deadLastFrame
          );
          return;
        }

        if (elapsed < transitionOneEnd) {
          const progress =
            (elapsed - lastDeathFrameHoldEnd) /
            DEATH_TRANSITION_MS;

          showCrossfade(
            zombie,
            DEAD_SHEET,
            deadLastFrame,
            BIRTH_DEATH_SHEET,
            extraFrameOne,
            progress
          );
          return;
        }

        if (elapsed < extraFrameOneHoldEnd) {
          showSingleFrame(
            zombie,
            BIRTH_DEATH_SHEET,
            extraFrameOne
          );
          return;
        }

        if (elapsed < transitionTwoEnd) {
          const progress =
            (elapsed - extraFrameOneHoldEnd) /
            DEATH_TRANSITION_MS;

          showCrossfade(
            zombie,
            BIRTH_DEATH_SHEET,
            extraFrameOne,
            BIRTH_DEATH_SHEET,
            extraFrameTwo,
            progress
          );
          return;
        }

        if (elapsed < extraFrameTwoHoldEnd) {
          showSingleFrame(
            zombie,
            BIRTH_DEATH_SHEET,
            extraFrameTwo
          );
          return;
        }

        if (elapsed < fadeEnd) {
          const fadeProgress =
            (elapsed - extraFrameTwoHoldEnd) /
            FADE_DURATION_MS;

          showSingleFrame(
            zombie,
            BIRTH_DEATH_SHEET,
            extraFrameTwo
          );

          // 전체 요소의 투명도를 낮춰 그림자도 함께 사라지게 합니다.
          zombie.element.style.opacity =
            String(Math.max(0, 1 - fadeProgress));
          return;
        }

        removeZombie(zombie);
      }

      function gameLoop(now) {
        const deltaMs = Math.min(100, now - lastFrameTime);
        lastFrameTime = now;

        for (const zombie of zombies.values()) {
          if (zombie.state === "birthing") {
            updateBirthing(zombie, now);
          } else if (
            zombie.state === "walking" ||
            zombie.state === "hit"
          ) {
            updateWalking(zombie, deltaMs, now);
          } else if (zombie.state === "dying") {
            updateDying(zombie, now);
          }
        }

        for (const deer of deerMap.values()) {
          if (deer.state === "birthing") {
            updateDeerBirthing(deer, now);
          } else if (deer.state === "idle") {
            updateDeerIdle(deer, now);
          } else if (deer.state === "turning") {
            updateDeerTurning(deer, deltaMs);
          } else if (
            deer.state === "evading" ||
            deer.state === "leaving"
          ) {
            updateDeerEvading(deer, deltaMs);
          } else if (deer.state === "dying") {
            updateDeerDying(deer, now);
          }
        }

        updateCloudGroup("sky", deltaMs, now);
        updateCloudGroup("shadow", deltaMs, now);
        updateBirds(now);

        requestAnimationFrame(gameLoop);
      }

      function scheduleNextZombieSpawnTick() {
        if (zombieSpawnTimerId !== null) {
          clearTimeout(zombieSpawnTimerId);
        }

        const elapsed = Math.max(0, Date.now() - lastZombieSpawnAt);
        const delay = Math.max(0, SPAWN_INTERVAL_MS - elapsed);

        zombieSpawnTimerId = window.setTimeout(() => {
          zombieSpawnTimerId = null;
          lastZombieSpawnAt = Date.now();

          if (canCreateZombie()) {
            const created = createZombie();
            if (created && pendingEmptyZombieSpawnTimerId !== null) {
              clearTimeout(pendingEmptyZombieSpawnTimerId);
              pendingEmptyZombieSpawnTimerId = null;
            }
          } else {
            saveResourceState();
          }

          scheduleNextZombieSpawnTick();
        }, delay);
      }

      function scheduleNextDeerSpawnTick() {
        if (deerSpawnTimerId !== null) {
          clearTimeout(deerSpawnTimerId);
        }

        const elapsed = Math.max(0, Date.now() - lastDeerSpawnAt);
        const delay = Math.max(0, DEER_SPAWN_INTERVAL_MS - elapsed);

        deerSpawnTimerId = window.setTimeout(() => {
          deerSpawnTimerId = null;
          lastDeerSpawnAt = Date.now();

          if (
            firstKillBirdFlockPlayed &&
            !isExploring &&
            deerMap.size < MAX_ACTIVE_DEER &&
            hasActivePopulationCapacity() &&
            foodCount < getMaxFoodCount()
          ) {
            createDeer();
          } else {
            saveResourceState();
          }

          scheduleNextDeerSpawnTick();
        }, delay);
      }

      function handleStructureInteraction(event, message, sound = "") {
        if (event) {
          event.preventDefault();
        }

        if (isExploring || document.body.classList.contains("is-night")) {
          return;
        }

        showToast(message);
        if (sound) {
          playStructureSound(sound);
        }
      }

      function handleStructureKeydown(event, message, sound = "") {
        if (event.key !== "Enter" && event.key !== " ") return;
        handleStructureInteraction(event, message, sound);
      }


      function getRemainingUntilRegularZombieSpawn() {
        const elapsed = Math.max(0, Date.now() - lastZombieSpawnAt);
        return Math.max(0, SPAWN_INTERVAL_MS - elapsed);
      }

      function scheduleEmptyFieldZombieSpawn() {
        if (pendingEmptyZombieSpawnTimerId !== null) {
          clearTimeout(pendingEmptyZombieSpawnTimerId);
          pendingEmptyZombieSpawnTimerId = null;
        }
        if (getLivingZombieCount() > 0 || !canCreateZombie()) return;

        const delay = 1_000 + Math.random() * 4_000;
        const regularSpawnRemaining = getRemainingUntilRegularZombieSpawn();

        // 빈 화면 보충 직후 정규 1분 생성이 겹치지 않도록,
        // 보충 시점 기준 5초 안에 정규 생성이 예정되어 있으면 기다립니다.
        if (
          regularSpawnRemaining <=
          delay + EMPTY_ZOMBIE_REGULAR_SPAWN_GUARD_MS
        ) {
          return;
        }

        pendingEmptyZombieSpawnTimerId = window.setTimeout(() => {
          pendingEmptyZombieSpawnTimerId = null;

          if (
            getRemainingUntilRegularZombieSpawn() <=
            EMPTY_ZOMBIE_REGULAR_SPAWN_GUARD_MS
          ) {
            return;
          }

          if (getLivingZombieCount() === 0 && canCreateZombie()) {
            const created = createZombie();
            if (created) {
              // 빈 화면 보충도 실제 생성으로 간주해 다음 정규 생성은 1분 뒤로 미룹니다.
              lastZombieSpawnAt = Date.now();
              scheduleNextZombieSpawnTick();
              saveResourceState();
            }
          }
        }, delay);
      }

      function scheduleEmptyFieldDeerSpawn() {
        if (pendingEmptyDeerSpawnTimerId !== null) {
          clearTimeout(pendingEmptyDeerSpawnTimerId);
        }
        if (
          !firstKillBirdFlockPlayed ||
          isExploring ||
          getLivingDeerCount() > 0 ||
          foodCount >= getMaxFoodCount() ||
          !hasActivePopulationCapacity()
        ) {
          return;
        }
        const delay = EMPTY_DEER_SPAWN_MIN_DELAY_MS +
          Math.random() *
            (EMPTY_DEER_SPAWN_MAX_DELAY_MS -
              EMPTY_DEER_SPAWN_MIN_DELAY_MS);
        pendingEmptyDeerSpawnTimerId = window.setTimeout(() => {
          pendingEmptyDeerSpawnTimerId = null;
          if (
            firstKillBirdFlockPlayed &&
            !isExploring &&
            getLivingDeerCount() === 0 &&
            foodCount < getMaxFoodCount() &&
            hasActivePopulationCapacity()
          ) {
            createDeer();
          }
        }, delay);
      }

      function startSpawner() {
        // 새 게임에서만 첫 좀비를 즉시 생성합니다.
        // 페이지를 열 때 이미 Axe를 보유했다면 첫 시작용 즉시 생성은 건너뜁니다.
        if (!skipFirstStartSequence && canCreateZombie()) {
          createZombie();
        }

        // 간헐적으로 지나가는 새는 첫 처치 연출 여부와 관계없이 항상 유지합니다.
        scheduleNextAmbientBirdFlock();
        scheduleNextZombieSpawnTick();
        scheduleNextDeerSpawnTick();
      }

      axePickupHitArea.addEventListener("pointerup", (event) => {
        if (!shouldActivateFieldObject(event, axePickupHitArea)) return;
        collectAxe(event);
      });
      axePickupHitArea.addEventListener("keydown", handleAxePickupKeydown);
      treeHitArea.addEventListener("pointerup", (event) => {
        if (!shouldActivateFieldObject(event, treeHitArea)) return;
        playTreeChopAnimation(event);
      });
      treeHitArea.addEventListener("keydown", handleTreeKeydown);
      shedObject.addEventListener("pointerup", (event) => {
        if (!shouldActivateFieldObject(event, shedObject)) return;
        if (isShedRepaired()) {
          handleStructureInteraction(event, SHED_REPAIRED_TOAST_MESSAGE, SHED_OLD_SOUND);
          return;
        }
        unlockShedRepairBlueprint();
        applyRepairState();
        handleStructureInteraction(event, SHED_REPAIR_TOAST_MESSAGE, SHED_OLD_SOUND);
      });
      shedObject.addEventListener("keydown", (event) => {
        if (event.key !== "Enter" && event.key !== " ") return;
        if (!isShedRepaired()) {
          unlockShedRepairBlueprint();
          applyRepairState();
        }
        handleStructureKeydown(event, isShedRepaired() ? SHED_REPAIRED_TOAST_MESSAGE : SHED_REPAIR_TOAST_MESSAGE, SHED_OLD_SOUND);
      });
      carObject.addEventListener("pointerup", (event) => {
        if (!shouldActivateFieldObject(event, carObject)) return;
        handleStructureInteraction(
          event,
          CAR_REPAIR_TOAST_MESSAGE,
          CAR_FAIL_SOUND
        );
      });
      carObject.addEventListener("keydown", (event) => {
        handleStructureKeydown(event, CAR_REPAIR_TOAST_MESSAGE, CAR_FAIL_SOUND);
      });
      mailboxObject.addEventListener("pointerup", (event) => {
        if (!shouldActivateFieldObject(event, mailboxObject)) return;
        handleMailboxInteraction(event);
      });
      mailboxObject.addEventListener("keydown", (event) => {
        if (event.key !== "Enter" && event.key !== " ") return;
        handleMailboxInteraction(event);
      });
      repairButton.addEventListener("click", handleRepairButton);
      inventoryButton.addEventListener("click", handleInventoryButton);
      exploreButton.addEventListener("click", handleExploreButton);

      explorationOverlay.addEventListener("pointerdown", (event) => {
        if (event.target === explorationOverlay) {
          closeExplorationMenu();
        }
      });

      explorationMenu.addEventListener("pointerdown", (event) => {
        event.stopPropagation();
      });

      inventoryOverlay.addEventListener("pointerdown", (event) => {
        if (event.target === inventoryOverlay) {
          closeInventory();
        }
      });

      inventoryMenu.addEventListener("pointerdown", (event) => {
        event.stopPropagation();
      });

      repairOverlay.addEventListener("pointerdown", (event) => {
        if (event.target === repairOverlay) {
          closeRepair();
        }
      });

      repairMenu.addEventListener("pointerdown", (event) => {
        event.stopPropagation();
      });

      for (const categoryButton of repairCategories) {
        categoryButton.addEventListener("click", () => {
          playSound(INVENTORY_SET_SOUND);
          selectRepairCategory(
            categoryButton.dataset.repairCategory || "outdoor"
          );
        });
      }

      repairGrid.addEventListener("click", (event) => {
        const target = event.target.closest(".repair-grid-item");
        if (!target || !repairGrid.contains(target)) return;

        playSound(INVENTORY_SET_SOUND);
        selectRepairItem(target.dataset.repairItemIndex);
      });

      repairActionButton.addEventListener("click", handleRepairAction);

      function startInventoryPageDrag(event) {
        if (
          inventoryPageCount <= 1 ||
          inventoryPageDragState.active ||
          (event.pointerType === "mouse" && event.button !== 0)
        ) {
          return;
        }

        inventoryPageDragState.active = true;
        inventoryPageDragState.moved = false;
        inventoryPageDragState.pointerId = event.pointerId;
        inventoryPageDragState.startX = event.clientX;
        inventoryPageDragState.startY = event.clientY;
        inventoryPageDragState.currentX = event.clientX;
        inventoryPageDragState.startOffset =
          -inventoryCurrentPage * getInventoryPageWidth();
        inventoryViewport.setPointerCapture(event.pointerId);
      }

      function moveInventoryPageDrag(event) {
        if (
          !inventoryPageDragState.active ||
          event.pointerId !== inventoryPageDragState.pointerId
        ) {
          return;
        }

        const deltaX = event.clientX - inventoryPageDragState.startX;
        const deltaY = event.clientY - inventoryPageDragState.startY;
        inventoryPageDragState.currentX = event.clientX;

        if (!inventoryPageDragState.moved) {
          if (Math.abs(deltaX) < 8 && Math.abs(deltaY) < 8) return;
          if (Math.abs(deltaY) > Math.abs(deltaX)) return;
          inventoryPageDragState.moved = true;
        }

        event.preventDefault();

        let resistedDeltaX = deltaX;
        if (
          (inventoryCurrentPage === 0 && deltaX > 0) ||
          (inventoryCurrentPage === inventoryPageCount - 1 && deltaX < 0)
        ) {
          resistedDeltaX *= 0.35;
        }

        setInventoryTrackOffset(
          inventoryPageDragState.startOffset + resistedDeltaX,
          false
        );
      }

      function endInventoryPageDrag(event) {
        if (
          !inventoryPageDragState.active ||
          event.pointerId !== inventoryPageDragState.pointerId
        ) {
          return;
        }

        const deltaX = event.clientX - inventoryPageDragState.startX;
        const pageWidth = getInventoryPageWidth();
        let targetPage = inventoryCurrentPage;

        if (
          inventoryPageDragState.moved &&
          Math.abs(deltaX) >= Math.max(42, pageWidth * 0.18)
        ) {
          targetPage += deltaX < 0 ? 1 : -1;
        }

        if (inventoryPageDragState.moved) {
          suppressInventoryClickUntil = performance.now() + 300;
        }

        if (inventoryViewport.hasPointerCapture(event.pointerId)) {
          inventoryViewport.releasePointerCapture(event.pointerId);
        }

        inventoryPageDragState.active = false;
        inventoryPageDragState.moved = false;
        inventoryPageDragState.pointerId = null;
        goToInventoryPage(targetPage, true);
      }

      inventoryViewport.addEventListener("pointerdown", startInventoryPageDrag);
      inventoryViewport.addEventListener("pointermove", moveInventoryPageDrag);
      inventoryViewport.addEventListener("pointerup", endInventoryPageDrag);
      inventoryViewport.addEventListener("pointercancel", endInventoryPageDrag);

      for (const item of inventoryItems) {
        item.addEventListener("mouseenter", () => {
          clearInventoryItemNewState(item.dataset.item || "");
        });

        item.addEventListener("click", () => {
          if (performance.now() < suppressInventoryClickUntil) return;

          const itemType = item.dataset.item || "";
          clearInventoryItemNewState(itemType);

          if (itemType === "handgunAmmo" && hasHandgunAmmo) {
            playSound(INVENTORY_SET_SOUND);
            showToast(HANDGUN_AMMO_SELECTED_TOAST_MESSAGE);
            return;
          }

          if (itemType === "axe" && hasAxe) {
            const willEquipAxe = !isAxeEquipped;
            playSound(
              willEquipAxe ? GET_AXE_SOUND : INVENTORY_SET_SOUND,
              willEquipAxe ? 0.7 : 1
            );
            isAxeEquipped = willEquipAxe;
            if (willEquipAxe) {
              isHandgunEquipped = false;
            }
            applyInventoryState();
            saveResourceState();
            return;
          }

          if (itemType === "handgun" && hasHandgun) {
            const willEquipHandgun = !isHandgunEquipped;
            playSound(
              willEquipHandgun
                ? HANDGUN_EQUIP_SOUND
                : INVENTORY_SET_SOUND
            );
            isHandgunEquipped = willEquipHandgun;
            if (willEquipHandgun) {
              isAxeEquipped = false;
              showToast(HANDGUN_SELECTED_TOAST_MESSAGE);
            }
            applyInventoryState();
            saveResourceState();
            return;
          }

          if (itemType === "musicBox" && hasMusicBox) {
            playSound(INVENTORY_SET_SOUND);
            showToast(MUSIC_BOX_SELECTED_TOAST_MESSAGE);
            setMusicOn(!isMusicOn);
            return;
          }

          if (itemType === "strangerLetter" && hasStrangerLetter) {
            playSound(INVENTORY_SET_SOUND);
            isStrangerLetterOn = !isStrangerLetterOn;
            updateTodoListUI();
            applyInventoryState();
            saveResourceState();
            return;
          }
        });
      }

      // 저장된 Music Box가 On인데 브라우저가 자동 재생을 막은 경우,
      // 다음 일반 클릭에서 현재 낮/밤 트랙 재생을 다시 시도합니다.
      document.addEventListener("click", () => {
        if (hasMusicBox && isMusicOn && !bgmStarted) {
          startBgmPlayback();
        }
      });

      document.addEventListener("keydown", (event) => {
        if (event.key !== "Escape") return;
        closeExplorationMenu();
        closeInventory();
        closeRepair();
      });

      for (const option of explorationOptions) {
        option.addEventListener("click", () => {
          handleExplorationDestination(option.dataset.destination);
        });
      }

      versionNumber.textContent = GAME_VERSION;
      versionTestButton.classList.toggle("is-test-active", TEST_MODE);
      versionTestButton.tabIndex = TEST_MODE ? 0 : -1;
      versionTestButton.addEventListener("pointerdown", handleVersionLabelTestAction);

      viewport.addEventListener("pointerdown", startBackgroundDrag);
      viewport.addEventListener("pointermove", moveBackgroundDrag);
      viewport.addEventListener("pointerup", endBackgroundDrag);
      viewport.addEventListener("pointercancel", endBackgroundDrag);

      window.addEventListener("resize", () => {
        updateWorldScale();
        updateInventoryPagePosition(false);
        if (isRepairOpen) applyRepairState();
      });

      window.addEventListener("pagehide", saveResourceState);
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "hidden") {
          saveResourceState();
        }
      });

      async function initializeGame() {
        // 공격에 쓰이는 좀비/사슴 스프라이트까지 디코딩된 뒤 게임을 시작합니다.
        await preloadGameSprites();

        loadResourceState();
        restoreStoredPopulation();
        updateWorldScale();
        initializeClouds();
        startSpawner();
        updateTodoListUI();
        scheduleEmptyFieldZombieSpawn();
        scheduleEmptyFieldDeerSpawn();

        if (hasMusicBox && isMusicOn) {
          startBgmPlayback();
        }

        if (document.body.classList.contains("is-restored-night")) {
          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              document.body.classList.remove("is-restored-night");
            });
          });
        }

        // 초기 저장 상태가 화면에 적용된 다음부터만 우하단 등장 페이드를 허용합니다.
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            document.body.classList.remove("is-initializing-status");
          });
        });

        lastFrameTime = performance.now();
        requestAnimationFrame(gameLoop);
      }

      initializeGame();
    })();
  </script>
</body>
</html>
