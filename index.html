<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>CoZy</title>
  <style>
    @font-face {
      font-family: "Montserrat";
      src: url("fonts/Montserrat-VariableFont_wght.ttf") format("truetype");
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Caveat";
      src: url("fonts/Caveat-VariableFont_wght.ttf") format("truetype");
      font-weight: 400 700;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --world-size: 2048px;
      --zombie-width: 64px;
      --zombie-height: 128px;
      --deer-width: 85.3333px;
      --deer-height: 85.3333px;

      /*
        집 / 창고 / 울타리 / 차 위치와 크기 수정 위치
        - left: 오른쪽으로 갈수록 증가
        - top: 아래로 갈수록 증가
        - size: 표시 크기(정사각형)
      */
      --house-left: 814px;
      --house-top: 730px;
      --house-size: 490px;

      --shed-left: 530px;
      --shed-top: 565px;
      --shed-size: 190px;

      --fence-left: 782px;
      --fence-top: 792px;
      --fence-size: 490px;

      --car-left: 1140px;
      --car-top: 1160px;
      --car-size: 256px;

      /* 메일함 위치와 크기: 자동차처럼 여기서 직접 수정할 수 있습니다. */
      --mailbox-left: 943px;
      --mailbox-top: 1066px;
      --mailbox-size: 64px;
    }

    * {
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #111;
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      touch-action: none;
    }

    body {
      font-family: "Montserrat", Arial, Helvetica, sans-serif;
      touch-action: none;
    }

    #viewport {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #111;
      touch-action: none;
    }

    #viewport.can-pan {
      cursor: grab;
    }

    #viewport.is-panning {
      cursor: grabbing;
    }

    #world {
      position: absolute;
      left: 50%;
      top: 50%;
      width: var(--world-size);
      height: var(--world-size);
      transform-origin: center center;
      background-image: url("images/bg_field_default_day.png");
      background-repeat: no-repeat;
      background-position: center;
      background-size: 2048px 2048px;
      will-change: transform;
    }

    /* 탐험 중에는 밤 배경을 3초 동안 페이드인하고, 귀환 시 반대로 전환합니다. */
    #world::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      background-image: url("images/bg_field_default_nigth.png");
      background-repeat: no-repeat;
      background-position: center;
      background-size: 2048px 2048px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 3s ease;
    }

    body.is-night #world::after {
      opacity: 1;
    }

    #cloudShadows,
    #clouds {
      position: absolute;
      inset: 0;
      overflow: visible;
      pointer-events: none;
    }

    /* 구름 그림자는 배경 위, 좀비 아래에 표시합니다. */
    #cloudShadows {
      z-index: 1;
      /*
        자식 그림자 요소가 아니라 레이어 전체를 배경과 곱합니다.
        z-index로 생성된 별도 합성 레이어 안에서 blend가 갇히는 문제를 방지합니다.
      */
      mix-blend-mode: multiply;
    }

    /* 도끼가 꽂힌 나무 밑동은 배경 오브젝트로 좀비보다 아래에 표시합니다. */
    #props {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    /*
      집 / 창고 / 울타리 / 차 레이어입니다.
      실제 위치와 크기는 위쪽 :root의 --house-*, --shed-*, --fence-*, --car-* 값으로 조정합니다.
    */
    #structures {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .world-structure {
      position: absolute;
      background-repeat: no-repeat;
      background-position: 0 0;
      image-rendering: auto;
      pointer-events: none;
      transform-origin: left top;
      transition: filter 3s ease;
      will-change: filter;
    }

    /*
      house_1.png은 1024×1024 2×2 스프라이트 시트입니다.
      - 낮: 첫 번째 이미지(좌상단)
      - 밤: 두 번째 이미지(상단 오른쪽)
      집의 밤 이미지는 이미 어두운 버전이므로 별도 brightness 처리는 하지 않습니다.
    */
    #houseObject {
      left: var(--house-left);
      top: var(--house-top);
      z-index: 3;
      width: var(--house-size);
      height: var(--house-size);
      overflow: hidden;
    }

    #houseObject::before,
    #houseObject::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image: url("images/house_1.png");
      background-repeat: no-repeat;
      background-size: 200% 200%;
      pointer-events: none;
      transition: opacity 3s ease;
    }

    /* 첫 번째 이미지(좌상단) */
    #houseObject::before {
      background-position: 0 0;
      opacity: 1;
    }

    /* 두 번째 이미지(상단 오른쪽) */
    #houseObject::after {
      background-position: 100% 0;
      opacity: 0;
    }

    body.is-night #houseObject::before {
      opacity: 0;
    }

    body.is-night #houseObject::after {
      opacity: 1;
    }

    /*
      창고 / 울타리 / 차는 낮 이미지와 밤 컬러 이미지를 겹쳐 놓고
      집·나무·배경처럼 3초 동안 크로스페이드합니다.
      filter 자체는 보간하지 않고 밤 레이어의 opacity만 전환해 색이 튀는 현상을 방지합니다.
    */
    #mailboxObject {
      position: absolute;
      left: var(--mailbox-left);
      top: var(--mailbox-top);
      width: var(--mailbox-size);
      height: var(--mailbox-size);
      background: none;
      border: 0;
      padding: 0;
      margin: 0;
      cursor: pointer;
      z-index: 6;
      appearance: none;
      -webkit-appearance: none;
      pointer-events: auto;
      touch-action: none;
    }

    /* 메일함도 자동차와 같은 밤 컬러 레이어를 사용해 3초 동안 전환합니다. */
    #mailboxObject::before,
    #mailboxObject::after {
      content: "";
      position: absolute;
      inset: 0;
      background: center / contain no-repeat url("images/mailbox.png");
      pointer-events: none;
      transition: opacity 3s ease;
      will-change: opacity;
    }

    #mailboxObject::before {
      opacity: 1;
    }

    #mailboxObject::after {
      opacity: 0;
      filter: url(#nightCoolBalance) brightness(0.4) saturate(0.55);
    }

    body.is-night #mailboxObject::before {
      opacity: 0;
    }

    body.is-night #mailboxObject::after {
      opacity: 1;
    }

    #mailboxObject.is-hidden-visual {
      opacity: 0;
    }

    body.is-night #mailboxObject {
      pointer-events: none;
      cursor: default;
    }

    #todoListOverlay {
      position: absolute;
      left: 30px;
      top: 90px;
      z-index: 30;
      color: rgba(255, 255, 255, 0.7);
      font-family: "Caveat", cursive;
      font-size: 22px;
      font-style: normal;
      font-weight: 200;
      line-height: 0.4;
      text-align: left;
      opacity: 1;
      transform: translateX(0);
      white-space: pre-wrap;
      pointer-events: none;
      will-change: transform, opacity;
    }

    #todoListOverlay[hidden] {
      display: none;
    }

    #todoListOverlay.is-showing {
      animation:
        todo-list-slide-in 700ms cubic-bezier(0.39, 0.575, 0.565, 1) both,
        todo-list-fade-in 700ms linear both;
    }

    #todoListOverlay.is-hiding {
      animation: todo-list-fade-out 300ms linear forwards;
    }

    @keyframes todo-list-slide-in {
      from { transform: translateX(-100px); }
      to { transform: translateX(0); }
    }

    @keyframes todo-list-fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes todo-list-fade-out {
      from { opacity: 1; }
      to { opacity: 0; }
    }

    #todoListTitle {
      display: block;
      margin-bottom: 3px;
      color: rgba(255, 255, 255, 0.9);
      line-height: 0.36;
      text-transform: lowercase;
    }

    .todo-item {
      position: relative;
      display: block;
      width: max-content;
      max-width: 260px;
      padding-left: 0.9em;
    }

    .todo-item + .todo-item {
      margin-top: -2px;
    }

    .todo-item.is-complete {
      opacity: 0.55;
    }

    .todo-item::before {
      content: "•";
      position: absolute;
      left: 0;
      top: 0;
    }

    .todo-item.is-complete::after {
      content: "";
      position: absolute;
      left: 0.9em;
      right: 0;
      top: calc(50% + 2px);
      border-top: 1px solid currentColor;
      transform: translateY(-50%);
    }

    #todoDoneNote {
      display: block;
      margin-top: 4px;
      opacity: 1;
    }

    #todoDoneNote[hidden] {
      display: none;
    }

    #inventoryEmptyState {
      width: 100%;
      text-align: center;
      color: #fff;
      font-size: 24px;
      font-weight: 350;
      line-height: 1;
      letter-spacing: 0;
      opacity: 0.3;
      padding: 70px 0 54px;
    }

    #inventoryEmptyState[hidden] {
      display: none;
    }

    .repair-category.is-selected:hover .repair-category-label {
      font-weight: 500;
    }

    #repairButton {
      position: relative;
      overflow: visible;
    }

    #repairNewBadge[hidden] {
      display: none;
    }

    #shedObject {
      left: var(--shed-left);
      top: var(--shed-top);
      z-index: 2;
      width: var(--shed-size);
      height: var(--shed-size);
    }

    #fenceObject {
      left: var(--fence-left);
      top: var(--fence-top);
      z-index: 4;
      width: var(--fence-size);
      height: var(--fence-size);
    }

    #carObject {
      left: var(--car-left);
      top: var(--car-top);
      /* 자동차는 집(z-index: 3)과 울타리(z-index: 4)보다 앞에 표시합니다. */
      z-index: 5;
      width: var(--car-size);
      height: var(--car-size);
    }

    /* 수리가 필요한 창고와 자동차만 필드에서 직접 선택할 수 있습니다. */
    #shedObject,
    #carObject {
      pointer-events: auto;
      cursor: pointer;
      touch-action: none;
      outline: none;
    }

    /* 밤에는 나무와 동일하게 창고와 자동차 입력을 받지 않습니다. */
    body.is-night #shedObject,
    body.is-night #carObject {
      pointer-events: none;
      cursor: default;
    }

    #shedObject::before,
    #shedObject::after,
    #fenceObject::before,
    #fenceObject::after,
    #carObject::before,
    #carObject::after {
      content: "";
      position: absolute;
      inset: 0;
      background-repeat: no-repeat;
      background-position: 0 0;
      background-size: 200% 200%;
      pointer-events: none;
      transition: opacity 3s ease;
      will-change: opacity;
    }

    #shedObject::before,
    #shedObject::after {
      background-image: url("images/shed_1.png");
      background-position: var(--shed-frame-position, left top);
    }

    #fenceObject::before,
    #fenceObject::after {
      background-image: url("images/fence_1.png");
    }

    #carObject::before,
    #carObject::after {
      background-image: url("images/car.png");
    }

    /* 낮 레이어 */
    #shedObject::before,
    #fenceObject::before,
    #carObject::before {
      opacity: 1;
    }

    /* 밤 컬러 레이어 */
    #shedObject::after,
    #fenceObject::after,
    #carObject::after {
      opacity: 0;
      filter: url(#nightCoolBalance) brightness(0.4) saturate(0.55);
    }

    body.is-night #shedObject::before,
    body.is-night #fenceObject::before,
    body.is-night #carObject::before {
      opacity: 0;
    }

    body.is-night #shedObject::after,
    body.is-night #fenceObject::after,
    body.is-night #carObject::after {
      opacity: 1;
    }

    #axeStump {
      position: absolute;
      left: 720px;
      top: 1020px;
      width: 179.2px;
      height: 179.2px;
      background-image: url("images/bg_stump_axe.png");
      background-repeat: no-repeat;
      background-position: var(--shed-frame-position, left top);
      background-size: 179.2px 179.2px;
      transform-origin: left top;
      pointer-events: none;
    }

    /* 탐험 중 빈 그루터기도 3초 동안 밤 이미지로 전환합니다. */
    #axeStump::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      background-image: url("images/bg_stump_night.png");
      background-repeat: no-repeat;
      background-position: var(--shed-frame-position, left top);
      background-size: 179.2px 179.2px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 3s ease;
    }

    body.is-night #axeStump::after {
      opacity: 1;
    }

    /* 이미지와 같은 70% 비율로 축소된 89.6×89.6 영역을 정중앙에 배치합니다. */
    #axePickupHitArea {
      position: absolute;
      left: 44.8px;
      top: 44.8px;
      width: 89.6px;
      height: 89.6px;
      z-index: 1;
      cursor: pointer;
      pointer-events: auto;
      touch-action: none;
      outline: none;
    }


    /* 나무와 터치 영역 전체를 원본의 60% 크기로 표시합니다. */
    #tree {
      position: absolute;
      /* 이전 위치에서 아래로 60px 이동 */
      left: 1103px;
      top: 562px;
      width: 512px;
      height: 512px;
      transform: scale(0.6);
      transform-origin: left top;
      pointer-events: none;
    }

    #treeDayVisual,
    #treeDayFadeVisual,
    #treeNightVisual,
    #treeCanopyDay,
    #treeCanopyDayFade,
    #treeCanopyNight {
      position: absolute;
      inset: 0;
      background-repeat: no-repeat;
      pointer-events: none;
    }

    #treeDayVisual {
      z-index: 0;
      background-image: url("images/bg_tree.png");
      background-position: -512px 0;
      background-size: 1024px 1024px;
      opacity: 1;
      transition: opacity 3s ease;
      will-change: background-position, opacity;
    }

    #treeDayFadeVisual {
      z-index: 1;
      background-image: url("images/bg_tree.png");
      background-position: -512px 0;
      background-size: 1024px 1024px;
      opacity: 0;
      transition: opacity 3s ease;
      will-change: background-position, opacity;
    }

    #treeNightVisual {
      z-index: 2;
      background-image: url("images/bg_tree_night.png");
      background-position: left top;
      background-size: 1024px 1024px;
      opacity: 0;
      transition: opacity 3s ease;
    }

    body.is-night #treeDayVisual,
    body.is-night #treeDayFadeVisual {
      opacity: 0;
    }

    body.is-night #treeNightVisual {
      opacity: 1;
    }

    /* 원본 왼쪽 절반 영역도 나무와 함께 60%로 축소됩니다. */
    #treeHitArea {
      position: absolute;
      left: 0;
      top: 0;
      z-index: 3;
      width: 256px;
      height: 512px;
      cursor: pointer;
      pointer-events: auto;
      touch-action: none;
      outline: none;
    }

    body.is-night #treeHitArea {
      pointer-events: none;
      cursor: default;
    }

    /* 나무 위쪽 3/4는 엔티티보다 앞에 표시해 위쪽 영역의 좀비/사슴이 나무 뒤로 지나가게 합니다. */
    #treeCanopyOverlay {
      position: absolute;
      left: 1103px;
      top: 562px;
      z-index: 15;
      width: 512px;
      height: 384px;
      overflow: hidden;
      transform: scale(0.6);
      transform-origin: left top;
      pointer-events: none;
    }

    /* 나무 파츠 그림자는 지면 오브젝트처럼 엔티티보다 아래에 표시합니다. */
    #treePartShadowLayer {
      position: absolute;
      inset: 0;
      z-index: 9;
      overflow: visible;
      pointer-events: none;
    }

    /* 나무를 칠 때 떨어지는 파츠는 나무 위에 겹쳐서 표시합니다. */
    #treePartLayer {
      position: absolute;
      inset: 0;
      z-index: 16;
      overflow: visible;
      pointer-events: none;
    }

    /*
      나무 파츠는 이동, 회전, 이미지 반전을 서로 다른 요소가 담당합니다.
      바깥 요소는 포물선 이동만, 회전용 부모는 (134, 105) 축 회전만 처리합니다.
    */
    .tree-falling-part {
      position: absolute;
      z-index: 1;
      width: 256px;
      height: 256px;
      will-change: transform, opacity;
      pointer-events: none;
    }

    /*
      나무 파츠 그림자 모양 수정 위치
      - 실제 위치와 크기는 아래 JavaScript의 TREE_PART_SHADOW_* 값으로 조정합니다.
      - skewX / scaleY: 그림자가 오른쪽으로 기울고 납작해지는 정도
      - filter blur(): 그림자 가장자리의 흐림 정도
    */
    .tree-falling-part-shadow {
      position: absolute;
      z-index: 0;
      background: #000;
      border-radius: 50%;
      opacity: 0;
      filter: blur(5px);
      transform: skewX(-28deg) scaleY(0.4);
      transform-origin: left center;
      will-change: opacity;
      pointer-events: none;
    }

    .tree-falling-part-rotator {
      position: absolute;
      inset: 0;
      transform-origin: 134px 105px;
      will-change: transform;
      pointer-events: none;
    }

    .tree-falling-part-image {
      position: absolute;
      inset: 0;
      background-image: url("images/bg_tree_part.png");
      background-repeat: no-repeat;
      background-position: center;
      background-size: 256px 256px;
      transform-origin: center center;
      will-change: transform;
      pointer-events: none;
    }

    #treeCanopyDay,
    #treeCanopyNight {
      width: 512px;
      height: 512px;
    }

    #treeCanopyDay {
      background-image: url("images/bg_tree.png");
      background-position: -512px 0;
      background-size: 1024px 1024px;
      opacity: 1;
      transition: opacity 3s ease;
      will-change: background-position, opacity;
    }

    #treeCanopyDayFade {
      background-image: url("images/bg_tree.png");
      background-position: -512px 0;
      background-size: 1024px 1024px;
      opacity: 0;
      transition: opacity 3s ease;
      will-change: background-position, opacity;
    }

    #treeCanopyNight {
      background-image: url("images/bg_tree_night.png");
      background-position: left top;
      background-size: 1024px 1024px;
      opacity: 0;
      transition: opacity 3s ease;
    }

    body.is-night #treeCanopyDay,
    body.is-night #treeCanopyDayFade {
      opacity: 0;
    }

    body.is-night #treeCanopyNight {
      opacity: 1;
    }

    #entities {
      position: absolute;
      inset: 0;
      z-index: 10;
      /* 빈 엔티티 레이어가 아래의 도끼 터치 영역을 가리지 않도록 합니다. */
      pointer-events: none;
    }

    /* 실제 구름은 좀비보다 높은 상공 레이어에 표시합니다. */
    #clouds {
      z-index: 20;
    }

    /* 새 떼는 배경 위 상공 레이어에서 날아가며, 화면 드래그에도 함께 반응합니다. */
    #birds {
      position: absolute;
      inset: 0;
      z-index: 19;
      overflow: visible;
      pointer-events: none;
    }

    .bird {
      position: absolute;
      width: 42.6667px;
      height: 42.6667px;
      background-color: #f1efe4;
      -webkit-mask-image: url("images/bird_fly.png");
      mask-image: url("images/bird_fly.png");
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-size: 128px 128px;
      mask-size: 128px 128px;
      -webkit-mask-position: 0 0;
      mask-position: 0 0;
      transform-origin: center center;
      image-rendering: auto;
      will-change: left, top, transform, opacity, -webkit-mask-position, mask-position;
      pointer-events: none;
    }

    .cloud-visual {
      position: absolute;
      width: 512px;
      height: 512px;
      transform-origin: center center;
      will-change: left, top, transform, opacity;
      pointer-events: none;
    }

    .cloud-visual::before,
    .cloud-visual::after {
      content: "";
      position: absolute;
      inset: 0;
      background-repeat: no-repeat;
      background-position: var(--cloud-position, 0 0);
      background-size: 1024px 1024px;
      pointer-events: none;
      transition: opacity 3s ease;
    }

    .cloud-visual::before {
      background-image: url("images/bg_field_default_clouds.png");
      opacity: 1;
    }

    .cloud-visual::after {
      background-image: url("images/bg_field_default_clouds_night.png");
      opacity: 0;
    }

    body.is-night .cloud-visual::before {
      opacity: 0;
    }

    body.is-night .cloud-visual::after {
      opacity: 1;
    }

    .cloud-shadow {
      opacity: 0.3;
      /* 실제 multiply 합성은 부모 #cloudShadows 레이어에서 처리합니다. */
      mix-blend-mode: normal;

      /*
        원본 구름 PNG의 투명도를 그대로 사용하면서
        그림자를 어두운 남청색(#303a72에 가까운 색)으로 변환합니다.
        mask-image를 사용하지 않으므로 file:// 로 직접 열어도 CORS에 막히지 않습니다.
      */
      filter:
        brightness(0)
        saturate(100%)
        invert(22%)
        sepia(18%)
        saturate(1780%)
        hue-rotate(193deg)
        brightness(88%)
        contrast(88%);
    }

    #hud {
      position: fixed;
      top: max(30px, calc(env(safe-area-inset-top) + 16px));

    }

    #toastLayer {
      position: fixed;
      top: 20vh;
      left: 50%;
      z-index: 140;
      width: min(90vw, 420px);
      height: 1px;
      transform: translateX(-50%);

    .toast-message {
      position: absolute;
      left: 50%;
      top: 0;
      color: #fff;
      font-size: 18px;
      font-weight: 350;
      line-height: 1.3;
      white-space: nowrap;
      text-align: center;
      transform: translate(-50%, 18px);
      will-change: transform;
      animation: toast-rise 3s linear forwards;
    }

    .toast-message-text {
      display: block;
      opacity: 0;
      will-change: opacity;
      animation: toast-fade 3s linear forwards;
    }

    /*
      새 토스트가 나타날 때 기존 토스트는 이동을 계속하면서
      남은 표시 시간이 충분한 경우 현재 투명도에서 0.5초 동안 사라집니다.
    */
    .toast-message.is-replaced .toast-message-text {
      animation: toast-replaced-fade 0.5s linear forwards;
    }

    @keyframes toast-rise {
      0% {
        transform: translate(-50%, 18px);
      }
      100% {
        transform: translate(-50%, -24px);
      }
    }

    @keyframes toast-fade {
      0% {
        opacity: 0;
      }
      16.6667% {
        opacity: 0.9;
      }
      66.6667% {
        opacity: 0.9;
      }
      100% {
        opacity: 0;
      }
    }

    @keyframes toast-replaced-fade {
      from {
        opacity: var(--toast-current-opacity, 0.9);
      }
      to {
        opacity: 0;
      }
    }

    #versionLabel {
      position: fixed;

    #exploreButton,
    #inventoryButton,

    @media (hover: hover) and (pointer: fine) {

      #exploreButton:hover .hud-action-button__label,
      #inventoryButton:hover .hud-action-button__label,
      #repairButton:hover .hud-action-button__label {
        opacity: 1;

    #exploreButton:focus-visible,
    #inventoryButton:focus-visible,
    #repairButton:focus-visible {

    #exploreButton:focus-visible .hud-action-button__label,
    #inventoryButton:focus-visible .hud-action-button__label,
    #repairButton:focus-visible .hud-action-button__label {
      opacity: 1;
      transform: translateX(0);
    }

    #exploreButton.is-menu-open.is-entry-expanded,
    #inventoryButton.is-menu-open.is-entry-expanded,
    #repairButton.is-menu-open.is-entry-expanded {
      width: var(--expanded-width);
    }

    #exploreButton.is-menu-open.is-entry-expanded .hud-action-button__label,
    #inventoryButton.is-menu-open.is-entry-expanded .hud-action-button__label,
    #repairButton.is-menu-open.is-entry-expanded .hud-action-button__label {

    /* 화면 진입 1초 뒤에는 포인터가 버튼 위에 남아 있어도 원형으로 복귀합니다. */
    #exploreButton.is-menu-open:not(.is-entry-expanded),
    #inventoryButton.is-menu-open:not(.is-entry-expanded),
    #repairButton.is-menu-open:not(.is-entry-expanded) {

    }

    #exploreButton.is-menu-open:not(.is-entry-expanded) .hud-action-button__label,
    #inventoryButton.is-menu-open:not(.is-entry-expanded) .hud-action-button__label,
    #repairButton.is-menu-open:not(.is-entry-expanded) .hud-action-button__label {
      opacity: 0;
      transform: translateX(-6px);
    }

    /* 현재 열려 있는 화면의 버튼도 다시 호버하면 일반 버튼과 같은 확장 연출을 보여줍니다. */
    @media (hover: hover) and (pointer: fine) {
      #exploreButton.is-menu-open.is-hover-ready:not(.is-entry-expanded):hover,
      #inventoryButton.is-menu-open.is-hover-ready:not(.is-entry-expanded):hover,
      #repairButton.is-menu-open.is-hover-ready:not(.is-entry-expanded):hover {

      }

      #exploreButton.is-menu-open.is-hover-ready:not(.is-entry-expanded):hover .hud-action-button__label,
      #inventoryButton.is-menu-open.is-hover-ready:not(.is-entry-expanded):hover .hud-action-button__label,
      #repairButton.is-menu-open.is-hover-ready:not(.is-entry-expanded):hover .hud-action-button__label {
        opacity: 1;
        transform: translateX(0);
      }

    #menuBackdrop {

    #explorationOverlay,

    /*

      선택 글자의 확대 폭을 반영해 JavaScript에서 갱신합니다.
      호버 중에는 너비가 고정되어 주변 항목이 흔들리지 않습니다.

    .repair-category {

      -webkit-appearance: none;

    .repair-category-label {

      transform-origin: center bottom;

        font-weight 150ms ease-out,
        transform 150ms cubic-bezier(0.215, 0.61, 0.355, 1);
    }

    .repair-category.is-selected .repair-category-label {

    .repair-category:active .repair-category-label {

      보이는 네모는 20×20px로 유지하고 버튼 입력 영역은 28×28px로 넓힙니다.
      버튼 영역끼리 맞닿게 배치해 네모 사이의 8px 여백도 클릭할 수 있습니다.
    */
    #repairContent {

      transform: translateX(5px);
    }

    #repairGrid.is-sectioned-layout {

    }

    .repair-style-row-label {
      display: inline-flex;
      align-self: center;
      justify-self: start;
      align-items: center;
      min-width: 0;
      padding: 0;
      background: transparent;
      color: #fff;
      font-size: 12px;
      font-weight: 500;
      line-height: 1;
      text-align: left;
      white-space: nowrap;
      pointer-events: none;
      transform: translate(2px, 3px);
    }

    .repair-style-row-label {
      grid-column: 1 / span 5;
    }

    .repair-grid-item {
      position: relative;
      width: 28px;
      height: 28px;
      padding: 0;
      border: 0;
      appearance: none;
      -webkit-appearance: none;
      outline: none;
      background: transparent;
      cursor: pointer;
    }

    .repair-grid-item::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 20px;
      height: 20px;
      border: 1px solid #fff;
      border-radius: 3px;
      background: transparent;
      transform: translate(-50%, -50%) scale(1);
      transition:
        background-color 120ms ease-out,
        border-color 120ms ease-out,
        opacity 120ms ease-out,
        transform 90ms ease-out,
        box-shadow 120ms ease-out;
    }

    .repair-grid-item.is-selected::before {
      background: #fff;
    }

    .repair-grid-item.is-new::before {
      border-color: #f6c062;
      background: #f6c062;
    }

    .repair-grid-item.is-disabled::before {
      border-color: transparent;
      background: rgba(255, 255, 255, 0.1);
    }

    /*
      현재 적용 중인 설계도는 네모 외곽선 끝까지 닿는 X로 표시합니다.
      X도 네모와 같은 비율로 확대·축소되어 호버와 클릭 반응을 함께합니다.
    */
    .repair-grid-item.is-applied::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 1;
      width: 20px;
      height: 20px;
      border-radius: 3px;
      background:
        linear-gradient(
          45deg,
          transparent calc(50% - 0.3px),
          rgba(255, 255, 255, 1) calc(50% - 0.3px),
          rgba(255, 255, 255, 1) calc(50% + 0.3px),
          transparent calc(50% + 0.3px)
        ),
        linear-gradient(
          -45deg,
          transparent calc(50% - 0.3px),
          rgba(255, 255, 255, 1) calc(50% - 0.3px),
          rgba(255, 255, 255, 1) calc(50% + 0.3px),
          transparent calc(50% + 0.3px)
        );
      transform: translate(-50%, -50%) scale(1);
      transition: transform 90ms ease-out;
      pointer-events: none;
    }

    .repair-grid-item.is-applied.is-selected::after {
      width: 22px;
      height: 22px;
      background:
        linear-gradient(
          45deg,
          transparent calc(50% - 0.4px),
          rgba(24, 24, 24, 1) calc(50% - 0.4px),
          rgba(24, 24, 24, 1) calc(50% + 0.4px),
          transparent calc(50% + 0.4px)
        ),
        linear-gradient(
          -45deg,
          transparent calc(50% - 0.4px),
          rgba(24, 24, 24, 1) calc(50% - 0.4px),
          rgba(24, 24, 24, 1) calc(50% + 0.4px),
          transparent calc(50% + 0.4px)
        );
    }

    .repair-grid-item:active::before,
    .repair-grid-item:active::after {
      transform: translate(-50%, -50%) scale(0.82);
    }

    .repair-grid-item:focus-visible::before {
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.45);
    }

    @media (hover: hover) and (pointer: fine) {
      .repair-grid-item:hover::before,
      .repair-grid-item:hover::after {
        transform: translate(-50%, -50%) scale(1.38);
      }

      /* 선택된 검은색 X는 호버 중에만 흰색 X와 같은 0.6px 굵기로 표시합니다. */
      .repair-grid-item.is-applied.is-selected:hover::after {
        background:
          linear-gradient(
            45deg,
            transparent calc(50% - 0.3px),
            rgba(24, 24, 24, 1) calc(50% - 0.3px),
            rgba(24, 24, 24, 1) calc(50% + 0.3px),
            transparent calc(50% + 0.3px)
          ),
          linear-gradient(
            -45deg,
            transparent calc(50% - 0.3px),
            rgba(24, 24, 24, 1) calc(50% - 0.3px),
            rgba(24, 24, 24, 1) calc(50% + 0.3px),
            transparent calc(50% + 0.3px)
          );
      }

      .repair-grid-item:active::before,
      .repair-grid-item:active::after {
        transform: translate(-50%, -50%) scale(0.82);
      }
    }

    #repairItemInfo {
      position: relative;
      display: grid;
      flex: 0 1 180px;

    /* DAY 정보는 숨길 때 즉시 사라지고, 다시 나타날 때만 2초 동안 페이드인합니다. */
    #dayStatus.is-hidden {

    /* 최초 로드와 새로고침에서는 현재 우하단 상태를 애니메이션 없이 바로 표시합니다. */
    body.is-initializing-status #exploringStatus,

    #dayNumber {

    .day-number-prefix {
      flex: 0 0 auto;
      margin-right: 0.22em;
    }

    /* 숫자 한 줄 높이만 보이도록 마스킹하고, 이전/다음 숫자를 세로로 굴립니다. */
    .day-number-viewport {
      display: inline-flex;
      flex: 0 0 auto;
      justify-content: flex-end;
      height: 0.9em;
      overflow: hidden;
      will-change: width;
    }

    /* 자릿수 폭이 바뀔 때 DAY 위치도 숫자 롤링과 동시에 부드럽게 이동합니다. */
    .day-number-viewport.is-resizing {
      transition: width 1000ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    .day-number-track {
      display: inline-grid;
      flex: 0 0 auto;
      height: 0.9em;
      align-items: start;
      justify-items: end;
    }

    .day-number-value {
      display: block;
      grid-area: 1 / 1;
      height: 0.9em;
      line-height: 0.9;
      white-space: nowrap;
      transform: translate3d(0, 0, 0);
      will-change: transform;
    }

    /*
      롤링 시작을 기다리는 동안 다음 숫자를 마스크 아래에 미리 둡니다.
      애니메이션 클래스가 붙기 전 두 숫자가 같은 위치에 겹쳐 보이는 현상을 방지합니다.
    */
    .day-number-track .day-number-value:last-child:not(:first-child) {
      transform: translate3d(0, 100%, 0);
    }

    /*
      트랙 전체를 절반만 이동시키지 않고 이전/다음 숫자를 각각 움직입니다.
      두 숫자가 동일한 속도로 위로 이동하며 자연스럽게 교체됩니다.
    */
    .day-number-track.is-rolling .day-number-value:first-child:not(:last-child) {
      animation: day-number-roll-out 1000ms
        cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    .day-number-track.is-rolling .day-number-value:last-child:not(:first-child) {
      animation: day-number-roll-in 1000ms
        cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    @keyframes day-number-roll-out {
      from {
        transform: translate3d(0, 0, 0);
      }
      to {
        transform: translate3d(0, -100%, 0);
      }
    }

    @keyframes day-number-roll-in {
      from {
        transform: translate3d(0, 100%, 0);
      }
      to {
        transform: translate3d(0, 0, 0);
      }
    }

    .zombie {
      position: absolute;
      width: var(--zombie-width);
      height: var(--zombie-height);
      cursor: pointer;
      transform: translate(-50%, -50%);
      transform-origin: center center;
      will-change: left, top, opacity;
      touch-action: none;
      /* 부모 엔티티 레이어는 클릭을 통과시키고 좀비만 직접 입력을 받습니다. */
      pointer-events: auto;
    }

    /*
      좀비 그림자 수정 위치
      - width / height: 그림자의 가로·세로 크기
      - left / bottom: 그림자 위치
      - transform: 오른쪽으로 기울어진 정도와 납작한 정도
      - opacity: 검정 투명도
      - filter blur(): 블러 강도
    */
    .zombie::before {
      content: "";
      position: absolute;
      left: 20px;
      bottom: 25px;
      width: 70px;
      height: 16px;
      background: #000;
      border-radius: 50%;
      opacity: 0.2;
      filter: blur(5px);
      transform: skewX(-28deg) scaleY(0.4);
      transform-origin: left center;
      pointer-events: none;
      z-index: 0;

    .zombie.is-dead {

      pointer-events: none;

    .zombie-sprite {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      background-repeat: no-repeat;
      background-size: 256px 256px;
      background-position: 0 0;
      image-rendering: auto;
      transform-origin: center center;
      will-change: transform, opacity, background-position;
    }

    .zombie-sprite-overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      width: 100%;
      height: 100%;
      background-repeat: no-repeat;
      background-size: 256px 256px;
      background-position: 0 0;
      image-rendering: auto;
      transform-origin: center center;
      will-change: transform, opacity, background-position;
      pointer-events: none;
      opacity: 0;
    }

    .deer {

      height: var(--deer-height);
      transform: translate(-50%, -50%);
      transform-origin: center center;
      will-change: left, top, opacity;
      touch-action: none;
      pointer-events: none;
    }

    .deer::before {
      content: "";
      position: absolute;
      left: 17.8333px;
      bottom: 15px;
      width: 73.3333px;
      height: 12px;
      background: #000;
      border-radius: 50%;
      opacity: 0.2;
      filter: blur(5px);
      transform: skewX(-28deg) scaleY(0.42);
      transform-origin: left center;
      pointer-events: none;

    .deer.is-dead {

    .deer-sprite {

    .deer-sprite-overlay {

      height: 100%;
      background-repeat: no-repeat;
      background-size: 512px 512px;
      background-position: 0 0;
      image-rendering: auto;
      transform-origin: center center;
      will-change: transform, opacity, background-position;
      pointer-events: none;
      opacity: 0;
    }

    /* 밤 전환에 맞춰 좀비와 사슴만 어둡게 표시합니다. */
    .zombie-sprite,
    .zombie-sprite-overlay,
    .deer-sprite,
    .deer-sprite-overlay {
      transition: filter 3s ease;
    }

    body.is-night .zombie-sprite,

    /* 저장된 탐험 상태로 다시 열 때는 첫 화면부터 즉시 밤 색상으로 표시합니다. */
    body.is-restored-night #world::after,

<!-- 우하단에 표시되고 저장 호환성 검사에도 사용하는 현재 게임 버전입니다. -->
<body class="is-initializing-status" data-game-version="0.067">
  <svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
    <filter id="nightCoolBalance" color-interpolation-filters="sRGB">
      <feColorMatrix
        type="matrix"
        values="
          0.4 0    0    0 0
          0    0.9 0    0 0
          0    0    2.5 0 0
          0    0    0    1 0
        "
      />
    </filter>
  </svg>
  <script>
    (() => {
      try {
        const saved = localStorage.getItem("cozy.resources.v1");
        if (!saved) return;

        const parsed = JSON.parse(saved);
        const currentGameVersion =
          String(document.body.dataset.gameVersion || "").trim();
        const savedGameVersion = String(parsed.version || "").trim();

        // 우하단 버전과 저장된 버전이 다르면 이전 진행 상태를 초기화합니다.
        if (!currentGameVersion || savedGameVersion !== currentGameVersion) {
          localStorage.removeItem("cozy.resources.v1");
          return;
        }

        const savedExplorationEndsAt = Number(parsed.explorationEndsAt);

        if (
          Number.isFinite(savedExplorationEndsAt) &&
          savedExplorationEndsAt > Date.now()
        ) {
          document.body.classList.add("is-night", "is-restored-night");
        }
      } catch (_) {
        // 저장소를 읽을 수 없어도 기본 낮 화면으로 계속 실행합니다.
      }
    })();
  </script>
  <div id="viewport">
    <div id="world">
      <div id="cloudShadows"></div>
      <div id="props">
        <div id="structures">
          <div id="houseObject" class="world-structure"></div>
          <div
            id="shedObject"
            class="world-structure world-interactive"
            role="button"
            tabindex="0"
            aria-label="창고 확인"
          ></div>
          <div id="fenceObject" class="world-structure" hidden></div>
          <div
            id="carObject"
            class="world-structure world-interactive"
            role="button"
            tabindex="0"
            aria-label="자동차 확인"
          ></div>
          <div
            id="mailboxObject"
            class="world-structure world-interactive"
            role="button"
            tabindex="0"

  <script>
    (() => {
      "use strict";

      const WORLD_SIZE = 2048;

      const GAME_ZONE = {
        left: 512,
        top: 512,
        right: 1536,
        bottom: 1536
      };

      // 월드 중심(1024, 1024)을 기준으로 한 420×300 안전영역입니다.
      const SAFE_ZONE = {
        left: 814,
        top: 874,
        right: 1234,
        bottom: 1174
      };

      // 자동차와 창고의 표시 영역 중앙에도 각각 128×128 크기의
      // 좀비·사슴 공용 안전 구역을 둡니다.
      const STRUCTURE_SAFE_ZONE_SIZE = 128;

      const ZOMBIE_WIDTH = 64;
      const ZOMBIE_HEIGHT = 128;
      const HALF_W = ZOMBIE_WIDTH / 2;
      const HALF_H = ZOMBIE_HEIGHT / 2;

      const DEER_SHEET_SIZE = 512;
      const DEER_SHEET_COLUMNS = 6;
      const DEER_SHEET_ROWS = 6;
      const DEER_FRAME_SIZE = DEER_SHEET_SIZE / DEER_SHEET_COLUMNS;
      const DEER_WIDTH = DEER_FRAME_SIZE;
      const DEER_HEIGHT = DEER_FRAME_SIZE;
      const DEER_HALF_W = DEER_WIDTH / 2;
      const DEER_HALF_H = DEER_HEIGHT / 2;
      const DEER_HITBOX_SIZE = DEER_WIDTH;

      // 좀비는 현재 필드 클리어에 필요한 수까지만 생성합니다.
      // 사슴은 기존처럼 최대 3마리이며, 두 종류의 합계만 최종적으로 100마리를 넘지 않습니다.
      const MAX_ACTIVE_POPULATION = 100;
      const MAX_ACTIVE_ZOMBIES = MAX_ACTIVE_POPULATION;
      const MAX_ACTIVE_DEER = 3;

      // 탐험에 필요한 좀비 처치 수는 첫 소수인 2부터 시작하고,
      // 귀환할 때마다 현재 수보다 큰 다음 소수로 증가합니다.
      const MAX_ZOMBIE_COUNT = Number.MAX_SAFE_INTEGER;
      const INITIAL_ZOMBIE_KILL_REQUIREMENT = 2;
      const BASE_MAX_FOOD_COUNT = 3;
      const UPGRADED_MAX_FOOD_COUNT = 5;
      const BASE_MAX_WOOD_COUNT = 10;
      const UPGRADED_MAX_WOOD_COUNT = 15;
      const STORAGE_MAX_FOOD_COUNT = UPGRADED_MAX_FOOD_COUNT;
      const STORAGE_MAX_WOOD_COUNT = UPGRADED_MAX_WOOD_COUNT;
      const MAX_INVENTORY_QUANTITY = 99;
      const INVENTORY_ITEMS_PER_PAGE = 10;

      // 화면에 표시하지 않는 전투 수치입니다.
      const ZOMBIE_MAX_HEALTH = 100;
      const DEER_MAX_HEALTH = 40;
      const AXE_DAMAGE = 40;
      const AXE_MISS_CHANCE = 0.10;
      const HANDGUN_DAMAGE = 50;
      const HANDGUN_MISS_CHANCE = 0.20;
      const HANDGUN_CRITICAL_CHANCE = 0.10;

      // 생성 간격: 좀비 1분 / 사슴 3분
      const SPAWN_INTERVAL_MS = 60_000;
      const DEER_SPAWN_INTERVAL_MS = 3 * 60_000;
      const EMPTY_ZOMBIE_REGULAR_SPAWN_GUARD_MS = 5_000;
      const EMPTY_DEER_SPAWN_MIN_DELAY_MS = 3_000;
      const EMPTY_DEER_SPAWN_MAX_DELAY_MS = 7_000;
      const TODO_LIST_MAIL_REVEAL_DELAY_MS = 1_000;

      const VILLAGE_EXPLORATION_DURATION_MS = 10 * 60_000;
      const FOREST_EXPLORATION_DURATION_MS = 30 * 60_000;
      const CITY_EXPLORATION_DURATION_MS = 10 * 60_000;
      const RESOURCE_STORAGE_KEY = "cozy.resources.v1";
      const GAME_VERSION = String(
        document.body.dataset.gameVersion || ""
      ).trim();
      const TEST_MODE = true;
      const TEST_BUTTON_TRIPLE_CLICK_MAX_GAP_MS = 500;
      const DAY_NUMBER_ROLL_DELAY_MS = 2_000;
      const DAY_NUMBER_ROLL_FALLBACK_MS = 1_100;

      // 기본 걷기 애니메이션: 2fps
      const WALK_FPS = 2;

      // 피격 첫 프레임과 전체 사망 모션: 프레임당 0.2초
      const DEATH_FPS = 5;
      const HIT_REACTION_MS = 200;

      // 가능하면 기존 좀비의 중심에서 이 거리 이상 떨어져 생성합니다.
      const MIN_SPAWN_DISTANCE = 160;
      const MIN_DEER_SPAWN_DISTANCE = 180;

      // 생성 모션 프레임별 유지 시간
      // 기존 유지 시간의 2배: 1번 4초 / 2번 0.5초 / 3번 1초 / 4번 0.5초
      // 생성 프레임은 크로스페이드 없이 바로 전환합니다.
      const BIRTH_FRAME_DURATIONS_MS = [
        4_000,
        500,
        1_000,
        500
      ];

      // 생성 첫 프레임의 처음 1초 동안 페이드인
      const BIRTH_FADE_IN_MS = 1_000;

      // 사망 모션 마지막 프레임과 추가 프레임 표시 시간
      const DEATH_LAST_FRAME_HOLD_MS = 3_000;
      const DEATH_EXTRA_FRAME_MS = 3_000;
      const DEATH_TRANSITION_MS = 1_000;
      const FADE_DURATION_MS = 3_000;

      // 이동 속도: 2초에 1px
      const MOVE_SPEED_PX_PER_MS = 1 / 2_000;
      const DEER_EVADE_SPEED_PX_PER_MS = 0.3;

      const WALK_SHEET = "images/zomebie_default_walk.png";
      const DEAD_SHEET = "images/zomebie_default_dead.png";
      const BIRTH_DEATH_SHEET =
        "images/zomebie_default_birthdeath.png";
      const DEER_SHEET = "images/deer_default.png";
      const NIGHT_BACKGROUND_IMAGE =
        "images/bg_field_default_nigth.png";
      const NIGHT_CLOUD_SHEET =
        "images/bg_field_default_clouds_night.png";
      const NIGHT_STUMP_IMAGE = "images/bg_stump_night.png";
      const TREE_DAY_SHEET = "images/bg_tree.png";
      const TREE_DAY_STAGE_TWO_IMAGE = "images/bg_tree_2.png";
      const TREE_DAY_STAGE_THREE_IMAGE = "images/bg_tree_3.png";
      const TREE_NIGHT_IMAGE = "images/bg_tree_night.png";
      const TREE_PART_IMAGE = "images/bg_tree_part.png";

      // 좀비와 사슴 스프라이트를 메모리에 유지해 공격 순간 빈 프레임이 보이지 않게 합니다.
      const PRELOADED_ZOMBIE_IMAGES = new Map();

      const HIT_SOUND = "sounds/sfx_zombie_hit_axe.wav";
      const BIRTH_SOUND = "sounds/sfx_zombie_birth.wav";
      const DEATH_SOUND = "sounds/sfx_zombie_death.wav";
      const AXE_MISS_SOUND = "sounds/sfx_miss_axe.wav";
      const HANDGUN_SOUND = "sounds/sfx_handgun.wav";
      const HANDGUN_EQUIP_SOUND = "sounds/sfx_handgun_equip.wav";
      const HANDGUN_NO_AMMO_SOUND = "sounds/sfx_handgun_noammo.wav";
      const GET_AXE_SOUND = "sounds/sfx_get_axe.wav";
      const TREE_CHOP_SOUND = "sounds/sfx_axe_chop.wav";
      const TREE_FALL_SOUND = "sounds/sfx_tree_fall.wav";
      const INVENTORY_SET_SOUND = "sounds/sfx_set.wav";
      const MAILBOX_SOUND = "sounds/sfx_mailbox.wav";
      const CRAFTING_SOUND = "sounds/sfx_crafting.wav";
      const CAR_FAIL_SOUND = "sounds/sfx_car_fail.wav";
      const SHED_OLD_SOUND = "sounds/sfx_shed_old.wav";
      const EXPLORE_BUTTON_SOUND = "sounds/sfx_btn.wav";
      const EXPLORING_FOOTSTEPS_SOUND =
        "sounds/sfx_exploringfootsteps.wav";
      const DAY_BGM_SOUND = "sounds/bgm_meadow.mp3";
      const NIGHT_BGM_SOUND = "sounds/bgm_meadow_night.mp3";
      // 기존 곡이 먼저 줄어든 뒤 잠시 조용한 구간을 두고 새 곡이 올라옵니다.
      const BGM_FADE_OUT_MS = 2_500;
      const BGM_QUIET_HOLD_MS = 1_000;
      const BGM_FADE_IN_MS = 2_500;

      // 프레임 번호는 코드 내부에서 0부터 시작합니다.
      // 리소스 기준: 대기 13 / 보기 13→11→12→11→13 / 풀 뜯기 13→4→5→4→13
      const DEER_IDLE_FRAME = 12;
      const DEER_LOOK_SEQUENCE = [12, 10, 11, 10, 12];
      const DEER_LOOK_DURATIONS_MS = [100, 100, 3_000, 100, 100];
      const DEER_GRAZE_SEQUENCE = [12, 3, 4, 3, 12];
      const DEER_GRAZE_DURATIONS_MS = [200, 200, 1_500, 200, 200];

      // 달리기: 리소스 14~22를 한 번 재생한 뒤 23~29를 15fps로 반복합니다.
      const DEER_RUN_INTRO_FRAME_START = 13;
      const DEER_RUN_INTRO_FRAME_COUNT = 9;
      const DEER_RUN_LOOP_FRAME_START = 22;
      const DEER_RUN_LOOP_FRAME_COUNT = 7;
      const DEER_RUN_FPS = 15;
      const DEER_TURN_FRAME_SEQUENCE = [30, 31, 32];
      const DEER_TURN_FRAME_ONE_MS = 200;
      const DEER_TURN_FRAME_TWO_MS = 100;
      const DEER_TURN_FRAME_THREE_MS = 100;
      const DEER_TURN_SLOWDOWN_MS = 300;

      // 생성: 리소스 1→2→3, 크로스페이드 없이 재생한 뒤 기본 대기로 전환합니다.
      const DEER_BIRTH_FRAME_SEQUENCE = [0, 1, 2];
      const DEER_BIRTH_FRAME_FADE_MS = 500;
      const DEER_BIRTH_FRAME_ONE_HOLD_MS = 2_000;
      const DEER_BIRTH_FRAME_TWO_MS = 200;
      const DEER_BIRTH_FRAME_THREE_MS = 200;

      // 사망: 리소스 7→8→9→10. 마지막 전환과 페이드 시간은 기존 연출을 유지합니다.
      const DEER_DEATH_FRAME_SEQUENCE = [6, 7, 8, 9, 5];
      const DEER_DEATH_FRAME_ONE_MS = 400;
      const DEER_DEATH_FRAME_TWO_MS = 400;
      const DEER_DEATH_FRAME_THREE_HOLD_MS = 3_000;
      const DEER_DEATH_TRANSITION_ONE_MS = 1_000;
      const DEER_DEATH_FRAME_FOUR_HOLD_MS = 3_000;
      const DEER_DEATH_TRANSITION_TWO_MS = 1_000;
      const DEER_DEATH_FRAME_FIVE_HOLD_MS = 3_000;
      const DEER_DEATH_FADE_MS = 3_000;
      const DEER_DEATH_SLIDE_DISTANCE_PX = 60;
      const DEER_DEATH_SLIDE_MS = 700;
      const DEER_IDLE_MIN_DELAY_MS = 2_500;
      const DEER_IDLE_MAX_DELAY_MS = 6_000;

      const STUMP_WITH_AXE_IMAGE = "images/bg_stump_axe.png";
      const STUMP_EMPTY_IMAGE = "images/bg_stump.png";


      // 나무 스프라이트: 1024×1024 안에 2×2, 프레임당 512×512입니다.
      // 리소스 번호 2가 기본 상태이며, 클릭하면 3→4→3→2→1→2를 재생합니다.
      const TREE_SHEET_COLUMNS = 2;
      const TREE_FRAME_SIZE = 512;
      const TREE_DEFAULT_FRAME = 1;
      const TREE_CHOP_SEQUENCE = [2, 3, 2, 1, 0, 1];
      const TREE_CHOP_FRAME_MS = 100;
      // 나무 단계 이미지는 히트 순간 투명도 전환 없이 즉시 교체합니다.

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function normalizeStoredCount(value, maxValue) {
        const number = Number(value);
        return Number.isFinite(number)
          ? Math.round(clamp(number, 0, maxValue))
          : 0;
      }

      function isPrime(value) {
        if (!Number.isInteger(value) || value < 2) return false;
        if (value === 2) return true;
        if (value % 2 === 0) return false;

        for (let divisor = 3; divisor * divisor <= value; divisor += 2) {
          if (value % divisor === 0) return false;
        }

        return true;
      }

      function getNextPrime(value) {
        let candidate = Math.max(2, Math.floor(Number(value) || 0) + 1);

        while (candidate <= MAX_ZOMBIE_COUNT) {
          if (isPrime(candidate)) return candidate;
          candidate += 1;
        }

        return value;
      }

      function normalizeZombieKillRequirement(value) {
        const number = Math.round(Number(value));
        if (!Number.isFinite(number) || number <= 1) {
          return INITIAL_ZOMBIE_KILL_REQUIREMENT;
        }

        const clamped = clamp(number, 2, MAX_ZOMBIE_COUNT);
        if (isPrime(clamped)) return clamped;

        let candidate = clamped;
        while (candidate <= MAX_ZOMBIE_COUNT && !isPrime(candidate)) {
          candidate += 1;
        }

        if (candidate <= MAX_ZOMBIE_COUNT) return candidate;

        candidate = MAX_ZOMBIE_COUNT;
        while (candidate >= 2 && !isPrime(candidate)) {
          candidate -= 1;
        }
        return candidate;
      }

      function normalizeRepairItemIndex(value) {

      function normalizeRepairSelectedItemIndex(value, category) {
        const number = Math.round(Number(value));
        if (category === "repair" && number === -1) return -1;
        return Number.isFinite(number)
          ? clamp(number, 0, REPAIR_GRID_ITEM_COUNT - 1)
          : (category === "repair" ? -1 : 0);

      function normalizeRepairMaterials(value) {
        if (!value || typeof value !== "object" || Array.isArray(value)) {
          return {};
        }

        const normalized = {};
        for (const [resource, amount] of Object.entries(value)) {
          const normalizedAmount = Math.max(0, Math.round(Number(amount) || 0));
          if (normalizedAmount > 0) {
            normalized[resource] = normalizedAmount;
          }
        }
        return normalized;
      }

      function loadRepairState(value) {
        if (!value || typeof value !== "object") return;

        if (isRepairCategory(value.selectedCategory)) {
          repairSelectedCategory = value.selectedCategory;
        }

        const selectedItems = value.selectedItemByCategory;
        const appliedItems = value.appliedItemByCategory;
        const appliedSectionItems = value.appliedItemBySection;
        const storedItems = value.itemsByCategory;

        if (appliedSectionItems && typeof appliedSectionItems === "object") {
          for (const [category, sections] of Object.entries(repairAppliedItemBySection)) {
            const storedSections = appliedSectionItems[category];
            if (!storedSections || typeof storedSections !== "object") continue;
            for (const key of Object.keys(sections)) {
              const fallbackIndex = sections[key];
              const rawIndex = normalizeRepairItemIndex(storedSections[key]);
              sections[key] = rawIndex >= getRepairInitialIndex(category, rawIndex)
                ? rawIndex
                : fallbackIndex;
            }
          }
        }

        for (const category of REPAIR_CATEGORY_ORDER) {
          if (selectedItems && typeof selectedItems === "object") {
            repairSelectedItemByCategory[category] = normalizeRepairSelectedItemIndex(
              selectedItems[category],
              category
            );
          }

          if (appliedItems && typeof appliedItems === "object") {
            repairAppliedItemByCategory[category] = normalizeRepairItemIndex(
              appliedItems[category]
            );
          }

          const categoryItems = storedItems && storedItems[category];
          if (!Array.isArray(categoryItems)) continue;

          const targetItems = repairItemsByCategory[category];
          for (let index = 0; index < Math.min(categoryItems.length, targetItems.length); index += 1) {
            const storedItem = categoryItems[index];
            if (!storedItem || typeof storedItem !== "object") continue;
            const targetItem = targetItems[index];
            if (typeof storedItem.name === "string") targetItem.name = storedItem.name;
            targetItem.unlocked = storedItem.unlocked === true;
            targetItem.built = storedItem.built === true;
            targetItem.isNew = storedItem.isNew === true;
            targetItem.materials = normalizeRepairMaterials(storedItem.materials);
            targetItem.description = typeof storedItem.description === "string"
              ? storedItem.description
              : targetItem.description;
            targetItem.builtDescription = typeof storedItem.builtDescription === "string"
              ? storedItem.builtDescription
              : targetItem.builtDescription;
          }

          const definition = REPAIR_CATEGORY_DEFINITIONS[category];
          if (Array.isArray(definition.sections)) {
            for (const section of definition.sections) {
              const initialItem = targetItems[section.startIndex];
              initialItem.name = section.initialItemName;
              initialItem.unlocked = true;
              initialItem.built = true;
              initialItem.isNew = false;
              initialItem.description = section.initialItemDescription;
              initialItem.builtDescription = section.initialItemDescription;
            }
          } else if (category !== "repair") {
            const initialItem = targetItems[0];
            initialItem.name = definition.initialItemName;
            initialItem.unlocked = true;
            initialItem.built = true;
            initialItem.isNew = false;
            initialItem.description = definition.initialItemDescription;
            initialItem.builtDescription = definition.initialItemDescription;
          }

          const selectedIndex = repairSelectedItemByCategory[category];
          if (selectedIndex < 0 || !targetItems[selectedIndex]?.unlocked) {
            repairSelectedItemByCategory[category] = category === "repair"
              ? -1
              : getRepairInitialIndex(category, selectedIndex);
          }

          const appliedIndex = repairAppliedItemByCategory[category];
          if (!targetItems[appliedIndex]?.unlocked || !targetItems[appliedIndex]?.built) {
            repairAppliedItemByCategory[category] = getRepairInitialIndex(category, appliedIndex);
          }
        }
      }

          itemsByCategory: Object.fromEntries(
            REPAIR_CATEGORY_ORDER.map((category) => [

      function getAppliedRepairItemIndex(category, itemIndex = 0) {
        if (isSectionedRepairCategory(category)) {
          const section = getRepairSectionDefinition(category, itemIndex);
          if (!section) return 0;
          return repairAppliedItemBySection[category][section.key] ?? section.startIndex;
        }
        return repairAppliedItemByCategory[category] || 0;

      function setAppliedRepairItemIndex(category, itemIndex) {
        if (isSectionedRepairCategory(category)) {
          const section = getRepairSectionDefinition(category, itemIndex);
          if (!section) return;
          repairAppliedItemBySection[category][section.key] = itemIndex;
          return;

        repairAppliedItemByCategory[category] = itemIndex;

      function getRepairResourceAmount(resource) {
        if (resource === "wood") return woodCount;
        if (resource === "food") return foodCount;
        if (resource === "carParts") return carPartsCount;
        if (resource === "repairKit") return hasRepairKit ? 1 : 0;
        return 0;
      }

      function setRepairResourceAmount(resource, amount) {
        if (resource === "wood") woodCount = Math.max(0, amount);
        if (resource === "food") foodCount = Math.max(0, amount);
        if (resource === "carParts") carPartsCount = clamp(Math.round(Number(amount) || 0), 0, getMaxCarPartsCount());
        if (resource === "repairKit") hasRepairKit = amount > 0;
      }

      function canAffordRepairMaterials(materials) {
        return Object.entries(materials).every(
          ([resource, amount]) => getRepairResourceAmount(resource) >= amount
        );
      }

      function consumeRepairMaterials(materials) {
        for (const [resource, amount] of Object.entries(materials)) {
          setRepairResourceAmount(resource, getRepairResourceAmount(resource) - amount);
        }
      }
