      function updateExploringCountdown() {
        if (!isExploring) return;

        const remainingMs = Math.max(0, explorationEndsAt - Date.now());

        if (remainingMs <= 0) {
          finishExploration();
          return;
        }

        const totalSeconds = Math.max(0, Math.ceil(remainingMs / 1_000));
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;
        exploringTime.textContent = `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
      }

      function animateBgmVolumes(
        targetDayVolume,
        targetNightVolume,
        durationMs,
        transitionToken
      ) {
        return new Promise((resolve) => {
          const dayStartVolume = dayBgmAudio.volume;
          const nightStartVolume = nightBgmAudio.volume;
          const startedAt = performance.now();

          if (bgmFadeFrameId !== null) {
            cancelAnimationFrame(bgmFadeFrameId);
            bgmFadeFrameId = null;
          }

          const updateFade = (now) => {
            if (transitionToken !== bgmFadeToken) {
              resolve(false);
              return;
            }

            const progress = clamp(
              (now - startedAt) / Math.max(1, durationMs),
              0,
              1
            );
            const easedProgress = 1 - Math.pow(1 - progress, 3);

            dayBgmAudio.volume = clamp(
              dayStartVolume +
                (targetDayVolume - dayStartVolume) * easedProgress,
              0,
              1
            );
            nightBgmAudio.volume = clamp(
              nightStartVolume +
                (targetNightVolume - nightStartVolume) * easedProgress,
              0,
              1
            );

            if (progress < 1) {
              bgmFadeFrameId = requestAnimationFrame(updateFade);
            } else {
              bgmFadeFrameId = null;
              resolve(true);
            }
          };

          bgmFadeFrameId = requestAnimationFrame(updateFade);
        });
      }

      function waitForBgmTransition(durationMs, transitionToken) {
        return new Promise((resolve) => {
          window.setTimeout(() => {
            resolve(transitionToken === bgmFadeToken);
          }, durationMs);
        });
      }

      async function transitionBgmForNightMode(enabled) {
        if (!isMusicOn || !bgmStarted) return;

        const transitionToken = ++bgmFadeToken;
        const incomingAudio = enabled ? nightBgmAudio : dayBgmAudio;
        const outgoingAudio = enabled ? dayBgmAudio : nightBgmAudio;

        if (bgmFadeFrameId !== null) {
          cancelAnimationFrame(bgmFadeFrameId);
          bgmFadeFrameId = null;
        }

        // 새 곡이 조용한 구간 동안 미리 진행되지 않도록 멈춰 둡니다.
        incomingAudio.pause();
        try {
          incomingAudio.currentTime = 0;
        } catch (_) {}

        const fadedOut = await animateBgmVolumes(
          0,
          0,
          BGM_FADE_OUT_MS,
          transitionToken
        );
        if (!fadedOut) return;

        const holdCompleted = await waitForBgmTransition(
          BGM_QUIET_HOLD_MS,
          transitionToken
        );
        if (!holdCompleted) return;

        outgoingAudio.pause();
        try {
          outgoingAudio.currentTime = 0;
          incomingAudio.currentTime = 0;
        } catch (_) {}

        try {
          await incomingAudio.play();
        } catch (_) {
          // 새 트랙 재생이 차단되면 다음 사용자 입력에서 다시 시도합니다.
          bgmStarted = false;
          return;
        }

        const fadedIn = await animateBgmVolumes(
          enabled ? 0 : 1,
          enabled ? 1 : 0,
          BGM_FADE_IN_MS,
          transitionToken
        );
        if (!fadedIn) return;
      }

      function getCloudShadowBaseOpacity(now = performance.now()) {
        const elapsed = now - cloudShadowOpacityTransitionStartedAt;

        if (elapsed >= CLOUD_SHADOW_NIGHT_TRANSITION_MS) {
          cloudShadowBaseOpacity = cloudShadowOpacityTarget;
          return cloudShadowBaseOpacity;
        }

        const progress = clamp(
          elapsed / CLOUD_SHADOW_NIGHT_TRANSITION_MS,
          0,
          1
        );
        const easedProgress = 1 - Math.pow(1 - progress, 3);

        cloudShadowBaseOpacity =
          cloudShadowOpacityStart +
          (cloudShadowOpacityTarget - cloudShadowOpacityStart) *
            easedProgress;

        return cloudShadowBaseOpacity;
      }

      function transitionCloudShadowOpacity(enabled) {
        const now = performance.now();
        cloudShadowOpacityStart = getCloudShadowBaseOpacity(now);
        cloudShadowOpacityTarget = enabled
          ? CLOUD_SHADOW_NIGHT_OPACITY
          : CLOUD_SHADOW_DAY_OPACITY;
        cloudShadowOpacityTransitionStartedAt = now;
      }

      function updateTreeInteractivity() {
        const isTreeInteractive = !isExploring;

        treeHitArea.tabIndex = isTreeInteractive ? 0 : -1;
        treeHitArea.setAttribute(
          "aria-disabled",
          isTreeInteractive ? "false" : "true"
        );

        if (!isTreeInteractive && treeAnimationTimerId !== null) {
          clearTimeout(treeAnimationTimerId);
          treeAnimationTimerId = null;
          isTreeAnimating = false;
          applyTreeVisualState();
        }
      }

      function updateStructureInteractivity() {
        const isStructureInteractive =
          !isExploring && !document.body.classList.contains("is-night");

        [shedObject, carObject, mailboxObject].forEach((element) => {
          element.tabIndex = isStructureInteractive ? 0 : -1;
          element.setAttribute(
            "aria-disabled",
            isStructureInteractive ? "false" : "true"
          );
        });
      }

      function startOneDeerLeavingForLightChange() {
        const candidates = Array.from(deerMap.values()).filter(
          (deer) =>
            deer.state !== "dying" &&
            deer.state !== "leaving" &&
            deer.state !== "removed"
        );

        if (candidates.length === 0) return false;

        const deer = candidates[
          Math.floor(Math.random() * candidates.length)
        ];
        const direction = deer.facing === "left" ? -1 : 1;

        beginDeerRunInDirection(deer, direction, "leaving");
        deer.element.style.opacity = "1";
        deer.hitbox.style.pointerEvents = "none";
        deer.hitbox.tabIndex = -1;
        showSingleDeerFrame(deer, DEER_RUN_INTRO_FRAME_START);
        renderDeer(deer);
        saveResourceState();
        return true;
      }

      function setNightMode(enabled) {
        const wasNight = document.body.classList.contains("is-night");

        if (wasNight !== enabled) {
          startOneDeerLeavingForLightChange();
        }

        document.body.classList.toggle("is-night", enabled);
        updateTreeInteractivity();
        updateStructureInteractivity();
        transitionCloudShadowOpacity(enabled);
        transitionBgmForNightMode(enabled);
      }

      function startExploration(destination) {
        closeExplorationMenu();
        closeInventory();

        if (explorationCompleteToastTimerId !== null) {
          clearTimeout(explorationCompleteToastTimerId);
          explorationCompleteToastTimerId = null;
        }

        if (returnZombieSpawnTimerId !== null) {
          clearTimeout(returnZombieSpawnTimerId);
          returnZombieSpawnTimerId = null;
        }

        playSound(EXPLORING_FOOTSTEPS_SOUND);

        const requiredFood = getDestinationFoodRequirement(destination);
        foodCount = Math.max(0, foodCount - requiredFood);
        zombieCount = 0;
        isExploring = true;
        explorationDestination = destination;
        explorationEndsAt = Date.now() + getExplorationDurationMs(destination);
        commitResourceState();
        setNightMode(true);
        exploringStatus.classList.add("is-visible");
        updateDayStatus();
        updateExploringCountdown();

        if (explorationTimerId !== null) {
          clearInterval(explorationTimerId);
        }

        explorationTimerId = window.setInterval(
          updateExploringCountdown,
          1_000
        );
      }

      function restoreExplorationState() {
        if (explorationEndsAt <= Date.now()) {
          if (explorationEndsAt > 0) {
            // 페이지가 닫혀 있는 동안 탐험이 끝난 경우에도 귀환 1회로 처리합니다.
            isExploring = true;
            finishExploration();
            return;
          }

          isExploring = false;
          explorationDestination = "";
          explorationEndsAt = 0;
          setNightMode(false);
          updateDayStatus();
          saveResourceState();
          return;
        }

        isExploring = true;
        setNightMode(true);
        exploringStatus.classList.add("is-visible");
        updateDayStatus();
        updateExploringCountdown();

        if (explorationTimerId !== null) {
          clearInterval(explorationTimerId);
        }

        explorationTimerId = window.setInterval(
          updateExploringCountdown,
          1_000
        );
      }

      function awardVillageExplorationRewards() {
        if (!repairItemsByCategory.repair[CAR_REPAIR_BLUEPRINT_INDEX].unlocked && Math.random() < 0.05) {
          unlockCarRepairBlueprint();
        }

        const candidates = [];
        if (!hasHandgun) {
          candidates.push("handgun");
        }
        if (handgunAmmoCount < MAX_INVENTORY_QUANTITY) {
          candidates.push("handgunAmmo");
        }
        if (carPartsCount < getMaxCarPartsCount()) {
          candidates.push("carParts");
        }

        if (candidates.length === 0) return;

        const reward = candidates[Math.floor(Math.random() * candidates.length)];

        if (reward === "handgun") {
          hasHandgun = true;
          markInventoryItemAsNew("handgun");
          applyInventoryState();
          return;
        }

        if (reward === "handgunAmmo") {
          const acquiredAmmo = Math.floor(Math.random() * 10) + 1;
          hasHandgunAmmo = true;
          handgunAmmoCount = Math.min(MAX_INVENTORY_QUANTITY, handgunAmmoCount + acquiredAmmo);
          markInventoryItemAsNew("handgunAmmo");
          applyInventoryState();
          return;
        }

        carPartsCount = Math.min(getMaxCarPartsCount(), carPartsCount + 1);
        markInventoryItemAsNew("carParts");
        applyInventoryState();
        showToast(CAR_PARTS_TOAST_MESSAGE);
      }

      function finishExploration() {
        if (!isExploring) return;

        playSound(EXPLORING_FOOTSTEPS_SOUND);

        isExploring = false;
        const completedDestination = explorationDestination;
        explorationDestination = "";
        explorationEndsAt = 0;
        dayCount += 1;
        zombieKillRequirement = getNextPrime(zombieKillRequirement);

        const previousTreeGrowthState = treeGrowthState;
        if (treeGrowthState === TREE_GROWTH_DEPLETED) {
          treeGrowthState = TREE_GROWTH_REGROWING;
          treeChopCount = TREE_MAX_CHOPS_PER_GROWTH;
        } else if (
          treeGrowthState === TREE_GROWTH_REGROWING ||
          (treeGrowthState === TREE_GROWTH_READY && treeChopCount >= 1)
        ) {
          treeGrowthState = TREE_GROWTH_READY;
          treeChopCount = 0;
          if (currentTodoListId === 2 && previousTreeGrowthState !== TREE_GROWTH_READY) {
            setTodoProgress(2, "item2", true);
          }
        }
        applyTreeVisualState();

        if (completedDestination === "village") {
          setTodoProgress(1, "item3", true);
          awardVillageExplorationRewards();
        } else if (completedDestination === "forest") {
          woodCount = Math.min(getMaxWoodCount(), woodCount + 10);
          setTodoProgress(3, "item2", true);
        }

        commitResourceState({ animateDay: true });
        setNightMode(false);
        exploringStatus.classList.remove("is-visible");

        if (explorationTimerId !== null) {
          clearInterval(explorationTimerId);
          explorationTimerId = null;
        }

        if (explorationCompleteToastTimerId !== null) {
          clearTimeout(explorationCompleteToastTimerId);
        }

        explorationCompleteToastTimerId = window.setTimeout(() => {
          explorationCompleteToastTimerId = null;
          showToast(EXPLORATION_COMPLETE_TOAST_MESSAGE);
        }, 4_200);

        zombieSpawnBlockedUntil = Date.now() + 7_000;

        if (returnZombieSpawnTimerId !== null) {
          clearTimeout(returnZombieSpawnTimerId);
        }

        returnZombieSpawnTimerId = window.setTimeout(() => {
          returnZombieSpawnTimerId = null;
          if (canCreateZombie()) {
            createZombie();
          }
        }, 7_000);
      }

      function hasDestinationItems(destination) {
        if (destination === "forest") {
          return hasCompass;
        }

        if (destination === "city") {
          return fuelCount >= 10 && hasMap;
        }

        return true;
      }

      function getDestinationFoodRequirement(destination) {
        if (destination === "village") return 1;
        if (destination === "forest") return 3;
        if (destination === "city") return 5;
        return 0;
      }


      function getExplorationDurationMs(destination) {
        if (destination === "village") return VILLAGE_EXPLORATION_DURATION_MS;
        if (destination === "forest") return FOREST_EXPLORATION_DURATION_MS;
        if (destination === "city") return CITY_EXPLORATION_DURATION_MS;
        return VILLAGE_EXPLORATION_DURATION_MS;
      }

      function handleExplorationDestination(destination) {
        if (zombieCount < zombieKillRequirement) {
          showToast(EXPLORE_BLOCKED_TOAST_MESSAGE);
          return;
        }

        if (!hasDestinationItems(destination)) {
          if (destination === "forest") {
            showToast(FOREST_BLOCKED_TOAST_MESSAGE);
          } else if (destination === "city") {
            showToast(CITY_BLOCKED_TOAST_MESSAGE);
          }
          return;
        }

        const requiredFood = getDestinationFoodRequirement(destination);
        if (foodCount < requiredFood) {
          showToast(NO_FOOD_TOAST_MESSAGE);
          return;
        }

        startExploration(destination);
      }

      function resetAllSavedStateForTest(event) {
        if (!TEST_MODE) return;

        if (event) {
          event.preventDefault();
          event.stopPropagation();
        }

        isStateSaveSuppressed = true;

        try {
          // 이 게임에서 저장하는 모든 진행 상태를 제거합니다.
          localStorage.removeItem(RESOURCE_STORAGE_KEY);
        } catch (_) {
          // 저장소 접근이 막힌 환경에서도 새로고침은 계속 진행합니다.
        }

        // 실행 중인 개체·타이머·첫 연출 플래그까지 모두 처음 상태로 만들기 위해
        // 저장 데이터를 지운 뒤 페이지를 새로 불러옵니다.
        location.reload();
      }

      function shortenExplorationForTest(event) {
        if (!TEST_MODE || !isExploring) return;

        if (event) {
          event.preventDefault();
          event.stopPropagation();
        }
        explorationEndsAt = Date.now() + 3_000;
        updateExploringCountdown();
      }

      function areTestResourcesFull() {
        return zombieCount >= zombieKillRequirement &&
          foodCount >= getMaxFoodCount() &&
          woodCount >= getMaxWoodCount();
      }

      function fillResourcesForTest() {
        if (!TEST_MODE || isExploring) return;

        zombieCount = zombieKillRequirement;
        foodCount = getMaxFoodCount();
        woodCount = getMaxWoodCount();
        commitResourceState();
      }

      function handleVersionLabelTestAction(event) {
        if (!TEST_MODE) return;

        if (event) {
          event.preventDefault();
          event.stopPropagation();
        }

        const now = performance.now();
        if (
          now - versionTestLastClickAt >
          TEST_BUTTON_TRIPLE_CLICK_MAX_GAP_MS
        ) {
          versionTestClickCount = 0;
        }

        versionTestLastClickAt = now;
        versionTestClickCount += 1;

        if (versionTestClickCount < 3) return;

        versionTestClickCount = 0;
        versionTestLastClickAt = -Infinity;

        if (isExploring) {
          shortenExplorationForTest();
          return;
        }

        if (areTestResourcesFull()) {
          resetAllSavedStateForTest();
          return;
        }

        fillResourcesForTest();
      }

      function easeOutSine(progress) {
        return Math.sin((clamp(progress, 0, 1) * Math.PI) / 2);
      }

      function preloadImage(path) {
        return new Promise((resolve) => {
          const image = new Image();
          PRELOADED_ZOMBIE_IMAGES.set(path, image);

          const finish = () => resolve();

          image.addEventListener(
            "load",
            async () => {
              try {
                if (typeof image.decode === "function") {
                  await image.decode();
                }
              } catch (_) {
                // decode 실패 시에도 이미 로드된 이미지는 그대로 사용합니다.
              }

              finish();
            },
            { once: true }
          );

          image.addEventListener("error", finish, { once: true });
          image.src = path;
        });
      }

      function preloadGameSprites() {
        return Promise.all([
          preloadImage(WALK_SHEET),
          preloadImage(DEAD_SHEET),
          preloadImage(BIRTH_DEATH_SHEET),
          preloadImage(DEER_SHEET),
          preloadImage(STUMP_WITH_AXE_IMAGE),
          preloadImage(STUMP_EMPTY_IMAGE),
          preloadImage(NIGHT_BACKGROUND_IMAGE),
          preloadImage(NIGHT_CLOUD_SHEET),
          preloadImage(NIGHT_STUMP_IMAGE),
          preloadImage(TREE_DAY_SHEET),
          preloadImage(TREE_DAY_STAGE_TWO_IMAGE),
          preloadImage(TREE_DAY_STAGE_THREE_IMAGE),
          preloadImage(TREE_NIGHT_IMAGE),
          preloadImage(TREE_PART_IMAGE)
        ]);
      }

      function applyWorldTransform() {
        world.style.left = `calc(50% + ${panX}px)`;
        world.style.top = `calc(50% + ${panY}px)`;
        world.style.transform =
          `translate(-50%, -50%) scale(${worldScale})`;
      }

      function updatePanBounds() {
        const viewportWidth = window.innerWidth;
        const viewportHeight = window.innerHeight;
        const renderedWorldSize = WORLD_SIZE * worldScale;

        /*
          브라우저 내부 크기는 정사각형 창에서도 주소창·테두리 등의 영향으로
          몇 px 차이가 날 수 있으므로, 긴 쪽 대비 1% 이내의 차이는 1:1로 봅니다.
        */
        const aspectDifference =
          Math.abs(viewportWidth - viewportHeight);
        const squareTolerance =
          Math.max(viewportWidth, viewportHeight) * 0.01;
        const isSquare =
          aspectDifference <= squareTolerance;
        const isWide =
          !isSquare && viewportWidth > viewportHeight;
        const isTall =
          !isSquare && viewportHeight > viewportWidth;

        /*
          화면 비율에 따라 실제로 잘린 방향만 드래그합니다.

          - 가로형 화면: 세로 방향만 드래그
          - 세로형 화면: 가로 방향만 드래그
          - 1:1에 가까운 화면: 드래그하지 않음

          배경 끝이 화면 끝에 닿는 지점까지만 이동합니다.
        */
        maxPanX = 0;
        maxPanY = 0;

        if (isWide) {
          /*
            가로형 화면에서는 가로 길이와 같은 정사각형 영역까지만
            위아래로 이동합니다.
            예: 1600×900 화면 → 세로 이동 범위는 ±350px
          */
          maxPanY = Math.max(
            0,
            (viewportWidth - viewportHeight) / 2
          );
        } else if (isTall) {
          /*
            세로형 화면에서는 세로 길이와 같은 정사각형 영역까지만
            좌우로 이동합니다.
            예: 900×1600 화면 → 가로 이동 범위는 ±350px
          */
          maxPanX = Math.max(
            0,
            (viewportHeight - viewportWidth) / 2
          );
        }

        panX = maxPanX > 0
          ? clamp(panX, -maxPanX, maxPanX)
          : 0;

        panY = maxPanY > 0
          ? clamp(panY, -maxPanY, maxPanY)
          : 0;

        viewport.classList.toggle(
          "can-pan",
          maxPanX > 0 || maxPanY > 0
        );
      }

      function updateWorldScale() {
        const viewportWidth = window.innerWidth;
        const viewportHeight = window.innerHeight;

        const baseWidth = clamp(viewportWidth, 1024, 2048);
        const baseHeight = clamp(viewportHeight, 1024, 2048);

        // 1024 미만과 2048 초과에서는 긴 쪽을 fit하고 반대쪽을 crop합니다.
        worldScale = Math.max(
          viewportWidth / baseWidth,
          viewportHeight / baseHeight
        );

        updatePanBounds();
        applyWorldTransform();
      }

      function startBackgroundDrag(event) {
        if (event.button !== undefined && event.button !== 0) return;
        if (maxPanX <= 0 && maxPanY <= 0) return;

        event.preventDefault();
        dragState.active = true;
        dragState.moved = false;
        dragState.pointerId = event.pointerId;
        dragState.captureTarget =
          event.target instanceof Element ? event.target : viewport;
        dragState.startX = event.clientX;
        dragState.startY = event.clientY;
        dragState.startPanX = panX;
        dragState.startPanY = panY;

        try {
          dragState.captureTarget.setPointerCapture(event.pointerId);
        } catch (_) {
          dragState.captureTarget = viewport;
          viewport.setPointerCapture(event.pointerId);
        }
      }

      function moveBackgroundDrag(event) {
        if (
          !dragState.active ||
          event.pointerId !== dragState.pointerId
        ) {
          return;
        }

        const deltaX = event.clientX - dragState.startX;
        const deltaY = event.clientY - dragState.startY;

        if (!dragState.moved && Math.hypot(deltaX, deltaY) >= 4) {
          dragState.moved = true;
          viewport.classList.add("is-panning");
        }

        if (!dragState.moved) return;

        panX = clamp(
          dragState.startPanX + deltaX,
          -maxPanX,
          maxPanX
        );

        panY = clamp(
          dragState.startPanY + deltaY,
          -maxPanY,
          maxPanY
        );

        applyWorldTransform();
        event.preventDefault();
      }

      function endBackgroundDrag(event) {
        if (
          !dragState.active ||
          event.pointerId !== dragState.pointerId
        ) {
          return;
        }

        const captureTarget = dragState.captureTarget;
        if (
          captureTarget &&
          typeof captureTarget.hasPointerCapture === "function" &&
          captureTarget.hasPointerCapture(event.pointerId)
        ) {
          try {
            captureTarget.releasePointerCapture(event.pointerId);
          } catch (_) {
            // 포인터 해제가 이미 끝난 경우에도 드래그 상태는 정상 정리합니다.
          }
        }

        dragState.active = false;
        dragState.moved = false;
        dragState.pointerId = null;
        dragState.captureTarget = null;
        viewport.classList.remove("is-panning");
      }

      function shouldActivateFieldObject(event, element = event?.currentTarget) {
        if (!event) return true;
        if (dragState.moved) return false;

        if (
          dragState.active &&
          event.pointerId !== dragState.pointerId
        ) {
          return false;
        }

        if (!(element instanceof Element)) return true;

        const rect = element.getBoundingClientRect();
        return (
          event.clientX >= rect.left &&
          event.clientX <= rect.right &&
          event.clientY >= rect.top &&
          event.clientY <= rect.bottom
        );
      }

      function framePosition(frameIndex) {
        const col = frameIndex % 4;
        const row = Math.floor(frameIndex / 4);
        return `${-col * ZOMBIE_WIDTH}px ${-row * ZOMBIE_HEIGHT}px`;
      }

      function deerFramePosition(frameIndex) {
        const normalizedIndex = Math.max(0, frameIndex);
        const col = normalizedIndex % DEER_SHEET_COLUMNS;
        const row = Math.floor(normalizedIndex / DEER_SHEET_COLUMNS);
        return `${-col * DEER_FRAME_SIZE}px ${-row * DEER_FRAME_SIZE}px`;
      }

      function getRandomDeerIdleDelay() {
        return randomBetween(
          DEER_IDLE_MIN_DELAY_MS,
          DEER_IDLE_MAX_DELAY_MS
        );
      }

      function randomCloudCount(minCount, maxCount) {
        return Math.floor(
          randomBetween(minCount, maxCount + 1)
        );
      }

      function getVisibleWorldBounds() {
        const screenCenterX = window.innerWidth / 2 + panX;
        const screenCenterY = window.innerHeight / 2 + panY;
        const worldCenter = WORLD_SIZE / 2;

        return {
          left: worldCenter + (0 - screenCenterX) / worldScale,
          top: worldCenter + (0 - screenCenterY) / worldScale,
          right:
            worldCenter +
            (window.innerWidth - screenCenterX) / worldScale,
          bottom:
            worldCenter +
            (window.innerHeight - screenCenterY) / worldScale
        };
      }

      function getCloudHalfSize(scale) {
        return (CLOUD_FRAME_SIZE * scale) / 2;
      }

      function getCloudBounds(x, y, scale, padding = 0) {
        const halfSize = getCloudHalfSize(scale) + padding;

        return {
          left: x - halfSize,
          top: y - halfSize,
          right: x + halfSize,
          bottom: y + halfSize
        };
      }

      function doCloudBoundsOverlap(a, b) {
        return !(
          a.right <= b.left ||
          a.left >= b.right ||
          a.bottom <= b.top ||
          a.top >= b.bottom
        );
      }

      function overlapsCloudGroup(x, y, scale, group) {
        const candidateBounds = getCloudBounds(
          x,
          y,
          scale,
          CLOUD_OVERLAP_PADDING
        );

        return group.some((otherCloud) => {
          const otherBounds = getCloudBounds(
            otherCloud.x,
            otherCloud.y,
            otherCloud.scale,
            CLOUD_OVERLAP_PADDING
          );

          return doCloudBoundsOverlap(candidateBounds, otherBounds);
        });
      }

      function lineIntersectsRectOnCloudPath(lineSum, rect) {
        const minLineSum = rect.left + rect.top;
        const maxLineSum = rect.right + rect.bottom;

        return lineSum >= minLineSum && lineSum <= maxLineSum;
      }

      function wouldCloudPathIntrudeSafeZone(
        x,
        y,
        scale,
        intrusionRatio
      ) {
        const halfSize = getCloudHalfSize(scale);
        const clampedIntrusionRatio = clamp(
          intrusionRatio,
          0,
          1
        );
        // 1 이상이면 safe zone 경로 제한을 사용하지 않습니다.
        if (clampedIntrusionRatio >= 1) {
          return false;
        }

        const protectedMargin =
          halfSize * (1 - clampedIntrusionRatio);

        const protectedZone = {
          left: SAFE_ZONE.left - protectedMargin,
          top: SAFE_ZONE.top - protectedMargin,
          right: SAFE_ZONE.right + protectedMargin,
          bottom: SAFE_ZONE.bottom + protectedMargin
        };

        // 구름과 그림자는 x + y 값이 일정한 대각선 경로로 이동합니다.
        // 이 경로가 보호 구역을 지나면 해당 생성 위치를 사용하지 않습니다.
        return lineIntersectsRectOnCloudPath(x + y, protectedZone);
      }

      function getRandomCloudPosition(kind, scale, group, initialInside) {
        const visibleBounds = getVisibleWorldBounds();
        const halfSize = getCloudHalfSize(scale);
        const centerX = (visibleBounds.left + visibleBounds.right) / 2;
        const centerY = (visibleBounds.top + visibleBounds.bottom) / 2;
        const isShadow = kind === "shadow";

        for (let attempt = 0; attempt < 120; attempt += 1) {
          let x;
          let y;

          if (initialInside) {
            const minX = visibleBounds.left + halfSize * 0.55;
            const maxX = visibleBounds.right - halfSize * 0.55;
            const minY = visibleBounds.top + halfSize * 0.55;
            const maxY = visibleBounds.bottom - halfSize * 0.55;

            x = minX <= maxX
              ? randomBetween(minX, maxX)
              : centerX;
            y = minY <= maxY
              ? randomBetween(minY, maxY)
              : centerY;
          } else if (Math.random() < 0.5) {
            // 화면 왼쪽의 아래쪽 구간에서 들어옵니다.
            x = visibleBounds.left - halfSize * 0.82;
            y = randomBetween(
              centerY,
              visibleBounds.bottom + halfSize * 0.15
            );
          } else {
            // 화면 아래쪽의 왼쪽 구간에서 들어옵니다.
            x = randomBetween(
              visibleBounds.left - halfSize * 0.15,
              centerX
            );
            y = visibleBounds.bottom + halfSize * 0.82;
          }

          if (overlapsCloudGroup(x, y, scale, group)) {
            continue;
          }

          const safeZoneIntrusionRatio = isShadow
            ? CLOUD_SHADOW_SAFE_ZONE_INTRUSION_RATIO
            : CLOUD_SAFE_ZONE_INTRUSION_RATIO;

          if (
            wouldCloudPathIntrudeSafeZone(
              x,
              y,
              scale,
              safeZoneIntrusionRatio
            )
          ) {
            continue;
          }

          return { x, y };
        }

        return null;
      }

      function applyCloudVariant(element, variant, isShadow) {
        const col = variant % CLOUD_SHEET_COLUMNS;
        const row = Math.floor(variant / CLOUD_SHEET_COLUMNS);
        const position =
          `${-col * CLOUD_FRAME_SIZE}px ` +
          `${-row * CLOUD_FRAME_SIZE}px`;

        // 낮/밤 구름 레이어가 동일한 스프라이트 위치를 사용합니다.
        element.style.setProperty("--cloud-position", position);
      }

      function renderCloud(cloud) {
        let renderX = cloud.x;
        let renderY = cloud.y;

        if (cloud.kind === "sky") {
          renderX += (-panX / worldScale) * CLOUD_DRAG_PARALLAX_FACTOR;
          renderY += (-panY / worldScale) * CLOUD_DRAG_PARALLAX_FACTOR;
        }

        cloud.element.style.left = `${renderX}px`;
        cloud.element.style.top = `${renderY}px`;
        cloud.element.style.transform =
          `translate(-50%, -50%) scale(${cloud.scale})`;
      }

      function applyCloudOpacity(cloud, opacityFactor) {
        cloud.opacityFactor = clamp(opacityFactor, 0, 1);
        cloud.element.style.opacity = String(
          cloud.baseOpacity * cloud.opacityFactor
        );
      }

      function updateCloudOpacity(cloud, now) {
        if (cloud.isFadingOut) {
          const fadeProgress = clamp(
            (now - cloud.fadeOutStartedAt) /
              CLOUD_FADE_DURATION_MS,
            0,
            1
          );

          applyCloudOpacity(
            cloud,
            cloud.fadeOutStartOpacity * (1 - fadeProgress)
          );
          return;
        }

        const fadeInProgress = clamp(
          (now - cloud.createdAt) / CLOUD_FADE_DURATION_MS,
          0,
          1
        );

        applyCloudOpacity(cloud, fadeInProgress);
      }

      function startCloudFadeOut(cloud, now) {
        if (cloud.isFadingOut) return;

        updateCloudOpacity(cloud, now);
        cloud.isFadingOut = true;
        cloud.fadeOutStartedAt = now;
        cloud.fadeOutStartOpacity = cloud.opacityFactor;
      }

      function getCloudTimeUntilOutside(
        cloud,
        visibleBounds,
        worldSpeed
      ) {
        const halfSize = getCloudHalfSize(cloud.scale);
        const velocityX = CLOUD_DIRECTION.x * worldSpeed;
        const velocityY = CLOUD_DIRECTION.y * worldSpeed;
        const exitCenterX =
          visibleBounds.right + CLOUD_EXIT_MARGIN + halfSize;
        const exitCenterY =
          visibleBounds.top - CLOUD_EXIT_MARGIN - halfSize;

        const timeUntilRightExit = velocityX > 0
          ? (exitCenterX - cloud.x) / velocityX
          : Infinity;
        const timeUntilTopExit = velocityY < 0
          ? (cloud.y - exitCenterY) / -velocityY
          : Infinity;

        return Math.min(
          timeUntilRightExit,
          timeUntilTopExit
        );
      }

      function createCloud(kind, initialInside = false) {
        const isShadow = kind === "shadow";
        const group = isShadow ? shadowClouds : skyClouds;
        const layer = isShadow ? cloudShadowsLayer : cloudsLayer;
        const scale = isShadow
          ? randomBetween(
              CLOUD_SHADOW_MIN_SCALE,
              CLOUD_SHADOW_MAX_SCALE
            )
          : randomBetween(
              CLOUD_MIN_SCALE,
              CLOUD_MAX_SCALE
            );
        const position = getRandomCloudPosition(
          kind,
          scale,
          group,
          initialInside
        );

        if (!position) return false;

        const variant = Math.floor(
          Math.random() * CLOUD_VARIANT_COUNT
        );
        const element = document.createElement("div");
        element.className = isShadow
          ? "cloud-visual cloud-shadow"
          : "cloud-visual cloud-sprite";

        applyCloudVariant(element, variant, isShadow);
        layer.appendChild(element);

        const now = performance.now();
        const initialOpacityFactor = initialInside ? 1 : 0;

        const cloud = {
          id: nextCloudId++,
          kind,
          element,
          x: position.x,
          y: position.y,
          scale,
          variant,
          baseOpacity: isShadow
            ? getCloudShadowBaseOpacity(now)
            : 1,
          opacityFactor: initialOpacityFactor,
          /*
            페이지 최초 로드 시 화면 안에 배치되는 구름과 그림자는
            즉시 보이도록 페이드인 완료 상태로 시작합니다.
            이후 새로 생성되는 구름만 1초 페이드인을 사용합니다.
          */
          createdAt: initialInside
            ? now - CLOUD_FADE_DURATION_MS
            : now,
          isFadingOut: false,
          fadeOutStartedAt: 0,
          fadeOutStartOpacity: 1
        };

        group.push(cloud);
        renderCloud(cloud);
        applyCloudOpacity(cloud, initialOpacityFactor);
        return true;
      }

      function removeCloud(cloud, group) {
        cloud.element.remove();
        const index = group.indexOf(cloud);

        if (index >= 0) {
          group.splice(index, 1);
        }
      }

      function isCloudOutsideVisibleArea(cloud, visibleBounds) {
        const halfSize = getCloudHalfSize(cloud.scale);

        return (
          cloud.x - halfSize > visibleBounds.right + CLOUD_EXIT_MARGIN ||
          cloud.y + halfSize < visibleBounds.top - CLOUD_EXIT_MARGIN
        );
      }

      function updateCloudGroup(kind, deltaMs, now) {
        const isShadow = kind === "shadow";
        const group = isShadow ? shadowClouds : skyClouds;
        const visibleBounds = getVisibleWorldBounds();
        const currentShadowOpacity = isShadow
          ? getCloudShadowBaseOpacity(now)
          : 1;

        // 화면에서 보이는 속도가 확대 배율과 관계없이 같도록 보정합니다.
        const worldSpeed =
          CLOUD_SPEED_SCREEN_PX_PER_MS / worldScale;

        for (const cloud of [...group]) {
          if (isShadow) {
            cloud.baseOpacity = currentShadowOpacity;
          }

          cloud.x += CLOUD_DIRECTION.x * worldSpeed * deltaMs;
          cloud.y += CLOUD_DIRECTION.y * worldSpeed * deltaMs;
          renderCloud(cloud);

          if (!cloud.isFadingOut) {
            const timeUntilOutside = getCloudTimeUntilOutside(
              cloud,
              visibleBounds,
              worldSpeed
            );

            /*
              완전히 화면 밖으로 나가기 약 1초 전부터 페이드아웃합니다.
              화면 이동으로 이미 경계를 넘은 경우에도 즉시 제거하지 않고
              같은 1초 페이드아웃을 적용합니다.
            */
            if (
              timeUntilOutside <= CLOUD_FADE_DURATION_MS ||
              isCloudOutsideVisibleArea(cloud, visibleBounds)
            ) {
              startCloudFadeOut(cloud, now);
            }
          }

          updateCloudOpacity(cloud, now);

          if (
            cloud.isFadingOut &&
            now - cloud.fadeOutStartedAt >= CLOUD_FADE_DURATION_MS
          ) {
            removeCloud(cloud, group);
          }
        }

        if (
          group.length < cloudTargetCounts[kind] &&
          now >= nextCloudSpawnAt[kind]
        ) {
          const created = createCloud(kind, false);
          nextCloudSpawnAt[kind] = now + (created ? 1_500 : 2_500);
        }
      }

      function initializeClouds() {
        cloudTargetCounts.sky = randomCloudCount(
          CLOUD_MIN_COUNT,
          CLOUD_MAX_COUNT
        );
        cloudTargetCounts.shadow = randomCloudCount(
          CLOUD_SHADOW_MIN_COUNT,
          CLOUD_SHADOW_MAX_COUNT
        );

        for (
          let index = 0;
          index < cloudTargetCounts.sky;
          index += 1
        ) {
          createCloud("sky", true);
        }

        for (
          let index = 0;
          index < cloudTargetCounts.shadow;
          index += 1
        ) {
          createCloud("shadow", true);
        }
      }

      function setBirdFrame(bird, frameIndex) {
        const normalizedFrame =
          frameIndex % BIRD_FRAME_COUNT;
        const col =
          normalizedFrame % BIRD_SHEET_COLUMNS;
        const row = Math.floor(
          normalizedFrame / BIRD_SHEET_COLUMNS
        );
        const position = `${col * 50}% ${row * 50}%`;

        // 3×3 스프라이트 시트는 각 축의 0% / 50% / 100% 위치를 사용합니다.
        bird.element.style.webkitMaskPosition = position;
        bird.element.style.maskPosition = position;
      }

      function createBirdFlock(count, isFirstKillFlock = false) {
        const visibleBounds = getVisibleWorldBounds();
        const visibleWidth = visibleBounds.right - visibleBounds.left;
        const visibleHeight = visibleBounds.bottom - visibleBounds.top;
        const margin = Math.max(
          220 / worldScale,
          Math.min(visibleWidth, visibleHeight) * 0.12
        );

        // 모든 새는 현재 화면 기준의 좌하단 바깥에서 우상단 바깥으로 이동합니다.
        // birds 레이어가 world 내부에 있으므로, 드래그 시 배경과 함께 자연스럽게 이동합니다.
        const verticalMargin =
          margin * BIRD_PATH_VERTICAL_MARGIN_FACTOR;

        // 간헐적 출현 무리는 전체 경로를 위아래로 조금씩 옮겨서
        // 같은 높이에서만 지나가지 않도록 합니다.
        const flockVerticalShift = isFirstKillFlock
          ? 0
          : randomBetween(
              -AMBIENT_BIRD_FLOCK_VERTICAL_SHIFT_PX,
              AMBIENT_BIRD_FLOCK_VERTICAL_SHIFT_PX
            );

        const baseStart = {
          x: visibleBounds.left - margin,
          y: visibleBounds.bottom + verticalMargin + flockVerticalShift
        };
        const baseEnd = {
          x: visibleBounds.right + margin,
          y: visibleBounds.top - verticalMargin + flockVerticalShift
        };
        const pathX = baseEnd.x - baseStart.x;
        const pathY = baseEnd.y - baseStart.y;
        const pathLength = Math.hypot(pathX, pathY);
        const direction = {
          x: pathX / pathLength,
          y: pathY / pathLength
        };
        const perpendicular = {
          x: -direction.y,
          y: direction.x
        };
        const speed = isFirstKillFlock
          ? FIRST_KILL_BIRD_SPEED_SCREEN_PX_PER_MS
          : AMBIENT_BIRD_SPEED_SCREEN_PX_PER_MS;
        const baseDuration = pathLength / speed;
        const now = performance.now();

        const flockSlots = [];

        for (let index = 0; index < count; index += 1) {
          const element = document.createElement("div");
          element.className = "bird";
          birdsLayer.appendChild(element);

          // 진행 방향 앞뒤 간격과 대각선에 수직인 간격을 섞어 자연스러운 무리를 만듭니다.
          // 이미 뽑힌 새들과 너무 가까운 경로는 다시 뽑아 겹침을 줄입니다.
          let trailOffset = 0;
          let lateralOffset = 0;
          let slotAccepted = false;

          for (let attempt = 0; attempt < 40; attempt += 1) {
            const candidateTrailOffset = randomBetween(-80, 130);
            const candidateLateralOffset = randomBetween(-72, 72);

            const overlapsExistingSlot = flockSlots.some((slot) => {
              const trailGap = Math.abs(
                candidateTrailOffset - slot.trailOffset
              );
              const lateralGap = Math.abs(
                candidateLateralOffset - slot.lateralOffset
              );
              const pathDistance = Math.hypot(trailGap, lateralGap);

              return (
                pathDistance < BIRD_MIN_PATH_DISTANCE_PX ||
                (trailGap < BIRD_MIN_TRAIL_GAP_PX &&
                  lateralGap < BIRD_MIN_LATERAL_GAP_PX)
              );
            });

            if (overlapsExistingSlot) {
              continue;
            }

            trailOffset = candidateTrailOffset;
            lateralOffset = candidateLateralOffset;
            slotAccepted = true;
            break;
          }

          if (!slotAccepted) {
            trailOffset = randomBetween(-80, 130);
            lateralOffset = randomBetween(-72, 72);
          }

          flockSlots.push({
            trailOffset,
            lateralOffset
          });

          const startX =
            baseStart.x +
            direction.x * trailOffset +
            perpendicular.x * lateralOffset;
          const startY =
            baseStart.y +
            direction.y * trailOffset +
            perpendicular.y * lateralOffset;
          const endX =
            baseEnd.x +
            direction.x * trailOffset +
            perpendicular.x * lateralOffset;
          const endY =
            baseEnd.y +
            direction.y * trailOffset +
            perpendicular.y * lateralOffset;
          const scale = randomBetween(
            BIRD_MIN_SCALE,
            BIRD_MAX_SCALE
          );
          const delay = randomBetween(0, isFirstKillFlock ? 240 : 180);
          const duration = baseDuration * randomBetween(0.92, 1.08);
          const frameOffset = Math.floor(
            Math.random() * BIRD_FRAME_COUNT
          );

          const bird = {
            element,
            startX,
            startY,
            endX,
            endY,
            scale,
            startedAt: now + delay,
            duration,
            frameOffset,
            fps: isFirstKillFlock ? FIRST_KILL_BIRD_FPS : BIRD_FPS
          };

          birds.push(bird);
          element.style.left = `${startX}px`;
          element.style.top = `${startY}px`;
          element.style.opacity = "0";
          element.style.transform =
            `translate(-50%, -50%) scale(${scale})`;
          setBirdFrame(bird, frameOffset);
        }
      }

      function updateBirds(now) {
        for (let index = birds.length - 1; index >= 0; index -= 1) {
          const bird = birds[index];
          const elapsed = now - bird.startedAt;

          if (elapsed < 0) {
            continue;
          }

          const progress = clamp(elapsed / bird.duration, 0, 1);
          const x = bird.startX + (bird.endX - bird.startX) * progress;
          const y = bird.startY + (bird.endY - bird.startY) * progress;
          const frameDuration = 1000 / bird.fps;
          const frameIndex =
            bird.frameOffset + Math.floor(elapsed / frameDuration);

          bird.element.style.left = `${x}px`;
          bird.element.style.top = `${y}px`;
          bird.element.style.opacity = "1";
          setBirdFrame(bird, frameIndex);

          if (progress >= 1) {
            bird.element.remove();
            birds.splice(index, 1);
          }
        }
      }

      function scheduleNextAmbientBirdFlock() {
        if (ambientBirdTimer !== null) {
          clearTimeout(ambientBirdTimer);
        }

        const delay = randomBetween(
          AMBIENT_BIRD_MIN_INTERVAL_MS,
          AMBIENT_BIRD_MAX_INTERVAL_MS
        );

        ambientBirdTimer = window.setTimeout(() => {
          const count = Math.floor(
            randomBetween(
              AMBIENT_BIRD_MIN_COUNT,
              AMBIENT_BIRD_MAX_COUNT + 1
            )
          );

          createBirdFlock(count, false);
          scheduleNextAmbientBirdFlock();
        }, delay);
      }

      function triggerFirstKillBirdFlock() {
        if (firstKillBirdFlockPlayed) return false;

        firstKillBirdFlockPlayed = true;
        saveResourceState();
        createBirdFlock(FIRST_KILL_BIRD_COUNT, true);
        playBirdFlySound();
        scheduleNextAmbientBirdFlock();
        return true;
      }

      function randomDirection() {
        const angle = Math.random() * Math.PI * 2;
        return {
          x: Math.cos(angle),
          y: Math.sin(angle)
        };
      }

      function randomDeathStartFrame() {
        return Math.random() < 0.5 ? 0 : 4;
      }

      function isInsideInflatedZoneFor(
        zone,
        x,
        y,
        halfWidth,
        halfHeight
      ) {
        return (
          x > zone.left - halfWidth &&
          x < zone.right + halfWidth &&
          y > zone.top - halfHeight &&
          y < zone.bottom + halfHeight
        );
      }

      function isInsideInflatedSafeZoneFor(x, y, halfWidth, halfHeight) {
        return isInsideInflatedZoneFor(
          SAFE_ZONE,
          x,
          y,
          halfWidth,
          halfHeight
        );
      }

      function isInsideInflatedSafeZone(x, y) {
        return isInsideInflatedSafeZoneFor(x, y, HALF_W, HALF_H);
      }

      function getCenteredStructureSafeZone(element) {
        const halfSafeSize = STRUCTURE_SAFE_ZONE_SIZE / 2;
        const centerX = element.offsetLeft + element.offsetWidth / 2;
        const centerY = element.offsetTop + element.offsetHeight / 2;

        return {
          left: centerX - halfSafeSize,
          top: centerY - halfSafeSize,
          right: centerX + halfSafeSize,
          bottom: centerY + halfSafeSize
        };
      }

      function getStructureSafeZones() {
        return [
          getCenteredStructureSafeZone(shedObject),
          getCenteredStructureSafeZone(carObject)
        ];
      }

      function getZombieSafeZones() {
        return [SAFE_ZONE, ...getStructureSafeZones()];
      }

      function getDeerSafeZones() {
        return [SAFE_ZONE, ...getStructureSafeZones()];
      }

      function doesDeerHorizontalPathCrossZone(y, zone) {
        return (
          y > zone.top - DEER_HALF_H &&
          y < zone.bottom + DEER_HALF_H
        );
      }

      function getRandomSpawnPosition() {
        const minX = GAME_ZONE.left + HALF_W;
        const maxX = GAME_ZONE.right - HALF_W;
        const minY = GAME_ZONE.top + HALF_H;
        const maxY = GAME_ZONE.bottom - HALF_H;

        let bestCandidate = null;
        let bestMinimumDistance = -1;
        const zombieSafeZones = getZombieSafeZones();

        for (let attempt = 0; attempt < 500; attempt += 1) {
          const x = minX + Math.random() * (maxX - minX);
          const y = minY + Math.random() * (maxY - minY);

          const overlapsSafeZone = zombieSafeZones.some((zone) =>
            isInsideInflatedZoneFor(zone, x, y, HALF_W, HALF_H)
          );

          if (overlapsSafeZone) {
            continue;
          }

          let minimumDistance = Infinity;

          for (const otherZombie of zombies.values()) {
            if (otherZombie.state === "removed") continue;

            const distance = Math.hypot(
              x - otherZombie.x,
              y - otherZombie.y
            );

            minimumDistance = Math.min(minimumDistance, distance);
          }

          // 다른 좀비가 없거나 충분히 멀리 떨어진 위치면 바로 사용합니다.
          if (minimumDistance >= MIN_SPAWN_DISTANCE) {
            return { x, y };
          }

          // 충분한 위치를 못 찾을 경우를 대비해 가장 멀었던 후보를 기억합니다.
          if (minimumDistance > bestMinimumDistance) {
            bestMinimumDistance = minimumDistance;
            bestCandidate = { x, y };
          }
        }

        if (bestCandidate) {
          return bestCandidate;
        }

        // 극히 드문 예외 상황에도 구조물 안전 구역과 겹치지 않는
        // 게임 영역 우측 상단을 기본 위치로 사용합니다.
        return {
          x: GAME_ZONE.right - HALF_W - 8,
          y: GAME_ZONE.top + HALF_H + 8
        };
      }

      function getRandomDeerSpawnPosition(options = {}) {
        const minX = GAME_ZONE.left + DEER_HALF_W;
        const maxX = GAME_ZONE.right - DEER_HALF_W;
        const minY = GAME_ZONE.top + DEER_HALF_H;
        const maxY = GAME_ZONE.bottom - DEER_HALF_H;
        const avoidX = Number.isFinite(options.avoidX)
          ? options.avoidX
          : null;
        const avoidY = Number.isFinite(options.avoidY)
          ? options.avoidY
          : null;
        const minAvoidDistance = Number.isFinite(options.minAvoidDistance)
          ? options.minAvoidDistance
          : 0;

        let bestCandidate = null;
        let bestMinimumDistance = -1;
        let bestAvoidDistance = -1;
        const deerSafeZones = getDeerSafeZones();

        for (let attempt = 0; attempt < 500; attempt += 1) {
          const x = minX + Math.random() * (maxX - minX);
          const y = minY + Math.random() * (maxY - minY);

          const overlapsSafeZone = deerSafeZones.some((zone) =>
            isInsideInflatedZoneFor(
              zone,
              x,
              y,
              DEER_HALF_W,
              DEER_HALF_H
            )
          );

          if (overlapsSafeZone) {
            continue;
          }

          // 사슴은 좌우로 도망가므로 중앙 안전 구역뿐 아니라
          // 창고와 자동차 중앙의 128×128 안전 구역도 가로지르지 않도록
          // 각 안전 구역과 같은 세로 높이에는 생성하지 않습니다.
          if (
            deerSafeZones.some((zone) =>
              doesDeerHorizontalPathCrossZone(y, zone)
            )
          ) {
            continue;
          }

          let minimumDistance = Infinity;

          for (const otherZombie of zombies.values()) {
            if (otherZombie.state === "removed") continue;

            const distance = Math.hypot(
              x - otherZombie.x,
              y - otherZombie.y
            );

            minimumDistance = Math.min(minimumDistance, distance);
          }

          for (const otherDeer of deerMap.values()) {
            if (otherDeer.state === "removed") continue;

            const distance = Math.hypot(
              x - otherDeer.x,
              y - otherDeer.y
            );

            minimumDistance = Math.min(minimumDistance, distance);
          }

          const avoidDistance =
            avoidX !== null && avoidY !== null
              ? Math.hypot(x - avoidX, y - avoidY)
              : Infinity;

          if (
            minimumDistance >= MIN_DEER_SPAWN_DISTANCE &&
            avoidDistance >= minAvoidDistance
          ) {
            return { x, y };
          }

          const isBetterAvoidDistance = avoidDistance > bestAvoidDistance;
          const isSameAvoidDistance =
            Math.abs(avoidDistance - bestAvoidDistance) < 0.001;

          if (
            isBetterAvoidDistance ||
            (isSameAvoidDistance && minimumDistance > bestMinimumDistance)
          ) {
            bestAvoidDistance = avoidDistance;
            bestMinimumDistance = minimumDistance;
            bestCandidate = { x, y };
          }
        }

        if (bestCandidate) {
          return bestCandidate;
        }

        // 무작위 탐색에서 후보를 찾지 못한 경우에도 안전 구역을
        // 가로지르지 않는 세로 위치를 위에서 아래로 다시 확인합니다.
        for (let y = minY; y <= maxY; y += 1) {
          const crossesSafeZone = deerSafeZones.some((zone) =>
            doesDeerHorizontalPathCrossZone(y, zone)
          );

          if (!crossesSafeZone) {
            return {
              x: GAME_ZONE.left + DEER_HALF_W + 8,
              y
            };
          }
        }

        // 모든 수평 이동 경로가 안전 구역과 겹치면 사슴을 생성하지 않습니다.
        return null;
      }

      function playSound(path, volume = 1) {
        try {
          const audio = new Audio(path);
          audio.volume = volume;
          audio.play().catch(() => {});
        } catch (_) {
          // 오디오 재생 실패는 게임 진행에 영향을 주지 않습니다.
        }
      }

      function playStructureSound(path, volume = 1) {
        try {
          const audio = structureSoundAudioByPath.get(path);
          if (!audio || (!audio.paused && !audio.ended)) return;

          audio.volume = volume;
          if (audio.ended) {
            audio.currentTime = 0;
          }
          audio.play().catch(() => {});
        } catch (_) {
          // 자동차·창고 사운드 재생 실패는 게임 진행에 영향을 주지 않습니다.
        }
      }

      function removeToast(toast) {
        if (!toast) return;

        if (toast.removeTimer !== null) {
          clearTimeout(toast.removeTimer);
          toast.removeTimer = null;
        }

        if (toast.replacedRemoveTimer !== null) {
          clearTimeout(toast.replacedRemoveTimer);
          toast.replacedRemoveTimer = null;
        }

        toast.element.remove();

        const toastIndex = activeToasts.indexOf(toast);
        if (toastIndex >= 0) {
          activeToasts.splice(toastIndex, 1);
        }
      }

      function fadeOutReplacedToast(toast, now = performance.now()) {
        if (!toast || !toast.element.isConnected) return;
        if (toast.element.classList.contains("is-replaced")) return;

        const remainingDisplayMs = toast.expiresAt - now;

        // 원래 표시 시간이 0.5초 이하로 남았다면 기존 페이드 애니메이션으로
        // 자연스럽게 사라지도록 별도의 교체 처리를 하지 않습니다.
        if (remainingDisplayMs <= TOAST_REPLACED_FADE_MS) {
          return;
        }

        if (toast.removeTimer !== null) {
          clearTimeout(toast.removeTimer);
          toast.removeTimer = null;
        }

        const currentOpacity = getComputedStyle(
          toast.textElement
        ).opacity;

        toast.textElement.style.setProperty(
          "--toast-current-opacity",
          currentOpacity
        );
        toast.element.classList.add("is-replaced");

        toast.replacedRemoveTimer = window.setTimeout(() => {
          removeToast(toast);
        }, TOAST_REPLACED_FADE_MS);
      }

      function showToast(message) {
        const now = performance.now();

        // 이미 제거된 토스트가 배열에 남지 않도록 정리합니다.
        for (let index = activeToasts.length - 1; index >= 0; index -= 1) {
          if (!activeToasts[index].element.isConnected) {
            activeToasts.splice(index, 1);
          }
        }

        // 새 토스트까지 포함해 3개 이상이 되는 순간 가장 오래된 것을 즉시 제거합니다.
        while (activeToasts.length >= MAX_VISIBLE_TOASTS) {
          removeToast(activeToasts[0]);
        }

        // 직전에 표시된 토스트는 남은 시간이 충분할 때만 0.5초 교체 페이드를 적용합니다.
        const previousToast = activeToasts[activeToasts.length - 1] || null;
        if (previousToast) {
          fadeOutReplacedToast(previousToast, now);
        }

        const element = document.createElement("div");
        element.className = "toast-message";

        const textElement = document.createElement("span");
        textElement.className = "toast-message-text";
        textElement.textContent = message;
        element.appendChild(textElement);

        toastLayer.appendChild(element);

        const toast = {
          element,
          textElement,
          createdAt: now,
          expiresAt: now + TOAST_DURATION_MS,
          removeTimer: null,
          replacedRemoveTimer: null
        };

        activeToasts.push(toast);

        toast.removeTimer = window.setTimeout(() => {
          removeToast(toast);
        }, TOAST_DURATION_MS + 100);
      }

      function handleRepairButton(event) {
        playSound(EXPLORE_BUTTON_SOUND);

        // 이미 수리 화면이면 닫거나 다시 열지 않고 현재 상태를 유지합니다.
        if (isRepairOpen) return;

        openRepair();
      }

      function handleInventoryButton(event) {
        playSound(EXPLORE_BUTTON_SOUND);

        if (hasNewInventoryItem) {
          hasNewInventoryItem = false;
          applyInventoryNewBadgeState();
          saveResourceState();
        }


        // 이미 가방 화면이면 닫거나 다시 열지 않고 현재 상태를 유지합니다.
        if (isInventoryOpen) return;

        openInventory();
      }

      function handleExploreButton(event) {
        playSound(EXPLORE_BUTTON_SOUND);

        if (isExploring) {
          closeInventory(false);
          closeRepair(false);
          syncMenuBackdrop();
          showExploringBusyToast(event);
          return;
        }

        // 이미 탐험 목적지 화면이면 닫거나 다시 열지 않고 현재 상태를 유지합니다.
        if (isExplorationMenuOpen) return;

        openExplorationMenu();
      }

      function applyAxeState() {
        axeStump.style.backgroundImage = hasAxe
          ? `url("${STUMP_EMPTY_IMAGE}")`
          : `url("${STUMP_WITH_AXE_IMAGE}")`;
        axeStump.setAttribute("aria-hidden", hasAxe ? "true" : "false");
        axePickupHitArea.hidden = hasAxe;
        axePickupHitArea.style.pointerEvents = hasAxe ? "none" : "auto";
        axePickupHitArea.tabIndex = hasAxe ? -1 : 0;
      }

      function setInventoryValue(item, value) {
        if (!item) return;
        const valueElement = item.querySelector(".inventory-item__quantity");
        if (valueElement) valueElement.textContent = value;
      }

      function applyInventoryState() {
        if (axeInventoryItem) {
          axeInventoryItem.hidden = !hasAxe;
          setInventoryValue(axeInventoryItem, hasAxe && isAxeEquipped ? "E" : "");
        }

        if (handgunInventoryItem) {
          handgunInventoryItem.hidden = !hasHandgun;
          setInventoryValue(handgunInventoryItem, hasHandgun && isHandgunEquipped ? "E" : "");
        }

        if (handgunAmmoInventoryItem) {
          handgunAmmoInventoryItem.hidden = !hasHandgunAmmo;
          setInventoryValue(handgunAmmoInventoryItem, `×${handgunAmmoCount}`);
        }

        if (musicBoxInventoryItem) {
          musicBoxInventoryItem.hidden = !hasMusicBox;
          setInventoryValue(musicBoxInventoryItem, isMusicOn ? "ON" : "OFF");
        }

        if (strangerLetterInventoryItem) {
          strangerLetterInventoryItem.hidden = !hasStrangerLetter;
          setInventoryValue(strangerLetterInventoryItem, isStrangerLetterOn ? "ON" : "OFF");
        }

        if (compassInventoryItem) {
          compassInventoryItem.hidden = !hasCompass;
          setInventoryValue(compassInventoryItem, "");
        }

        if (carPartsInventoryItem) {
          carPartsInventoryItem.hidden = carPartsCount <= 0;
          setInventoryValue(carPartsInventoryItem, `×${carPartsCount}`);
        }

        applyInventoryItemNewTagState();
        rebuildInventoryPages();
