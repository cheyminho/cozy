<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>CoZy</title>
  <style>
    :root {
      --world-size: 2048px;
      --zombie-width: 64px;
      --zombie-height: 128px;
    }

    * {
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #111;
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      touch-action: none;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      touch-action: none;
    }

    #viewport {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #111;
      touch-action: none;
    }

    #viewport.can-pan {
      cursor: grab;
    }

    #viewport.is-panning {
      cursor: grabbing;
    }

    #world {
      position: absolute;
      left: 50%;
      top: 50%;
      width: var(--world-size);
      height: var(--world-size);
      transform-origin: center center;
      background-image: url("images/bg_field_default_day.png");
      background-repeat: no-repeat;
      background-position: center;
      background-size: 2048px 2048px;
      will-change: transform;
    }

    #cloudShadows,
    #clouds {
      position: absolute;
      inset: 0;
      overflow: visible;
      pointer-events: none;
    }

    /* 구름 그림자는 배경 위, 좀비 아래에 표시합니다. */
    #cloudShadows {
      z-index: 1;
    }

    /* 도끼가 꽂힌 나무 밑동은 배경 오브젝트로 좀비보다 아래에 표시합니다. */
    #props {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    #axeStump {
      position: absolute;
      /* 1024×1024 게임 영역 좌상단(512, 512)에서 +116px, +200px */
      left: 628px;
      top: 712px;
      width: 179.2px;
      height: 179.2px;
      background-image: url("images/bg_stump_axe.png");
      background-repeat: no-repeat;
      background-position: left top;
      background-size: 179.2px 179.2px;
      transform-origin: left top;
      pointer-events: none;
    }

    /* 이미지와 같은 70% 비율로 축소된 89.6×89.6 영역을 정중앙에 배치합니다. */
    #axePickupHitArea {
      position: absolute;
      left: 44.8px;
      top: 44.8px;
      width: 89.6px;
      height: 89.6px;
      cursor: pointer;
      pointer-events: auto;
      touch-action: none;
      outline: none;
    }

    #entities {
      position: absolute;
      inset: 0;
      z-index: 10;
      /* 빈 엔티티 레이어가 아래의 도끼 터치 영역을 가리지 않도록 합니다. */
      pointer-events: none;
    }

    /* 실제 구름은 좀비보다 높은 상공 레이어에 표시합니다. */
    #clouds {
      z-index: 20;
    }

    /* 새 떼는 배경 위 상공 레이어에서 날아가며, 화면 드래그에도 함께 반응합니다. */
    #birds {
      position: absolute;
      inset: 0;
      z-index: 19;
      overflow: visible;
      pointer-events: none;
    }

    .bird {
      position: absolute;
      width: 42.6667px;
      height: 42.6667px;
      background-color: #f1efe4;
      -webkit-mask-image: url("images/bird_fly.png");
      mask-image: url("images/bird_fly.png");
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-size: 128px 128px;
      mask-size: 128px 128px;
      -webkit-mask-position: 0 0;
      mask-position: 0 0;
      transform-origin: center center;
      image-rendering: auto;
      will-change: left, top, transform, opacity, -webkit-mask-position, mask-position;
      pointer-events: none;
    }

    .cloud-visual {
      position: absolute;
      width: 512px;
      height: 512px;
      transform-origin: center center;
      will-change: left, top, transform;
      pointer-events: none;
    }

    .cloud-sprite {
      background-image: url("images/bg_field_default_clouds.png");
      background-repeat: no-repeat;
      background-size: 1024px 1024px;
    }

    .cloud-shadow {
      background-image: url("images/bg_field_default_clouds.png");
      background-repeat: no-repeat;
      background-size: 1024px 1024px;
      opacity: 0.3;
      mix-blend-mode: multiply;

      /*
        원본 구름 PNG의 투명도를 그대로 사용하면서
        그림자를 어두운 남청색(#303a72에 가까운 색)으로 변환합니다.
        mask-image를 사용하지 않으므로 file:// 로 직접 열어도 CORS에 막히지 않습니다.
      */
      filter:
        brightness(0)
        saturate(100%)
        invert(22%)
        sepia(18%)
        saturate(1780%)
        hue-rotate(193deg)
        brightness(88%)
        contrast(88%);
    }

    #hud {
      position: fixed;
      top: max(14px, env(safe-area-inset-top));
      left: 50%;
      z-index: 100;
      transform: translateX(-50%);
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      line-height: 1;
      letter-spacing: 0.01em;
      text-align: center;
      white-space: nowrap;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.65);
      pointer-events: none;
    }

    #toastLayer {
      position: fixed;
      top: 25vh;
      left: 50%;
      z-index: 110;
      width: min(90vw, 420px);
      height: 1px;
      transform: translateX(-50%);
      pointer-events: none;
    }

    .toast-message {
      position: absolute;
      left: 50%;
      top: 0;
      color: #fff;
      font-size: 20px;
      font-weight: 300;
      line-height: 1.3;
      white-space: nowrap;
      text-align: center;
      opacity: 0;
      will-change: transform, opacity;
      animation: toast-rise-and-fade 1.6s ease-out forwards;
    }

    @keyframes toast-rise-and-fade {
      0% {
        opacity: 0;
        transform: translate(-50%, 18px);
      }
      16% {
        opacity: 0.9;
      }
      42% {
        opacity: 0.9;
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -24px);
      }
    }

    #versionLabel {
      position: fixed;
      left: max(10px, env(safe-area-inset-left));
      bottom: max(10px, env(safe-area-inset-bottom));
      z-index: 100;
      color: #fff;
      font-size: 11px;
      font-weight: 400;
      line-height: 1;
      opacity: 0.7;
      pointer-events: none;
    }

    .zombie {
      position: absolute;
      width: var(--zombie-width);
      height: var(--zombie-height);
      cursor: pointer;
      transform: translate(-50%, -50%);
      transform-origin: center center;
      will-change: left, top, opacity;
      touch-action: none;
      /* 부모 엔티티 레이어는 클릭을 통과시키고 좀비만 직접 입력을 받습니다. */
      pointer-events: auto;
    }

    /*
      좀비 그림자 수정 위치
      - width / height: 그림자의 가로·세로 크기
      - left / bottom: 그림자 위치
      - transform: 오른쪽으로 기울어진 정도와 납작한 정도
      - opacity: 검정 투명도
      - filter blur(): 블러 강도
    */
    .zombie::before {
      content: "";
      position: absolute;
      left: 20px;
      bottom: 25px;
      width: 70px;
      height: 16px;
      background: #000;
      border-radius: 50%;
      opacity: 0.2;
      filter: blur(5px);
      transform: skewX(-28deg) scaleY(0.4);
      transform-origin: left center;
      pointer-events: none;
      z-index: 0;
    }

    .zombie.is-dead {
      cursor: default;
      pointer-events: none;
    }

    .zombie-sprite {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      background-repeat: no-repeat;
      background-size: 256px 256px;
      background-position: 0 0;
      image-rendering: auto;
      transform-origin: center center;
      will-change: transform, opacity, background-position;
    }

    .zombie-sprite-overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      width: 100%;
      height: 100%;
      background-repeat: no-repeat;
      background-size: 256px 256px;
      background-position: 0 0;
      image-rendering: auto;
      transform-origin: center center;
      will-change: transform, opacity, background-position;
      pointer-events: none;
      opacity: 0;
    }

    /* 주소 끝에 ?debug=1을 붙이면 안전 영역과 게임 영역을 확인할 수 있습니다. */
    .debug-zone {
      position: absolute;
      display: none;
      pointer-events: none;
      z-index: 90;
    }

    body.debug .debug-zone {
      display: block;
    }

    #gameZone {
      left: 512px;
      top: 512px;
      width: 1024px;
      height: 1024px;
      border: 2px solid rgba(80, 180, 255, 0.9);
      background: rgba(80, 180, 255, 0.06);
    }

    #safeZone {
      left: 768px;
      top: 768px;
      width: 512px;
      height: 512px;
      border: 2px solid rgba(255, 235, 80, 0.95);
      background: rgba(255, 235, 80, 0.08);
    }
  </style>
</head>
<body>
  <div id="viewport">
    <div id="world">
      <div id="cloudShadows"></div>
      <div id="props">
        <div id="axeStump" aria-hidden="false">
          <div
            id="axePickupHitArea"
            class="world-interactive"
            role="button"
            tabindex="0"
            aria-label="도끼 얻기"
          ></div>
        </div>
      </div>
      <div id="entities"></div>
      <div id="birds"></div>
      <div id="clouds"></div>
      <div id="gameZone" class="debug-zone"></div>
      <div id="safeZone" class="debug-zone"></div>
    </div>
  </div>

  <div id="hud">Zombies: <span id="zombieCount">0</span></div>
  <div id="toastLayer" aria-live="polite" aria-atomic="false"></div>
  <div id="versionLabel">v0.029</div>

  <script>
    (() => {
      "use strict";

      const WORLD_SIZE = 2048;

      const GAME_ZONE = {
        left: 512,
        top: 512,
        right: 1536,
        bottom: 1536
      };

      const SAFE_ZONE = {
        left: 768,
        top: 768,
        right: 1280,
        bottom: 1280
      };

      const ZOMBIE_WIDTH = 64;
      const ZOMBIE_HEIGHT = 128;
      const HALF_W = ZOMBIE_WIDTH / 2;
      const HALF_H = ZOMBIE_HEIGHT / 2;

      // 화면에 동시에 표시되는 좀비의 최대 수
      const MAX_ACTIVE_ZOMBIES = 100;

      // 누적 처치 카운터의 최대 수
      const MAX_ZOMBIE_COUNT = 999;

      const SPAWN_INTERVAL_MS = 60_000;
      const AUTO_DEATH_MS = 12 * 60_000;

      // 기본 걷기 애니메이션: 2fps
      const WALK_FPS = 2;

      // 피격 첫 프레임과 전체 사망 모션: 프레임당 0.2초
      const DEATH_FPS = 5;
      const HIT_REACTION_MS = 200;

      // 가능하면 기존 좀비의 중심에서 이 거리 이상 떨어져 생성합니다.
      const MIN_SPAWN_DISTANCE = 160;

      // 생성 모션 프레임별 유지 시간
      // 1번 2초 / 2번 0.25초 / 3번 0.5초 / 4번 0.25초
      const BIRTH_FRAME_DURATIONS_MS = [
        2_000,
        250,
        500,
        250
      ];

      // 생성 프레임 사이의 부드러운 전환 시간
      const BIRTH_TRANSITION_MS = 300;

      // 생성 첫 프레임의 처음 1초 동안 페이드인
      const BIRTH_FADE_IN_MS = 1_000;

      // 사망 모션 마지막 프레임과 추가 프레임 표시 시간
      const DEATH_LAST_FRAME_HOLD_MS = 3_000;
      const DEATH_EXTRA_FRAME_MS = 3_000;
      const DEATH_TRANSITION_MS = 1_000;
      const FADE_DURATION_MS = 3_000;

      // 이동 속도: 2초에 1px
      const MOVE_SPEED_PX_PER_MS = 1 / 2_000;

      const WALK_SHEET = "images/zomebie_default_walk.png";
      const DEAD_SHEET = "images/zomebie_default_dead.png";
      const BIRTH_DEATH_SHEET =
        "images/zomebie_default_birthdeath.png";

      // 좀비 스프라이트를 메모리에 유지해 공격 순간 빈 프레임이 보이지 않게 합니다.
      const PRELOADED_ZOMBIE_IMAGES = new Map();

      const HIT_SOUND = "sounds/sfx_zombie_hit_axe.wav";
      const BIRTH_SOUND = "sounds/sfx_zombie_birth.wav";
      const DEATH_SOUND = "sounds/sfx_zombie_death.wav";
      const GET_AXE_SOUND = "sounds/sfx_get_axe.wav";
      const BGM_SOUND = "sounds/bgm_meadow.mp3";

      const STUMP_WITH_AXE_IMAGE = "images/bg_stump_axe.png";
      const STUMP_EMPTY_IMAGE = "images/bg_stump.png";

      const UNARMED_TOAST_MESSAGE = "I need a weapon.";
      const MAX_VISIBLE_TOASTS = 5;
      const TOAST_DURATION_MS = 1_600;

      // 구름 스프라이트 시트: 1024×1024 안에 2×2로 배치된 4종입니다.
      const CLOUD_SHEET_COLUMNS = 2;
      const CLOUD_SHEET_ROWS = 2;
      const CLOUD_VARIANT_COUNT = 4;
      const CLOUD_FRAME_SIZE = 512;

      // 실제 구름 크기: 기본 크기의 0.5~1.5배
      const CLOUD_MIN_SCALE = 0.5;
      const CLOUD_MAX_SCALE = 1.5;

      // 지상 그림자 크기: 기본 크기의 1~2배
      const CLOUD_SHADOW_MIN_SCALE = 1;
      const CLOUD_SHADOW_MAX_SCALE = 2;

      // 실제 구름은 한 화면에 1~3개를 유지합니다.
      const CLOUD_MIN_COUNT = 1;
      const CLOUD_MAX_COUNT = 3;

      // 구름 그림자는 기존 요청대로 한 화면에 2~3개를 유지합니다.
      const CLOUD_SHADOW_MIN_COUNT = 2;
      const CLOUD_SHADOW_MAX_COUNT = 3;

      // 모든 구름과 그림자는 화면 기준 초당 5px로 같은 속도로 이동합니다.
      const CLOUD_SPEED_SCREEN_PX_PER_MS = 1 / 200;
      const CLOUD_DIRECTION_LENGTH = Math.hypot(1, -1);
      const CLOUD_DIRECTION = {
        x: 1 / CLOUD_DIRECTION_LENGTH,
        y: -1 / CLOUD_DIRECTION_LENGTH
      };

      // 실제 이미지보다 넉넉하게 간격을 두어 서로 겹치지 않게 합니다.
      const CLOUD_OVERLAP_PADDING = 32;
      const CLOUD_EXIT_MARGIN = 24;

      // 실제 구름과 구름 그림자는 중앙 안전 구역을 가급적 피하도록 생성합니다.
      // 0.00 = 침범 불가 / 0.10 = 약 10% 침범 허용 / 1.00 = 제한 없음
      const CLOUD_SAFE_ZONE_INTRUSION_RATIO = 0.90;
      const CLOUD_SHADOW_SAFE_ZONE_INTRUSION_RATIO = 0.60;

      // 드래그할 때 실제 구름만 약간 덜 따라오게 하여
      // 지면보다 더 높이 떠 있는 것처럼 느끼게 합니다.
      const CLOUD_DRAG_PARALLAX_FACTOR = 0.3;

      // 새 비행 스프라이트 시트: 128×128 안에 3×3, 총 9프레임입니다.
      const BIRD_SHEET_COLUMNS = 3;
      const BIRD_SHEET_ROWS = 3;
      const BIRD_FRAME_COUNT = 9;
      const BIRD_FPS = 12;

      // 첫 좀비 처치 시에는 5마리가 빠르게 화면을 가로지릅니다.
      const FIRST_KILL_BIRD_COUNT = 5;
      const FIRST_KILL_BIRD_SPEED_SCREEN_PX_PER_MS = 0.5;

      // 이후에는 20~60초 간격으로 1~3마리가 가끔 지나갑니다.
      const AMBIENT_BIRD_MIN_COUNT = 1;
      const AMBIENT_BIRD_MAX_COUNT = 3;
      const AMBIENT_BIRD_MIN_INTERVAL_MS = 20_000;
      const AMBIENT_BIRD_MAX_INTERVAL_MS = 60_000;
      const AMBIENT_BIRD_SPEED_SCREEN_PX_PER_MS = 0.1;

      // 시작점과 끝점의 세로 바깥 여백을 줄여 비행 경로를 조금 더 수평에 가깝게 만듭니다.
      // 1 = 기존처럼 세로 방향도 margin 전체 사용 / 0.25 = margin의 25%만 사용
      const BIRD_PATH_VERTICAL_MARGIN_FACTOR = 0.18;

      // 화면에서 보이는 새 크기 범위입니다.
      const BIRD_MIN_SCALE = 0.55;
      const BIRD_MAX_SCALE = 0.9;

      // 새 떼 효과음은 요청대로 sound 폴더를 먼저 시도하고,
      // 기존 프로젝트 구조 호환을 위해 sounds 폴더도 보조로 시도합니다.
      const BIRD_FLY_SOUND_CANDIDATES = [
        "sound/sfx_bird_fly.wav",
        "sounds/sfx_bird_fly.wav"
      ];

      // 기본 경로는 sounds이며, 파일이 없으면 요청문에 적힌 soundes 경로도 시도합니다.
      const FALL_SOUND_CANDIDATES = [
        "sounds/sfx_zomebe_fall.wav",
        "soundes/sfx_zomebe_fall.wav"
      ];

      const viewport = document.getElementById("viewport");
      const world = document.getElementById("world");
      const cloudShadowsLayer = document.getElementById("cloudShadows");
      const entities = document.getElementById("entities");
      const cloudsLayer = document.getElementById("clouds");
      const birdsLayer = document.getElementById("birds");
      const countElement = document.getElementById("zombieCount");
      const toastLayer = document.getElementById("toastLayer");
      const axeStump = document.getElementById("axeStump");
      const axePickupHitArea = document.getElementById("axePickupHitArea");

      const query = new URLSearchParams(location.search);
      if (query.get("debug") === "1") {
        document.body.classList.add("debug");
      }

      // iPhone/iPad Safari의 핀치 확대와 더블탭 확대를 막습니다.
      // Safari는 기기·버전에 따라 두 번째 touchend가 아니라
      // 두 번째 touchstart 또는 dblclick 단계에서 확대를 확정할 수 있으므로
      // 세 경로를 모두 차단합니다.
      const preventZoomGesture = (event) => {
        if (event.cancelable) {
          event.preventDefault();
        }
      };

      document.addEventListener(
        "gesturestart",
        preventZoomGesture,
        { passive: false }
      );
      document.addEventListener(
        "gesturechange",
        preventZoomGesture,
        { passive: false }
      );
      document.addEventListener(
        "gestureend",
        preventZoomGesture,
        { passive: false }
      );

      // Safari가 합성하는 더블클릭 확대도 별도로 차단합니다.
      document.addEventListener(
        "dblclick",
        preventZoomGesture,
        { passive: false, capture: true }
      );

      document.addEventListener(
        "touchmove",
        (event) => {
          if (event.touches.length > 1) {
            preventZoomGesture(event);
          }
        },
        { passive: false, capture: true }
      );

      const DOUBLE_TAP_BLOCK_MS = 500;
      const DOUBLE_TAP_MAX_DISTANCE_PX = 80;
      let lastTapStartedAt = -Infinity;
      let lastTapX = 0;
      let lastTapY = 0;
      let blockCurrentTapZoom = false;

      document.addEventListener(
        "touchstart",
        (event) => {
          if (event.touches.length > 1) {
            blockCurrentTapZoom = true;
            preventZoomGesture(event);
            return;
          }

          const touch = event.changedTouches[0];
          if (!touch) return;

          const now = performance.now();
          const elapsed = now - lastTapStartedAt;
          const distance = Math.hypot(
            touch.clientX - lastTapX,
            touch.clientY - lastTapY
          );

          blockCurrentTapZoom =
            elapsed <= DOUBLE_TAP_BLOCK_MS &&
            distance <= DOUBLE_TAP_MAX_DISTANCE_PX;

          if (blockCurrentTapZoom) {
            preventZoomGesture(event);
          }

          lastTapStartedAt = now;
          lastTapX = touch.clientX;
          lastTapY = touch.clientY;
        },
        { passive: false, capture: true }
      );

      document.addEventListener(
        "touchend",
        (event) => {
          if (blockCurrentTapZoom) {
            preventZoomGesture(event);
          }

          if (event.touches.length === 0) {
            blockCurrentTapZoom = false;
          }
        },
        { passive: false, capture: true }
      );

      document.addEventListener(
        "touchcancel",
        () => {
          blockCurrentTapZoom = false;
        },
        { passive: true, capture: true }
      );

      let zombieCount = 0;
      let hasAxe = false;
      const visibleToasts = [];
      let nextZombieId = 1;
      let nextCloudId = 1;
      let lastFrameTime = performance.now();
      const zombies = new Map();

      const skyClouds = [];
      const shadowClouds = [];
      const cloudTargetCounts = {
        sky: CLOUD_MIN_COUNT,
        shadow: CLOUD_MIN_COUNT
      };
      const nextCloudSpawnAt = {
        sky: 0,
        shadow: 0
      };

      const birds = [];
      let firstKillBirdFlockPlayed = false;
      let ambientBirdTimer = null;

      const bgmAudio = new Audio(BGM_SOUND);
      bgmAudio.loop = true;
      let bgmStartScheduled = false;
      let bgmStarted = false;

      let worldScale = 1;
      let panX = 0;
      let panY = 0;
      let maxPanX = 0;
      let maxPanY = 0;

      const dragState = {
        active: false,
        moved: false,
        pointerId: null,
        startX: 0,
        startY: 0,
        startPanX: 0,
        startPanY: 0
      };

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function preloadImage(path) {
        return new Promise((resolve) => {
          const image = new Image();
          PRELOADED_ZOMBIE_IMAGES.set(path, image);

          const finish = () => resolve();

          image.addEventListener(
            "load",
            async () => {
              try {
                if (typeof image.decode === "function") {
                  await image.decode();
                }
              } catch (_) {
                // decode 실패 시에도 이미 로드된 이미지는 그대로 사용합니다.
              }

              finish();
            },
            { once: true }
          );

          image.addEventListener("error", finish, { once: true });
          image.src = path;
        });
      }

      function preloadZombieSprites() {
        return Promise.all([
          preloadImage(WALK_SHEET),
          preloadImage(DEAD_SHEET),
          preloadImage(BIRTH_DEATH_SHEET),
          preloadImage(STUMP_WITH_AXE_IMAGE),
          preloadImage(STUMP_EMPTY_IMAGE)
        ]);
      }

      function applyWorldTransform() {
        world.style.left = `calc(50% + ${panX}px)`;
        world.style.top = `calc(50% + ${panY}px)`;
        world.style.transform =
          `translate(-50%, -50%) scale(${worldScale})`;
      }

      function updatePanBounds() {
        const viewportWidth = window.innerWidth;
        const viewportHeight = window.innerHeight;
        const renderedWorldSize = WORLD_SIZE * worldScale;

        /*
          브라우저 내부 크기는 정사각형 창에서도 주소창·테두리 등의 영향으로
          몇 px 차이가 날 수 있으므로, 긴 쪽 대비 1% 이내의 차이는 1:1로 봅니다.
        */
        const aspectDifference =
          Math.abs(viewportWidth - viewportHeight);
        const squareTolerance =
          Math.max(viewportWidth, viewportHeight) * 0.01;
        const isSquare =
          aspectDifference <= squareTolerance;
        const isWide =
          !isSquare && viewportWidth > viewportHeight;
        const isTall =
          !isSquare && viewportHeight > viewportWidth;

        /*
          화면 비율에 따라 실제로 잘린 방향만 드래그합니다.

          - 가로형 화면: 세로 방향만 드래그
          - 세로형 화면: 가로 방향만 드래그
          - 1:1에 가까운 화면: 드래그하지 않음

          배경 끝이 화면 끝에 닿는 지점까지만 이동합니다.
        */
        maxPanX = 0;
        maxPanY = 0;

        if (isWide) {
          /*
            가로형 화면에서는 가로 길이와 같은 정사각형 영역까지만
            위아래로 이동합니다.
            예: 1600×900 화면 → 세로 이동 범위는 ±350px
          */
          maxPanY = Math.max(
            0,
            (viewportWidth - viewportHeight) / 2
          );
        } else if (isTall) {
          /*
            세로형 화면에서는 세로 길이와 같은 정사각형 영역까지만
            좌우로 이동합니다.
            예: 900×1600 화면 → 가로 이동 범위는 ±350px
          */
          maxPanX = Math.max(
            0,
            (viewportHeight - viewportWidth) / 2
          );
        }

        panX = maxPanX > 0
          ? clamp(panX, -maxPanX, maxPanX)
          : 0;

        panY = maxPanY > 0
          ? clamp(panY, -maxPanY, maxPanY)
          : 0;

        viewport.classList.toggle(
          "can-pan",
          maxPanX > 0 || maxPanY > 0
        );
      }

      function updateWorldScale() {
        const viewportWidth = window.innerWidth;
        const viewportHeight = window.innerHeight;

        const baseWidth = clamp(viewportWidth, 1024, 2048);
        const baseHeight = clamp(viewportHeight, 1024, 2048);

        // 1024 미만과 2048 초과에서는 긴 쪽을 fit하고 반대쪽을 crop합니다.
        worldScale = Math.max(
          viewportWidth / baseWidth,
          viewportHeight / baseHeight
        );

        updatePanBounds();
        applyWorldTransform();
      }

      function startBackgroundDrag(event) {
        if (event.button !== undefined && event.button !== 0) return;

        if (
          event.target instanceof Element &&
          event.target.closest(".zombie, .world-interactive")
        ) {
          return;
        }

        if (maxPanX <= 0 && maxPanY <= 0) return;

        event.preventDefault();
        dragState.active = true;
        dragState.moved = false;
        dragState.pointerId = event.pointerId;
        dragState.startX = event.clientX;
        dragState.startY = event.clientY;
        dragState.startPanX = panX;
        dragState.startPanY = panY;

        viewport.setPointerCapture(event.pointerId);
      }

      function moveBackgroundDrag(event) {
        if (
          !dragState.active ||
          event.pointerId !== dragState.pointerId
        ) {
          return;
        }

        const deltaX = event.clientX - dragState.startX;
        const deltaY = event.clientY - dragState.startY;

        if (!dragState.moved && Math.hypot(deltaX, deltaY) >= 4) {
          dragState.moved = true;
          viewport.classList.add("is-panning");
        }

        if (!dragState.moved) return;

        panX = clamp(
          dragState.startPanX + deltaX,
          -maxPanX,
          maxPanX
        );

        panY = clamp(
          dragState.startPanY + deltaY,
          -maxPanY,
          maxPanY
        );

        applyWorldTransform();
        event.preventDefault();
      }

      function endBackgroundDrag(event) {
        if (
          !dragState.active ||
          event.pointerId !== dragState.pointerId
        ) {
          return;
        }

        if (viewport.hasPointerCapture(event.pointerId)) {
          viewport.releasePointerCapture(event.pointerId);
        }

        dragState.active = false;
        dragState.pointerId = null;
        viewport.classList.remove("is-panning");
      }

      function framePosition(frameIndex) {
        const col = frameIndex % 4;
        const row = Math.floor(frameIndex / 4);
        return `${-col * ZOMBIE_WIDTH}px ${-row * ZOMBIE_HEIGHT}px`;
      }

      function randomBetween(min, max) {
        return min + Math.random() * (max - min);
      }

      function randomCloudCount(minCount, maxCount) {
        return Math.floor(
          randomBetween(minCount, maxCount + 1)
        );
      }

      function getVisibleWorldBounds() {
        const screenCenterX = window.innerWidth / 2 + panX;
        const screenCenterY = window.innerHeight / 2 + panY;
        const worldCenter = WORLD_SIZE / 2;

        return {
          left: worldCenter + (0 - screenCenterX) / worldScale,
          top: worldCenter + (0 - screenCenterY) / worldScale,
          right:
            worldCenter +
            (window.innerWidth - screenCenterX) / worldScale,
          bottom:
            worldCenter +
            (window.innerHeight - screenCenterY) / worldScale
        };
      }

      function getCloudHalfSize(scale) {
        return (CLOUD_FRAME_SIZE * scale) / 2;
      }

      function getCloudBounds(x, y, scale, padding = 0) {
        const halfSize = getCloudHalfSize(scale) + padding;

        return {
          left: x - halfSize,
          top: y - halfSize,
          right: x + halfSize,
          bottom: y + halfSize
        };
      }

      function doCloudBoundsOverlap(a, b) {
        return !(
          a.right <= b.left ||
          a.left >= b.right ||
          a.bottom <= b.top ||
          a.top >= b.bottom
        );
      }

      function overlapsCloudGroup(x, y, scale, group) {
        const candidateBounds = getCloudBounds(
          x,
          y,
          scale,
          CLOUD_OVERLAP_PADDING
        );

        return group.some((otherCloud) => {
          const otherBounds = getCloudBounds(
            otherCloud.x,
            otherCloud.y,
            otherCloud.scale,
            CLOUD_OVERLAP_PADDING
          );

          return doCloudBoundsOverlap(candidateBounds, otherBounds);
        });
      }

      function lineIntersectsRectOnCloudPath(lineSum, rect) {
        const minLineSum = rect.left + rect.top;
        const maxLineSum = rect.right + rect.bottom;

        return lineSum >= minLineSum && lineSum <= maxLineSum;
      }

      function wouldCloudPathIntrudeSafeZone(
        x,
        y,
        scale,
        intrusionRatio
      ) {
        const halfSize = getCloudHalfSize(scale);
        const clampedIntrusionRatio = clamp(
          intrusionRatio,
          0,
          1
        );
        // 1 이상이면 safe zone 경로 제한을 사용하지 않습니다.
        if (clampedIntrusionRatio >= 1) {
          return false;
        }

        const protectedMargin =
          halfSize * (1 - clampedIntrusionRatio);

        const protectedZone = {
          left: SAFE_ZONE.left - protectedMargin,
          top: SAFE_ZONE.top - protectedMargin,
          right: SAFE_ZONE.right + protectedMargin,
          bottom: SAFE_ZONE.bottom + protectedMargin
        };

        // 구름과 그림자는 x + y 값이 일정한 대각선 경로로 이동합니다.
        // 이 경로가 보호 구역을 지나면 해당 생성 위치를 사용하지 않습니다.
        return lineIntersectsRectOnCloudPath(x + y, protectedZone);
      }

      function getRandomCloudPosition(kind, scale, group, initialInside) {
        const visibleBounds = getVisibleWorldBounds();
        const halfSize = getCloudHalfSize(scale);
        const centerX = (visibleBounds.left + visibleBounds.right) / 2;
        const centerY = (visibleBounds.top + visibleBounds.bottom) / 2;
        const isShadow = kind === "shadow";

        for (let attempt = 0; attempt < 120; attempt += 1) {
          let x;
          let y;

          if (initialInside) {
            const minX = visibleBounds.left + halfSize * 0.55;
            const maxX = visibleBounds.right - halfSize * 0.55;
            const minY = visibleBounds.top + halfSize * 0.55;
            const maxY = visibleBounds.bottom - halfSize * 0.55;

            x = minX <= maxX
              ? randomBetween(minX, maxX)
              : centerX;
            y = minY <= maxY
              ? randomBetween(minY, maxY)
              : centerY;
          } else if (Math.random() < 0.5) {
            // 화면 왼쪽의 아래쪽 구간에서 들어옵니다.
            x = visibleBounds.left - halfSize * 0.82;
            y = randomBetween(
              centerY,
              visibleBounds.bottom + halfSize * 0.15
            );
          } else {
            // 화면 아래쪽의 왼쪽 구간에서 들어옵니다.
            x = randomBetween(
              visibleBounds.left - halfSize * 0.15,
              centerX
            );
            y = visibleBounds.bottom + halfSize * 0.82;
          }

          if (overlapsCloudGroup(x, y, scale, group)) {
            continue;
          }

          const safeZoneIntrusionRatio = isShadow
            ? CLOUD_SHADOW_SAFE_ZONE_INTRUSION_RATIO
            : CLOUD_SAFE_ZONE_INTRUSION_RATIO;

          if (
            wouldCloudPathIntrudeSafeZone(
              x,
              y,
              scale,
              safeZoneIntrusionRatio
            )
          ) {
            continue;
          }

          return { x, y };
        }

        return null;
      }

      function applyCloudVariant(element, variant, isShadow) {
        const col = variant % CLOUD_SHEET_COLUMNS;
        const row = Math.floor(variant / CLOUD_SHEET_COLUMNS);
        const position =
          `${-col * CLOUD_FRAME_SIZE}px ` +
          `${-row * CLOUD_FRAME_SIZE}px`;

        // 실제 구름과 그림자 모두 같은 스프라이트 시트를 사용합니다.
        element.style.backgroundPosition = position;
      }

      function renderCloud(cloud) {
        let renderX = cloud.x;
        let renderY = cloud.y;

        if (cloud.kind === "sky") {
          renderX += (-panX / worldScale) * CLOUD_DRAG_PARALLAX_FACTOR;
          renderY += (-panY / worldScale) * CLOUD_DRAG_PARALLAX_FACTOR;
        }

        cloud.element.style.left = `${renderX}px`;
        cloud.element.style.top = `${renderY}px`;
        cloud.element.style.transform =
          `translate(-50%, -50%) scale(${cloud.scale})`;
      }

      function createCloud(kind, initialInside = false) {
        const isShadow = kind === "shadow";
        const group = isShadow ? shadowClouds : skyClouds;
        const layer = isShadow ? cloudShadowsLayer : cloudsLayer;
        const scale = isShadow
          ? randomBetween(
              CLOUD_SHADOW_MIN_SCALE,
              CLOUD_SHADOW_MAX_SCALE
            )
          : randomBetween(
              CLOUD_MIN_SCALE,
              CLOUD_MAX_SCALE
            );
        const position = getRandomCloudPosition(
          kind,
          scale,
          group,
          initialInside
        );

        if (!position) return false;

        const variant = Math.floor(
          Math.random() * CLOUD_VARIANT_COUNT
        );
        const element = document.createElement("div");
        element.className = isShadow
          ? "cloud-visual cloud-shadow"
          : "cloud-visual cloud-sprite";

        applyCloudVariant(element, variant, isShadow);
        layer.appendChild(element);

        const cloud = {
          id: nextCloudId++,
          kind,
          element,
          x: position.x,
          y: position.y,
          scale,
          variant
        };

        group.push(cloud);
        renderCloud(cloud);
        return true;
      }

      function removeCloud(cloud, group) {
        cloud.element.remove();
        const index = group.indexOf(cloud);

        if (index >= 0) {
          group.splice(index, 1);
        }
      }

      function isCloudOutsideVisibleArea(cloud, visibleBounds) {
        const halfSize = getCloudHalfSize(cloud.scale);

        return (
          cloud.x - halfSize > visibleBounds.right + CLOUD_EXIT_MARGIN ||
          cloud.y + halfSize < visibleBounds.top - CLOUD_EXIT_MARGIN
        );
      }

      function updateCloudGroup(kind, deltaMs, now) {
        const isShadow = kind === "shadow";
        const group = isShadow ? shadowClouds : skyClouds;
        const visibleBounds = getVisibleWorldBounds();

        // 화면에서 보이는 속도가 확대 배율과 관계없이 같도록 보정합니다.
        const worldSpeed =
          CLOUD_SPEED_SCREEN_PX_PER_MS / worldScale;

        for (const cloud of [...group]) {
          cloud.x += CLOUD_DIRECTION.x * worldSpeed * deltaMs;
          cloud.y += CLOUD_DIRECTION.y * worldSpeed * deltaMs;
          renderCloud(cloud);

          if (isCloudOutsideVisibleArea(cloud, visibleBounds)) {
            removeCloud(cloud, group);
          }
        }

        if (
          group.length < cloudTargetCounts[kind] &&
          now >= nextCloudSpawnAt[kind]
        ) {
          const created = createCloud(kind, false);
          nextCloudSpawnAt[kind] = now + (created ? 1_500 : 2_500);
        }
      }

      function initializeClouds() {
        cloudTargetCounts.sky = randomCloudCount(
          CLOUD_MIN_COUNT,
          CLOUD_MAX_COUNT
        );
        cloudTargetCounts.shadow = randomCloudCount(
          CLOUD_SHADOW_MIN_COUNT,
          CLOUD_SHADOW_MAX_COUNT
        );

        for (
          let index = 0;
          index < cloudTargetCounts.sky;
          index += 1
        ) {
          createCloud("sky", true);
        }

        for (
          let index = 0;
          index < cloudTargetCounts.shadow;
          index += 1
        ) {
          createCloud("shadow", true);
        }
      }

      function setBirdFrame(bird, frameIndex) {
        const normalizedFrame =
          frameIndex % BIRD_FRAME_COUNT;
        const col =
          normalizedFrame % BIRD_SHEET_COLUMNS;
        const row = Math.floor(
          normalizedFrame / BIRD_SHEET_COLUMNS
        );
        const position = `${col * 50}% ${row * 50}%`;

        // 3×3 스프라이트 시트는 각 축의 0% / 50% / 100% 위치를 사용합니다.
        bird.element.style.webkitMaskPosition = position;
        bird.element.style.maskPosition = position;
      }

      function createBirdFlock(count, isFirstKillFlock = false) {
        const visibleBounds = getVisibleWorldBounds();
        const visibleWidth = visibleBounds.right - visibleBounds.left;
        const visibleHeight = visibleBounds.bottom - visibleBounds.top;
        const margin = Math.max(
          220 / worldScale,
          Math.min(visibleWidth, visibleHeight) * 0.12
        );

        // 모든 새는 현재 화면 기준의 좌하단 바깥에서 우상단 바깥으로 이동합니다.
        // birds 레이어가 world 내부에 있으므로, 드래그 시 배경과 함께 자연스럽게 이동합니다.
        const verticalMargin =
          margin * BIRD_PATH_VERTICAL_MARGIN_FACTOR;

        const baseStart = {
          x: visibleBounds.left - margin,
          y: visibleBounds.bottom + verticalMargin
        };
        const baseEnd = {
          x: visibleBounds.right + margin,
          y: visibleBounds.top - verticalMargin
        };
        const pathX = baseEnd.x - baseStart.x;
        const pathY = baseEnd.y - baseStart.y;
        const pathLength = Math.hypot(pathX, pathY);
        const direction = {
          x: pathX / pathLength,
          y: pathY / pathLength
        };
        const perpendicular = {
          x: -direction.y,
          y: direction.x
        };
        const speed = isFirstKillFlock
          ? FIRST_KILL_BIRD_SPEED_SCREEN_PX_PER_MS
          : AMBIENT_BIRD_SPEED_SCREEN_PX_PER_MS;
        const baseDuration = pathLength / speed;
        const now = performance.now();

        for (let index = 0; index < count; index += 1) {
          const element = document.createElement("div");
          element.className = "bird";
          birdsLayer.appendChild(element);

          // 진행 방향 앞뒤 간격과 대각선에 수직인 간격을 섞어 자연스러운 무리를 만듭니다.
          const trailOffset = randomBetween(-80, 130);
          const lateralOffset = randomBetween(-72, 72);
          const startX =
            baseStart.x +
            direction.x * trailOffset +
            perpendicular.x * lateralOffset;
          const startY =
            baseStart.y +
            direction.y * trailOffset +
            perpendicular.y * lateralOffset;
          const endX =
            baseEnd.x +
            direction.x * trailOffset +
            perpendicular.x * lateralOffset;
          const endY =
            baseEnd.y +
            direction.y * trailOffset +
            perpendicular.y * lateralOffset;
          const scale = randomBetween(
            BIRD_MIN_SCALE,
            BIRD_MAX_SCALE
          );
          const delay = randomBetween(0, isFirstKillFlock ? 240 : 180);
          const duration = baseDuration * randomBetween(0.92, 1.08);
          const frameOffset = Math.floor(
            Math.random() * BIRD_FRAME_COUNT
          );

          const bird = {
            element,
            startX,
            startY,
            endX,
            endY,
            scale,
            startedAt: now + delay,
            duration,
            frameOffset
          };

          birds.push(bird);
          element.style.left = `${startX}px`;
          element.style.top = `${startY}px`;
          element.style.opacity = "0";
          element.style.transform =
            `translate(-50%, -50%) scale(${scale})`;
          setBirdFrame(bird, frameOffset);
        }
      }

      function updateBirds(now) {
        const frameDuration = 1000 / BIRD_FPS;

        for (let index = birds.length - 1; index >= 0; index -= 1) {
          const bird = birds[index];
          const elapsed = now - bird.startedAt;

          if (elapsed < 0) {
            continue;
          }

          const progress = clamp(elapsed / bird.duration, 0, 1);
          const x = bird.startX + (bird.endX - bird.startX) * progress;
          const y = bird.startY + (bird.endY - bird.startY) * progress;
          const frameIndex =
            bird.frameOffset + Math.floor(elapsed / frameDuration);

          bird.element.style.left = `${x}px`;
          bird.element.style.top = `${y}px`;
          bird.element.style.opacity = "1";
          setBirdFrame(bird, frameIndex);

          if (progress >= 1) {
            bird.element.remove();
            birds.splice(index, 1);
          }
        }
      }

      function scheduleNextAmbientBirdFlock() {
        if (ambientBirdTimer !== null) {
          clearTimeout(ambientBirdTimer);
        }

        const delay = randomBetween(
          AMBIENT_BIRD_MIN_INTERVAL_MS,
          AMBIENT_BIRD_MAX_INTERVAL_MS
        );

        ambientBirdTimer = window.setTimeout(() => {
          const count = Math.floor(
            randomBetween(
              AMBIENT_BIRD_MIN_COUNT,
              AMBIENT_BIRD_MAX_COUNT + 1
            )
          );

          createBirdFlock(count, false);
          scheduleNextAmbientBirdFlock();
        }, delay);
      }

      function triggerFirstKillBirdFlock() {
        if (firstKillBirdFlockPlayed) return;

        firstKillBirdFlockPlayed = true;
        createBirdFlock(FIRST_KILL_BIRD_COUNT, true);
        playBirdFlySound();
        scheduleNextAmbientBirdFlock();
      }

      function randomDirection() {
        const angle = Math.random() * Math.PI * 2;
        return {
          x: Math.cos(angle),
          y: Math.sin(angle)
        };
      }

      function randomDeathStartFrame() {
        return Math.random() < 0.5 ? 0 : 4;
      }

      function isInsideInflatedSafeZone(x, y) {
        return (
          x > SAFE_ZONE.left - HALF_W &&
          x < SAFE_ZONE.right + HALF_W &&
          y > SAFE_ZONE.top - HALF_H &&
          y < SAFE_ZONE.bottom + HALF_H
        );
      }

      function getRandomSpawnPosition() {
        const minX = GAME_ZONE.left + HALF_W;
        const maxX = GAME_ZONE.right - HALF_W;
        const minY = GAME_ZONE.top + HALF_H;
        const maxY = GAME_ZONE.bottom - HALF_H;

        let bestCandidate = null;
        let bestMinimumDistance = -1;

        for (let attempt = 0; attempt < 500; attempt += 1) {
          const x = minX + Math.random() * (maxX - minX);
          const y = minY + Math.random() * (maxY - minY);

          if (isInsideInflatedSafeZone(x, y)) {
            continue;
          }

          let minimumDistance = Infinity;

          for (const otherZombie of zombies.values()) {
            if (otherZombie.state === "removed") continue;

            const distance = Math.hypot(
              x - otherZombie.x,
              y - otherZombie.y
            );

            minimumDistance = Math.min(minimumDistance, distance);
          }

          // 다른 좀비가 없거나 충분히 멀리 떨어진 위치면 바로 사용합니다.
          if (minimumDistance >= MIN_SPAWN_DISTANCE) {
            return { x, y };
          }

          // 충분한 위치를 못 찾을 경우를 대비해 가장 멀었던 후보를 기억합니다.
          if (minimumDistance > bestMinimumDistance) {
            bestMinimumDistance = minimumDistance;
            bestCandidate = { x, y };
          }
        }

        if (bestCandidate) {
          return bestCandidate;
        }

        // 극히 드문 예외 상황의 안전한 기본 위치
        return {
          x: GAME_ZONE.left + HALF_W + 8,
          y: GAME_ZONE.top + HALF_H + 8
        };
      }

      function playSound(path, volume = 1) {
        try {
          const audio = new Audio(path);
          audio.volume = volume;
          audio.play().catch(() => {});
        } catch (_) {
          // 오디오 재생 실패는 게임 진행에 영향을 주지 않습니다.
        }
      }

      function removeToast(toast) {
        const index = visibleToasts.indexOf(toast);

        if (index >= 0) {
          visibleToasts.splice(index, 1);
        }

        if (toast.removeTimer !== null) {
          clearTimeout(toast.removeTimer);
          toast.removeTimer = null;
        }

        toast.element.remove();
      }

      function showToast(message) {
        const element = document.createElement("div");
        element.className = "toast-message";
        element.textContent = message;
        toastLayer.appendChild(element);

        const toast = {
          element,
          removeTimer: null
        };

        visibleToasts.push(toast);

        while (visibleToasts.length > MAX_VISIBLE_TOASTS) {
          removeToast(visibleToasts[0]);
        }

        toast.removeTimer = window.setTimeout(() => {
          removeToast(toast);
        }, TOAST_DURATION_MS + 100);
      }

      function collectAxe(event) {
        if (hasAxe) return;

        if (event) {
          event.preventDefault();
          event.stopPropagation();
        }

        hasAxe = true;
        axeStump.style.backgroundImage =
          `url("${STUMP_EMPTY_IMAGE}")`;
        axeStump.setAttribute("aria-hidden", "true");
        axePickupHitArea.remove();
        playSound(GET_AXE_SOUND, 0.7);
      }

      function handleAxePickupKeydown(event) {
        if (event.key !== "Enter" && event.key !== " ") return;
        collectAxe(event);
      }

      function scheduleBgmAfterFirstPlayerKill() {
        if (bgmStartScheduled || bgmStarted) return;

        bgmStartScheduled = true;

        window.setTimeout(() => {
          bgmAudio.currentTime = 0;
          bgmAudio.play()
            .then(() => {
              bgmStarted = true;
            })
            .catch(() => {
              // 브라우저가 차단한 경우 다음 사용자 입력에서 다시 시도합니다.
              bgmStartScheduled = false;
            });
        }, 3_000);
      }

      function playBirdFlySound() {
        let candidateIndex = 0;

        const tryNext = () => {
          if (candidateIndex >= BIRD_FLY_SOUND_CANDIDATES.length) return;

          const audio = new Audio(
            BIRD_FLY_SOUND_CANDIDATES[candidateIndex]
          );
          candidateIndex += 1;
          audio.volume = 1;

          audio.addEventListener("error", tryNext, { once: true });
          audio.play().catch(() => {});
        };

        tryNext();
      }

      function playFallSound() {
        let candidateIndex = 0;

        const tryNext = () => {
          if (candidateIndex >= FALL_SOUND_CANDIDATES.length) return;

          const audio = new Audio(FALL_SOUND_CANDIDATES[candidateIndex]);
          candidateIndex += 1;
          audio.volume = 1;

          audio.addEventListener("error", tryNext, { once: true });
          audio.play().catch(() => {});
        };

        tryNext();
      }

      function setFacing(zombie) {
        if (zombie.direction.x > 0.000001) {
          zombie.facing = 1;
        } else if (zombie.direction.x < -0.000001) {
          zombie.facing = -1;
        }

        // 원본은 왼쪽을 향하므로 오른쪽 이동 시에만 반전합니다.
        const facingTransform =
          zombie.facing === 1 ? "scaleX(-1)" : "scaleX(1)";

        zombie.sprite.style.transform = facingTransform;
        zombie.overlay.style.transform = facingTransform;
      }

      function renderZombie(zombie) {
        zombie.element.style.left = `${zombie.x}px`;
        zombie.element.style.top = `${zombie.y}px`;
      }

      function showSingleFrame(zombie, sheet, frameIndex) {
        zombie.sprite.style.backgroundImage = `url("${sheet}")`;
        zombie.sprite.style.backgroundPosition =
          framePosition(frameIndex);
        zombie.sprite.style.opacity = "1";

        zombie.overlay.style.opacity = "0";
      }

      function showCrossfade(
        zombie,
        fromSheet,
        fromFrameIndex,
        toSheet,
        toFrameIndex,
        progress
      ) {
        const clampedProgress = clamp(progress, 0, 1);

        zombie.sprite.style.backgroundImage = `url("${fromSheet}")`;
        zombie.sprite.style.backgroundPosition =
          framePosition(fromFrameIndex);
        zombie.sprite.style.opacity =
          String(1 - clampedProgress);

        zombie.overlay.style.backgroundImage = `url("${toSheet}")`;
        zombie.overlay.style.backgroundPosition =
          framePosition(toFrameIndex);
        zombie.overlay.style.opacity =
          String(clampedProgress);
      }

      function createZombie() {
        // 생성·이동·사망·페이드 중인 개체를 모두 화면 표시 수에 포함합니다.
        if (zombies.size >= MAX_ACTIVE_ZOMBIES) return;

        const position = getRandomSpawnPosition();
        const direction = randomDirection();

        const element = document.createElement("div");
        element.className = "zombie";
        element.setAttribute("role", "button");
        element.setAttribute("aria-label", "Zombie");
        element.style.opacity = "0";

        const sprite = document.createElement("div");
        sprite.className = "zombie-sprite";
        sprite.style.backgroundImage =
          `url("${BIRTH_DEATH_SHEET}")`;

        const overlay = document.createElement("div");
        overlay.className = "zombie-sprite-overlay";

        element.appendChild(sprite);
        element.appendChild(overlay);
        entities.appendChild(element);

        const zombie = {
          id: nextZombieId++,
          element,
          sprite,
          overlay,
          x: position.x,
          y: position.y,
          direction,
          facing: Math.random() < 0.5 ? -1 : 1,
          hitCount: 0,
          state: "birthing",
          birthStartedAt: performance.now(),
          walkElapsed: 0,
          walkFrame: Math.floor(Math.random() * 8),
          hitReactionEnd: 0,
          hitReactionFrame: 0,
          deathStartFrame: randomDeathStartFrame(),
          deathStartedAt: 0,
          counted: false,
          autoDeathTimer: null,
          fallSoundTimer: null
        };

        zombies.set(zombie.id, zombie);

        setFacing(zombie);
        zombie.sprite.style.backgroundPosition = framePosition(0);
        renderZombie(zombie);
        playSound(BIRTH_SOUND, 0.5);

        element.addEventListener("pointerdown", (event) => {
          event.preventDefault();
          attackZombie(zombie);
        });

        zombie.autoDeathTimer = window.setTimeout(() => {
          beginDeath(zombie, false);
        }, AUTO_DEATH_MS);
      }

      function attackZombie(zombie) {
        if (
          zombie.state === "dying" ||
          zombie.state === "removed"
        ) {
          return;
        }

        if (!hasAxe) {
          playSound(BIRTH_SOUND, 0.5);
          showToast(UNARMED_TOAST_MESSAGE);
          return;
        }

        if (zombie.state === "birthing") {
          return;
        }

        playSound(HIT_SOUND, 0.5);

        zombie.hitCount += 1;

        if (zombie.hitCount >= 3) {
          beginDeath(zombie, true);
          return;
        }

        zombie.state = "hit";
        zombie.deathStartFrame = randomDeathStartFrame();
        zombie.hitReactionFrame = zombie.deathStartFrame;
        zombie.hitReactionEnd = performance.now() + HIT_REACTION_MS;

        showSingleFrame(
          zombie,
          DEAD_SHEET,
          zombie.hitReactionFrame
        );
      }

      function beginDeath(zombie, wasPlayerKill = false) {
        if (zombie.state === "dying" || zombie.state === "removed") return;

        zombie.state = "dying";
        zombie.element.classList.add("is-dead");
        zombie.deathStartFrame = randomDeathStartFrame();
        zombie.deathStartedAt = performance.now();
        playSound(DEATH_SOUND, 0.5);

        if (wasPlayerKill) {
          scheduleBgmAfterFirstPlayerKill();
          triggerFirstKillBirdFlock();
        }

        if (zombie.autoDeathTimer !== null) {
          clearTimeout(zombie.autoDeathTimer);
          zombie.autoDeathTimer = null;
        }

        zombie.element.style.opacity = "1";
        showSingleFrame(
          zombie,
          DEAD_SHEET,
          zombie.deathStartFrame
        );

        if (wasPlayerKill && !zombie.counted) {
          zombie.counted = true;
          zombieCount = Math.min(
            MAX_ZOMBIE_COUNT,
            zombieCount + 1
          );
          countElement.textContent = String(zombieCount);
        }

        zombie.fallSoundTimer = window.setTimeout(() => {
          playFallSound();
        }, 500);
      }

      function removeZombie(zombie) {
        if (zombie.state === "removed") return;

        zombie.state = "removed";

        if (zombie.autoDeathTimer !== null) {
          clearTimeout(zombie.autoDeathTimer);
        }

        if (zombie.fallSoundTimer !== null) {
          clearTimeout(zombie.fallSoundTimer);
        }

        zombie.element.remove();
        zombies.delete(zombie.id);
      }

      function resolveOuterBounds(zombie) {
        const minX = GAME_ZONE.left + HALF_W;
        const maxX = GAME_ZONE.right - HALF_W;
        const minY = GAME_ZONE.top + HALF_H;
        const maxY = GAME_ZONE.bottom - HALF_H;

        if (zombie.x < minX) {
          zombie.x = minX;
          zombie.direction.x = Math.abs(zombie.direction.x);
        } else if (zombie.x > maxX) {
          zombie.x = maxX;
          zombie.direction.x = -Math.abs(zombie.direction.x);
        }

        if (zombie.y < minY) {
          zombie.y = minY;
          zombie.direction.y = Math.abs(zombie.direction.y);
        } else if (zombie.y > maxY) {
          zombie.y = maxY;
          zombie.direction.y = -Math.abs(zombie.direction.y);
        }
      }

      function resolveSafeZone(zombie, previousX, previousY) {
        if (!isInsideInflatedSafeZone(zombie.x, zombie.y)) return;

        const left = SAFE_ZONE.left - HALF_W;
        const right = SAFE_ZONE.right + HALF_W;
        const top = SAFE_ZONE.top - HALF_H;
        const bottom = SAFE_ZONE.bottom + HALF_H;

        const enteredFromLeft = previousX <= left;
        const enteredFromRight = previousX >= right;
        const enteredFromTop = previousY <= top;
        const enteredFromBottom = previousY >= bottom;

        if (enteredFromLeft) {
          zombie.x = left;
          zombie.direction.x = -Math.abs(zombie.direction.x);
        } else if (enteredFromRight) {
          zombie.x = right;
          zombie.direction.x = Math.abs(zombie.direction.x);
        } else if (enteredFromTop) {
          zombie.y = top;
          zombie.direction.y = -Math.abs(zombie.direction.y);
        } else if (enteredFromBottom) {
          zombie.y = bottom;
          zombie.direction.y = Math.abs(zombie.direction.y);
        } else {
          // 모서리 진입 등 예외 상황에서는 가장 가까운 경계로 밀어냅니다.
          const distances = [
            { side: "left", value: Math.abs(zombie.x - left) },
            { side: "right", value: Math.abs(right - zombie.x) },
            { side: "top", value: Math.abs(zombie.y - top) },
            { side: "bottom", value: Math.abs(bottom - zombie.y) }
          ].sort((a, b) => a.value - b.value);

          switch (distances[0].side) {
            case "left":
              zombie.x = left;
              zombie.direction.x = -Math.abs(zombie.direction.x);
              break;
            case "right":
              zombie.x = right;
              zombie.direction.x = Math.abs(zombie.direction.x);
              break;
            case "top":
              zombie.y = top;
              zombie.direction.y = -Math.abs(zombie.direction.y);
              break;
            default:
              zombie.y = bottom;
              zombie.direction.y = Math.abs(zombie.direction.y);
          }
        }
      }

      function updateBirthing(zombie, now) {
        const elapsed = now - zombie.birthStartedAt;

        // 1번 프레임의 처음 1초 동안 좀비와 그림자를 함께 페이드인합니다.
        zombie.element.style.opacity = String(
          clamp(elapsed / BIRTH_FADE_IN_MS, 0, 1)
        );

        const birthFrameCount = BIRTH_FRAME_DURATIONS_MS.length;
        let phaseStart = 0;

        for (let index = 0; index < birthFrameCount; index += 1) {
          const holdEnd =
            phaseStart + BIRTH_FRAME_DURATIONS_MS[index];

          if (elapsed < holdEnd) {
            showSingleFrame(
              zombie,
              BIRTH_DEATH_SHEET,
              index
            );
            return;
          }

          const isLastBirthFrame =
            index === birthFrameCount - 1;
          const transitionEnd =
            holdEnd + BIRTH_TRANSITION_MS;

          if (elapsed < transitionEnd) {
            const progress =
              (elapsed - holdEnd) / BIRTH_TRANSITION_MS;

            if (isLastBirthFrame) {
              showCrossfade(
                zombie,
                BIRTH_DEATH_SHEET,
                index,
                WALK_SHEET,
                zombie.walkFrame,
                progress
              );
            } else {
              showCrossfade(
                zombie,
                BIRTH_DEATH_SHEET,
                index,
                BIRTH_DEATH_SHEET,
                index + 1,
                progress
              );
            }
            return;
          }

          phaseStart = transitionEnd;
        }

        zombie.state = "walking";
        zombie.walkElapsed = 0;
        zombie.element.style.opacity = "1";
        showSingleFrame(
          zombie,
          WALK_SHEET,
          zombie.walkFrame
        );
      }

      function updateWalking(zombie, deltaMs, now) {
        if (zombie.state === "hit") {
          if (now >= zombie.hitReactionEnd) {
            zombie.state = "walking";
            zombie.sprite.style.backgroundImage = `url("${WALK_SHEET}")`;
            zombie.sprite.style.opacity = "1";
            zombie.overlay.style.opacity = "0";
          } else {
            showSingleFrame(
              zombie,
              DEAD_SHEET,
              zombie.hitReactionFrame
            );
            return;
          }
        }

        const previousX = zombie.x;
        const previousY = zombie.y;

        zombie.x += zombie.direction.x * MOVE_SPEED_PX_PER_MS * deltaMs;
        zombie.y += zombie.direction.y * MOVE_SPEED_PX_PER_MS * deltaMs;

        resolveOuterBounds(zombie);
        resolveSafeZone(zombie, previousX, previousY);
        setFacing(zombie);

        zombie.walkElapsed += deltaMs;
        const frameDuration = 1000 / WALK_FPS;

        if (zombie.walkElapsed >= frameDuration) {
          const advancedFrames = Math.floor(zombie.walkElapsed / frameDuration);
          zombie.walkElapsed %= frameDuration;
          zombie.walkFrame = (zombie.walkFrame + advancedFrames) % 8;
        }

        showSingleFrame(
          zombie,
          WALK_SHEET,
          zombie.walkFrame
        );

        renderZombie(zombie);
      }

      function updateDying(zombie, now) {
        const elapsed = now - zombie.deathStartedAt;
        const deathFrameDuration = 1000 / DEATH_FPS;
        const deathAnimationEnd = 4 * deathFrameDuration;
        const lastDeathFrameHoldEnd =
          deathAnimationEnd + DEATH_LAST_FRAME_HOLD_MS;
        const transitionOneEnd =
          lastDeathFrameHoldEnd + DEATH_TRANSITION_MS;
        const extraFrameOneHoldEnd =
          transitionOneEnd + DEATH_EXTRA_FRAME_MS;
        const transitionTwoEnd =
          extraFrameOneHoldEnd + DEATH_TRANSITION_MS;
        const extraFrameTwoHoldEnd =
          transitionTwoEnd + DEATH_EXTRA_FRAME_MS;
        const fadeEnd =
          extraFrameTwoHoldEnd + FADE_DURATION_MS;

        const isBackwardDeath = zombie.deathStartFrame === 0;
        const deadLastFrame = zombie.deathStartFrame + 3;
        const extraFrameOne = isBackwardDeath ? 4 : 6;
        const extraFrameTwo = extraFrameOne + 1;

        zombie.element.style.opacity = "1";

        if (elapsed < deathAnimationEnd) {
          const localFrame = Math.min(
            3,
            Math.floor(elapsed / deathFrameDuration)
          );

          showSingleFrame(
            zombie,
            DEAD_SHEET,
            zombie.deathStartFrame + localFrame
          );
          return;
        }

        if (elapsed < lastDeathFrameHoldEnd) {
          showSingleFrame(
            zombie,
            DEAD_SHEET,
            deadLastFrame
          );
          return;
        }

        if (elapsed < transitionOneEnd) {
          const progress =
            (elapsed - lastDeathFrameHoldEnd) /
            DEATH_TRANSITION_MS;

          showCrossfade(
            zombie,
            DEAD_SHEET,
            deadLastFrame,
            BIRTH_DEATH_SHEET,
            extraFrameOne,
            progress
          );
          return;
        }

        if (elapsed < extraFrameOneHoldEnd) {
          showSingleFrame(
            zombie,
            BIRTH_DEATH_SHEET,
            extraFrameOne
          );
          return;
        }

        if (elapsed < transitionTwoEnd) {
          const progress =
            (elapsed - extraFrameOneHoldEnd) /
            DEATH_TRANSITION_MS;

          showCrossfade(
            zombie,
            BIRTH_DEATH_SHEET,
            extraFrameOne,
            BIRTH_DEATH_SHEET,
            extraFrameTwo,
            progress
          );
          return;
        }

        if (elapsed < extraFrameTwoHoldEnd) {
          showSingleFrame(
            zombie,
            BIRTH_DEATH_SHEET,
            extraFrameTwo
          );
          return;
        }

        if (elapsed < fadeEnd) {
          const fadeProgress =
            (elapsed - extraFrameTwoHoldEnd) /
            FADE_DURATION_MS;

          showSingleFrame(
            zombie,
            BIRTH_DEATH_SHEET,
            extraFrameTwo
          );

          // 전체 요소의 투명도를 낮춰 그림자도 함께 사라지게 합니다.
          zombie.element.style.opacity =
            String(Math.max(0, 1 - fadeProgress));
          return;
        }

        removeZombie(zombie);
      }

      function gameLoop(now) {
        const deltaMs = Math.min(100, now - lastFrameTime);
        lastFrameTime = now;

        for (const zombie of zombies.values()) {
          if (zombie.state === "birthing") {
            updateBirthing(zombie, now);
          } else if (
            zombie.state === "walking" ||
            zombie.state === "hit"
          ) {
            updateWalking(zombie, deltaMs, now);
          } else if (zombie.state === "dying") {
            updateDying(zombie, now);
          }
        }

        updateCloudGroup("sky", deltaMs, now);
        updateCloudGroup("shadow", deltaMs, now);
        updateBirds(now);

        requestAnimationFrame(gameLoop);
      }

      function startSpawner() {
        // 첫 좀비는 게임 시작과 동시에 생성합니다.
        createZombie();

        // 이후에는 6초마다 확인하여 화면에 100마리 미만일 때만 생성합니다.
        window.setInterval(() => {
          if (zombies.size < MAX_ACTIVE_ZOMBIES) {
            createZombie();
          }
        }, SPAWN_INTERVAL_MS);
      }

      axePickupHitArea.addEventListener("pointerdown", collectAxe);
      axePickupHitArea.addEventListener("keydown", handleAxePickupKeydown);

      viewport.addEventListener("pointerdown", startBackgroundDrag);
      viewport.addEventListener("pointermove", moveBackgroundDrag);
      viewport.addEventListener("pointerup", endBackgroundDrag);
      viewport.addEventListener("pointercancel", endBackgroundDrag);

      window.addEventListener("resize", updateWorldScale);

      async function initializeGame() {
        // 공격에 쓰이는 사망 스프라이트까지 디코딩된 뒤 좀비를 생성합니다.
        await preloadZombieSprites();

        updateWorldScale();
        initializeClouds();
        startSpawner();
        lastFrameTime = performance.now();
        requestAnimationFrame(gameLoop);
      }

      initializeGame();
    })();
  </script>
</body>
</html>
