          deer.nightSprite.style.backgroundImage = backgroundImage;
          deer.nightSprite.style.backgroundPosition = fromPosition;
          deer.nightOverlay.style.backgroundImage = backgroundImage;
          deer.nightOverlay.style.backgroundPosition = toPosition;

          renderState.mode = "crossfade";
          renderState.crossfadeKey = crossfadeKey;
          renderState.frameIndex = -1;
          renderState.fromOpacity = "";
          renderState.toOpacity = "";
        }

        // 크로스페이드 중에는 실제로 달라지는 투명도만 갱신합니다.
        if (renderState.fromOpacity !== fromOpacity) {
          deer.sprite.style.opacity = fromOpacity;
          deer.nightSprite.style.opacity = fromOpacity;
          renderState.fromOpacity = fromOpacity;
        }
        if (renderState.toOpacity !== toOpacity) {
          deer.overlay.style.opacity = toOpacity;
          deer.nightOverlay.style.opacity = toOpacity;
          renderState.toOpacity = toOpacity;
        }
      }

      function scheduleNextDeerIdleAnimation(deer, now = performance.now()) {
        deer.nextIdleAnimationAt = now + getRandomDeerIdleDelay();
      }

      function startDeerIdleAnimation(deer, sequence, durations, now) {
        deer.idleAnimation = { sequence, durations };
        deer.idleAnimationStartedAt = now;
      }

      function startRandomDeerIdleAnimation(deer, now) {
        if (Math.random() < 0.5) {
          startDeerIdleAnimation(
            deer,
            DEER_LOOK_SEQUENCE,
            DEER_LOOK_DURATIONS_MS,
            now
          );
        } else {
          startDeerIdleAnimation(
            deer,
            DEER_GRAZE_SEQUENCE,
            DEER_GRAZE_DURATIONS_MS,
            now
          );
        }
      }

      function updateActiveDeerIdleAnimation(deer, now) {
        if (!deer.idleAnimation) {
          showSingleDeerFrame(deer, DEER_IDLE_FRAME);
          return;
        }

        const elapsed = now - deer.idleAnimationStartedAt;
        let phaseStart = 0;

        for (let index = 0; index < deer.idleAnimation.sequence.length; index += 1) {
          const holdEnd =
            phaseStart + deer.idleAnimation.durations[index];

          if (elapsed < holdEnd) {
            showSingleDeerFrame(
              deer,
              deer.idleAnimation.sequence[index]
            );
            return;
          }

          phaseStart = holdEnd;
        }

        deer.idleAnimation = null;
        scheduleNextDeerIdleAnimation(deer, now);
        showSingleDeerFrame(deer, DEER_IDLE_FRAME);
      }

      function removeDeer(deer, options = {}) {
        if (deer.state === "removed") return;

        deer.state = "removed";
        deer.element.remove();
        deerMap.delete(deer.id);

        if (options.persist !== false) {
          saveResourceState();
        }
        if (options.scheduleReplacement !== false) {
          scheduleEmptyFieldDeerSpawn();
        }
      }

      function removeOneHiddenLivingDeer() {
        for (const deer of deerMap.values()) {
          if (
            deer.state !== "dying" &&
            deer.state !== "leaving" &&
            deer.state !== "removed" &&
            !isDeerVisibleInCurrentViewport(deer)
          ) {
            removeDeer(deer, {
              persist: false,
              scheduleReplacement: false
            });
            return true;
          }
        }

        return false;
      }

      function isDeerOutsideVisibleArea(deer) {
        const visibleBounds = getVisibleWorldBounds();
        const margin = DEER_HALF_W + 16;

        return (
          deer.x + margin < visibleBounds.left ||
          deer.x - margin > visibleBounds.right
        );
      }

      function isClientPointInsideElement(clientX, clientY, element) {
        if (!(element instanceof Element)) return false;
        const rect = element.getBoundingClientRect();
        return (
          clientX >= rect.left &&
          clientX <= rect.right &&
          clientY >= rect.top &&
          clientY <= rect.bottom
        );
      }

      function getLivingZombieAtClientPoint(clientX, clientY) {
        const candidates = Array.from(zombies.values()).filter(
          (zombie) =>
            zombie.state !== "dying" &&
            zombie.state !== "chainsawAttacking" &&
            zombie.state !== "removed" &&
            isClientPointInsideElement(clientX, clientY, zombie.element)
        );

        return candidates.sort((a, b) => b.y - a.y || b.id - a.id)[0] || null;
      }

      function getLivingDeerAtClientPoint(clientX, clientY) {
        const candidates = Array.from(deerMap.values()).filter(
          (deer) =>
            deer.state !== "dying" &&
            deer.state !== "leaving" &&
            deer.state !== "removed" &&
            isClientPointInsideElement(clientX, clientY, deer.hitbox)
        );

        return candidates.sort((a, b) => b.y - a.y || b.id - a.id)[0] || null;
      }

      function clearFieldEntityPressState(pointerId = null) {
        if (
          pointerId !== null &&
          fieldEntityPressState.active &&
          pointerId !== fieldEntityPressState.pointerId
        ) {
          return;
        }

        fieldEntityPressState.active = false;
        fieldEntityPressState.pointerId = null;
        fieldEntityPressState.entityType = "";
        fieldEntityPressState.entityId = null;
      }

      function startFieldEntityPress(event) {
        if (event.button !== undefined && event.button !== 0) return;

        // 겹친 위치에서는 기존 규칙대로 살아 있는 좀비를 사슴보다 우선합니다.
        const zombie = getLivingZombieAtClientPoint(
          event.clientX,
          event.clientY
        );
        const deer = zombie
          ? null
          : getLivingDeerAtClientPoint(event.clientX, event.clientY);

        if (!zombie && !deer) {
          clearFieldEntityPressState();
          return;
        }

        fieldEntityPressState.active = true;
        fieldEntityPressState.pointerId = event.pointerId;
        fieldEntityPressState.entityType = zombie ? "zombie" : "deer";
        fieldEntityPressState.entityId = zombie ? zombie.id : deer.id;
      }

      function activatePressedFieldEntity(event) {
        if (
          !fieldEntityPressState.active ||
          event.pointerId !== fieldEntityPressState.pointerId
        ) {
          return;
        }

        const entityType = fieldEntityPressState.entityType;
        const entityId = fieldEntityPressState.entityId;
        clearFieldEntityPressState(event.pointerId);

        // 뗀 위치가 이동한 엔티티 위인지 다시 검사하지 않고 드래그 여부만 확인합니다.
        if (!shouldActivateFieldObject(event, null)) return;

        event.preventDefault();

        if (entityType === "zombie") {
          const zombie = zombies.get(entityId);
          if (zombie) attackZombie(zombie);
          return;
        }

        if (entityType === "deer") {
          const deer = deerMap.get(entityId);
          if (deer) attackDeer(deer);
        }
      }

      function createDeer(options = {}) {
        const force = options.force === true;
        if (
          (!force && isExploring) ||
          getLivingDeerCount() >= MAX_ACTIVE_DEER ||
          !hasActivePopulationCapacity()
        ) {
          return false;
        }

        const spawnZone = getSpawnZoneForNextEntity();
        const position = getRandomDeerSpawnPosition({
          ...options,
          spawnZone
        });
        if (!position) {
          return false;
        }

        const now = performance.now();

        const element = document.createElement("div");
        element.className = "deer";
        element.setAttribute("role", "button");
        element.setAttribute("aria-label", "Deer");
        element.style.opacity = "0";

        const dayVisual = document.createElement("div");
        dayVisual.className = "deer-visual-layer deer-visual-day";

        const nightVisual = document.createElement("div");
        nightVisual.className = "deer-visual-layer deer-visual-night";

        const sprite = document.createElement("div");
        sprite.className = "deer-sprite";

        const overlay = document.createElement("div");
        overlay.className = "deer-sprite-overlay";

        const nightSprite = document.createElement("div");
        nightSprite.className = "deer-sprite";

        const nightOverlay = document.createElement("div");
        nightOverlay.className = "deer-sprite-overlay";

        const hitbox = document.createElement("div");
        hitbox.className = "deer-hitbox";
        hitbox.setAttribute("role", "button");
        hitbox.setAttribute("tabindex", "0");
        hitbox.setAttribute("aria-label", "Attack deer");

        dayVisual.appendChild(sprite);
        dayVisual.appendChild(overlay);
        nightVisual.appendChild(nightSprite);
        nightVisual.appendChild(nightOverlay);
        element.appendChild(dayVisual);
        element.appendChild(nightVisual);
        element.appendChild(hitbox);
        entities.appendChild(element);

        const skipBirth = options.skipBirth === true;
        const deer = {
          id: nextDeerId++,
          element,
          sprite,
          overlay,
          nightSprite,
          nightOverlay,
          hitbox,
          x: position.x,
          y: position.y,
          facing: Math.random() < 0.5 ? "left" : "right",
          renderedFacingTransform: "",
          spriteRenderState: {
            mode: "",
            frameIndex: -1,
            crossfadeKey: "",
            fromOpacity: "",
            toOpacity: ""
          },
          state: skipBirth ? "idle" : "birthing",
          birthStartedAt: now,
          idleAnimation: null,
          idleAnimationStartedAt: 0,
          nextIdleAnimationAt: now + getRandomDeerIdleDelay(),
          health: DEER_MAX_HEALTH,
          axeAttackCount: 0,
          evadeCount: 0,
          evadeDirection: 0,
          runElapsed: 0,
          runFrame: 0,
          runIntroComplete: false,
          turnStartedAt: 0,
          turnDirection: 0,
          turnNextDirection: 0,
          deathStartedAt: 0,
          deathStartX: 0,
          deathSlideDirection: 0,
          counted: false,
          movementZone: spawnZone
        };

        deerMap.set(deer.id, deer);
        setDeerFacing(deer);

        if (skipBirth) {
          deer.element.style.opacity = "1";
          scheduleNextDeerIdleAnimation(deer, now);
          showSingleDeerFrame(deer, DEER_IDLE_FRAME);
        } else {
          showSingleDeerFrame(deer, DEER_BIRTH_FRAME_SEQUENCE[0]);
        }

        renderDeer(deer);

        hitbox.addEventListener("pointerdown", startFieldEntityPress);
        hitbox.addEventListener("pointerup", activatePressedFieldEntity);

        if (options.persist !== false) {
          saveResourceState();
        }

        return true;
      }

      function beginDeerRunInDirection(
        deer,
        direction,
        state = "evading"
      ) {
        deer.state = state;
        deer.idleAnimation = null;
        deer.evadeDirection = direction < 0 ? -1 : 1;
        deer.facing = deer.evadeDirection < 0 ? "left" : "right";
        deer.runElapsed = 0;
        deer.runFrame = 0;
        deer.runIntroComplete = false;
        setDeerFacing(deer);

        // 마지막으로 보이던 사슴이 도망가기 시작한 순간부터
        // 해당 사슴을 빈 화면 판정에서 제외하고 보충 타이머를 계산합니다.
        if (state === "evading" || state === "leaving") {
          scheduleEmptyFieldDeerSpawn({ ignoredDeerId: deer.id });
        }
      }

      function beginDeerEvadeInDirection(deer, direction) {
        beginDeerRunInDirection(deer, direction, "evading");
      }

      function startDeerEvade(deer) {
        const oppositeDirection = deer.facing === "left" ? 1 : -1;
        beginDeerEvadeInDirection(deer, oppositeDirection);
      }

      function startDeerTurnaround(deer) {
        const currentDirection = deer.state === "evading"
          ? deer.evadeDirection
          : (deer.state === "turning"
            ? deer.turnDirection
            : (deer.facing === "left" ? -1 : 1));

        deer.state = "turning";
        deer.idleAnimation = null;
        deer.turnStartedAt = performance.now();
        deer.turnDirection = currentDirection < 0 ? -1 : 1;
        deer.turnNextDirection = deer.turnDirection * -1;
        deer.facing = deer.turnDirection < 0 ? "left" : "right";
        setDeerFacing(deer);
      }

      function beginDeerDeath(deer) {
        if (deer.state === "dying" || deer.state === "removed") return;

        const slideDirection = (
          deer.state === "evading" || deer.state === "leaving"
        )
          ? deer.evadeDirection
          : (deer.state === "turning"
            ? deer.turnDirection
            : (deer.facing === "left" ? -1 : 1));

        deer.state = "dying";
        deer.element.classList.add("is-dead");
        deer.idleAnimation = null;
        deer.deathStartedAt = performance.now();
        deer.deathStartX = deer.x;
        deer.deathSlideDirection = slideDirection || 1;
        deer.element.style.opacity = "1";
        showSingleDeerFrame(deer, DEER_DEATH_FRAME_SEQUENCE[0]);

        // 마지막으로 보이던 살아 있는 사슴이 죽기 시작한 순간부터
        // 시체 제거를 기다리지 않고 빈 화면 보충 타이머를 계산합니다.
        scheduleEmptyFieldDeerSpawn({ ignoredDeerId: deer.id });

        if (!deer.counted) {
          deer.counted = true;
          foodCount = Math.min(getMaxFoodCount(), foodCount + 1);
          setTodoProgress(1, "item2", true);
          commitResourceState();
        }
      }

      function makeDeerEvade(deer) {
        deer.evadeCount += 1;

        if (deer.evadeCount === 1) {
          const currentDirection = deer.facing === "left" ? -1 : 1;
          beginDeerEvadeInDirection(deer, currentDirection);
          return;
        }

        startDeerTurnaround(deer);
      }

      function alertNearbyDeer(attackSource, excludedDeer = null) {
        for (const otherDeer of deerMap.values()) {
          if (
            otherDeer === excludedDeer ||
            otherDeer.state === "dying" ||
            otherDeer.state === "leaving" ||
            otherDeer.state === "removed"
          ) {
            continue;
          }

          const isInsideAlertArea =
            Math.abs(otherDeer.x - attackSource.x) <= DEER_ALERT_HALF_SIZE &&
            Math.abs(otherDeer.y - attackSource.y) <= DEER_ALERT_HALF_SIZE;
          if (!isInsideAlertArea) continue;

          // 공격 위치가 오른쪽에 있으면 왼쪽, 왼쪽에 있으면 오른쪽으로 도망갑니다.
          const escapeDirection = attackSource.x >= otherDeer.x ? -1 : 1;
          beginDeerRunInDirection(otherDeer, escapeDirection, "leaving");
        }
      }

      function attackDeer(deer) {
        if (isExploring) {
          showExploringBusyToast();
          return;
        }

        if (
          deer.state === "dying" ||
          deer.state === "leaving" ||
          deer.state === "removed"
        ) {
          return;
        }

        const weapon = getEquippedWeapon();

        // 샷건·체인소우의 사슴 제한은 Food 최대치보다 먼저 판정합니다.
        if (weapon === "shotgun" || weapon === "chainsaw") {
          showToast(OVERKILL_TOAST_MESSAGE);
          return;
        }

        if (foodCount >= getMaxFoodCount()) {
          showToast(DEER_FOOD_FULL_TOAST_MESSAGE);
          return;
        }

        if (!weapon) {
          showToast(UNARMED_TOAST_MESSAGE);
          return;
        }

        if (weapon === "handgun" && handgunAmmoCount <= 0) {
          showNoAmmoFeedback();
          return;
        }
        if (weapon === "rifle" && rifleAmmoCount <= 0) {
          showNoAmmoFeedback();
          return;
        }

        alertNearbyDeer(deer, deer);

        if (weapon === "axe") {
          deer.axeAttackCount += 1;
          if (deer.axeAttackCount <= 2) {
            playSound(AXE_MISS_SOUND, 0.7);
            makeDeerEvade(deer);
            return;
          }

          playSound(HIT_SOUND, 0.5);
          deer.health = Math.max(0, deer.health - AXE_DAMAGE);
          if (deer.health <= 0) beginDeerDeath(deer);
          return;
        }

        if (weapon === "handgun") {
          consumeAmmo("handgun");
          playSound(HANDGUN_SOUND);
          if (Math.random() < HANDGUN_MISS_CHANCE) {
            makeDeerEvade(deer);
            return;
          }

          const isCritical = Math.random() < HANDGUN_CRITICAL_CHANCE;
          const damage = isCritical ? HANDGUN_DAMAGE * 2 : HANDGUN_DAMAGE;
          deer.health = Math.max(0, deer.health - damage);
          if (deer.health <= 0) {
            recordDifferentWeaponKill(weapon);
            if (isCritical) setTodoProgress(4, "item1", true);
            beginDeerDeath(deer);
          }
          return;
        }

        if (weapon === "rifle") {
          consumeAmmo("rifle");
          playSound(RIFLE_FIRE_SOUND);
          recordDifferentWeaponKill(weapon);
          setTodoProgress(4, "item1", true);
          deer.health = 0;
          beginDeerDeath(deer);
        }
      }

      function updateDeerBirthing(deer, now) {
        const elapsed = now - deer.birthStartedAt;

        // 생성 프레임은 1 → 2 → 3 순서로 크로스페이드 없이 전환하고,
        // 이후 기본 대기 프레임 13으로 전환합니다.
        const firstFrameEnd =
          DEER_BIRTH_FRAME_FADE_MS + DEER_BIRTH_FRAME_ONE_HOLD_MS;
        const secondFrameEnd =
          firstFrameEnd + DEER_BIRTH_FRAME_TWO_MS;
        const thirdFrameEnd =
          secondFrameEnd + DEER_BIRTH_FRAME_THREE_MS;

        deer.element.style.opacity = String(
          clamp(elapsed / DEER_BIRTH_FRAME_FADE_MS, 0, 1)
        );

        if (elapsed < firstFrameEnd) {
          showSingleDeerFrame(deer, DEER_BIRTH_FRAME_SEQUENCE[0]);
          renderDeer(deer);
          return;
        }

        if (elapsed < secondFrameEnd) {
          showSingleDeerFrame(deer, DEER_BIRTH_FRAME_SEQUENCE[1]);
          renderDeer(deer);
          return;
        }

        if (elapsed < thirdFrameEnd) {
          showSingleDeerFrame(deer, DEER_BIRTH_FRAME_SEQUENCE[2]);
          renderDeer(deer);
          return;
        }

        deer.state = "idle";
        deer.element.style.opacity = "1";
        deer.idleAnimation = null;
        scheduleNextDeerIdleAnimation(deer, now);
        showSingleDeerFrame(deer, DEER_IDLE_FRAME);
        renderDeer(deer);
      }

      function updateDeerIdle(deer, now) {
        if (!deer.idleAnimation && now >= deer.nextIdleAnimationAt) {
          startRandomDeerIdleAnimation(deer, now);
        }

        updateActiveDeerIdleAnimation(deer, now);
        deer.element.style.opacity = "1";
        renderDeer(deer);
      }

      function updateDeerTurning(deer, deltaMs) {
        const elapsed = performance.now() - deer.turnStartedAt;
        const slowProgress = clamp(elapsed / DEER_TURN_SLOWDOWN_MS, 0, 1);
        const speedFactor = 1 - slowProgress;

        deer.x +=
          deer.turnDirection *
          DEER_EVADE_SPEED_PX_PER_MS *
          deltaMs *
          speedFactor;

        const frameOneEnd = DEER_TURN_FRAME_ONE_MS;
        const frameTwoEnd = frameOneEnd + DEER_TURN_FRAME_TWO_MS;
        const turnEnd = frameTwoEnd + DEER_TURN_FRAME_THREE_MS;

        if (elapsed < frameOneEnd) {
          showSingleDeerFrame(deer, DEER_TURN_FRAME_SEQUENCE[0]);
          renderDeer(deer);
        } else if (elapsed < frameTwoEnd) {
          showSingleDeerFrame(deer, DEER_TURN_FRAME_SEQUENCE[1]);
          renderDeer(deer);
        } else if (elapsed < turnEnd) {
          showSingleDeerFrame(deer, DEER_TURN_FRAME_SEQUENCE[2]);
          renderDeer(deer);
        } else {
          beginDeerEvadeInDirection(deer, deer.turnNextDirection);
          showSingleDeerFrame(deer, DEER_RUN_INTRO_FRAME_START);
          renderDeer(deer);
          return;
        }

        if (isDeerOutsideVisibleArea(deer)) {
          removeDeer(deer);
        }
      }

      function updateDeerEvading(deer, deltaMs) {
        deer.x += deer.evadeDirection * DEER_EVADE_SPEED_PX_PER_MS * deltaMs;
        deer.runElapsed += deltaMs;

        const frameDuration = 1000 / DEER_RUN_FPS;
        if (deer.runElapsed >= frameDuration) {
          const advancedFrames = Math.floor(deer.runElapsed / frameDuration);
          deer.runElapsed %= frameDuration;
          deer.runFrame += advancedFrames;

          if (!deer.runIntroComplete &&
              deer.runFrame >= DEER_RUN_INTRO_FRAME_COUNT) {
            deer.runIntroComplete = true;
            deer.runFrame =
              (deer.runFrame - DEER_RUN_INTRO_FRAME_COUNT) %
              DEER_RUN_LOOP_FRAME_COUNT;
          } else if (deer.runIntroComplete) {
            deer.runFrame %= DEER_RUN_LOOP_FRAME_COUNT;
          }
        }

        const currentRunFrame = deer.runIntroComplete
          ? DEER_RUN_LOOP_FRAME_START + deer.runFrame
          : DEER_RUN_INTRO_FRAME_START + deer.runFrame;

        showSingleDeerFrame(deer, currentRunFrame);
        renderDeer(deer);

        if (isDeerOutsideVisibleArea(deer)) {
          removeDeer(deer);
        }
      }

      function updateDeerDying(deer, now) {
        const elapsed = now - deer.deathStartedAt;
        const frameOneEnd = DEER_DEATH_FRAME_ONE_MS;
        const frameTwoEnd = frameOneEnd + DEER_DEATH_FRAME_TWO_MS;
        const frameThreeHoldEnd =
          frameTwoEnd + DEER_DEATH_FRAME_THREE_HOLD_MS;
        const transitionOneEnd =
          frameThreeHoldEnd + DEER_DEATH_TRANSITION_ONE_MS;
        const frameFourHoldEnd =
          transitionOneEnd + DEER_DEATH_FRAME_FOUR_HOLD_MS;
        const transitionTwoEnd =
          frameFourHoldEnd + DEER_DEATH_TRANSITION_TWO_MS;
        const frameFiveHoldEnd =
          transitionTwoEnd + DEER_DEATH_FRAME_FIVE_HOLD_MS;
        const fadeEnd = frameFiveHoldEnd + DEER_DEATH_FADE_MS;
        const slideProgress = easeOutSine(elapsed / DEER_DEATH_SLIDE_MS);

        deer.x =
          deer.deathStartX +
          deer.deathSlideDirection *
            DEER_DEATH_SLIDE_DISTANCE_PX * slideProgress;

        deer.element.style.opacity = "1";

        if (elapsed < frameOneEnd) {
          showSingleDeerFrame(deer, DEER_DEATH_FRAME_SEQUENCE[0]);
          renderDeer(deer);
          return;
        }

        if (elapsed < frameTwoEnd) {
          showSingleDeerFrame(deer, DEER_DEATH_FRAME_SEQUENCE[1]);
          renderDeer(deer);
          return;
        }

        if (elapsed < frameThreeHoldEnd) {
          showSingleDeerFrame(deer, DEER_DEATH_FRAME_SEQUENCE[2]);
          renderDeer(deer);
          return;
        }

        if (elapsed < transitionOneEnd) {
          const progress =
            (elapsed - frameThreeHoldEnd) /
            DEER_DEATH_TRANSITION_ONE_MS;
          showDeerCrossfade(
            deer,
            DEER_DEATH_FRAME_SEQUENCE[2],
            DEER_DEATH_FRAME_SEQUENCE[3],
            progress
          );
          renderDeer(deer);
          return;
        }

        if (elapsed < frameFourHoldEnd) {
          showSingleDeerFrame(deer, DEER_DEATH_FRAME_SEQUENCE[3]);
          renderDeer(deer);
          return;
        }

        if (elapsed < transitionTwoEnd) {
          const progress =
            (elapsed - frameFourHoldEnd) /
            DEER_DEATH_TRANSITION_TWO_MS;
          showDeerCrossfade(
            deer,
            DEER_DEATH_FRAME_SEQUENCE[3],
            DEER_DEATH_FRAME_SEQUENCE[4],
            progress
          );
          renderDeer(deer);
          return;
        }

        if (elapsed < frameFiveHoldEnd) {
          showSingleDeerFrame(deer, DEER_DEATH_FRAME_SEQUENCE[4]);
          renderDeer(deer);
          return;
        }

        if (elapsed < fadeEnd) {
          const fadeProgress =
            (elapsed - frameFiveHoldEnd) /
            DEER_DEATH_FADE_MS;
          showSingleDeerFrame(deer, DEER_DEATH_FRAME_SEQUENCE[4]);
          deer.element.style.opacity = String(Math.max(0, 1 - fadeProgress));
          renderDeer(deer);
          return;
        }

        removeDeer(deer);
      }

      function createZombie(options = {}) {
        // 처치 수와 살아 있는 좀비 수의 합이 최대값을 넘지 않게 합니다.
        const force = options.force === true;
        if (force) {
          if (
            !hasActivePopulationCapacity() ||
            zombieCount + getLivingZombieCount() >= zombieKillRequirement
          ) {
            return false;
          }
        } else if (!canCreateZombie()) {
          return false;
        }

        const spawnZone = getSpawnZoneForNextEntity();
        const position = getRandomSpawnPosition({
          ...options,
          spawnZone
        });
        const direction = randomDirection();

        const element = document.createElement("div");
        element.className = "zombie";
        element.setAttribute("role", "button");
        element.setAttribute("aria-label", "Zombie");
        element.style.opacity = "0";

        const dayVisual = document.createElement("div");
        dayVisual.className = "zombie-visual-layer zombie-visual-day";

        const nightVisual = document.createElement("div");
        nightVisual.className = "zombie-visual-layer zombie-visual-night";

        const sprite = document.createElement("div");
        sprite.className = "zombie-sprite";
        sprite.style.backgroundImage =
          `url("${BIRTH_DEATH_SHEET}")`;

        const overlay = document.createElement("div");
        overlay.className = "zombie-sprite-overlay";

        const nightSprite = document.createElement("div");
        nightSprite.className = "zombie-sprite";
        nightSprite.style.backgroundImage =
          `url("${BIRTH_DEATH_SHEET}")`;

        const nightOverlay = document.createElement("div");
        nightOverlay.className = "zombie-sprite-overlay";

        dayVisual.appendChild(sprite);
        dayVisual.appendChild(overlay);
        nightVisual.appendChild(nightSprite);
        nightVisual.appendChild(nightOverlay);
        element.appendChild(dayVisual);
        element.appendChild(nightVisual);
        entities.appendChild(element);

        const skipBirth = options.skipBirth === true;
        const zombie = {
          id: nextZombieId++,
          element,
          sprite,
          overlay,
          nightSprite,
          nightOverlay,
          x: position.x,
          y: position.y,
          direction,
          facing: Math.random() < 0.5 ? -1 : 1,
          renderedFacingTransform: "",
          spriteRenderState: {
            mode: "",
            sheet: "",
            frameIndex: -1,
            crossfadeKey: "",
            fromOpacity: "",
            toOpacity: ""
          },
          health: ZOMBIE_MAX_HEALTH,
          state: skipBirth ? "walking" : "birthing",
          birthStartedAt: performance.now(),
          walkElapsed: 0,
          walkFrame: Math.floor(Math.random() * 8),
          hitReactionEnd: 0,
          hitReactionFrame: 0,
          deathStartFrame: randomDeathStartFrame(),
          deathStartedAt: 0,
          counted: false,
          fallSoundTimer: null,
          deathSheet: DEAD_SHEET,
          chainsawAttackStartedAt: 0,
          chainsawAttackFrame: -1,
          chainsawAttackStep: -1,
          movementZone: spawnZone
        };

        zombies.set(zombie.id, zombie);

        setFacing(zombie);

        if (skipBirth) {
          zombie.element.style.opacity = "1";
          showSingleFrame(zombie, WALK_SHEET, zombie.walkFrame);
        } else {
          showSingleFrame(zombie, BIRTH_DEATH_SHEET, 0);
        }

        renderZombie(zombie);
        if (!skipBirth && !options.silent) {
          playSound(BIRTH_SOUND, 0.5);
        }

        element.addEventListener("pointerdown", startFieldEntityPress);
        element.addEventListener("pointerup", activatePressedFieldEntity);

        if (options.persist !== false) {
          saveResourceState();
        }

        return true;
      }

      function getZombiePartFramePosition(frameIndex) {
        const normalized = clamp(Math.round(Number(frameIndex) || 0), 0, 7);
        const col = normalized % 4;
        const row = Math.floor(normalized / 4);
        return `${-col * ZOMBIE_PART_SIZE}px ${-row * ZOMBIE_PART_SIZE}px`;
      }

      function chooseUniqueRandomZombieParts(count) {
        const frames = Array.from({ length: 8 }, (_, index) => index);
        for (let index = frames.length - 1; index > 0; index -= 1) {
          const swapIndex = Math.floor(Math.random() * (index + 1));
          [frames[index], frames[swapIndex]] = [frames[swapIndex], frames[index]];
        }
        return frames.slice(0, clamp(count, 0, frames.length));
      }

      function spawnZombieFallingPart(options = {}) {
        if (!zombiePartLayer || !zombiePartShadowLayer) return;

        const frameIndex = clamp(Math.round(Number(options.frameIndex) || 0), 0, 7);
        const startX = Number(options.startX) || 0;
        const startY = Number(options.startY) || 0;
        const directionX = Number.isFinite(Number(options.directionX)) ? Number(options.directionX) : 1;
        const directionY = Number.isFinite(Number(options.directionY)) ? Number(options.directionY) : 0;
        const distance = Number(options.distance) || randomBetween(
          ZOMBIE_PART_FLIGHT_DISTANCE_MIN,
          ZOMBIE_PART_FLIGHT_DISTANCE_MAX
        );
        const arcHeight = Number(options.arcHeight) || randomBetween(
          ZOMBIE_PART_ARC_MIN,
          ZOMBIE_PART_ARC_MAX
        );
        const flightDuration = Number(options.flightDuration) || randomBetween(
          ZOMBIE_PART_FLIGHT_MS_MIN,
          ZOMBIE_PART_FLIGHT_MS_MAX
        );
        const bounceHeight = Number(options.bounceHeight) || randomBetween(
          ZOMBIE_PART_BOUNCE_HEIGHT_MIN,
          ZOMBIE_PART_BOUNCE_HEIGHT_MAX
        );
        const rotationDirection = Math.random() < 0.5 ? -1 : 1;
        const totalRotation = rotationDirection * randomBetween(420, 900);
        const sharedFallSoundState = options.sharedFallSoundState || { played: false };

        const shadow = document.createElement("div");
        shadow.className = "zombie-falling-part-shadow";
        shadow.style.width = `${ZOMBIE_PART_SHADOW_WIDTH}px`;
        shadow.style.height = `${ZOMBIE_PART_SHADOW_HEIGHT}px`;

        const part = document.createElement("div");
        part.className = "zombie-falling-part";
        part.style.left = `${startX}px`;
        part.style.top = `${startY}px`;

        const image = document.createElement("div");
        image.className = "zombie-falling-part-image";
        image.style.backgroundImage = `url("${ZOMBIE_PARTS_SHEET}")`;
        image.style.backgroundPosition = getZombiePartFramePosition(frameIndex);
        part.appendChild(image);

        const horizontalDistance = directionX * distance;
        const verticalDistance = directionY * distance * 0.45 + randomBetween(28, 64);
        const landingX = startX + horizontalDistance;
        const landingY = startY + verticalDistance;
        shadow.style.left = `${landingX + ZOMBIE_PART_SHADOW_OFFSET_X}px`;
        shadow.style.top = `${landingY + ZOMBIE_PART_SHADOW_OFFSET_Y}px`;
        shadow.style.opacity = "0";

        zombiePartShadowLayer.appendChild(shadow);
        zombiePartLayer.appendChild(part);

        const startTime = performance.now();
        const flightEnd = startTime + flightDuration;
        const bounceEnd = flightEnd + ZOMBIE_PART_BOUNCE_MS;
        const holdEnd = bounceEnd + ZOMBIE_PART_HOLD_MS;
        const fadeEnd = holdEnd + ZOMBIE_PART_FADE_MS;

        const setPose = (x, y, rotation, opacity = 1, scale = 1) => {
          part.style.transform = `translate3d(${x}px, ${y}px, 0)`;
          part.style.opacity = String(opacity);
          image.style.transform = `rotate(${rotation}deg) scale(${scale})`;
        };

        const step = (now) => {
          if (!part.isConnected) return;

          if (now < flightEnd) {
            const progress = clamp((now - startTime) / flightDuration, 0, 1);
            const x = horizontalDistance * progress;
            const y = verticalDistance * progress - Math.sin(progress * Math.PI) * arcHeight;
            setPose(x, y, totalRotation * progress);
            requestAnimationFrame(step);
            return;
          }

          if (!sharedFallSoundState.played) {
            sharedFallSoundState.played = true;
            playFallSound();
          }
          shadow.style.opacity = String(ZOMBIE_PART_SHADOW_OPACITY);

          if (now < bounceEnd) {
            const progress = clamp((now - flightEnd) / ZOMBIE_PART_BOUNCE_MS, 0, 1);
            const bounceWave = Math.abs(Math.sin(progress * Math.PI * 2));
            const decayedBounce = bounceHeight * (1 - progress) * bounceWave;
            setPose(horizontalDistance, verticalDistance - decayedBounce, totalRotation + totalRotation * 0.2 * progress);
            requestAnimationFrame(step);
            return;
          }

          if (now < holdEnd) {
            setPose(horizontalDistance, verticalDistance, totalRotation * 1.2);
            requestAnimationFrame(step);
            return;
          }

          if (now < fadeEnd) {
            const progress = clamp((now - holdEnd) / ZOMBIE_PART_FADE_MS, 0, 1);
            const opacity = 1 - progress;
            shadow.style.opacity = String(ZOMBIE_PART_SHADOW_OPACITY * opacity);
            setPose(horizontalDistance, verticalDistance, totalRotation * 1.2, opacity, 1 - progress * 0.06);
            requestAnimationFrame(step);
            return;
          }

          shadow.remove();
          part.remove();
        };

        requestAnimationFrame(step);
      }

      function spawnZombieHeadPart(zombie) {
        const fallDirection = zombie.deathStartFrame < 4 ? 1 : -1;
        const offset = ZOMBIE_HEAD_START_OFFSET;
        spawnZombieFallingPart({
          frameIndex: 0,
          startX: zombie.x + offset.x - ZOMBIE_PART_SIZE / 2,
          startY: zombie.y + offset.y - ZOMBIE_PART_SIZE / 2,
          directionX: fallDirection,
          directionY: -0.12,
          distance: randomBetween(92, 138),
          arcHeight: randomBetween(72, 112),
          flightDuration: randomBetween(620, 820),
          bounceHeight: randomBetween(16, 28)
        });
      }

      function spawnShotgunZombieParts(zombie) {
        const sharedFallSoundState = { played: false };
        const selectedFrames = chooseUniqueRandomZombieParts(5);
        selectedFrames.forEach((frameIndex, index) => {
          const angle = (Math.PI * 2 * index) / selectedFrames.length + randomBetween(-0.45, 0.45);
          const offset = ZOMBIE_PART_START_OFFSETS[frameIndex] || { x: 0, y: 0 };
          spawnZombieFallingPart({
            frameIndex,
            startX: zombie.x + offset.x - ZOMBIE_PART_SIZE / 2,
            startY: zombie.y + offset.y - ZOMBIE_PART_SIZE / 2,
            directionX: Math.cos(angle),
            directionY: Math.sin(angle),
            distance: randomBetween(ZOMBIE_PART_FLIGHT_DISTANCE_MIN, ZOMBIE_PART_FLIGHT_DISTANCE_MAX),
            sharedFallSoundState
          });
        });
      }

      function recordDifferentWeaponKill(weapon) {
        if (weapon && weapon !== "axe") {
          setTodoProgress(3, "item2", true);
        }
      }

      function registerPlayerZombieKill(zombie) {
        if (zombie.counted) return;

        zombie.counted = true;
        recordDifferentWeaponKill(zombie.lastPlayerWeapon || getEquippedWeapon());
        awardMusicBox();
        const isFirstZombieKill = triggerFirstKillBirdFlock();
        if (isFirstZombieKill) {
          lastDeerSpawnAt = Date.now();
          createDeer({ preferVisible: true, forceVisibleWhenExpanded: true });
          scheduleNextDeerSpawnTick();
        }

        setTodoProgress(1, "item1", true);
        const previousZombieCount = zombieCount;
        zombieCount = Math.min(zombieKillRequirement, zombieCount + 1);
        commitResourceState();

        if (previousZombieCount < zombieKillRequirement && zombieCount >= zombieKillRequirement) {
          window.setTimeout(() => {
            if (!isExploring && zombieCount >= zombieKillRequirement) {
              showToast(FIELD_CLEAR_TOAST_MESSAGE);
            }
          }, FIELD_CLEAR_TOAST_DELAY_MS);
        }
      }

      function consumeAmmo(ammoType) {
        if (ammoType === "handgun") {
          if (handgunAmmoCount <= 0) return false;
          handgunAmmoCount -= 1;
        } else if (ammoType === "shotgun") {
          if (shotgunAmmoCount <= 0) return false;
          shotgunAmmoCount -= 1;
        } else if (ammoType === "rifle") {
          if (rifleAmmoCount <= 0) return false;
          rifleAmmoCount -= 1;
        } else {
          return false;
        }
        applyInventoryState();
        saveResourceState();
        return true;
      }

      function showNoAmmoFeedback() {
        playSound(NO_AMMO_SOUND);
        showToast(EMPTY_WEAPON_TOAST_MESSAGE);
      }

      function showChainsawNoPowerFeedback() {
        playSound(CHAINSAW_LOW_BATTERY_SOUND);
        showToast(CHAINSAW_NO_POWER_TOAST_MESSAGE);
      }

      function beginShotgunDeath(zombie) {
        if (zombie.state === "dying" || zombie.state === "removed") return;
        registerPlayerZombieKill(zombie);
        spawnShotgunZombieParts(zombie);
        zombie.state = "removed";
        zombie.element.remove();
        zombies.delete(zombie.id);
        saveResourceState();
        scheduleEmptyFieldZombieSpawn();
      }

      function beginChainsawAttackDeath(zombie) {
        if (zombie.state === "dying" || zombie.state === "removed" || zombie.state === "chainsawAttacking") return;
        zombie.state = "chainsawAttacking";
        zombie.element.classList.add("is-dead");
        zombie.chainsawAttackStartedAt = performance.now();
        zombie.chainsawAttackFrame = -1;
        zombie.chainsawAttackStep = -1;
        zombie.element.style.opacity = "1";
      }

      function updateChainsawAttackDeath(zombie, now) {
        const elapsed = now - zombie.chainsawAttackStartedAt;
        if (elapsed >= CHAINSAW_GLITCH_DURATION_MS) {
          beginDeath(zombie, true, { deathType: "normal" });
          return;
        }

        const step = Math.floor(elapsed / CHAINSAW_GLITCH_FRAME_MS);
        if (step !== zombie.chainsawAttackStep) {
          let nextFrame = Math.floor(Math.random() * 8);
          if (nextFrame === zombie.chainsawAttackFrame) {
            nextFrame = (nextFrame + 1 + Math.floor(Math.random() * 7)) % 8;
          }
          zombie.chainsawAttackStep = step;
          zombie.chainsawAttackFrame = nextFrame;
        }
        showSingleFrame(zombie, WALK_SHEET, Math.max(0, zombie.chainsawAttackFrame));
      }

      function attackZombie(zombie) {
        if (isExploring) {
          showExploringBusyToast();
          return;
        }

        if (
          zombie.state === "dying" ||
          zombie.state === "chainsawAttacking" ||
          zombie.state === "removed"
        ) {
          return;
        }

        const weapon = getEquippedWeapon();
        if (!weapon) {
          showToast(UNARMED_TOAST_MESSAGE);
          return;
        }

        if (weapon === "axe") {
          alertNearbyDeer(zombie);
          if (Math.random() < AXE_MISS_CHANCE) {
            playSound(AXE_MISS_SOUND, 0.7);
            return;
          }

          playSound(HIT_SOUND, 0.5);
          zombie.health = Math.max(0, zombie.health - AXE_DAMAGE);
          if (zombie.health <= 0) {
            zombie.lastPlayerWeapon = weapon;
            beginDeath(zombie, true, { deathType: "normal" });
            return;
          }

          zombie.state = "hit";
          zombie.deathStartFrame = randomDeathStartFrame();
          zombie.hitReactionFrame = zombie.deathStartFrame;
          zombie.hitReactionEnd = performance.now() + HIT_REACTION_MS;
          showSingleFrame(zombie, DEAD_SHEET, zombie.hitReactionFrame);
          return;
        }

        if (weapon === "handgun") {
          if (!consumeAmmo("handgun")) {
            showNoAmmoFeedback();
            return;
          }
          alertNearbyDeer(zombie);
          playSound(HANDGUN_SOUND);
          if (Math.random() < HANDGUN_MISS_CHANCE) return;

          const isCritical = Math.random() < HANDGUN_CRITICAL_CHANCE;
          const damage = isCritical ? HANDGUN_DAMAGE * 2 : HANDGUN_DAMAGE;
          zombie.health = Math.max(0, zombie.health - damage);
          if (zombie.health <= 0) {
            zombie.lastPlayerWeapon = weapon;
            if (isCritical) setTodoProgress(4, "item1", true);
            beginDeath(zombie, true, { deathType: isCritical ? "headshot" : "normal" });
            return;
          }

          zombie.state = "hit";
          zombie.deathStartFrame = randomDeathStartFrame();
          zombie.hitReactionFrame = zombie.deathStartFrame;
          zombie.hitReactionEnd = performance.now() + HIT_REACTION_MS;
          showSingleFrame(zombie, DEAD_SHEET, zombie.hitReactionFrame);
          saveResourceState();
          return;
        }

        if (weapon === "shotgun") {
          if (!consumeAmmo("shotgun")) {
            showNoAmmoFeedback();
            return;
          }
          alertNearbyDeer(zombie);
          playSound(SHOTGUN_FIRE_SOUND);
          zombie.lastPlayerWeapon = weapon;
          beginShotgunDeath(zombie);
          return;
        }

        if (weapon === "rifle") {
          if (!consumeAmmo("rifle")) {
            showNoAmmoFeedback();
            return;
          }
          alertNearbyDeer(zombie);
          playSound(RIFLE_FIRE_SOUND);
          zombie.lastPlayerWeapon = weapon;
          setTodoProgress(4, "item1", true);
          zombie.health = 0;
          beginDeath(zombie, true, { deathType: "headshot" });
          return;
        }

        if (weapon === "chainsaw") {
          if (chainsawBatteryPercent <= 0) {
            showChainsawNoPowerFeedback();
            handleChainsawBatteryDepleted();
            return;
          }
          alertNearbyDeer(zombie);
          playSound(CHAINSAW_ATTACK_SOUND);
          zombie.lastPlayerWeapon = weapon;
          zombie.health = 0;
          beginChainsawAttackDeath(zombie);
        }
      }

      function beginDeath(zombie, wasPlayerKill = false, options = {}) {
        if (zombie.state === "dying" || zombie.state === "removed") return;

        const deathType = options.deathType === "headshot" ? "headshot" : "normal";
        zombie.state = "dying";
        zombie.element.classList.add("is-dead");
        zombie.deathStartFrame = randomDeathStartFrame();
        zombie.deathStartedAt = performance.now();
        zombie.deathSheet = deathType === "headshot" ? DEAD_NO_HEAD_SHEET : DEAD_SHEET;
        playSound(DEATH_SOUND, 0.5);

        if (wasPlayerKill) {
          registerPlayerZombieKill(zombie);
        }

        zombie.element.style.opacity = "1";
        showSingleFrame(zombie, zombie.deathSheet, zombie.deathStartFrame);

        if (deathType === "headshot") {
          spawnZombieHeadPart(zombie);
        }

        zombie.fallSoundTimer = window.setTimeout(() => {
          playFallSound();
        }, 500);
      }

      function removeZombie(zombie, options = {}) {
        if (zombie.state === "removed") return;

        zombie.state = "removed";

        if (zombie.fallSoundTimer !== null) {
          clearTimeout(zombie.fallSoundTimer);
        }

        zombie.element.remove();
        zombies.delete(zombie.id);

        if (options.persist !== false) {
          saveResourceState();
        }
        if (options.scheduleReplacement !== false) {
          scheduleEmptyFieldZombieSpawn();
        }
      }

      function removeOneHiddenLivingZombie() {
        for (const zombie of zombies.values()) {
          if (
            zombie.state !== "dying" &&
            zombie.state !== "removed" &&
            !isZombieVisibleInCurrentViewport(zombie)
          ) {
            removeZombie(zombie, {
              persist: false,
              scheduleReplacement: false
            });
            return true;
          }
        }

        return false;
      }

      function resolveOuterBounds(zombie) {
        const movementZone = zombie.movementZone || GAME_ZONE;
        const minX = movementZone.left + HALF_W;
        const maxX = movementZone.right - HALF_W;
        const minY = movementZone.top + HALF_H;
        const maxY = movementZone.bottom - HALF_H;

        if (zombie.x < minX) {
          zombie.x = minX;
          zombie.direction.x = Math.abs(zombie.direction.x);
        } else if (zombie.x > maxX) {
          zombie.x = maxX;
          zombie.direction.x = -Math.abs(zombie.direction.x);
        }

        if (zombie.y < minY) {
          zombie.y = minY;
          zombie.direction.y = Math.abs(zombie.direction.y);
        } else if (zombie.y > maxY) {
          zombie.y = maxY;
          zombie.direction.y = -Math.abs(zombie.direction.y);
        }
      }

      function resolveSafeZoneFor(
        zombie,
        zone,
        previousX,
        previousY
      ) {
        if (
          !isInsideInflatedZoneFor(
            zone,
            zombie.x,
            zombie.y,
            HALF_W,
            HALF_H
          )
        ) {
          return false;
        }

        const left = zone.left - HALF_W;
        const right = zone.right + HALF_W;
        const top = zone.top - HALF_H;
        const bottom = zone.bottom + HALF_H;

        const enteredFromLeft = previousX <= left;
        const enteredFromRight = previousX >= right;
        const enteredFromTop = previousY <= top;
        const enteredFromBottom = previousY >= bottom;

        if (enteredFromLeft) {
          zombie.x = left;
          zombie.direction.x = -Math.abs(zombie.direction.x);
        } else if (enteredFromRight) {
          zombie.x = right;
          zombie.direction.x = Math.abs(zombie.direction.x);
        } else if (enteredFromTop) {
          zombie.y = top;
          zombie.direction.y = -Math.abs(zombie.direction.y);
        } else if (enteredFromBottom) {
          zombie.y = bottom;
          zombie.direction.y = Math.abs(zombie.direction.y);
        } else {
          // 모서리 진입 등 예외 상황에서는 가장 가까운 경계로 밀어냅니다.
          const distances = [
            { side: "left", value: Math.abs(zombie.x - left) },
            { side: "right", value: Math.abs(right - zombie.x) },
            { side: "top", value: Math.abs(zombie.y - top) },
            { side: "bottom", value: Math.abs(bottom - zombie.y) }
          ].sort((a, b) => a.value - b.value);

          switch (distances[0].side) {
            case "left":
              zombie.x = left;
              zombie.direction.x = -Math.abs(zombie.direction.x);
              break;
            case "right":
              zombie.x = right;
              zombie.direction.x = Math.abs(zombie.direction.x);
              break;
            case "top":
              zombie.y = top;
              zombie.direction.y = -Math.abs(zombie.direction.y);
              break;
            default:
              zombie.y = bottom;
              zombie.direction.y = Math.abs(zombie.direction.y);
          }
        }

        return true;
      }

      function resolveSafeZones(zombie, previousX, previousY) {
        const safeZones = getZombieSafeZones();
        const previousWasSafe = !safeZones.some((zone) =>
          isInsideInflatedZoneFor(
            zone,
            previousX,
            previousY,
            HALF_W,
            HALF_H
          )
        );
        const attemptedX = zombie.x;
        const attemptedY = zombie.y;

        // 중앙과 자동차 안전 구역처럼 확장 판정이 일부 겹치는 경우에도
        // 어느 안전 구역 안에도 남지 않도록 여러 번 확인합니다.
        for (let pass = 0; pass <= safeZones.length; pass += 1) {
          let resolved = false;

          for (const zone of safeZones) {
            if (
              resolveSafeZoneFor(
                zombie,
                zone,
                previousX,
                previousY
              )
            ) {
              resolved = true;
            }
          }

          if (!resolved) return;
        }

        const stillInsideSafeZone = safeZones.some((zone) =>
          isInsideInflatedZoneFor(
            zone,
            zombie.x,
            zombie.y,
            HALF_W,
            HALF_H
          )
        );

        // 겹친 경계의 드문 예외에서는 진입 전 위치로 되돌려
        // 안전 구역 안에 머무르는 상황을 확실히 방지합니다.
        if (stillInsideSafeZone && previousWasSafe) {
          zombie.x = previousX;
          zombie.y = previousY;

          const movedX = attemptedX - previousX;
          const movedY = attemptedY - previousY;

          if (Math.abs(movedX) >= Math.abs(movedY)) {
            zombie.direction.x = movedX >= 0
              ? -Math.abs(zombie.direction.x)
              : Math.abs(zombie.direction.x);
          } else {
            zombie.direction.y = movedY >= 0
              ? -Math.abs(zombie.direction.y)
              : Math.abs(zombie.direction.y);
          }

          return;
        }

        // 수정 전에 이미 구조물과 겹쳐 있던 좀비도 다음 이동 프레임에
        // 모든 안전 구역 밖의 가장 가까운 경계점으로 밀어냅니다.
        if (stillInsideSafeZone) {
          const movementZone = zombie.movementZone || GAME_ZONE;
          const minX = movementZone.left + HALF_W;
          const maxX = movementZone.right - HALF_W;
          const minY = movementZone.top + HALF_H;
          const maxY = movementZone.bottom - HALF_H;
          const xCandidates = [zombie.x];
          const yCandidates = [zombie.y];

          for (const zone of safeZones) {
            xCandidates.push(
              zone.left - HALF_W,
              zone.right + HALF_W
            );
            yCandidates.push(
              zone.top - HALF_H,
              zone.bottom + HALF_H
            );
          }

          let nearestCandidate = null;
          let nearestDistance = Infinity;

          for (const candidateX of xCandidates) {
            for (const candidateY of yCandidates) {
              if (
                candidateX < minX ||
                candidateX > maxX ||
                candidateY < minY ||
                candidateY > maxY
              ) {
                continue;
              }

              const candidateIsBlocked = safeZones.some((zone) =>
                isInsideInflatedZoneFor(
                  zone,
                  candidateX,
                  candidateY,
                  HALF_W,
                  HALF_H
                )
              );

              if (candidateIsBlocked) continue;

              const distance = Math.hypot(
                candidateX - zombie.x,
                candidateY - zombie.y
              );

              if (distance < nearestDistance) {
                nearestDistance = distance;
                nearestCandidate = {
                  x: candidateX,
                  y: candidateY
                };
              }
            }
          }

          if (nearestCandidate) {
            const pushedX = nearestCandidate.x - zombie.x;
            const pushedY = nearestCandidate.y - zombie.y;
            zombie.x = nearestCandidate.x;
            zombie.y = nearestCandidate.y;

            if (Math.abs(pushedX) >= Math.abs(pushedY)) {
              zombie.direction.x = pushedX >= 0
                ? Math.abs(zombie.direction.x)
                : -Math.abs(zombie.direction.x);
            } else {
              zombie.direction.y = pushedY >= 0
                ? Math.abs(zombie.direction.y)
                : -Math.abs(zombie.direction.y);
            }
          }
        }
      }

      function updateBirthing(zombie, now) {
        const elapsed = now - zombie.birthStartedAt;

        // 1번 프레임의 처음 1초 동안 좀비와 그림자를 함께 페이드인합니다.
        zombie.element.style.opacity = String(
          clamp(elapsed / BIRTH_FADE_IN_MS, 0, 1)
        );

        let phaseStart = 0;

        for (
          let index = 0;
          index < BIRTH_FRAME_DURATIONS_MS.length;
          index += 1
        ) {
          const holdEnd =
            phaseStart + BIRTH_FRAME_DURATIONS_MS[index];

          if (elapsed < holdEnd) {
            showSingleFrame(
              zombie,
              BIRTH_DEATH_SHEET,
              index
            );
            return;
          }

          phaseStart = holdEnd;
        }

        // 마지막 생성 프레임에서 걷기 프레임으로도 즉시 전환합니다.
        zombie.state = "walking";
        zombie.walkElapsed = 0;
        zombie.element.style.opacity = "1";
        showSingleFrame(
          zombie,
          WALK_SHEET,
          zombie.walkFrame
        );
      }

      function updateWalking(zombie, deltaMs, now) {
        if (zombie.state === "hit") {
          if (now >= zombie.hitReactionEnd) {
            zombie.state = "walking";
          } else {
            showSingleFrame(
              zombie,
              DEAD_SHEET,
              zombie.hitReactionFrame
            );
            return;
          }
        }

        const previousX = zombie.x;
        const previousY = zombie.y;

        zombie.x += zombie.direction.x * MOVE_SPEED_PX_PER_MS * deltaMs;
        zombie.y += zombie.direction.y * MOVE_SPEED_PX_PER_MS * deltaMs;

        resolveOuterBounds(zombie);
        resolveSafeZones(zombie, previousX, previousY);
        setFacing(zombie);

        zombie.walkElapsed += deltaMs;
        const frameDuration = 1000 / WALK_FPS;

        if (zombie.walkElapsed >= frameDuration) {
          const advancedFrames = Math.floor(zombie.walkElapsed / frameDuration);
          zombie.walkElapsed %= frameDuration;
          zombie.walkFrame = (zombie.walkFrame + advancedFrames) % 8;
        }

        showSingleFrame(
          zombie,
          WALK_SHEET,
          zombie.walkFrame
        );

        renderZombie(zombie);
      }

      function updateDying(zombie, now) {
        const elapsed = now - zombie.deathStartedAt;
        const deathSheet = zombie.deathSheet || DEAD_SHEET;
        const deathFrameDuration = 1000 / DEATH_FPS;
        const deathAnimationEnd = 4 * deathFrameDuration;
        const lastDeathFrameHoldEnd =
          deathAnimationEnd + DEATH_LAST_FRAME_HOLD_MS;
        const transitionOneEnd =
          lastDeathFrameHoldEnd + DEATH_TRANSITION_MS;
        const extraFrameOneHoldEnd =
          transitionOneEnd + DEATH_EXTRA_FRAME_MS;
        const transitionTwoEnd =
          extraFrameOneHoldEnd + DEATH_TRANSITION_MS;
        const extraFrameTwoHoldEnd =
          transitionTwoEnd + DEATH_EXTRA_FRAME_MS;
        const fadeEnd =
          extraFrameTwoHoldEnd + FADE_DURATION_MS;

        const isBackwardDeath = zombie.deathStartFrame === 0;
        const deadLastFrame = zombie.deathStartFrame + 3;
        const usesNoHeadDeathFrames = deathSheet === DEAD_NO_HEAD_SHEET;
        const extraSheet = usesNoHeadDeathFrames
          ? DEATH_NO_HEAD_SHEET
          : BIRTH_DEATH_SHEET;
        // 기존 birthdeath 5~8번과 같은 방향 순서를 새 시트 1~4번에 대응합니다.
        const extraFrameOne = usesNoHeadDeathFrames
          ? (isBackwardDeath ? 0 : 2)
          : (isBackwardDeath ? 4 : 6);
        const extraFrameTwo = extraFrameOne + 1;

        zombie.element.style.opacity = "1";

        if (elapsed < deathAnimationEnd) {
          const localFrame = Math.min(
            3,
            Math.floor(elapsed / deathFrameDuration)
          );

          showSingleFrame(
            zombie,
            deathSheet,
            zombie.deathStartFrame + localFrame
          );
          return;
        }

        if (elapsed < lastDeathFrameHoldEnd) {
          showSingleFrame(
            zombie,
            deathSheet,
            deadLastFrame
          );
          return;
        }

        if (elapsed < transitionOneEnd) {
          const progress =
            (elapsed - lastDeathFrameHoldEnd) /
            DEATH_TRANSITION_MS;

          showCrossfade(
            zombie,
            deathSheet,
            deadLastFrame,
            extraSheet,
            extraFrameOne,
            progress
          );
          return;
        }

        if (elapsed < extraFrameOneHoldEnd) {
          showSingleFrame(
            zombie,
            extraSheet,
            extraFrameOne
          );
          return;
        }

        if (elapsed < transitionTwoEnd) {
          const progress =
            (elapsed - extraFrameOneHoldEnd) /
            DEATH_TRANSITION_MS;

          showCrossfade(
            zombie,
            extraSheet,
            extraFrameOne,
            extraSheet,
            extraFrameTwo,
            progress
          );
          return;
        }

        if (elapsed < extraFrameTwoHoldEnd) {
          showSingleFrame(
            zombie,
            extraSheet,
            extraFrameTwo
          );
          return;
        }

        if (elapsed < fadeEnd) {
          const fadeProgress =
            (elapsed - extraFrameTwoHoldEnd) /
            FADE_DURATION_MS;

          showSingleFrame(
            zombie,
            extraSheet,
            extraFrameTwo
          );

          // 전체 요소의 투명도를 낮춰 그림자도 함께 사라지게 합니다.
          zombie.element.style.opacity =
            String(Math.max(0, 1 - fadeProgress));
          return;
        }

        removeZombie(zombie);
      }

      function gameLoop(now) {
        const deltaMs = Math.min(100, now - lastFrameTime);
        lastFrameTime = now;

        for (const zombie of zombies.values()) {
          if (zombie.state === "birthing") {
            updateBirthing(zombie, now);
          } else if (
            zombie.state === "walking" ||
            zombie.state === "hit"
          ) {
            updateWalking(zombie, deltaMs, now);
          } else if (zombie.state === "chainsawAttacking") {
            updateChainsawAttackDeath(zombie, now);
          } else if (zombie.state === "dying") {
            updateDying(zombie, now);
          }
        }

        for (const deer of deerMap.values()) {
          if (deer.state === "birthing") {
            updateDeerBirthing(deer, now);
          } else if (deer.state === "idle") {
            updateDeerIdle(deer, now);
          } else if (deer.state === "turning") {
            updateDeerTurning(deer, deltaMs);
          } else if (
            deer.state === "evading" ||
            deer.state === "leaving"
          ) {
            updateDeerEvading(deer, deltaMs);
          } else if (deer.state === "dying") {
            updateDeerDying(deer, now);
          }
        }

        if (dog) {
          updateDog(dog, deltaMs, now);
        }

        if (
          now - lastZombieVisibilityCheckAt >=
          ZOMBIE_VISIBILITY_CHECK_INTERVAL_MS
        ) {
          lastZombieVisibilityCheckAt = now;
          scheduleEmptyFieldZombieSpawn();
        }

        updateCloudGroup("sky", deltaMs, now);
        updateCloudGroup("shadow", deltaMs, now);
        updateBirds(now);

        requestAnimationFrame(gameLoop);
      }

      function scheduleNextZombieSpawnTick() {
        if (zombieSpawnTimerId !== null) {
          clearTimeout(zombieSpawnTimerId);
          zombieSpawnTimerId = null;
        }

        if (
          populationTimersPausedForBackground ||
          document.visibilityState === "hidden"
        ) {
          return;
        }

        const elapsed = Math.max(0, Date.now() - lastZombieSpawnAt);
        const delay = Math.max(0, SPAWN_INTERVAL_MS - elapsed);

        zombieSpawnTimerId = window.setTimeout(() => {
          zombieSpawnTimerId = null;

          // iOS Safari가 복귀 과정에서 대기 중이던 타이머를 먼저 실행해도
          // 경과 시간을 소비하지 않도록 백그라운드 상태에서는 즉시 중단합니다.
          if (
            populationTimersPausedForBackground ||
            document.visibilityState === "hidden"
          ) {
            return;
          }

          lastZombieSpawnAt = Date.now();

          if (canCreateZombie()) {
            const created = createZombie({ preferVisible: true });
            if (created && pendingEmptyZombieSpawnTimerId !== null) {
              clearTimeout(pendingEmptyZombieSpawnTimerId);
              pendingEmptyZombieSpawnTimerId = null;
            }
          } else {
            saveResourceState();
            scheduleEmptyFieldZombieSpawn();
          }

          scheduleNextZombieSpawnTick();
        }, delay);
      }

      function scheduleNextDeerSpawnTick() {
        if (deerSpawnTimerId !== null) {
          clearTimeout(deerSpawnTimerId);
          deerSpawnTimerId = null;
        }

        if (
          populationTimersPausedForBackground ||
          document.visibilityState === "hidden"
        ) {
          return;
        }

        const elapsed = Math.max(0, Date.now() - lastDeerSpawnAt);
        const delay = Math.max(0, DEER_SPAWN_INTERVAL_MS - elapsed);

        deerSpawnTimerId = window.setTimeout(() => {
          deerSpawnTimerId = null;

          if (
            populationTimersPausedForBackground ||
            document.visibilityState === "hidden"
          ) {
            return;
          }

          lastDeerSpawnAt = Date.now();

          if (
            firstKillBirdFlockPlayed &&
            !isExploring &&
            getLivingDeerCount() < MAX_ACTIVE_DEER &&
            hasActivePopulationCapacity() &&
            foodCount < getMaxFoodCount()
          ) {
            createDeer({ preferVisible: true });
          } else {
            saveResourceState();
          }

          scheduleNextDeerSpawnTick();
        }, delay);
      }

      function pausePopulationTimersForBackground() {
        if (!hasGameInitialized) return;

        populationTimersPausedForBackground = true;

        if (zombieSpawnTimerId !== null) {
          clearTimeout(zombieSpawnTimerId);
          zombieSpawnTimerId = null;
        }
        if (deerSpawnTimerId !== null) {
          clearTimeout(deerSpawnTimerId);
          deerSpawnTimerId = null;
        }
        if (pendingEmptyZombieSpawnTimerId !== null) {
          clearTimeout(pendingEmptyZombieSpawnTimerId);
          pendingEmptyZombieSpawnTimerId = null;
        }
        if (pendingEmptyDeerSpawnTimerId !== null) {
          clearTimeout(pendingEmptyDeerSpawnTimerId);
          pendingEmptyDeerSpawnTimerId = null;
        }

        saveResourceState();
      }

      /*
        iOS에서 화면 잠금이나 백그라운드 전환으로 타이머가 멈춘 경우,
        다시 화면이 활성화될 때 집에 머문 경과 시간만큼 누락된 좀비와 사슴 생성을 보정합니다.
        탐험 중 경과 시간은 필드 엔티티 생성 시간에 포함하지 않습니다.
      */
      function refreshPopulationAfterResume() {
        if (!hasGameInitialized || document.visibilityState === "hidden") {
          return;
        }

        const now = Date.now();
        const wasPausedForBackground =
          populationTimersPausedForBackground;
        populationTimersPausedForBackground = false;

        // pageshow, visibilitychange, focus가 연달아 들어오는 iOS Safari에서
        // 실제 백그라운드 복귀가 아닌 중복 이벤트만 짧게 무시합니다.
        if (
          !wasPausedForBackground &&
          now - lastPopulationResumeRefreshAt < 250
        ) {
          return;
        }
        lastPopulationResumeRefreshAt = now;

        if (isExploring) {
          // 탐험 완료 시각이 지났다면 일반 카운트다운과 동일하게 귀환 처리합니다.
          updateExploringCountdown();

          if (!isExploring) {
            // 귀환 직후에는 기존 7초 생성 지연 규칙을 그대로 사용합니다.
            scheduleNextZombieSpawnTick();
            scheduleNextDeerSpawnTick();
            scheduleEmptyFieldZombieSpawn();
            scheduleEmptyFieldDeerSpawn();
            saveResourceState();
            return;
          }

          // 아직 탐험 중이라면 백그라운드에 있던 시간을 생성 주기에서 제외합니다.
          lastZombieSpawnAt = now;
          lastDeerSpawnAt = now;
          scheduleNextZombieSpawnTick();
          scheduleNextDeerSpawnTick();
          saveResourceState();
          return;
        }

        const zombieSpawnEligibleAt = Math.max(
          lastZombieSpawnAt,
          zombieSpawnBlockedUntil
        );
        const elapsedZombieTicks = Math.max(
          0,
          Math.floor(
            (now - zombieSpawnEligibleAt) / SPAWN_INTERVAL_MS
          )
        );

        let createdZombieCount = 0;
        for (let index = 0; index < elapsedZombieTicks; index += 1) {
          if (!canCreateZombie()) break;

          const created = createZombie({
            silent: true,
            persist: false,
            skipBirth: true,
            preferVisible: true
          });
          if (!created) break;
          createdZombieCount += 1;
        }

        if (elapsedZombieTicks > 0) {
          // 생성 한도에 막혀도 지난 주기는 소비해 복귀 직후 중복 생성되지 않게 합니다.
          lastZombieSpawnAt = Math.min(
            now,
            zombieSpawnEligibleAt +
              elapsedZombieTicks * SPAWN_INTERVAL_MS
          );
        }

        if (
          createdZombieCount > 0 &&
          pendingEmptyZombieSpawnTimerId !== null
        ) {
          clearTimeout(pendingEmptyZombieSpawnTimerId);
          pendingEmptyZombieSpawnTimerId = null;
        }

        const elapsedDeerTicks = firstKillBirdFlockPlayed
          ? Math.max(
              0,
              Math.floor(
                (now - lastDeerSpawnAt) / DEER_SPAWN_INTERVAL_MS
              )
            )
          : 0;

        let createdDeerCount = 0;
        for (let index = 0; index < elapsedDeerTicks; index += 1) {
          if (
            !firstKillBirdFlockPlayed ||
            getLivingDeerCount() >= MAX_ACTIVE_DEER ||
            !hasActivePopulationCapacity() ||
            foodCount >= getMaxFoodCount()
          ) {
            break;
          }

          const created = createDeer({
            persist: false,
            skipBirth: true,
            preferVisible: true
          });
          if (!created) break;
          createdDeerCount += 1;
        }

        if (elapsedDeerTicks > 0) {
          // 생성 한도나 Food 최대치에 막혀도 지난 주기는 소비해 중복 보정을 막습니다.
          lastDeerSpawnAt = Math.min(
            now,
            lastDeerSpawnAt +
              elapsedDeerTicks * DEER_SPAWN_INTERVAL_MS
          );
        }

        if (
          createdDeerCount > 0 &&
          pendingEmptyDeerSpawnTimerId !== null
        ) {
          clearTimeout(pendingEmptyDeerSpawnTimerId);
          pendingEmptyDeerSpawnTimerId = null;
        }

        // 정지되었던 기존 타이머를 현재 타임스탬프 기준으로 다시 예약합니다.
        scheduleNextZombieSpawnTick();
        scheduleNextDeerSpawnTick();
        scheduleEmptyFieldZombieSpawn();
        scheduleEmptyFieldDeerSpawn();
        saveResourceState();
      }

      function handleStructureInteraction(event, message, sound = "") {
        if (event) {
          event.preventDefault();
        }

        if (isExploring || document.body.classList.contains("is-night")) {
          return;
        }

        showToast(message);
        if (sound) {
          playStructureSound(sound);
        }
      }

      function handleStructureKeydown(event, message, sound = "") {
        if (event.key !== "Enter" && event.key !== " ") return;
        handleStructureInteraction(event, message, sound);
      }


      function getRemainingUntilRegularZombieSpawn() {
        const elapsed = Math.max(0, Date.now() - lastZombieSpawnAt);
        return Math.max(0, SPAWN_INTERVAL_MS - elapsed);
      }

      function scheduleEmptyFieldZombieSpawn() {
        if (
          populationTimersPausedForBackground ||
          document.visibilityState === "hidden"
        ) {
          if (pendingEmptyZombieSpawnTimerId !== null) {
            clearTimeout(pendingEmptyZombieSpawnTimerId);
            pendingEmptyZombieSpawnTimerId = null;
          }
          return;
        }

        const cannotShowZombie =
          isExploring ||
          Date.now() < zombieSpawnBlockedUntil ||
          zombieCount >= zombieKillRequirement;

        if (getVisibleLivingZombieCount() > 0 || cannotShowZombie) {
          if (pendingEmptyZombieSpawnTimerId !== null) {
            clearTimeout(pendingEmptyZombieSpawnTimerId);
            pendingEmptyZombieSpawnTimerId = null;
          }
          return;
        }

        // 이미 보충 생성이 예약되어 있다면 주기적인 화면 검사로 타이머를 밀지 않습니다.
        if (pendingEmptyZombieSpawnTimerId !== null) return;

        const delay = EMPTY_ZOMBIE_SPAWN_MIN_DELAY_MS +
          Math.random() *
            (EMPTY_ZOMBIE_SPAWN_MAX_DELAY_MS -
              EMPTY_ZOMBIE_SPAWN_MIN_DELAY_MS);
        const regularSpawnRemaining = getRemainingUntilRegularZombieSpawn();

        // 정규 생성이 실제로 가능한 경우에만 5초 중복 방지 규칙을 적용합니다.
        // 화면 밖 좀비 때문에 최대 필요 수에 도달한 경우에는 숨은 개체를 교체해야 합니다.
        if (
          canCreateZombie() &&
          regularSpawnRemaining <=
            delay + EMPTY_ZOMBIE_REGULAR_SPAWN_GUARD_MS
        ) {
          return;
        }

        pendingEmptyZombieSpawnTimerId = window.setTimeout(() => {
          pendingEmptyZombieSpawnTimerId = null;

          if (
            populationTimersPausedForBackground ||
            document.visibilityState === "hidden"
          ) {
            return;
          }

          if (
            isExploring ||
            Date.now() < zombieSpawnBlockedUntil ||
            zombieCount >= zombieKillRequirement ||
            getVisibleLivingZombieCount() > 0
          ) {
            return;
          }

          if (
            canCreateZombie() &&
            getRemainingUntilRegularZombieSpawn() <=
              EMPTY_ZOMBIE_REGULAR_SPAWN_GUARD_MS
          ) {
            return;
          }

          // 남은 필요 처치 수만큼의 좀비가 모두 화면 밖에 있으면 한 마리를
          // 정리한 뒤 현재 화면 안에 다시 생성해 총 개체 수는 늘리지 않습니다.
          if (!canCreateZombie()) {
            removeOneHiddenLivingZombie();
          }

          const created = createZombie({ preferVisible: true, forceVisibleWhenExpanded: true });
          if (created) {
            // 빈 화면 보충도 실제 생성으로 간주해 다음 정규 생성은 1분 뒤로 미룹니다.
            lastZombieSpawnAt = Date.now();
            scheduleNextZombieSpawnTick();
            saveResourceState();
          } else {
            // 생성 위치나 조건이 일시적으로 맞지 않으면 다음 화면 검사에서 재시도합니다.
            scheduleEmptyFieldZombieSpawn();
          }
        }, delay);
      }

      function scheduleEmptyFieldDeerSpawn(options = {}) {
        if (
          populationTimersPausedForBackground ||
          document.visibilityState === "hidden"
        ) {
          if (pendingEmptyDeerSpawnTimerId !== null) {
            clearTimeout(pendingEmptyDeerSpawnTimerId);
            pendingEmptyDeerSpawnTimerId = null;
          }
          return;
        }

        // 이미 사망·이탈 시작 시 예약된 타이머가 있다면
        // 시체 제거 또는 주기적인 화면 검사로 시간을 다시 밀지 않습니다.
        if (pendingEmptyDeerSpawnTimerId !== null) return;

        const ignoredDeerId = Number.isFinite(Number(options.ignoredDeerId))
          ? Number(options.ignoredDeerId)
          : null;

        if (
          !firstKillBirdFlockPlayed ||
          isExploring ||
          getVisibleLivingDeerCount(ignoredDeerId) > 0
        ) {
          return;
        }

        const delay = EMPTY_DEER_SPAWN_MIN_DELAY_MS +
          Math.random() *
            (EMPTY_DEER_SPAWN_MAX_DELAY_MS -
              EMPTY_DEER_SPAWN_MIN_DELAY_MS);

        const trySpawnEmptyFieldDeer = () => {
          pendingEmptyDeerSpawnTimerId = null;

          if (
            populationTimersPausedForBackground ||
            document.visibilityState === "hidden"
          ) {
            return;
          }

          if (
            !firstKillBirdFlockPlayed ||
            isExploring ||
            getVisibleLivingDeerCount(ignoredDeerId) > 0
          ) {
            return;
          }

          // 사망 모션이나 이탈 중인 개체가 전체 개체 수 제한을 잠시 차지한다면
          // 최초 5~7초 타이머를 다시 시작하지 않고 자리가 생길 때까지 짧게 재확인합니다.
          if (!hasActivePopulationCapacity()) {
            pendingEmptyDeerSpawnTimerId = window.setTimeout(
              trySpawnEmptyFieldDeer,
              250
            );
            return;
          }

          // 최대 3마리가 모두 현재 화면 밖에 남아 있으면 한 마리를 정리해
          // 화면 안에 새 사슴이 들어올 자리를 확보합니다.
          if (getLivingDeerCount() >= MAX_ACTIVE_DEER) {
            removeOneHiddenLivingDeer();
          }

          const created = createDeer({ preferVisible: true, forceVisibleWhenExpanded: true });
          if (created) {
            // 빈 화면 보충도 실제 생성으로 간주해 정규 3분 생성과 겹치지 않게 합니다.
            lastDeerSpawnAt = Date.now();
            scheduleNextDeerSpawnTick();
            saveResourceState();
          } else {
            // 생성 위치를 일시적으로 찾지 못한 경우 최초 지연을 다시 적용하지 않고 재시도합니다.
            pendingEmptyDeerSpawnTimerId = window.setTimeout(
              trySpawnEmptyFieldDeer,
              250
            );
          }
        };

        pendingEmptyDeerSpawnTimerId = window.setTimeout(
          trySpawnEmptyFieldDeer,
          delay
        );
      }

      function startSpawner() {
        // 새 게임에서만 첫 좀비를 즉시 생성합니다.
        // 페이지를 열 때 이미 Axe를 보유했다면 첫 시작용 즉시 생성은 건너뜁니다.
        if (!skipFirstStartSequence && canCreateZombie()) {
          createZombie({ preferVisible: true, forceVisibleWhenExpanded: true });
        }

        // 간헐적으로 지나가는 새는 첫 처치 연출 여부와 관계없이 항상 유지합니다.
        scheduleNextAmbientBirdFlock();
        scheduleNextZombieSpawnTick();
        scheduleNextDeerSpawnTick();
      }

      axePickupHitArea.addEventListener("pointerup", (event) => {
        if (!shouldActivateFieldObject(event, axePickupHitArea)) return;
        collectAxe(event);
      });
      axePickupHitArea.addEventListener("keydown", handleAxePickupKeydown);
      treeHitArea.addEventListener("pointerup", (event) => {
        if (!shouldActivateFieldObject(event, treeHitArea)) return;
        playTreeChopAnimation(event);
      });
      treeHitArea.addEventListener("keydown", handleTreeKeydown);
      shedObject.addEventListener("pointerup", (event) => {
        if (!shouldActivateFieldObject(event, shedObject)) return;
        if (isShedRepaired()) {
          handleStructureInteraction(event, SHED_REPAIRED_TOAST_MESSAGE, SHED_OLD_SOUND);
          return;
        }
        unlockShedRepairBlueprint();
        applyRepairState();
        handleStructureInteraction(event, SHED_REPAIR_TOAST_MESSAGE, SHED_OLD_SOUND);
      });
      shedObject.addEventListener("keydown", (event) => {
        if (event.key !== "Enter" && event.key !== " ") return;
        if (!isShedRepaired()) {
          unlockShedRepairBlueprint();
          applyRepairState();
        }
        handleStructureKeydown(event, isShedRepaired() ? SHED_REPAIRED_TOAST_MESSAGE : SHED_REPAIR_TOAST_MESSAGE, SHED_OLD_SOUND);
      });
      carObject.addEventListener("pointerup", (event) => {
        if (isCarTraveling) return;
        if (!shouldActivateFieldObject(event, carObject)) return;
        handleStructureInteraction(
          event,
          isCarRepaired()
            ? CAR_REPAIRED_TOAST_MESSAGE
            : CAR_REPAIR_TOAST_MESSAGE,
          isCarRepaired() ? CAR_HORN_SOUND : CAR_FAIL_SOUND
        );
      });
      carObject.addEventListener("keydown", (event) => {
        if (isCarTraveling) return;
        handleStructureKeydown(
          event,
          isCarRepaired()
            ? CAR_REPAIRED_TOAST_MESSAGE
            : CAR_REPAIR_TOAST_MESSAGE,
          isCarRepaired() ? CAR_HORN_SOUND : CAR_FAIL_SOUND
        );
      });
      mailboxObject.addEventListener("pointerup", (event) => {
        if (!shouldActivateFieldObject(event, mailboxObject)) return;
        handleMailboxInteraction(event);
      });
      mailboxObject.addEventListener("keydown", (event) => {
        if (event.key !== "Enter" && event.key !== " ") return;
        handleMailboxInteraction(event);
      });
      repairButton.addEventListener("click", handleRepairButton);
      inventoryButton.addEventListener("click", handleInventoryButton);
      exploreButton.addEventListener("click", handleExploreButton);

      explorationOverlay.addEventListener("pointerdown", (event) => {
        if (event.target === explorationOverlay) {
          closeExplorationMenu();
        }
      });

      explorationMenu.addEventListener("pointerdown", (event) => {
        event.stopPropagation();
      });

      inventoryOverlay.addEventListener("pointerdown", (event) => {
        if (event.target === inventoryOverlay) {
          closeInventory();
        }
      });

      inventoryMenu.addEventListener("pointerdown", (event) => {
        event.stopPropagation();
      });

      repairOverlay.addEventListener("pointerdown", (event) => {
        if (event.target === repairOverlay) {
          closeRepair();
        }
      });

      repairMenu.addEventListener("pointerdown", (event) => {
        event.stopPropagation();
      });

      for (const categoryButton of repairCategories) {
        categoryButton.addEventListener("click", () => {
          playSound(INVENTORY_SET_SOUND);
          selectRepairCategory(
            categoryButton.dataset.repairCategory || "outdoor"
          );
        });
      }

      repairGrid.addEventListener("mouseover", (event) => {
        const target = event.target.closest(".repair-grid-item");
        if (!target || !repairGrid.contains(target)) return;

        const index = normalizeRepairItemIndex(target.dataset.repairItemIndex);
        if (!clearRepairItemNewState(repairSelectedCategory, index)) return;

        applyRepairState();
        saveResourceState();
      });

      repairGrid.addEventListener("click", (event) => {
        const target = event.target.closest(".repair-grid-item");
        if (!target || !repairGrid.contains(target)) return;

        playSound(INVENTORY_SET_SOUND);
        selectRepairItem(target.dataset.repairItemIndex);
      });

      repairActionButton.addEventListener("click", handleRepairAction);

      function startInventoryPageDrag(event) {
        if (
          inventoryPageCount <= 1 ||
          inventoryPageDragState.active ||
          (event.pointerType === "mouse" && event.button !== 0)
        ) {
          return;
        }

        inventoryPageDragState.active = true;
        inventoryPageDragState.moved = false;
        inventoryPageDragState.pointerId = event.pointerId;
        inventoryPageDragState.startX = event.clientX;
        inventoryPageDragState.startY = event.clientY;
        inventoryPageDragState.currentX = event.clientX;
        inventoryPageDragState.startOffset =
          -inventoryCurrentPage * getInventoryPageWidth();

        /*
          탭 단계에서는 포인터 캡처를 하지 않습니다.
          pointerdown 직후 뷰포트가 캡처하면 아이템 버튼 대신 뷰포트가
          pointerup 대상이 되어 click이 발생하지 않을 수 있습니다.
          실제 가로 드래그로 판정된 순간에만 캡처합니다.
        */
      }

      function moveInventoryPageDrag(event) {
        if (
          !inventoryPageDragState.active ||
          event.pointerId !== inventoryPageDragState.pointerId
        ) {
          return;
        }

        const deltaX = event.clientX - inventoryPageDragState.startX;
        const deltaY = event.clientY - inventoryPageDragState.startY;
        inventoryPageDragState.currentX = event.clientX;

        if (!inventoryPageDragState.moved) {
          if (Math.abs(deltaX) < 8 && Math.abs(deltaY) < 8) return;
          if (Math.abs(deltaY) > Math.abs(deltaX)) return;
          inventoryPageDragState.moved = true;

          /* 실제 스와이프가 시작된 뒤에만 이동 중 포인터를 유지합니다. */
          if (!inventoryViewport.hasPointerCapture(event.pointerId)) {
            inventoryViewport.setPointerCapture(event.pointerId);
          }
        }

        event.preventDefault();

        let resistedDeltaX = deltaX;
        if (
          (inventoryCurrentPage === 0 && deltaX > 0) ||
          (inventoryCurrentPage === inventoryPageCount - 1 && deltaX < 0)
        ) {
          resistedDeltaX *= 0.35;
        }

        setInventoryTrackOffset(
          inventoryPageDragState.startOffset + resistedDeltaX,
          false
        );
      }

      function endInventoryPageDrag(event) {
        if (
          !inventoryPageDragState.active ||
          event.pointerId !== inventoryPageDragState.pointerId
        ) {
          return;
        }

        const didMove = inventoryPageDragState.moved;
        const deltaX = event.clientX - inventoryPageDragState.startX;
