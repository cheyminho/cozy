        // 아직 획득하지 않은 설계도는 미리 슬롯을 차지하지 않습니다.
        const items = repairItemsByCategory.buildings || [];
        for (let index = 0; index < items.length; index += 1) {
          const blueprintId = inferBuildingBlueprintId(items[index]);
          const definition = BUILDING_BLUEPRINT_DEFINITIONS[blueprintId];
          if (!definition) continue;
          configureRepairItem("buildings", index, {
            ...definition,
            blueprintId
          });
        }
      }

      function unlockCarRepairBlueprint() {
        if (unlockRepairBlueprint(CAR_REPAIR_BLUEPRINT_ID)) {
          saveResourceState();
          return true;
        }
        return false;
      }

      function applyMailboxVisibility() {
        if (!mailboxObject) return;
        // 울타리 설치 여부와 관계없이 우편함은 계속 표시합니다.
        mailboxObject.classList.remove("is-hidden-visual");
      }

      function deliverTodoList(listId, shouldMarkNew = true) {
        playSound(MAILBOX_SOUND);

        if (todoListRevealTimerId !== null) {
          clearTimeout(todoListRevealTimerId);
          todoListRevealTimerId = null;
        }

        currentTodoListId = listId;
        syncTodoProgressFromCurrentState(listId);
        hasStrangerLetter = true;
        isStrangerLetterOn = true;
        todoSubmittedListId = 0;
        todoSubmittedDay = 0;
        isTodoListRevealDelayed = true;

        if (shouldMarkNew) {
          markInventoryItemAsNew("strangerLetter");
        }

        applyInventoryState();
        updateTodoListUI();
        saveResourceState();

        todoListRevealTimerId = window.setTimeout(() => {
          todoListRevealTimerId = null;
          isTodoListRevealDelayed = false;
          updateTodoListUI();
        }, TODO_LIST_MAIL_REVEAL_DELAY_MS);
      }

      function getUnlockedBlueprintCount() {
        const unlockedBlueprintIds = new Set();

        for (const [category, items] of Object.entries(repairItemsByCategory)) {
          for (const item of items || []) {
            if (!item?.unlocked) continue;

            let blueprintId = item.blueprintId || "";
            if (!blueprintId && category === "outdoor") {
              blueprintId = inferOutdoorBlueprintId(item);
            } else if (!blueprintId && category === "buildings") {
              blueprintId = inferBuildingBlueprintId(item);
            } else if (!blueprintId && category === "repair") {
              blueprintId = inferRepairBlueprintId(item);
            }

            if (blueprintId) {
              unlockedBlueprintIds.add(`${category}:${blueprintId}`);
            }
          }
        }

        return unlockedBlueprintIds.size;
      }

      function syncTodoProgressFromCurrentState(listId) {
        const list = todoProgress[listId];
        if (!list) return false;
        let changed = false;

        const complete = (key, condition) => {
          if (!condition || !(key in list) || list[key] === true) return;
          list[key] = true;
          changed = true;
        };

        if (listId === 1) {
          complete("item1", zombieCount > 0);
          complete("item2", foodCount > 0);
        } else if (listId === 2) {
          complete("item1", repairAppliedItemBySection.outdoor.fence >= 0);
          complete("item3", isShedRepaired());
        } else if (listId === 3) {
          complete("item1", getUnlockedBlueprintCount() >= 3);
        } else if (listId === 4) {
          complete("item2", fuelCount >= 10);
          complete("item3", isCarRepaired());
        }

        return changed;
      }

      function setTodoProgress(listId, key, value = true) {
        const list = todoProgress[listId];
        if (!list || !(key in list) || list[key] === value) return false;
        list[key] = value;
        updateTodoListUI();
        saveResourceState();
        return true;
      }

      function isTodoListComplete(listId) {
        const list = todoProgress[listId];
        return Boolean(list) && Object.values(list).every(Boolean);
      }

      function showTodoListOverlay() {
        if (!todoListOverlay) return;
        if (todoListHideTimerId !== null) {
          clearTimeout(todoListHideTimerId);
          todoListHideTimerId = null;
        }

        const wasHidden = todoListOverlay.hidden;
        todoListOverlay.classList.remove("is-hiding");
        todoListOverlay.hidden = false;

        if (wasHidden) {
          todoListOverlay.classList.remove("is-showing");
          void todoListOverlay.offsetWidth;
          todoListOverlay.classList.add("is-showing");
        }
      }

      function hideTodoListOverlay() {
        if (!todoListOverlay || todoListOverlay.hidden) return;
        if (todoListHideTimerId !== null) {
          clearTimeout(todoListHideTimerId);
        }

        todoListOverlay.classList.remove("is-showing");
        todoListOverlay.classList.add("is-hiding");
        todoListHideTimerId = window.setTimeout(() => {
          todoListHideTimerId = null;
          todoListOverlay.hidden = true;
          todoListOverlay.classList.remove("is-hiding");
        }, 500);
      }

      function updateTodoListUI() {
        if (!todoListOverlay) return;

        const taskTexts = {
          1: [
            "kill a zombie",
            "hunt a deer for food",
            "explore the village"
          ],
          2: [
            "build a fence",
            "wait for the tree to regrow",
            "repair the shed"
          ],
          3: [
            "collect 3 blueprints",
            "kill with a different weapon",
            "explore the forest"
          ],
          4: [
            "headshot",
            "collect 10 fuel",
            "repair the car"
          ],
          5: [
            "wait for the next update"
          ]
        };

        const rewardTexts = {
          1: "i'll send you a blueprint.",
          2: "i'll send you a compass.",
          3: "i’ll send you a rifle.",
          4: "i’ll send you a map."
        };

        const visible =
          hasStrangerLetter &&
          isStrangerLetterOn &&
          currentTodoListId > 0 &&
          !isTodoListRevealDelayed;
        if (visible) {
          showTodoListOverlay();
        } else {
          hideTodoListOverlay();
          return;
        }

        const texts = taskTexts[currentTodoListId] || [];
        const progress = todoProgress[currentTodoListId] || {};
        const keys = ["item1", "item2", "item3"];

        todoItemElements.forEach((element, index) => {
          const key = keys[index];
          const text = texts[index] || "";
          element.hidden = !text;
          element.textContent = text;
          element.classList.toggle("is-complete", Boolean(text) && progress[key] === true);
        });

        const isComplete = isTodoListComplete(currentTodoListId);
        const rewardText = rewardTexts[currentTodoListId] || "";

        todoDoneNote.hidden = !isComplete;
        if (todoRewardNote) {
          todoRewardNote.textContent = rewardText;
          todoRewardNote.hidden = !isComplete || !rewardText;
        }
      }

      function handleMailboxInteraction(event) {
        if (event) {
          event.preventDefault();
        }

        if (isExploring || document.body.classList.contains("is-night")) {
          return;
        }

        if (!mailboxIntroTriggered && currentTodoListId === 0 && todoSubmittedListId === 0) {
          mailboxIntroTriggered = true;
          deliverTodoList(1);
          showToast(MAIL_FIRST_TOAST_MESSAGE);
          return;
        }

        if (currentTodoListId > 0) {
          if (isTodoListComplete(currentTodoListId)) {
            playSound(MAILBOX_SOUND);
            todoSubmittedListId = currentTodoListId;
            todoSubmittedDay = dayCount;
            currentTodoListId = 0;
            hasStrangerLetter = false;
            isStrangerLetterOn = false;
            applyInventoryState();
            updateTodoListUI();
            saveResourceState();
            showToast(MAIL_DONE_TOAST_MESSAGE);
            return;
          }

          showToast(MAIL_READ_FIRST_TOAST_MESSAGE);
          return;
        }

        if (todoSubmittedListId > 0) {
          if (dayCount > todoSubmittedDay) {
            if (todoSubmittedListId === 1) {
              unlockWoodenFenceBlueprint();
              deliverTodoList(2);
              showToast(MAIL_NEXT_TOAST_MESSAGE);
              return;
            }

            if (todoSubmittedListId === 2) {
              hasCompass = true;
              markInventoryItemAsNew("compass");
              // 획득 즉시 Forest 조건에서 Compass를 숨기고 잠금 상태도 갱신합니다.
              updateExplorationRequirements();
              deliverTodoList(3);
              showToast(MAIL_NEXT_TOAST_MESSAGE);
              return;
            }

            if (todoSubmittedListId === 3) {
              const didNotHaveRifle = !hasRifle;
              hasRifle = true;
              if (didNotHaveRifle) {
                markInventoryItemAsNew("rifle");
              }

              const previousRifleAmmoCount = rifleAmmoCount;
              rifleAmmoCount = Math.min(
                MAX_INVENTORY_QUANTITY,
                rifleAmmoCount + 10
              );
              hasRifleAmmo = rifleAmmoCount > 0;
              if (rifleAmmoCount > previousRifleAmmoCount) {
                markInventoryItemAsNew("rifleAmmo");
              }

              deliverTodoList(4);
              showToast(MAIL_NEXT_TOAST_MESSAGE);
              return;
            }

            if (todoSubmittedListId === 4) {
              const wasMissingMap = !hasMap;
              hasMap = true;
              if (wasMissingMap) {
                markInventoryItemAsNew("map");
              }
              // 획득 즉시 City 조건에서 Map을 숨기고 잠금 상태도 갱신합니다.
              updateExplorationRequirements();
              deliverTodoList(5);
              showToast(MAIL_NEXT_TOAST_MESSAGE);
              return;
            }
          }

          showToast(MAIL_WAIT_TOAST_MESSAGE);
        }
      }

      function isRepairCategory(value) {
        return REPAIR_CATEGORY_ORDER.includes(value);
      }

      function normalizeRepairItemIndex(value) {
        const number = Math.round(Number(value));
        return Number.isFinite(number)
          ? clamp(number, 0, REPAIR_GRID_ITEM_COUNT - 1)
          : 0;
      }

      function normalizeRepairSelectedItemIndex(value) {
        const number = Math.round(Number(value));
        if (number === -1) return -1;
        return Number.isFinite(number)
          ? clamp(number, 0, REPAIR_GRID_ITEM_COUNT - 1)
          : -1;
      }

      function normalizeRepairAppliedSectionIndex(value, category, section) {
        const number = Math.round(Number(value));
        const fallbackIndex = section.initialItemName ? section.startIndex : -1;
        if (number === -1 && fallbackIndex === -1) return -1;
        if (!Number.isFinite(number)) return fallbackIndex;
        return number >= section.startIndex &&
          number < section.startIndex + REPAIR_SECTION_SPAN
          ? number
          : fallbackIndex;
      }

      function normalizeRepairMaterials(value) {
        if (!value || typeof value !== "object" || Array.isArray(value)) {
          return {};
        }

        const normalized = {};
        for (const [resource, amount] of Object.entries(value)) {
          const normalizedAmount = Math.max(0, Math.round(Number(amount) || 0));
          if (normalizedAmount > 0) {
            normalized[resource] = normalizedAmount;
          }
        }
        return normalized;
      }

      function inferRepairBlueprintId(item) {
        if (item?.blueprintId && REPAIR_BLUEPRINT_DEFINITIONS[item.blueprintId]) {
          return item.blueprintId;
        }

        const normalizedName = String(item?.name || "").trim().toLowerCase();
        if (normalizedName === "shed repair" || normalizedName === "repaired shed") {
          return SHED_REPAIR_BLUEPRINT_ID;
        }
        if (normalizedName === "car repair") {
          return CAR_REPAIR_BLUEPRINT_ID;
        }
        return item?.blueprintId || "";
      }

      function resetRepairBlueprintItem(item) {
        item.name = "";
        item.unlocked = false;
        item.built = false;
        item.isNew = false;
        item.materials = {};
        item.description = "";
        item.builtDescription = "";
        item.blueprintId = "";
      }

      function compactOutdoorBlueprintSlots() {
        const items = repairItemsByCategory.outdoor || [];
        const acquiredBySection = Object.fromEntries(
          REPAIR_CATEGORY_DEFINITIONS.outdoor.sections.map((section) => [section.key, []])
        );
        const seenBlueprintIds = new Set();
        const appliedBlueprintBySection = {};

        for (const section of REPAIR_CATEGORY_DEFINITIONS.outdoor.sections) {
          const appliedIndex = repairAppliedItemBySection.outdoor[section.key];
          const appliedItem = Number.isInteger(appliedIndex) && appliedIndex >= 0
            ? items[appliedIndex]
            : null;
          const appliedBlueprintId = inferOutdoorBlueprintId(appliedItem);
          appliedBlueprintBySection[section.key] =
            OUTDOOR_BLUEPRINT_DEFINITIONS[appliedBlueprintId]?.sectionKey === section.key
              ? appliedBlueprintId
              : "";
        }

        for (let index = 0; index < items.length; index += 1) {
          const item = items[index];
          const blueprintId = inferOutdoorBlueprintId(item);
          const definition = OUTDOOR_BLUEPRINT_DEFINITIONS[blueprintId];
          if (
            !definition ||
            seenBlueprintIds.has(blueprintId) ||
            (!item.unlocked && !item.built && !item.isNew)
          ) {
            continue;
          }

          seenBlueprintIds.add(blueprintId);
          acquiredBySection[definition.sectionKey].push({
            ...item,
            blueprintId,
            materials: { ...item.materials }
          });
        }

        for (const section of REPAIR_CATEGORY_DEFINITIONS.outdoor.sections) {
          for (
            let index = section.startIndex;
            index < section.startIndex + REPAIR_SECTION_SPAN;
            index += 1
          ) {
            resetRepairBlueprintItem(items[index]);
          }

          for (const storedItem of acquiredBySection[section.key]) {
            const blueprintId = storedItem.blueprintId;
            const targetIndex = ensureOutdoorBlueprintSlot(blueprintId);
            const targetItem = targetIndex >= 0 ? items[targetIndex] : null;
            if (!targetItem) continue;
            targetItem.unlocked = storedItem.unlocked === true || storedItem.built === true;
            targetItem.built = storedItem.built === true;
            targetItem.isNew = storedItem.isNew === true;
          }

          const appliedBlueprintId = appliedBlueprintBySection[section.key];
          repairAppliedItemBySection.outdoor[section.key] = appliedBlueprintId
            ? getOutdoorBlueprintIndex(appliedBlueprintId)
            : -1;
        }

        repairSelectedItemByCategory.outdoor = -1;
      }

      function compactBuildingBlueprintSlots() {
        const items = repairItemsByCategory.buildings || [];
        const acquiredBySection = Object.fromEntries(
          REPAIR_CATEGORY_DEFINITIONS.buildings.sections.map((section) => [section.key, []])
        );
        const seenBlueprintIds = new Set();
        const appliedBlueprintBySection = {};
        const selectedIndex = repairSelectedItemByCategory.buildings;
        const selectedItem = selectedIndex >= 0 ? items[selectedIndex] : null;
        const selectedBlueprintId = inferBuildingBlueprintId(selectedItem);
        const selectedBasicIndex = selectedBlueprintId
          ? -1
          : REPAIR_CATEGORY_DEFINITIONS.buildings.sections.some(
              (section) => section.startIndex === selectedIndex
            )
            ? selectedIndex
            : -1;

        for (const section of REPAIR_CATEGORY_DEFINITIONS.buildings.sections) {
          const appliedIndex = repairAppliedItemBySection.buildings[section.key];
          const appliedItem = Number.isInteger(appliedIndex) && appliedIndex >= 0
            ? items[appliedIndex]
            : null;
          const appliedBlueprintId = inferBuildingBlueprintId(appliedItem);
          appliedBlueprintBySection[section.key] =
            BUILDING_BLUEPRINT_DEFINITIONS[appliedBlueprintId]?.sectionKey === section.key
              ? appliedBlueprintId
              : "";
        }

        for (let index = 0; index < items.length; index += 1) {
          const item = items[index];
          const blueprintId = inferBuildingBlueprintId(item);
          const definition = BUILDING_BLUEPRINT_DEFINITIONS[blueprintId];
          if (
            !definition ||
            seenBlueprintIds.has(blueprintId) ||
            (!item.unlocked && !item.built && !item.isNew)
          ) {
            continue;
          }

          seenBlueprintIds.add(blueprintId);
          acquiredBySection[definition.sectionKey].push({
            ...item,
            blueprintId,
            materials: { ...item.materials }
          });
        }

        for (const section of REPAIR_CATEGORY_DEFINITIONS.buildings.sections) {
          const firstBlueprintIndex = section.startIndex + (section.initialItemName ? 1 : 0);
          for (
            let index = firstBlueprintIndex;
            index < section.startIndex + REPAIR_SECTION_SPAN;
            index += 1
          ) {
            resetRepairBlueprintItem(items[index]);
          }

          for (const storedItem of acquiredBySection[section.key]) {
            const blueprintId = storedItem.blueprintId;
            const targetIndex = ensureBuildingBlueprintSlot(blueprintId);
            const targetItem = targetIndex >= 0 ? items[targetIndex] : null;
            if (!targetItem) continue;
            targetItem.unlocked = storedItem.unlocked === true || storedItem.built === true;
            targetItem.built = storedItem.built === true;
            targetItem.isNew = storedItem.isNew === true;
          }

          const appliedBlueprintId = appliedBlueprintBySection[section.key];
          repairAppliedItemBySection.buildings[section.key] = appliedBlueprintId
            ? getBuildingBlueprintIndex(appliedBlueprintId)
            : section.startIndex;
        }

        repairSelectedItemByCategory.buildings = selectedBlueprintId
          ? getBuildingBlueprintIndex(selectedBlueprintId)
          : selectedBasicIndex;
        if (repairSelectedItemByCategory.buildings < 0) {
          repairSelectedItemByCategory.buildings = -1;
        }
      }

      function compactRepairBlueprintSlots() {
        const items = repairItemsByCategory.repair || [];
        const selectedIndex = repairSelectedItemByCategory.repair;
        const selectedItem = selectedIndex >= 0 ? items[selectedIndex] : null;
        const selectedBlueprintId = inferRepairBlueprintId(selectedItem);
        const selectedLegacyName = String(selectedItem?.name || "");

        const acquiredItems = [];
        const seenKeys = new Set();
        for (let index = 0; index < items.length; index += 1) {
          const item = items[index];
          if (!item || (!item.unlocked && !item.built && !item.isNew)) continue;

          const blueprintId = inferRepairBlueprintId(item);
          const key = blueprintId || `legacy:${String(item.name || "").toLowerCase()}:${index}`;
          if (seenKeys.has(key)) continue;
          seenKeys.add(key);
          acquiredItems.push({
            ...item,
            materials: { ...item.materials },
            blueprintId
          });
        }

        for (const item of items) {
          resetRepairBlueprintItem(item);
        }

        acquiredItems.forEach((storedItem, index) => {
          const targetItem = items[index];
          if (!targetItem) return;
          const definition = REPAIR_BLUEPRINT_DEFINITIONS[storedItem.blueprintId];
          if (definition) {
            configureRepairItem("repair", index, {
              ...definition,
              blueprintId: storedItem.blueprintId
            });
          } else {
            targetItem.name = storedItem.name || "";
            targetItem.materials = { ...storedItem.materials };
            targetItem.description = storedItem.description || "";
            targetItem.builtDescription = storedItem.builtDescription || storedItem.description || "";
            targetItem.blueprintId = storedItem.blueprintId || "";
          }
          targetItem.unlocked = storedItem.unlocked === true || storedItem.built === true;
          targetItem.built = storedItem.built === true;
          targetItem.isNew = storedItem.isNew === true;
        });

        if (selectedBlueprintId) {
          repairSelectedItemByCategory.repair = getRepairBlueprintIndex(selectedBlueprintId);
        } else if (selectedLegacyName) {
          repairSelectedItemByCategory.repair = items.findIndex(
            (item) => item.unlocked && item.name === selectedLegacyName
          );
        } else {
          repairSelectedItemByCategory.repair = -1;
        }

        if (repairSelectedItemByCategory.repair < 0) {
          repairSelectedItemByCategory.repair = -1;
        }
      }

      function loadRepairState(value) {
        if (!value || typeof value !== "object") return;

        if (isRepairCategory(value.selectedCategory)) {
          repairSelectedCategory = value.selectedCategory;
        }

        const selectedItems = value.selectedItemByCategory;
        const appliedItems = value.appliedItemByCategory;
        const appliedSectionItems = value.appliedItemBySection;
        const storedCategoryNewByCategory = value.categoryNewByCategory;
        const storedItems = value.itemsByCategory;

        if (appliedSectionItems && typeof appliedSectionItems === "object") {
          for (const [category, sections] of Object.entries(repairAppliedItemBySection)) {
            const storedSections = appliedSectionItems[category];
            if (!storedSections || typeof storedSections !== "object") continue;
            for (const key of Object.keys(sections)) {
              const section = REPAIR_CATEGORY_DEFINITIONS[category]?.sections?.find(
                (entry) => entry.key === key
              );
              if (!section) continue;
              sections[key] = normalizeRepairAppliedSectionIndex(
                storedSections[key],
                category,
                section
              );
            }
          }
        }

        for (const category of REPAIR_CATEGORY_ORDER) {
          if (selectedItems && typeof selectedItems === "object") {
            repairSelectedItemByCategory[category] = normalizeRepairSelectedItemIndex(
              selectedItems[category]
            );
          }

          if (appliedItems && typeof appliedItems === "object") {
            repairAppliedItemByCategory[category] = normalizeRepairItemIndex(
              appliedItems[category]
            );
          }

          const categoryItems = storedItems && storedItems[category];
          if (!Array.isArray(categoryItems)) continue;

          const targetItems = repairItemsByCategory[category];
          for (let index = 0; index < Math.min(categoryItems.length, targetItems.length); index += 1) {
            const storedItem = categoryItems[index];
            if (!storedItem || typeof storedItem !== "object") continue;
            const targetItem = targetItems[index];
            if (typeof storedItem.name === "string") targetItem.name = storedItem.name;
            targetItem.unlocked = storedItem.unlocked === true;
            targetItem.built = storedItem.built === true;
            targetItem.isNew = storedItem.isNew === true;
            targetItem.materials = normalizeRepairMaterials(storedItem.materials);
            targetItem.description = typeof storedItem.description === "string"
              ? storedItem.description
              : targetItem.description;
            targetItem.builtDescription = typeof storedItem.builtDescription === "string"
              ? storedItem.builtDescription
              : targetItem.builtDescription;
            targetItem.blueprintId = typeof storedItem.blueprintId === "string"
              ? storedItem.blueprintId
              : targetItem.blueprintId;
          }

          const definition = REPAIR_CATEGORY_DEFINITIONS[category];
          if (Array.isArray(definition.sections)) {
            for (const section of definition.sections) {
              if (!section.initialItemName) continue;
              const initialItem = targetItems[section.startIndex];
              initialItem.name = section.initialItemName;
              initialItem.unlocked = true;
              initialItem.built = true;
              initialItem.isNew = false;
              initialItem.description = section.initialItemDescription || "";
              initialItem.builtDescription = section.initialItemDescription || "";
            }
          } else if (category !== "repair") {
            const initialItem = targetItems[0];
            initialItem.name = definition.initialItemName;
            initialItem.unlocked = true;
            initialItem.built = true;
            initialItem.isNew = false;
            initialItem.description = definition.initialItemDescription;
            initialItem.builtDescription = definition.initialItemDescription;
          }

          const selectedIndex = repairSelectedItemByCategory[category];
          if (selectedIndex < 0 || !targetItems[selectedIndex]?.unlocked) {
            repairSelectedItemByCategory[category] = -1;
          }

          const appliedIndex = repairAppliedItemByCategory[category];
          if (!targetItems[appliedIndex]?.unlocked || !targetItems[appliedIndex]?.built) {
            repairAppliedItemByCategory[category] = getRepairInitialIndex(category, appliedIndex);
          }
        }

        // Decor는 각 하위 카테고리에서 획득 순서대로 첫 빈칸부터 재배치합니다.
        compactOutdoorBlueprintSlots();

        // House는 Basic 다음 칸부터 획득 순서대로 빈틈없이 재배치합니다.
        compactBuildingBlueprintSlots();

        // Restore의 기존 고정 슬롯 저장값도 획득된 순서를 유지한 채 첫 칸부터 빈틈없이 재배치합니다.
        compactRepairBlueprintSlots();

        // 저장 데이터에 이전 재료 수량이 남아 있어도 최신 설계도 정의를 다시 적용합니다.
        configureExplorationBlueprintDefinitions();

        for (const category of REPAIR_CATEGORY_ORDER) {
          if (
            storedCategoryNewByCategory &&
            typeof storedCategoryNewByCategory === "object" &&
            typeof storedCategoryNewByCategory[category] === "boolean"
          ) {
            repairCategoryNewByCategory[category] =
              storedCategoryNewByCategory[category];
          } else {
            // 이전 저장 파일은 개별 설계도의 NEW 상태로 카테고리 태그를 복원합니다.
            repairCategoryNewByCategory[category] =
              (repairItemsByCategory[category] || []).some(
                (item) => item.unlocked && item.isNew
              );
          }
        }
      }

      function serializeRepairState() {
        return {
          selectedCategory: repairSelectedCategory,
          categoryNewByCategory: { ...repairCategoryNewByCategory },
          selectedItemByCategory: { ...repairSelectedItemByCategory },
          appliedItemByCategory: { ...repairAppliedItemByCategory },
          appliedItemBySection: Object.fromEntries(
            Object.entries(repairAppliedItemBySection).map(([category, sections]) => [
              category,
              { ...sections }
            ])
          ),
          itemsByCategory: Object.fromEntries(
            REPAIR_CATEGORY_ORDER.map((category) => [
              category,
              repairItemsByCategory[category].map((item) => ({
                name: item.name,
                unlocked: item.unlocked,
                built: item.built,
                isNew: item.isNew,
                materials: { ...item.materials },
                description: item.description,
                builtDescription: item.builtDescription,
                blueprintId: item.blueprintId
              }))
            ])
          )
        };
      }

      function getSelectedRepairItem() {
        const selectedIndex = repairSelectedItemByCategory[repairSelectedCategory];
        if (!Number.isInteger(selectedIndex) || selectedIndex < 0) return null;
        return repairItemsByCategory[repairSelectedCategory][selectedIndex] || null;
      }

      function getAppliedRepairItemIndex(category, itemIndex = 0) {
        if (isSectionedRepairCategory(category)) {
          const section = getRepairSectionDefinition(category, itemIndex);
          if (!section) return -1;
          return repairAppliedItemBySection[category][section.key] ??
            getRepairInitialIndex(category, itemIndex);
        }
        return repairAppliedItemByCategory[category] ?? -1;
      }

      function setAppliedRepairItemIndex(category, itemIndex) {
        if (isSectionedRepairCategory(category)) {
          const section = getRepairSectionDefinition(category, itemIndex);
          if (!section) return;
          repairAppliedItemBySection[category][section.key] = itemIndex;
          return;
        }
        repairAppliedItemByCategory[category] = itemIndex;
      }

      function getRepairResourceAmount(resource) {
        if (resource === "wood") return woodCount;
        if (resource === "food") return foodCount;
        if (resource === "carParts") return carPartsCount;
        if (resource === "flowers") return flowerCount;
        if (resource === "repairKit") return repairKitCount;
        if (resource in paintCounts) return paintCounts[resource];
        return 0;
      }

      function setRepairResourceAmount(resource, amount) {
        if (resource === "wood") woodCount = Math.max(0, amount);
        if (resource === "food") foodCount = Math.max(0, amount);
        if (resource === "carParts") carPartsCount = clamp(Math.round(Number(amount) || 0), 0, getMaxCarPartsCount());
        if (resource === "flowers") flowerCount = clamp(Math.round(Number(amount) || 0), 0, MAX_INVENTORY_QUANTITY);
        if (resource === "repairKit") repairKitCount = clamp(Math.round(Number(amount) || 0), 0, MAX_INVENTORY_QUANTITY);
        if (resource in paintCounts) {
          paintCounts[resource] = clamp(
            Math.round(Number(amount) || 0),
            0,
            MAX_INVENTORY_QUANTITY
          );
        }
      }

      function canAffordRepairMaterials(materials) {
        return Object.entries(materials).every(
          ([resource, amount]) => getRepairResourceAmount(resource) >= amount
        );
      }

      function consumeRepairMaterials(materials) {
        for (const [resource, amount] of Object.entries(materials)) {
          setRepairResourceAmount(resource, getRepairResourceAmount(resource) - amount);
        }
      }

      function clearRepairItemNewState(category, index) {
        const item = repairItemsByCategory[category][index];
        if (!item || !item.isNew) return false;
        item.isNew = false;
        return true;
      }

      const REPAIR_SELECTED_CATEGORY_SCALE = 1.55;

      function updateRepairCategoryLayout() {
        for (const categoryButton of repairCategories) {
          categoryButton.style.width = "auto";
        }

        for (const categoryButton of repairCategories) {
          const label = categoryButton.querySelector(".repair-category-label");
          if (!label) continue;
          const isSelected = categoryButton.classList.contains("is-selected");
          const labelWidth = label.offsetWidth;
          const visualWidth = isSelected
            ? labelWidth * REPAIR_SELECTED_CATEGORY_SCALE
            : labelWidth;
          categoryButton.style.width = `${Math.ceil(visualWidth + 2)}px`;
        }
      }

      function renderRepairCategories() {
        for (const categoryButton of repairCategories) {
          const category = categoryButton.dataset.repairCategory || "";
          const isSelected = category === repairSelectedCategory;
          const badge = categoryButton.querySelector(".repair-category-new-badge");
          categoryButton.classList.toggle("is-selected", isSelected);
          categoryButton.setAttribute("aria-selected", isSelected ? "true" : "false");
          if (badge) badge.hidden = !getRepairCategoryHasNewItems(category);
        }
      }

      function renderRepairGrid() {
        repairGrid.replaceChildren();

        const selectedIndex = repairSelectedItemByCategory[repairSelectedCategory];
        const items = repairItemsByCategory[repairSelectedCategory];
        const definition = REPAIR_CATEGORY_DEFINITIONS[repairSelectedCategory];
        const isSectionedLayout = Array.isArray(definition.sections);

        repairGrid.classList.toggle("is-sectioned-layout", isSectionedLayout);
        repairGrid.style.gridTemplateRows = isSectionedLayout
          ? `repeat(${definition.sections.length * 2}, 28px)`
          : "";

        if (isSectionedLayout) {
          definition.sections.forEach((section, sectionIndex) => {
            const label = document.createElement("span");
            label.className = `repair-style-row-label repair-style-row-label--${section.key}`;
            label.textContent = section.label;
            label.style.gridRow = String(sectionIndex * 2 + 1);
            label.setAttribute("aria-hidden", "true");
            repairGrid.append(label);
          });
        }

        items.forEach((item, index) => {
          if (isSectionedLayout && !getRepairSectionDefinition(repairSelectedCategory, index)) {
            return;
          }
          if (isSectionedLayout && index >= definition.sections.length * REPAIR_SECTION_SPAN) return;

          const button = document.createElement("button");
          button.type = "button";
          button.className = "repair-grid-item";
          button.dataset.repairItemIndex = String(index);
          button.setAttribute("role", "gridcell");
          button.setAttribute(
            "aria-label",
            item.unlocked ? item.name || `Option ${index + 1}` : `Locked option ${index + 1}`
          );
          button.classList.toggle("is-selected", item.unlocked && index === selectedIndex);
          button.classList.toggle("is-disabled", !item.unlocked);
          button.classList.toggle("is-new", item.unlocked && item.isNew);
          button.classList.toggle("is-uncrafted", item.unlocked && !item.built);
          button.classList.toggle(
            "is-applied",
            item.unlocked && item.built && index === getAppliedRepairItemIndex(repairSelectedCategory, index)
          );
          button.setAttribute("aria-disabled", item.unlocked ? "false" : "true");

          if (isSectionedLayout) {
            const section = getRepairSectionDefinition(repairSelectedCategory, index);
            const sectionOrder = definition.sections.findIndex((entry) => entry.key === section.key);
            button.style.gridColumn = String((index % REPAIR_SECTION_SPAN) + 1);
            button.style.gridRow = String(sectionOrder * 2 + 2);
          }

          repairGrid.append(button);
        });
      }

      function renderRepairItemInfo() {
        const selectedIndex = repairSelectedItemByCategory[repairSelectedCategory];
        const item = getSelectedRepairItem();

        if (!item) {
          repairItemName.textContent = "None";
          repairItemMeta.textContent = "";
          repairItemMeta.removeAttribute("aria-label");
          repairItemDescription.textContent = "Nothing to fix right now.";
          repairActionButton.textContent = repairSelectedCategory === "repair"
            ? "Repair"
            : "Apply";
          repairActionButton.disabled = true;
          return;
        }

        const appliedIndex = getAppliedRepairItemIndex(repairSelectedCategory, selectedIndex);
        const sectionDefinition = getRepairSectionDefinition(repairSelectedCategory, selectedIndex);

        repairItemName.textContent = item.name || "Unnamed";
        repairItemMeta.textContent = "";
        repairItemMeta.removeAttribute("aria-label");
        repairItemDescription.replaceChildren();

        if (item.built) {
          repairItemDescription.textContent = item.builtDescription || item.description || sectionDefinition?.initialItemDescription || REPAIR_CATEGORY_DEFINITIONS[repairSelectedCategory].initialItemDescription || "";
        } else {
          const labels = {
            wood: "Wood",
            food: "Food",
            carParts: "Car Parts",
            flowers: "Flowers",
            repairKit: "Repair Kit",
            whitePaint: "White Paint",
            blackPaint: "Black Paint",
            redPaint: "Red Paint",
            yellowPaint: "Yellow Paint",
            bluePaint: "Blue Paint",
            greenPaint: "Green Paint"
          };
          const materialEntries = Object.entries(item.materials);
          if (materialEntries.length === 0) {
            repairItemDescription.textContent = repairSelectedCategory === "repair"
              ? ""
              : item.description || "—";
          } else {
            for (const [resource, required] of materialEntries) {
              const current = getRepairResourceAmount(resource);
              const line = document.createElement("span");
              line.className = "repair-material-line";
              line.textContent = `${labels[resource] || resource} ${current}/${required}`;
              line.classList.toggle("is-complete", current >= required);
              repairItemDescription.append(line);
            }
            // 획득 직후에는 이름과 재료만 표시하고, 제작 후 재료 대신 설명을 표시합니다.
          }
        }

        if (repairSelectedCategory === "repair") {
          repairActionButton.textContent = item.built ? "Repaired" : "Repair";
          repairActionButton.disabled = item.built ||
            !item.unlocked ||
            !canAffordRepairMaterials(item.materials);
          return;
        }

        if (!item.built) {
          repairActionButton.textContent = "Craft";
          repairActionButton.disabled = false;
          return;
        }
        if (selectedIndex === appliedIndex) {
          const section = getRepairSectionDefinition(
            repairSelectedCategory,
            selectedIndex
          );
          const canRemove = repairSelectedCategory === "outdoor" &&
            (section?.key === "fence" || section?.key === "garden");
          repairActionButton.textContent = canRemove ? "Remove" : "Applied";
          repairActionButton.disabled = !canRemove;
        } else {
          repairActionButton.textContent = "Apply";
          repairActionButton.disabled = false;
        }
      }

      function syncRepairCompletionLabels() {
        const shedRepairItem = getRepairBlueprintItem(SHED_REPAIR_BLUEPRINT_ID);
        if (shedRepairItem?.unlocked) {
          shedRepairItem.name = shedRepairItem.built
            ? "Repaired Shed"
            : "Shed Repair";
          if (shedRepairItem.built) {
            shedRepairItem.builtDescription =
              "Get the old shed standing again.\nMax Food +2\nMax Wood +5";
          }
        }
      }

      function updateInstalledStructureVisibility() {
        const appliedFenceIndex = repairAppliedItemBySection.outdoor.fence ?? -1;
        const appliedFenceItem = appliedFenceIndex >= 0
          ? repairItemsByCategory.outdoor[appliedFenceIndex]
          : null;
        fenceObject.hidden = !(appliedFenceItem?.unlocked && appliedFenceItem?.built);
        fenceObject.style.setProperty(
          "--fence-frame-position",
          inferOutdoorBlueprintId(appliedFenceItem) === WHITE_FENCE_BLUEPRINT_ID
            ? "right top"
            : "left top"
        );

        const appliedGardenIndex = repairAppliedItemBySection.outdoor.garden ?? -1;
        const appliedGardenItem = appliedGardenIndex >= 0
          ? repairItemsByCategory.outdoor[appliedGardenIndex]
          : null;
        gardenObject.hidden = !(appliedGardenItem?.unlocked && appliedGardenItem?.built);
        gardenObject.style.setProperty(
          "--garden-frame-position",
          inferOutdoorBlueprintId(appliedGardenItem) === WOODEN_FLOWER_BED_BLUEPRINT_ID
            ? "right top"
            : "left top"
        );

        const appliedRoofIndex = repairAppliedItemBySection.buildings.roof ?? 5;
        const appliedRoofItem = appliedRoofIndex >= 0
          ? repairItemsByCategory.buildings[appliedRoofIndex]
          : null;
        const appliedRoofBlueprintId = inferBuildingBlueprintId(appliedRoofItem);
        const appliedRoofDefinition = BUILDING_BLUEPRINT_DEFINITIONS[appliedRoofBlueprintId];
        roofObject.hidden = !(
          appliedRoofItem?.unlocked &&
          appliedRoofItem?.built &&
          appliedRoofDefinition?.sectionKey === "roof"
        );
        roofObject.style.setProperty(
          "--roof-frame-position",
          appliedRoofDefinition?.framePosition || "left top"
        );

        const appliedWallsIndex = repairAppliedItemBySection.buildings.walls ?? 10;
        const appliedWallsItem = appliedWallsIndex >= 0
          ? repairItemsByCategory.buildings[appliedWallsIndex]
          : null;
        const appliedWallsBlueprintId = inferBuildingBlueprintId(appliedWallsItem);
        const appliedWallsDefinition = BUILDING_BLUEPRINT_DEFINITIONS[appliedWallsBlueprintId];
        wallsObject.hidden = !(
          appliedWallsItem?.unlocked &&
          appliedWallsItem?.built &&
          appliedWallsDefinition?.sectionKey === "walls"
        );
        wallsObject.style.setProperty(
          "--walls-frame-position",
          appliedWallsDefinition?.framePosition || "left top"
        );

        applyMailboxVisibility();
        shedObject.style.setProperty(
          "--shed-frame-position",
          isShedRepaired() ? "right top" : "left top"
        );
        if (!isCarTraveling) {
          carObject.style.setProperty(
            "--car-frame-position",
            isCarRepaired() ? "right top" : "left top"
          );
        }
      }

      function applyRepairState() {
        syncRepairCompletionLabels();
        updateInstalledStructureVisibility();
        renderRepairCategories();
        renderRepairGrid();
        renderRepairItemInfo();
        updateRepairNewBadgeState();
      }

      function selectRepairCategory(category) {
        if (!isRepairCategory(category)) return;

        repairSelectedCategory = category;
        repairSelectedItemByCategory[category] = -1;
        clearRepairCategoryNewState(category);
        applyRepairState();
        updateRepairCategoryLayout();
        saveResourceState();
      }

      function selectRepairItem(index) {
        const normalizedIndex = normalizeRepairItemIndex(index);
        const item = repairItemsByCategory[repairSelectedCategory][normalizedIndex];

        if (!item.unlocked) {
          showToast(REPAIR_BLOCKED_TOAST_MESSAGE);
          return;
        }

        repairSelectedItemByCategory[repairSelectedCategory] = normalizedIndex;
        clearRepairItemNewState(repairSelectedCategory, normalizedIndex);
        applyRepairState();
        saveResourceState();
      }

      function handleRepairAction() {
        if (isExploring) {
          showExploringBusyToast();
          return;
        }

        const selectedIndex = repairSelectedItemByCategory[repairSelectedCategory];
        const item = getSelectedRepairItem();
        if (!item) return;

        if (repairSelectedCategory === "repair") {
          if (!item.unlocked || item.built) return;
          if (!canAffordRepairMaterials(item.materials)) return;
          playSound(CRAFTING_SOUND);
          consumeRepairMaterials(item.materials);
          item.built = true;
          item.isNew = false;
          if (item.blueprintId === SHED_REPAIR_BLUEPRINT_ID) {
            setTodoProgress(2, "item3", true);
          }
          if (item.blueprintId === CAR_REPAIR_BLUEPRINT_ID) {
            setTodoProgress(4, "item3", true);
            clearCarPartsAfterRepair();
          }
          updateResourceHud();
          applyRepairState();
          applyInventoryState();
          saveResourceState();
          return;
        }

        if (!item.built) {
          if (!canAffordRepairMaterials(item.materials)) {
            showToast(REPAIR_MATERIALS_TOAST_MESSAGE);
            return;
          }

          playSound(CRAFTING_SOUND);
          consumeRepairMaterials(item.materials);
          item.built = true;
          item.isNew = false;
          updateResourceHud();
          applyRepairState();
          applyInventoryState();
          saveResourceState();
          return;
        }

        if (getAppliedRepairItemIndex(repairSelectedCategory, selectedIndex) === selectedIndex) {
          const section = getRepairSectionDefinition(
            repairSelectedCategory,
            selectedIndex
          );
          const canRemove = repairSelectedCategory === "outdoor" &&
            (section?.key === "fence" || section?.key === "garden");
          if (!canRemove) return;

          playSound(CRAFTING_SOUND);
          repairAppliedItemBySection.outdoor[section.key] = -1;
          repairSelectedItemByCategory.outdoor = -1;
          applyRepairState();
          saveResourceState();
          return;
        }

        playSound(CRAFTING_SOUND);
        setAppliedRepairItemIndex(repairSelectedCategory, selectedIndex);
        if (repairSelectedCategory === "outdoor") {
          const section = getRepairSectionDefinition("outdoor", selectedIndex);
          if (section?.key === "fence") {
            setTodoProgress(2, "item1", true);
          }
        }
        applyRepairState();
        saveResourceState();
      }

      function loadResourceState() {
        configureExplorationBlueprintDefinitions();

        try {
          const saved = localStorage.getItem(RESOURCE_STORAGE_KEY);
          if (!saved) {
            applyAxeState();
            applyInventoryState();
            applyInventoryNewBadgeState();
            applyRepairState();
            applyTreeVisualState();
            updateResourceHud();
            updateDayStatus();
            applyWeatherState();
            restoreExplorationState();
            return;
          }

          const parsed = JSON.parse(saved);
          const savedGameVersion = String(parsed.version || "").trim();

          if (
            RESET_SAVE_ON_VERSION_MISMATCH &&
            (!GAME_VERSION || savedGameVersion !== GAME_VERSION)
          ) {
            localStorage.removeItem(RESOURCE_STORAGE_KEY);
            applyAxeState();
            applyInventoryState();
            applyInventoryNewBadgeState();
            applyRepairState();
            applyTreeVisualState();
            updateResourceHud();
            updateDayStatus();
            applyWeatherState();
            restoreExplorationState();
            return;
          }

          zombieKillRequirement = normalizeZombieKillRequirement(
            parsed.zombieKillRequirement
          );
          zombieCount = Math.min(
            normalizeStoredCount(parsed.zombies, MAX_ZOMBIE_COUNT),
            zombieKillRequirement
          );
          dayCount = normalizeDayCount(parsed.dayCount);
          rainChancePercent = normalizeRainChancePercent(
            parsed.rainChancePercent
          );
          isRainyToday = dayCount > 1 && parsed.isRainyToday === true;
          zombieKillRequirementResetPending =
            Object.prototype.hasOwnProperty.call(
              parsed,
              "zombieKillRequirementResetPending"
            )
              ? parsed.zombieKillRequirementResetPending === true
              : isRainyToday;
          foodCount = normalizeStoredCount(parsed.food, STORAGE_MAX_FOOD_COUNT);
          // 테스트 모드에서 모든 설계도 제작 재료를 한 번에 지급하면
          // Wood가 일반 최대치를 넘을 수 있으므로 해당 저장값을 그대로 복원합니다.
          woodCount = normalizeStoredCount(
            parsed.wood,
            TEST_MODE ? MAX_INVENTORY_QUANTITY : STORAGE_MAX_WOOD_COUNT
          );
          treeChopCount = clamp(
            Math.round(Number(parsed.treeChopCount) || 0),
            0,
            TREE_MAX_CHOPS_PER_GROWTH
          );
          treeGrowthState = [
            TREE_GROWTH_READY,
            TREE_GROWTH_DEPLETED,
            TREE_GROWTH_REGROWING,
            TREE_GROWTH_REGROWING_HOLD
          ].includes(parsed.treeGrowthState)
            ? parsed.treeGrowthState
            : (treeChopCount >= TREE_MAX_CHOPS_PER_GROWTH
              ? TREE_GROWTH_DEPLETED
              : TREE_GROWTH_READY);
          if (treeGrowthState !== TREE_GROWTH_READY) {
            treeChopCount = TREE_MAX_CHOPS_PER_GROWTH;
          }
          hasAxe = parsed.hasAxe === true;
          hasHandgun = parsed.hasHandgun === true;
          hasHandgunAmmo = parsed.hasHandgunAmmo === true ||
            Number(parsed.handgunAmmo) > 0;
          handgunAmmoCount = normalizeStoredCount(
            parsed.handgunAmmo,
            MAX_INVENTORY_QUANTITY
          );
          hasShotgun = parsed.hasShotgun === true;
          hasShotgunAmmo = parsed.hasShotgunAmmo === true || Number(parsed.shotgunAmmo) > 0;
          shotgunAmmoCount = normalizeStoredCount(parsed.shotgunAmmo, MAX_INVENTORY_QUANTITY);
          hasRifle = parsed.hasRifle === true;
          hasRifleAmmo = parsed.hasRifleAmmo === true || Number(parsed.rifleAmmo) > 0;
          rifleAmmoCount = normalizeStoredCount(parsed.rifleAmmo, MAX_INVENTORY_QUANTITY);
          hasChainsaw = parsed.hasChainsaw === true;
          hasChainsawBattery = parsed.hasChainsawBattery === true || Number(parsed.chainsawBattery) > 0;
          chainsawBatteryPercent = normalizeStoredCount(parsed.chainsawBattery, MAX_CHAINSAW_BATTERY);

          const storedEquippedWeapon = ["axe", "handgun", "shotgun", "rifle", "chainsaw"]
            .includes(parsed.equippedWeapon)
            ? parsed.equippedWeapon
            : (parsed.isChainsawEquipped === true ? "chainsaw"
              : parsed.isRifleEquipped === true ? "rifle"
              : parsed.isShotgunEquipped === true ? "shotgun"
              : parsed.isHandgunEquipped === true ? "handgun"
              : parsed.isAxeEquipped !== false ? "axe" : "");
          isAxeEquipped = storedEquippedWeapon === "axe" && hasAxe;
          isHandgunEquipped = storedEquippedWeapon === "handgun" && hasHandgun;
          isShotgunEquipped = storedEquippedWeapon === "shotgun" && hasShotgun;
          isRifleEquipped = storedEquippedWeapon === "rifle" && hasRifle;
          isChainsawEquipped = storedEquippedWeapon === "chainsaw" && hasChainsaw && chainsawBatteryPercent > 0;
          hasMusicBox = parsed.hasMusicBox === true;
          isMusicOn = hasMusicBox && parsed.isMusicOn !== false;
          hasNewInventoryItem = parsed.hasNewInventoryItem === true;
          const storedNewInventoryItems = Array.isArray(parsed.newInventoryItems)
            ? parsed.newInventoryItems
            : [];

          for (const itemType of storedNewInventoryItems) {
            if (
              typeof itemType === "string" &&
              inventoryItems.some(
                (item) => item.dataset.item === itemType
              )
            ) {
              newInventoryItemTypes.add(itemType);
            }
          }

          if (
            newInventoryItemTypes.size === 0 &&
            hasNewInventoryItem
          ) {
            if (hasHandgun) newInventoryItemTypes.add("handgun");
            if (hasHandgunAmmo) newInventoryItemTypes.add("handgunAmmo");
            if (hasShotgun) newInventoryItemTypes.add("shotgun");
            if (hasShotgunAmmo) newInventoryItemTypes.add("shotgunAmmo");
            if (hasRifle) newInventoryItemTypes.add("rifle");
            if (hasRifleAmmo) newInventoryItemTypes.add("rifleAmmo");
            if (hasChainsaw) newInventoryItemTypes.add("chainsaw");
            if (hasChainsawBattery) newInventoryItemTypes.add("chainsawBattery");
          }

          const storedViewedInventoryNewItems = Array.isArray(
            parsed.viewedInventoryNewItems
          )
            ? parsed.viewedInventoryNewItems
            : [];
          for (const itemType of storedViewedInventoryNewItems) {
            if (
              typeof itemType === "string" &&
              newInventoryItemTypes.has(itemType)
            ) {
              viewedInventoryNewItemTypes.add(itemType);
            }
          }
          hasCompass = parsed.hasCompass === true;
          hasStrangerLetter = parsed.hasStrangerLetter === true;
          isStrangerLetterOn = hasStrangerLetter && parsed.isStrangerLetterOn !== false;
          carPartsCount = normalizeStoredCount(parsed.carParts, getMaxCarPartsCount());
          flowerCount = normalizeStoredCount(parsed.flowers, MAX_INVENTORY_QUANTITY);
          const storedPaintCounts = parsed.paintCounts && typeof parsed.paintCounts === "object"
            ? parsed.paintCounts
            : {};
          for (const itemType of Object.keys(paintCounts)) {
            paintCounts[itemType] = normalizeStoredCount(
              storedPaintCounts[itemType] ?? parsed[itemType],
              MAX_INVENTORY_QUANTITY
            );
          }
          repairKitCount = normalizeStoredCount(
            parsed.repairKit ?? (parsed.hasRepairKit === true ? 1 : 0),
            MAX_INVENTORY_QUANTITY
          );
          mailboxIntroTriggered = parsed.mailboxIntroTriggered === true;
          currentTodoListId = clamp(Math.round(Number(parsed.currentTodoListId) || 0), 0, 5);
          todoSubmittedListId = clamp(Math.round(Number(parsed.todoSubmittedListId) || 0), 0, 5);
          todoSubmittedDay = normalizeDayCount(parsed.todoSubmittedDay || 0);
          const storedTodoProgress = parsed.todoProgress && typeof parsed.todoProgress === "object"
            ? parsed.todoProgress
            : null;
          if (storedTodoProgress) {
            const storedTodoSchemaVersion = Math.max(1, Math.round(Number(parsed.todoSchemaVersion) || 1));
            for (const [listId, tasks] of Object.entries(todoProgress)) {
              const storedTasks = storedTodoProgress[listId];
              if (!storedTasks || typeof storedTasks !== "object") continue;
              for (const key of Object.keys(tasks)) {
                tasks[key] = storedTasks[key] === true;
              }
            }

            if (storedTodoSchemaVersion < TODO_SCHEMA_VERSION) {
              const previousThirdList = storedTodoProgress[3] || {};
              todoProgress[3].item1 = false;
              todoProgress[3].item2 = previousThirdList.item1 === true;
              todoProgress[3].item3 = previousThirdList.item2 === true;
              todoProgress[4].item1 = previousThirdList.item1 === true;
              todoProgress[4].item3 = previousThirdList.item3 === true;
            }
          }
          fuelCount = normalizeStoredCount(parsed.fuel, MAX_INVENTORY_QUANTITY);
          hasMap = parsed.hasMap === true ||
            parsed.map === true ||
            Number(parsed.map) > 0;

          const storedExplorationNewState =
            parsed.explorationNewState &&
            typeof parsed.explorationNewState === "object"
              ? parsed.explorationNewState
              : null;
          if (storedExplorationNewState) {
            hasExploreButtonNew = storedExplorationNewState.button === true;
            const storedDestinations =
              storedExplorationNewState.destinations &&
              typeof storedExplorationNewState.destinations === "object"
                ? storedExplorationNewState.destinations
                : {};
            const storedTriggered =
              storedExplorationNewState.triggered &&
              typeof storedExplorationNewState.triggered === "object"
                ? storedExplorationNewState.triggered
                : {};

            for (const destination of ["village", "forest", "city"]) {
              explorationDestinationNewState[destination] =
                storedDestinations[destination] === true;
              explorationUnlockAnnouncementTriggered[destination] =
                storedTriggered[destination] === true;
            }
          }

          explorationDestination = typeof parsed.explorationDestination === "string"
            ? parsed.explorationDestination
            : "";
          explorationEndsAt = Number.isFinite(Number(parsed.explorationEndsAt))
            ? Math.max(0, Number(parsed.explorationEndsAt))
            : 0;
          if (explorationEndsAt > 0 && isChainsawEquipped) {
            isChainsawEquipped = false;
          }

          const savedAt = Number.isFinite(Number(parsed.savedAt))
            ? Math.max(0, Number(parsed.savedAt))
            : Date.now();
          lastZombieSpawnAt = Number.isFinite(Number(parsed.lastZombieSpawnAt))
            ? Math.max(0, Number(parsed.lastZombieSpawnAt))
            : savedAt;
          lastDeerSpawnAt = Number.isFinite(Number(parsed.lastDeerSpawnAt))
            ? Math.max(0, Number(parsed.lastDeerSpawnAt))
            : savedAt;
          storedPopulationSnapshot = {
            savedAt,
            explorationEndsAt,
            activeZombies: normalizeStoredCount(
              parsed.activeZombies,
              MAX_ACTIVE_ZOMBIES
            ),
            activeDeer: normalizeStoredCount(
              parsed.activeDeer,
              MAX_ACTIVE_DEER
            )
          };

          // 첫 좀비 처치 새 떼 연출은 별도 저장해 게임 초기화 전까지 한 번만 재생합니다.
          firstKillBirdFlockPlayed =
            parsed.firstKillBirdFlockPlayed === true;
          loadRepairState(parsed.repairState);
          if (isCarRepaired()) {
            clearCarPartsAfterRepair();
          }
          // 이전 저장 파일의 비어 있던 설계도 슬롯이 새 정의를 덮지 않게 다시 적용합니다.
          configureExplorationBlueprintDefinitions();
          for (const listId of [1, 2, 3, 4]) {
            syncTodoProgressFromCurrentState(listId);
          }
          hasRepairButtonNew = REPAIR_CATEGORY_ORDER.some(
            (category) => getRepairCategoryHasNewItems(category)
          );
        } catch (_) {
          // file:// 환경 등에서 저장소를 사용할 수 없어도 게임은 계속 동작합니다.
        }

        // 페이지를 처음 열 때 이미 Axe를 보유하고 있었다면 기존 튜토리얼성 시작 처리는 건너뜁니다.
        // 새 떼 연출 여부는 Axe 보유와 분리해 저장된 전용 플래그만 사용합니다.
        skipFirstStartSequence = hasAxe;

        applyAxeState();
        applyInventoryState();
        applyInventoryNewBadgeState();
        applyRepairState();
        applyTreeVisualState();
        updateTodoListUI();
        updateResourceHud();
        updateDayStatus();
        applyWeatherState();
        restoreExplorationState();
      }

      function saveResourceState() {
        if (isStateSaveSuppressed) return;

        try {
          localStorage.setItem(
            RESOURCE_STORAGE_KEY,
            JSON.stringify({
              version: GAME_VERSION,
              zombies: zombieCount,
              zombieKillRequirement,
              dayCount,
              rainChancePercent,
              isRainyToday,
              zombieKillRequirementResetPending,
              food: foodCount,
              wood: woodCount,
              treeChopCount,
              treeGrowthState,
              hasAxe,
              isAxeEquipped,
              hasHandgun,
              isHandgunEquipped,
              hasHandgunAmmo,
              handgunAmmo: handgunAmmoCount,
              hasShotgun,
              isShotgunEquipped,
              hasShotgunAmmo,
              shotgunAmmo: shotgunAmmoCount,
              hasRifle,
              isRifleEquipped,
              hasRifleAmmo,
              rifleAmmo: rifleAmmoCount,
              hasChainsaw,
              isChainsawEquipped,
              hasChainsawBattery,
              chainsawBattery: chainsawBatteryPercent,
              equippedWeapon: getEquippedWeapon(),
              hasMusicBox,
              isMusicOn,
              hasNewInventoryItem,
              newInventoryItems: Array.from(newInventoryItemTypes),
              viewedInventoryNewItems: Array.from(viewedInventoryNewItemTypes),
              hasCompass,
              hasStrangerLetter,
              isStrangerLetterOn,
              carParts: carPartsCount,
              flowers: flowerCount,
              paintCounts: { ...paintCounts },
              repairKit: repairKitCount,
              hasRepairKit: repairKitCount > 0,
              mailboxIntroTriggered,
              currentTodoListId,
              todoSubmittedListId,
              todoSubmittedDay,
              todoSchemaVersion: TODO_SCHEMA_VERSION,
              todoProgress,
              fuel: fuelCount,
              hasMap,
              explorationNewState: {
                button: hasExploreButtonNew,
                destinations: { ...explorationDestinationNewState },
                triggered: { ...explorationUnlockAnnouncementTriggered }
              },
              repairState: serializeRepairState(),
              firstKillBirdFlockPlayed,
              explorationDestination,
              explorationEndsAt: isExploring ? explorationEndsAt : 0,
              activeZombies: getLivingZombieCount(),
              activeDeer: getLivingDeerCount(),
              lastZombieSpawnAt,
              lastDeerSpawnAt,
              savedAt: Date.now()
            })
          );
        } catch (_) {
          // 저장 실패는 게임 진행에 영향을 주지 않습니다.
        }
      }

      function getRequirementValue(requirement) {
        if (requirement === "zombies") return zombieCount;
        if (requirement === "food") return foodCount;
        if (requirement === "compass") return hasCompass ? 1 : 0;
        if (requirement === "fuel") return fuelCount;
        if (requirement === "map") return hasMap ? 1 : 0;
        if (requirement === "car") return isCarRepaired() ? 1 : 0;
        return 0;
      }

      function updateExplorationRequirements() {
        for (const item of explorationRequirementItems) {
          const requirement = item.dataset.requirement || "";
          const required = requirement === "zombies"
            ? zombieKillRequirement
            : Math.max(0, Number(item.dataset.required) || 0);
          const current = getRequirementValue(requirement);
          const currentElement = item.querySelector(
            ".exploration-requirement-current"
          );
          const totalElement = item.querySelector(
            ".exploration-requirement-total"
          );

          if (currentElement) {
            currentElement.textContent = String(current);
          }

          if (totalElement) {
            totalElement.textContent = String(required);
          }

          const isComplete = current >= required;
          item.classList.toggle("is-complete", isComplete);
          item.hidden =
            item.classList.contains("is-label-only") && isComplete;
        }

        syncExplorationUnlockNewState({
          animate: hasGameInitialized,
          persist: hasGameInitialized
        });
      }

      function updateResourceHud() {
        countElement.textContent = String(zombieCount);
        zombieGoalElement.textContent = String(zombieKillRequirement);
        foodCountElement.textContent = String(foodCount);
        woodCountElement.textContent = String(woodCount);
        const foodContainer = foodCountElement.parentElement;
        const woodContainer = woodCountElement.parentElement;
        if (foodContainer && foodContainer.lastChild) {
          foodContainer.lastChild.textContent = `/${getMaxFoodCount()}`;
        }
        if (woodContainer && woodContainer.lastChild) {
          woodContainer.lastChild.textContent = `/${getMaxWoodCount()}`;
        }
        updateExplorationRequirements();
      }

      function createDayNumberValue(value) {
        const element = document.createElement("span");
        element.className = "day-number-value";
        element.textContent = String(value);
        return element;
      }

      function setDayNumberImmediately(value) {
        dayNumberAnimationToken += 1;

        if (dayNumberAnimationTimerId !== null) {
          clearTimeout(dayNumberAnimationTimerId);
          dayNumberAnimationTimerId = null;
        }

        dayNumberTrack.classList.remove("is-rolling");
        dayNumberViewport.classList.remove("is-resizing");
        dayNumberTrack.replaceChildren(createDayNumberValue(value));
        dayNumberViewport.style.width = `${dayNumberTrack.scrollWidth}px`;
        renderedDayCount = value;
        dayNumber.setAttribute("aria-label", `DAY ${value}`);
      }

      function animateDayNumberTo(value) {
        if (value === renderedDayCount) {
          setDayNumberImmediately(value);
          return;
        }

        const animationToken = ++dayNumberAnimationToken;
        const previousValue = renderedDayCount;

        if (dayNumberAnimationTimerId !== null) {
          clearTimeout(dayNumberAnimationTimerId);
          dayNumberAnimationTimerId = null;
        }

        const previousValueElement = createDayNumberValue(previousValue);
        const nextValueElement = createDayNumberValue(value);

        dayNumberTrack.classList.remove("is-rolling");
        dayNumberViewport.classList.remove("is-resizing");
        dayNumberTrack.replaceChildren(
          previousValueElement,
          nextValueElement
        );

        const previousNumberWidth = previousValueElement.getBoundingClientRect().width;
        const nextNumberWidth = nextValueElement.getBoundingClientRect().width;
        dayNumberViewport.style.width = `${previousNumberWidth}px`;
        dayNumber.setAttribute("aria-label", `DAY ${value}`);

        const finishAnimation = () => {
          if (animationToken !== dayNumberAnimationToken) return;

          if (dayNumberAnimationTimerId !== null) {
            clearTimeout(dayNumberAnimationTimerId);
            dayNumberAnimationTimerId = null;
          }

          dayNumberTrack.classList.remove("is-rolling");
          dayNumberViewport.classList.remove("is-resizing");
          dayNumberTrack.replaceChildren(createDayNumberValue(value));
          dayNumberViewport.style.width = `${nextNumberWidth}px`;
          renderedDayCount = value;
        };

        nextValueElement.addEventListener("animationend", finishAnimation, {
          once: true
        });

        // 귀환 후 3초 대기한 다음 롤링을 시작합니다.
        dayNumberAnimationTimerId = window.setTimeout(() => {
          if (animationToken !== dayNumberAnimationToken) return;

          // 내용을 교체한 뒤에도 애니메이션이 확실히 재시작되게 합니다.
          void dayNumberTrack.offsetHeight;
          dayNumberViewport.classList.add("is-resizing");
          dayNumberTrack.classList.add("is-rolling");
          dayNumberViewport.style.width = `${nextNumberWidth}px`;

          dayNumberAnimationTimerId = window.setTimeout(
            finishAnimation,
            DAY_NUMBER_ROLL_FALLBACK_MS
          );
        }, DAY_NUMBER_ROLL_DELAY_MS);
      }

      function updateDayStatus(options = {}) {
        dayStatus.classList.toggle("is-hidden", isExploring);

        if (
          options.animateDay === true &&
          !isExploring &&
          dayCount !== renderedDayCount
        ) {
          animateDayNumberTo(dayCount);
        } else {
          setDayNumberImmediately(dayCount);
        }
      }

      function commitResourceState(options = {}) {
        updateResourceHud();
        updateDayStatus(options);
        saveResourceState();
      }

      function getLivingZombieCount() {
        let count = 0;

        for (const zombie of zombies.values()) {
          if (
            zombie.state !== "dying" &&
            zombie.state !== "removed"
          ) {
            count += 1;
          }
        }

        return count;
      }

      function isZombieVisibleInCurrentViewport(zombie) {
        if (
          zombie.state === "dying" ||
          zombie.state === "removed"
        ) {
          return false;
        }

        const visibleBounds = getVisibleWorldBounds();
        const marginX = HALF_W + 16;
        const marginY = HALF_H + 16;

        return !(
          zombie.x + marginX < visibleBounds.left ||
          zombie.x - marginX > visibleBounds.right ||
          zombie.y + marginY < visibleBounds.top ||
          zombie.y - marginY > visibleBounds.bottom
        );
      }

      function getVisibleLivingZombieCount() {
        let count = 0;

        for (const zombie of zombies.values()) {
          if (isZombieVisibleInCurrentViewport(zombie)) {
            count += 1;
          }
        }

        return count;
      }

      function getLivingDeerCount() {
        let count = 0;

        for (const deer of deerMap.values()) {
          if (
            deer.state !== "dying" &&
            deer.state !== "leaving" &&
            deer.state !== "removed"
          ) {
            count += 1;
          }
        }

        return count;
      }

      function isDeerVisibleInCurrentViewport(deer) {
        if (
          deer.state === "dying" ||
          deer.state === "leaving" ||
          deer.state === "removed"
        ) {
          return false;
        }

        const visibleBounds = getVisibleWorldBounds();
        const marginX = DEER_HALF_W + 16;
        const marginY = DEER_HALF_H + 16;

        return !(
          deer.x + marginX < visibleBounds.left ||
          deer.x - marginX > visibleBounds.right ||
          deer.y + marginY < visibleBounds.top ||
          deer.y - marginY > visibleBounds.bottom
        );
      }

      function getVisibleLivingDeerCount(ignoredDeerId = null) {
        let count = 0;

        for (const deer of deerMap.values()) {
          if (deer.id === ignoredDeerId) continue;
          if (isDeerVisibleInCurrentViewport(deer)) {
            count += 1;
          }
        }

        return count;
      }

      function restoreStoredPopulation() {
        if (!storedPopulationSnapshot) return;

        const now = Date.now();
        const snapshot = storedPopulationSnapshot;
        let targetZombieCount = snapshot.activeZombies;
        let targetDeerCount = snapshot.activeDeer;

        if (isExploring) {
          // 탐험 중 닫았다가 다시 열면 기존 개체 수만 복원하고,
          // 탐험 중 경과 시간은 필드 생성 시간으로 계산하지 않습니다.
          lastZombieSpawnAt = now;
          lastDeerSpawnAt = now;
        } else {
          const explorationFinishedWhileClosed =
            snapshot.explorationEndsAt > snapshot.savedAt;
          const zombieSpawnEligibleAt = explorationFinishedWhileClosed
            ? Math.max(
                lastZombieSpawnAt,
                snapshot.explorationEndsAt + 7_000
              )
            : lastZombieSpawnAt;
          const deerSpawnEligibleAt = explorationFinishedWhileClosed
            ? Math.max(lastDeerSpawnAt, snapshot.explorationEndsAt)
            : lastDeerSpawnAt;
          const elapsedZombieTicks = Math.max(
            0,
            Math.floor(
              (now - zombieSpawnEligibleAt) / SPAWN_INTERVAL_MS
            )
          );
          const elapsedDeerTicks = firstKillBirdFlockPlayed
            ? Math.max(
                0,
                Math.floor(
                  (now - deerSpawnEligibleAt) / DEER_SPAWN_INTERVAL_MS
                )
              )
            : 0;
          const remainingZombieCapacity = Math.max(
            0,
            Math.min(
              MAX_ACTIVE_ZOMBIES,
              zombieKillRequirement - zombieCount
            )
          );

          targetZombieCount = Math.min(
            remainingZombieCapacity,
            targetZombieCount + elapsedZombieTicks
          );
          targetDeerCount = firstKillBirdFlockPlayed
            ? Math.min(
                MAX_ACTIVE_DEER,
                targetDeerCount +
                  (foodCount < getMaxFoodCount()
                    ? elapsedDeerTicks
                    : 0)
              )
            : 0;
          lastZombieSpawnAt = Math.min(
            now,
            zombieSpawnEligibleAt +
              elapsedZombieTicks * SPAWN_INTERVAL_MS
          );
          lastDeerSpawnAt = Math.min(
            now,
            deerSpawnEligibleAt +
              elapsedDeerTicks * DEER_SPAWN_INTERVAL_MS
          );
        }

        targetZombieCount = Math.min(
          targetZombieCount,
          MAX_ACTIVE_POPULATION
        );
        if (!firstKillBirdFlockPlayed) {
          targetDeerCount = 0;
        }
        targetDeerCount = Math.min(
          targetDeerCount,
          Math.max(0, MAX_ACTIVE_POPULATION - targetZombieCount)
        );

        for (let index = 0; index < targetZombieCount; index += 1) {
          if (!createZombie({
            force: true,
            silent: true,
            persist: false,
            skipBirth: true,
            preferVisible: true
          })) {
            break;
          }
        }

        for (let index = 0; index < targetDeerCount; index += 1) {
          if (!createDeer({
            force: true,
            persist: false,
            skipBirth: true,
            preferVisible: true
          })) {
            break;
          }
        }

        storedPopulationSnapshot = null;
        saveResourceState();
      }

      function getActivePopulationCount() {
        return zombies.size + deerMap.size;
      }

      function hasActivePopulationCapacity() {
        return getActivePopulationCount() < MAX_ACTIVE_POPULATION;
      }

      function canCreateZombie() {
        return (
          !isExploring &&
          Date.now() >= zombieSpawnBlockedUntil &&
          hasActivePopulationCapacity() &&
          zombieCount + getLivingZombieCount() < zombieKillRequirement
        );
      }

      function showExploringBusyToast(event) {
        if (event) {
          event.preventDefault();
          event.stopPropagation();
        }

        showToast(EXPLORING_BUSY_TOAST_MESSAGE);
      }

      function syncMenuBackdrop() {
        const isAnyMenuOpen =
          isExplorationMenuOpen || isInventoryOpen || isRepairOpen;

        menuBackdrop.classList.toggle("is-open", isAnyMenuOpen);
        menuBackdrop.setAttribute(
          "aria-hidden",
          isAnyMenuOpen ? "false" : "true"
        );
      }

      function closeExplorationMenu(syncBackdrop = true) {
        if (!isExplorationMenuOpen) return;

        isExplorationMenuOpen = false;
        explorationOverlay.classList.remove("is-open");
        explorationOverlay.setAttribute("aria-hidden", "true");
        setHudActionMenuState(exploreButton, false);
        if (syncBackdrop) syncMenuBackdrop();
      }

      function closeInventory(syncBackdrop = true) {
        if (!isInventoryOpen) return;

        isInventoryOpen = false;
        inventoryOverlay.classList.remove("is-open");
        inventoryOverlay.setAttribute("aria-hidden", "true");
        setHudActionMenuState(inventoryButton, false);
        if (syncBackdrop) syncMenuBackdrop();
      }

      function closeRepair(syncBackdrop = true) {
        if (!isRepairOpen) return;

        isRepairOpen = false;
        repairOverlay.classList.remove("is-open");
        repairOverlay.setAttribute("aria-hidden", "true");
        setHudActionMenuState(repairButton, false);
        if (syncBackdrop) syncMenuBackdrop();
      }

      function hasAnyInventoryItem() {
        return hasAxe ||
          hasHandgun ||
          hasHandgunAmmo ||
          hasShotgun ||
          hasShotgunAmmo ||
          hasRifle ||
          hasRifleAmmo ||
          hasChainsaw ||
          hasChainsawBattery ||
          hasMusicBox ||
          hasStrangerLetter ||
          hasCompass ||
          carPartsCount > 0 ||
          fuelCount > 0 ||
          repairKitCount > 0 ||
          hasMap ||
          Object.values(paintCounts).some((count) => count > 0);
      }

      function getInventoryItemLabel(item) {
        const label = item?.querySelector(".inventory-item__label");
        return String(label?.textContent || "").trim();
      }

      function getInventoryItemSortGroup(item) {
        const itemType = item?.dataset.item || "";
        return INVENTORY_ITEM_SORT_GROUPS[itemType] ?? 3;
      }

      function getInventoryQuantitySortGroup(item) {
        const itemType = item?.dataset.item || "";
        return INVENTORY_QUANTITY_SORT_GROUPS[itemType] ?? 3;
      }

      function sortInventoryItems(items) {
        return [...items].sort((leftItem, rightItem) => {
          const leftGroup = getInventoryItemSortGroup(leftItem);
          const rightGroup = getInventoryItemSortGroup(rightItem);
          const groupDifference = leftGroup - rightGroup;
          if (groupDifference !== 0) return groupDifference;

          if (leftGroup === 2) {
            const quantityGroupDifference =
              getInventoryQuantitySortGroup(leftItem) -
              getInventoryQuantitySortGroup(rightItem);
            if (quantityGroupDifference !== 0) {
              return quantityGroupDifference;
            }
          }

          return getInventoryItemLabel(leftItem).localeCompare(
            getInventoryItemLabel(rightItem),
            "en",
            { sensitivity: "base" }
          );
        });
      }

      function getFirstVisibleInventoryItem() {
        return inventoryTrack.querySelector(".inventory-item:not([hidden])");
      }

      function getInventoryPageWidth() {
        return Math.max(1, inventoryViewport.getBoundingClientRect().width);
      }

      function setInventoryTrackOffset(offset, animate) {
        inventoryTrack.classList.toggle("is-dragging", !animate);
        inventoryTrack.style.transform = `translate3d(${offset}px, 0, 0)`;
      }

      function inventoryPageHasUnseenNewItem(pageIndex) {
        const pageItemTypes = inventoryPageItemTypes[pageIndex] || [];
        return pageItemTypes.some(
          (itemType) =>
            newInventoryItemTypes.has(itemType) &&
            !viewedInventoryNewItemTypes.has(itemType)
        );
      }

      function acknowledgeInventoryPageNewState(pageIndex) {
        const pageItemTypes = inventoryPageItemTypes[pageIndex] || [];
        let didChange = false;

        for (const itemType of pageItemTypes) {
          if (
            newInventoryItemTypes.has(itemType) &&
            !viewedInventoryNewItemTypes.has(itemType)
          ) {
            viewedInventoryNewItemTypes.add(itemType);
            didChange = true;
          }
        }

        if (didChange) saveResourceState();
        return didChange;
      }

      function updateInventoryPageDots() {
        inventoryPagination.replaceChildren();
        inventoryPagination.hidden = inventoryPageCount <= 1;

        if (inventoryPageCount <= 1) return;

        if (inventoryPageCount > INVENTORY_DOT_PAGE_LIMIT) {
          const counter = document.createElement("span");
          counter.className = "inventory-page-counter";
          counter.textContent = `${inventoryCurrentPage + 1}/${inventoryPageCount}`;
          counter.setAttribute(
            "aria-label",
            `Bag page ${inventoryCurrentPage + 1} of ${inventoryPageCount}`
          );
          inventoryPagination.append(counter);
          return;
        }

        for (let index = 0; index < inventoryPageCount; index += 1) {
          const dot = document.createElement("button");
          dot.type = "button";
          dot.className = "inventory-page-dot";
          dot.classList.toggle("is-current", index === inventoryCurrentPage);
          dot.classList.toggle(
            "is-new",
            inventoryPageHasUnseenNewItem(index)
          );
          dot.setAttribute("aria-label", `Bag page ${index + 1}`);
          dot.setAttribute(
