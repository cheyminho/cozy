            const timeUntilOutside = getCloudTimeUntilOutside(
              cloud,
              visibleBounds,
              worldSpeed
            );

            /*
              완전히 화면 밖으로 나가기 약 1초 전부터 페이드아웃합니다.
              화면 이동으로 이미 경계를 넘은 경우에도 즉시 제거하지 않고
              같은 1초 페이드아웃을 적용합니다.
            */
            if (
              timeUntilOutside <= CLOUD_FADE_DURATION_MS ||
              isCloudOutsideVisibleArea(cloud, visibleBounds)
            ) {
              startCloudFadeOut(cloud, now);
            }
          }

          updateCloudOpacity(cloud, now);

          if (
            cloud.isFadingOut &&
            now - cloud.fadeOutStartedAt >= CLOUD_FADE_DURATION_MS
          ) {
            removeCloud(cloud, group);
          }
        }

        if (
          group.length < cloudTargetCounts[kind] &&
          now >= nextCloudSpawnAt[kind]
        ) {
          const created = createCloud(kind, false);
          nextCloudSpawnAt[kind] = now + (created ? 1_500 : 2_500);
        }
      }

      function initializeClouds() {
        cloudTargetCounts.sky = randomCloudCount(
          CLOUD_MIN_COUNT,
          CLOUD_MAX_COUNT
        );
        cloudTargetCounts.shadow = randomCloudCount(
          CLOUD_SHADOW_MIN_COUNT,
          CLOUD_SHADOW_MAX_COUNT
        );

        for (
          let index = 0;
          index < cloudTargetCounts.sky;
          index += 1
        ) {
          createCloud("sky", true);
        }

        for (
          let index = 0;
          index < cloudTargetCounts.shadow;
          index += 1
        ) {
          createCloud("shadow", true);
        }
      }

      function setBirdFrame(bird, frameIndex) {
        const normalizedFrame =
          frameIndex % BIRD_FRAME_COUNT;
        const col =
          normalizedFrame % BIRD_SHEET_COLUMNS;
        const row = Math.floor(
          normalizedFrame / BIRD_SHEET_COLUMNS
        );
        const position = `${col * 50}% ${row * 50}%`;

        // 3×3 스프라이트 시트는 각 축의 0% / 50% / 100% 위치를 사용합니다.
        bird.element.style.webkitMaskPosition = position;
        bird.element.style.maskPosition = position;
      }

      function createBirdFlock(count, isFirstKillFlock = false) {
        const visibleBounds = getVisibleWorldBounds();
        const visibleWidth = visibleBounds.right - visibleBounds.left;
        const visibleHeight = visibleBounds.bottom - visibleBounds.top;
        const margin = Math.max(
          220 / worldScale,
          Math.min(visibleWidth, visibleHeight) * 0.12
        );

        // 모든 새는 현재 화면 기준의 좌하단 바깥에서 우상단 바깥으로 이동합니다.
        // birds 레이어가 world 내부에 있으므로, 드래그 시 배경과 함께 자연스럽게 이동합니다.
        const verticalMargin =
          margin * BIRD_PATH_VERTICAL_MARGIN_FACTOR;

        // 간헐적 출현 무리는 전체 경로를 위아래로 조금씩 옮겨서
        // 같은 높이에서만 지나가지 않도록 합니다.
        const flockVerticalShift = isFirstKillFlock
          ? 0
          : randomBetween(
              -AMBIENT_BIRD_FLOCK_VERTICAL_SHIFT_PX,
              AMBIENT_BIRD_FLOCK_VERTICAL_SHIFT_PX
            );

        const baseStart = {
          x: visibleBounds.left - margin,
          y: visibleBounds.bottom + verticalMargin + flockVerticalShift
        };
        const baseEnd = {
          x: visibleBounds.right + margin,
          y: visibleBounds.top - verticalMargin + flockVerticalShift
        };
        const pathX = baseEnd.x - baseStart.x;
        const pathY = baseEnd.y - baseStart.y;
        const pathLength = Math.hypot(pathX, pathY);
        const direction = {
          x: pathX / pathLength,
          y: pathY / pathLength
        };
        const perpendicular = {
          x: -direction.y,
          y: direction.x
        };
        const speed = isFirstKillFlock
          ? FIRST_KILL_BIRD_SPEED_SCREEN_PX_PER_MS
          : AMBIENT_BIRD_SPEED_SCREEN_PX_PER_MS;
        const baseDuration = pathLength / speed;
        const now = performance.now();

        const flockSlots = [];

        for (let index = 0; index < count; index += 1) {
          const element = document.createElement("div");
          element.className = "bird";
          birdsLayer.appendChild(element);

          // 진행 방향 앞뒤 간격과 대각선에 수직인 간격을 섞어 자연스러운 무리를 만듭니다.
          // 이미 뽑힌 새들과 너무 가까운 경로는 다시 뽑아 겹침을 줄입니다.
          let trailOffset = 0;
          let lateralOffset = 0;
          let slotAccepted = false;

          for (let attempt = 0; attempt < 40; attempt += 1) {
            const candidateTrailOffset = randomBetween(-80, 130);
            const candidateLateralOffset = randomBetween(-72, 72);

            const overlapsExistingSlot = flockSlots.some((slot) => {
              const trailGap = Math.abs(
                candidateTrailOffset - slot.trailOffset
              );
              const lateralGap = Math.abs(
                candidateLateralOffset - slot.lateralOffset
              );
              const pathDistance = Math.hypot(trailGap, lateralGap);

              return (
                pathDistance < BIRD_MIN_PATH_DISTANCE_PX ||
                (trailGap < BIRD_MIN_TRAIL_GAP_PX &&
                  lateralGap < BIRD_MIN_LATERAL_GAP_PX)
              );
            });

            if (overlapsExistingSlot) {
              continue;
            }

            trailOffset = candidateTrailOffset;
            lateralOffset = candidateLateralOffset;
            slotAccepted = true;
            break;
          }

          if (!slotAccepted) {
            trailOffset = randomBetween(-80, 130);
            lateralOffset = randomBetween(-72, 72);
          }

          flockSlots.push({
            trailOffset,
            lateralOffset
          });

          const startX =
            baseStart.x +
            direction.x * trailOffset +
            perpendicular.x * lateralOffset;
          const startY =
            baseStart.y +
            direction.y * trailOffset +
            perpendicular.y * lateralOffset;
          const endX =
            baseEnd.x +
            direction.x * trailOffset +
            perpendicular.x * lateralOffset;
          const endY =
            baseEnd.y +
            direction.y * trailOffset +
            perpendicular.y * lateralOffset;
          const scale = randomBetween(
            BIRD_MIN_SCALE,
            BIRD_MAX_SCALE
          );
          const delay = randomBetween(0, isFirstKillFlock ? 240 : 180);
          const duration = baseDuration * randomBetween(0.92, 1.08);
          const frameOffset = Math.floor(
            Math.random() * BIRD_FRAME_COUNT
          );

          const bird = {
            element,
            startX,
            startY,
            endX,
            endY,
            scale,
            startedAt: now + delay,
            duration,
            frameOffset,
            fps: isFirstKillFlock ? FIRST_KILL_BIRD_FPS : BIRD_FPS
          };

          birds.push(bird);
          element.style.left = `${startX}px`;
          element.style.top = `${startY}px`;
          element.style.opacity = "0";
          element.style.transform =
            `translate(-50%, -50%) scale(${scale})`;
          setBirdFrame(bird, frameOffset);
        }
      }

      function updateBirds(now) {
        for (let index = birds.length - 1; index >= 0; index -= 1) {
          const bird = birds[index];
          const elapsed = now - bird.startedAt;

          if (elapsed < 0) {
            continue;
          }

          const progress = clamp(elapsed / bird.duration, 0, 1);
          const x = bird.startX + (bird.endX - bird.startX) * progress;
          const y = bird.startY + (bird.endY - bird.startY) * progress;
          const frameDuration = 1000 / bird.fps;
          const frameIndex =
            bird.frameOffset + Math.floor(elapsed / frameDuration);

          bird.element.style.left = `${x}px`;
          bird.element.style.top = `${y}px`;
          bird.element.style.opacity = "1";
          setBirdFrame(bird, frameIndex);

          if (progress >= 1) {
            bird.element.remove();
            birds.splice(index, 1);
          }
        }
      }

      function scheduleNextAmbientBirdFlock() {
        if (ambientBirdTimer !== null) {
          clearTimeout(ambientBirdTimer);
        }

        const delay = randomBetween(
          AMBIENT_BIRD_MIN_INTERVAL_MS,
          AMBIENT_BIRD_MAX_INTERVAL_MS
        );

        ambientBirdTimer = window.setTimeout(() => {
          const count = Math.floor(
            randomBetween(
              AMBIENT_BIRD_MIN_COUNT,
              AMBIENT_BIRD_MAX_COUNT + 1
            )
          );

          createBirdFlock(count, false);
          scheduleNextAmbientBirdFlock();
        }, delay);
      }

      function triggerFirstKillBirdFlock() {
        if (firstKillBirdFlockPlayed) return false;

        firstKillBirdFlockPlayed = true;
        saveResourceState();
        createBirdFlock(FIRST_KILL_BIRD_COUNT, true);
        playBirdFlySound();
        scheduleNextAmbientBirdFlock();
        return true;
      }

      function randomDirection() {
        const angle = Math.random() * Math.PI * 2;
        return {
          x: Math.cos(angle),
          y: Math.sin(angle)
        };
      }

      function randomDeathStartFrame() {
        return Math.random() < 0.5 ? 0 : 4;
      }

      function isInsideInflatedZoneFor(
        zone,
        x,
        y,
        halfWidth,
        halfHeight
      ) {
        return (
          x > zone.left - halfWidth &&
          x < zone.right + halfWidth &&
          y > zone.top - halfHeight &&
          y < zone.bottom + halfHeight
        );
      }

      function isInsideInflatedSafeZoneFor(x, y, halfWidth, halfHeight) {
        return isInsideInflatedZoneFor(
          SAFE_ZONE,
          x,
          y,
          halfWidth,
          halfHeight
        );
      }

      function isInsideInflatedSafeZone(x, y) {
        return isInsideInflatedSafeZoneFor(x, y, HALF_W, HALF_H);
      }

      function getCenteredStructureSafeZone(element) {
        const halfSafeSize = STRUCTURE_SAFE_ZONE_SIZE / 2;
        const centerX = element.offsetLeft + element.offsetWidth / 2;
        const centerY = element.offsetTop + element.offsetHeight / 2;

        return {
          left: centerX - halfSafeSize,
          top: centerY - halfSafeSize,
          right: centerX + halfSafeSize,
          bottom: centerY + halfSafeSize
        };
      }

      // 창고와 자동차는 게임 중 위치·크기가 바뀌지 않으므로,
      // 이동 및 생성 판정마다 offset 값을 다시 읽지 않고 캐시를 공유합니다.
      let cachedStructureSafeZones = [];
      let cachedZombieSafeZones = [SAFE_ZONE];
      let cachedDeerSafeZones = [SAFE_ZONE];

      function refreshStructureSafeZones() {
        const shedSafeZone = getCenteredStructureSafeZone(shedObject);
        const carSafeZone = getCenteredStructureSafeZone(carObject);

        cachedStructureSafeZones = [shedSafeZone, carSafeZone];
        cachedZombieSafeZones = [SAFE_ZONE, ...cachedStructureSafeZones];
        cachedDeerSafeZones = [SAFE_ZONE, ...cachedStructureSafeZones];
      }

      function getStructureSafeZones() {
        return cachedStructureSafeZones;
      }

      function getZombieSafeZones() {
        return cachedZombieSafeZones;
      }

      function getDeerSafeZones() {
        return cachedDeerSafeZones;
      }

      function doesDeerHorizontalPathCrossZone(y, zone) {
        return (
          y > zone.top - DEER_HALF_H &&
          y < zone.bottom + DEER_HALF_H
        );
      }

      function getSpawnZoneForNextEntity() {
        return getActivePopulationCount() >=
          EXPANDED_SPAWN_POPULATION_THRESHOLD
          ? EXPANDED_ENTITY_ZONE
          : GAME_ZONE;
      }

      function getRandomSpawnPosition(options = {}) {
        const spawnZone = options.spawnZone || GAME_ZONE;
        const gameMinX = spawnZone.left + HALF_W;
        const gameMaxX = spawnZone.right - HALF_W;
        const gameMinY = spawnZone.top + HALF_H;
        const gameMaxY = spawnZone.bottom - HALF_H;
        let minX = gameMinX;
        let maxX = gameMaxX;
        let minY = gameMinY;
        let maxY = gameMaxY;

        // 정규 생성과 빈 화면 보충 모두 가능하면 현재 화면 안을 우선합니다.
        if (
          options.preferVisible === true &&
          (spawnZone === GAME_ZONE || options.forceVisibleWhenExpanded === true)
        ) {
          const visibleBounds = getVisibleWorldBounds();
          const visibleMargin = 24 / Math.max(worldScale, 0.001);
          const visibleMinX = Math.max(
            gameMinX,
            visibleBounds.left + HALF_W + visibleMargin
          );
          const visibleMaxX = Math.min(
            gameMaxX,
            visibleBounds.right - HALF_W - visibleMargin
          );
          const visibleMinY = Math.max(
            gameMinY,
            visibleBounds.top + HALF_H + visibleMargin
          );
          const visibleMaxY = Math.min(
            gameMaxY,
            visibleBounds.bottom - HALF_H - visibleMargin
          );

          if (
            visibleMinX <= visibleMaxX &&
            visibleMinY <= visibleMaxY
          ) {
            minX = visibleMinX;
            maxX = visibleMaxX;
            minY = visibleMinY;
            maxY = visibleMaxY;
          }
        }

        let bestCandidate = null;
        let bestMinimumDistance = -1;
        const zombieSafeZones = getZombieSafeZones();

        for (let attempt = 0; attempt < 500; attempt += 1) {
          const x = minX + Math.random() * (maxX - minX);
          const y = minY + Math.random() * (maxY - minY);

          const overlapsSafeZone = zombieSafeZones.some((zone) =>
            isInsideInflatedZoneFor(zone, x, y, HALF_W, HALF_H)
          );

          if (overlapsSafeZone) {
            continue;
          }

          let minimumDistance = Infinity;

          for (const otherZombie of zombies.values()) {
            if (otherZombie.state === "removed") continue;

            const distance = Math.hypot(
              x - otherZombie.x,
              y - otherZombie.y
            );

            minimumDistance = Math.min(minimumDistance, distance);
          }

          // 다른 좀비가 없거나 충분히 멀리 떨어진 위치면 바로 사용합니다.
          if (minimumDistance >= MIN_SPAWN_DISTANCE) {
            return { x, y };
          }

          // 충분한 위치를 못 찾을 경우를 대비해 가장 멀었던 후보를 기억합니다.
          if (minimumDistance > bestMinimumDistance) {
            bestMinimumDistance = minimumDistance;
            bestCandidate = { x, y };
          }
        }

        if (bestCandidate) {
          return bestCandidate;
        }

        // 극히 드문 예외 상황에도 구조물 안전 구역과 겹치지 않는
        // 게임 영역 우측 상단을 기본 위치로 사용합니다.
        return {
          x: spawnZone.right - HALF_W - 8,
          y: spawnZone.top + HALF_H + 8
        };
      }

      function getRandomDeerSpawnPosition(options = {}) {
        const spawnZone = options.spawnZone || GAME_ZONE;
        const gameMinX = spawnZone.left + DEER_HALF_W;
        const gameMaxX = spawnZone.right - DEER_HALF_W;
        const gameMinY = spawnZone.top + DEER_HALF_H;
        const gameMaxY = spawnZone.bottom - DEER_HALF_H;
        let minX = gameMinX;
        let maxX = gameMaxX;
        let minY = gameMinY;
        let maxY = gameMaxY;

        // 일반 생성과 빈 화면 보충은 현재 화면 안을 우선합니다.
        // 화면을 이동했을 때 다른 위치에 남아 있는 사슴이 새 생성을 막지 않게 합니다.
        if (
          options.preferVisible === true &&
          (spawnZone === GAME_ZONE || options.forceVisibleWhenExpanded === true)
        ) {
          const visibleBounds = getVisibleWorldBounds();
          const visibleMargin = 24 / Math.max(worldScale, 0.001);
          const visibleMinX = Math.max(
            gameMinX,
            visibleBounds.left + DEER_HALF_W + visibleMargin
          );
          const visibleMaxX = Math.min(
            gameMaxX,
            visibleBounds.right - DEER_HALF_W - visibleMargin
          );
          const visibleMinY = Math.max(
            gameMinY,
            visibleBounds.top + DEER_HALF_H + visibleMargin
          );
          const visibleMaxY = Math.min(
            gameMaxY,
            visibleBounds.bottom - DEER_HALF_H - visibleMargin
          );

          if (
            visibleMinX <= visibleMaxX &&
            visibleMinY <= visibleMaxY
          ) {
            minX = visibleMinX;
            maxX = visibleMaxX;
            minY = visibleMinY;
            maxY = visibleMaxY;
          }
        }
        const avoidX = Number.isFinite(options.avoidX)
          ? options.avoidX
          : null;
        const avoidY = Number.isFinite(options.avoidY)
          ? options.avoidY
          : null;
        const minAvoidDistance = Number.isFinite(options.minAvoidDistance)
          ? options.minAvoidDistance
          : 0;

        let bestCandidate = null;
        let bestAvoidShortfall = Infinity;
        let bestDeerDistance = -1;
        let bestZombieDistance = -1;
        const deerSafeZones = getDeerSafeZones();

        for (let attempt = 0; attempt < 500; attempt += 1) {
          const x = minX + Math.random() * (maxX - minX);
          const y = minY + Math.random() * (maxY - minY);

          const overlapsSafeZone = deerSafeZones.some((zone) =>
            isInsideInflatedZoneFor(
              zone,
              x,
              y,
              DEER_HALF_W,
              DEER_HALF_H
            )
          );

          if (overlapsSafeZone) {
            continue;
          }

          // 사슴은 좌우로 도망가므로 중앙 안전 구역뿐 아니라
          // 창고와 자동차 중앙의 128×128 안전 구역도 가로지르지 않도록
          // 각 안전 구역과 같은 세로 높이에는 생성하지 않습니다.
          if (
            deerSafeZones.some((zone) =>
              doesDeerHorizontalPathCrossZone(y, zone)
            )
          ) {
            continue;
          }

          let minimumZombieDistance = Infinity;
          let minimumDeerDistance = Infinity;

          for (const otherZombie of zombies.values()) {
            if (otherZombie.state === "removed") continue;

            const distance = Math.hypot(
              x - otherZombie.x,
              y - otherZombie.y
            );

            minimumZombieDistance = Math.min(
              minimumZombieDistance,
              distance
            );
          }

          for (const otherDeer of deerMap.values()) {
            if (otherDeer.state === "removed") continue;

            const distance = Math.hypot(
              x - otherDeer.x,
              y - otherDeer.y
            );

            minimumDeerDistance = Math.min(
              minimumDeerDistance,
              distance
            );
          }

          const avoidDistance =
            avoidX !== null && avoidY !== null
              ? Math.hypot(x - avoidX, y - avoidY)
              : Infinity;

          if (
            minimumZombieDistance >= MIN_DEER_SPAWN_DISTANCE &&
            minimumDeerDistance >= MIN_DEER_TO_DEER_SPAWN_DISTANCE &&
            avoidDistance >= minAvoidDistance
          ) {
            return { x, y };
          }

          // 모든 기준을 만족하는 곳이 없으면 회피 거리 조건을 우선하고,
          // 그다음 기존 사슴과 가장 멀리 떨어진 후보를 사용합니다.
          const avoidShortfall = Math.max(
            0,
            minAvoidDistance - avoidDistance
          );
          const isBetterCandidate =
            avoidShortfall < bestAvoidShortfall ||
            (avoidShortfall === bestAvoidShortfall &&
              minimumDeerDistance > bestDeerDistance) ||
            (avoidShortfall === bestAvoidShortfall &&
              minimumDeerDistance === bestDeerDistance &&
              minimumZombieDistance > bestZombieDistance);

          if (isBetterCandidate) {
            bestAvoidShortfall = avoidShortfall;
            bestDeerDistance = minimumDeerDistance;
            bestZombieDistance = minimumZombieDistance;
            bestCandidate = { x, y };
          }
        }

        if (bestCandidate) {
          return bestCandidate;
        }

        // 무작위 탐색에서 후보를 찾지 못한 경우에도 안전 구역을
        // 가로지르지 않는 세로 위치를 위에서 아래로 다시 확인합니다.
        for (let y = minY; y <= maxY; y += 1) {
          const crossesSafeZone = deerSafeZones.some((zone) =>
            doesDeerHorizontalPathCrossZone(y, zone)
          );

          if (!crossesSafeZone) {
            return {
              x: Math.min(maxX, minX + 8),
              y
            };
          }
        }

        // 모든 수평 이동 경로가 안전 구역과 겹치면 사슴을 생성하지 않습니다.
        return null;
      }

      function playSound(path, volume = 1) {
        try {
          const audio = new Audio(path);
          audio.volume = volume;
          audio.play().catch(() => {});
        } catch (_) {
          // 오디오 재생 실패는 게임 진행에 영향을 주지 않습니다.
        }
      }

      function playStructureSound(path, volume = 1) {
        try {
          const audio = structureSoundAudioByPath.get(path);
          if (!audio || (!audio.paused && !audio.ended)) return;

          audio.volume = volume;
          if (audio.ended) {
            audio.currentTime = 0;
          }
          audio.play().catch(() => {});
        } catch (_) {
          // 자동차·창고 사운드 재생 실패는 게임 진행에 영향을 주지 않습니다.
        }
      }

      function removeToast(toast) {
        if (!toast) return;

        if (toast.removeTimer !== null) {
          clearTimeout(toast.removeTimer);
          toast.removeTimer = null;
        }

        if (toast.replacedRemoveTimer !== null) {
          clearTimeout(toast.replacedRemoveTimer);
          toast.replacedRemoveTimer = null;
        }

        toast.element.remove();

        const toastIndex = activeToasts.indexOf(toast);
        if (toastIndex >= 0) {
          activeToasts.splice(toastIndex, 1);
        }
      }

      function fadeOutReplacedToast(toast, now = performance.now()) {
        if (!toast || !toast.element.isConnected) return;
        if (toast.element.classList.contains("is-replaced")) return;

        const remainingDisplayMs = toast.expiresAt - now;

        // 원래 표시 시간이 0.5초 이하로 남았다면 기존 페이드 애니메이션으로
        // 자연스럽게 사라지도록 별도의 교체 처리를 하지 않습니다.
        if (remainingDisplayMs <= TOAST_REPLACED_FADE_MS) {
          return;
        }

        if (toast.removeTimer !== null) {
          clearTimeout(toast.removeTimer);
          toast.removeTimer = null;
        }

        const currentOpacity = getComputedStyle(
          toast.textElement
        ).opacity;

        toast.textElement.style.setProperty(
          "--toast-current-opacity",
          currentOpacity
        );
        toast.element.classList.add("is-replaced");

        toast.replacedRemoveTimer = window.setTimeout(() => {
          removeToast(toast);
        }, TOAST_REPLACED_FADE_MS);
      }

      function showToast(message) {
        const now = performance.now();

        // 이미 제거된 토스트가 배열에 남지 않도록 정리합니다.
        for (let index = activeToasts.length - 1; index >= 0; index -= 1) {
          if (!activeToasts[index].element.isConnected) {
            activeToasts.splice(index, 1);
          }
        }

        // 새 토스트까지 포함해 3개 이상이 되는 순간 가장 오래된 것을 즉시 제거합니다.
        while (activeToasts.length >= MAX_VISIBLE_TOASTS) {
          removeToast(activeToasts[0]);
        }

        // 직전에 표시된 토스트는 남은 시간이 충분할 때만 0.5초 교체 페이드를 적용합니다.
        const previousToast = activeToasts[activeToasts.length - 1] || null;
        if (previousToast) {
          fadeOutReplacedToast(previousToast, now);
        }

        const element = document.createElement("div");
        element.className = "toast-message";

        const textElement = document.createElement("span");
        textElement.className = "toast-message-text";
        textElement.textContent = message;
        element.appendChild(textElement);

        toastLayer.appendChild(element);

        const toast = {
          element,
          textElement,
          createdAt: now,
          expiresAt: now + TOAST_DURATION_MS,
          removeTimer: null,
          replacedRemoveTimer: null
        };

        activeToasts.push(toast);

        toast.removeTimer = window.setTimeout(() => {
          removeToast(toast);
        }, TOAST_DURATION_MS + 100);
      }

      function handleRepairButton(event) {
        playSound(EXPLORE_BUTTON_SOUND);

        // 이미 수리 화면이면 닫거나 다시 열지 않고 현재 상태를 유지합니다.
        if (isRepairOpen) return;

        openRepair();
      }

      function handleInventoryButton(event) {
        playSound(EXPLORE_BUTTON_SOUND);

        if (hasNewInventoryItem) {
          hasNewInventoryItem = false;
          applyInventoryNewBadgeState();
          saveResourceState();
        }


        // 이미 가방 화면이면 닫거나 다시 열지 않고 현재 상태를 유지합니다.
        if (isInventoryOpen) return;

        openInventory();
      }

      function handleExploreButton(event) {
        playSound(EXPLORE_BUTTON_SOUND);
        clearExploreButtonNewState();

        // 탐험 중에도 목적지 화면은 확인할 수 있습니다.
        // 실제 목적지 선택은 handleExplorationDestination에서 차단합니다.
        if (isExplorationMenuOpen) return;

        openExplorationMenu();
      }

      function applyAxeState() {
        const stumpImage = hasAxe
          ? STUMP_EMPTY_IMAGE
          : STUMP_WITH_AXE_IMAGE;
        axeStump.style.setProperty(
          "--stump-image",
          `url("${stumpImage}")`
        );
        axeStump.setAttribute("aria-hidden", hasAxe ? "true" : "false");
        axePickupHitArea.hidden = hasAxe;
        axePickupHitArea.style.pointerEvents = hasAxe ? "none" : "auto";
        axePickupHitArea.tabIndex = hasAxe ? -1 : 0;
      }

      function setInventoryValue(item, value) {
        if (!item) return;
        const valueElement = item.querySelector(".inventory-item__quantity");
        if (valueElement) valueElement.textContent = value;
      }

      function getEquippedWeapon() {
        if (isChainsawEquipped) return "chainsaw";
        if (isRifleEquipped) return "rifle";
        if (isShotgunEquipped) return "shotgun";
        if (isHandgunEquipped) return "handgun";
        if (isAxeEquipped) return "axe";
        return "";
      }

      function stopChainsawIdleSound() {
        try {
          chainsawIdleAudio.pause();
          chainsawIdleAudio.currentTime = 0;
        } catch (_) {}
      }

      function startChainsawIdleSound() {
        if (!isChainsawEquipped || chainsawBatteryPercent <= 0 || document.visibilityState === "hidden") {
          stopChainsawIdleSound();
          return;
        }
        chainsawIdleAudio.play().catch(() => {});
      }

      function playChainsawEquipThenIdle() {
        try {
          const equipAudio = new Audio(CHAINSAW_EQUIP_SOUND);
          let completed = false;
          const finish = () => {
            if (completed) return;
            completed = true;
            if (isChainsawEquipped && chainsawBatteryPercent > 0) {
              startChainsawIdleSound();
            }
          };
          equipAudio.addEventListener("ended", finish, { once: true });
          equipAudio.addEventListener("error", finish, { once: true });
          equipAudio.play().catch(finish);
        } catch (_) {
          startChainsawIdleSound();
        }
      }

      function stopChainsawBatteryDrain() {
        if (chainsawDrainTimerId !== null) {
          clearInterval(chainsawDrainTimerId);
          chainsawDrainTimerId = null;
        }
      }

      function setEquippedWeapon(weapon = "", options = {}) {
        const normalizedWeapon = ["axe", "handgun", "shotgun", "rifle", "chainsaw"].includes(weapon)
          ? weapon
          : "";

        isAxeEquipped = normalizedWeapon === "axe" && hasAxe;
        isHandgunEquipped = normalizedWeapon === "handgun" && hasHandgun;
        isShotgunEquipped = normalizedWeapon === "shotgun" && hasShotgun;
        isRifleEquipped = normalizedWeapon === "rifle" && hasRifle;
        isChainsawEquipped = normalizedWeapon === "chainsaw" && hasChainsaw && chainsawBatteryPercent > 0;

        if (!isChainsawEquipped) {
          stopChainsawBatteryDrain();
          stopChainsawIdleSound();
        } else if (options.startChainsaw !== false) {
          startChainsawBatteryDrain();
          startChainsawIdleSound();
        }

        if (options.render !== false) applyInventoryState();
        if (options.save !== false) saveResourceState();
      }

      function handleChainsawBatteryDepleted() {
        chainsawBatteryPercent = 0;
        isChainsawEquipped = false;
        stopChainsawBatteryDrain();
        stopChainsawIdleSound();
        applyInventoryState();
        saveResourceState();
      }

      function startChainsawBatteryDrain() {
        stopChainsawBatteryDrain();
        if (!isChainsawEquipped || chainsawBatteryPercent <= 0 || document.visibilityState === "hidden") return;

        chainsawDrainTimerId = window.setInterval(() => {
          if (!isChainsawEquipped || document.visibilityState === "hidden") return;
          chainsawBatteryPercent = Math.max(0, chainsawBatteryPercent - 1);
          applyInventoryState();
          if (chainsawBatteryPercent <= 0) {
            handleChainsawBatteryDepleted();
            return;
          }
          saveResourceState();
        }, CHAINSAW_DRAIN_INTERVAL_MS);
      }

      function pauseChainsawForBackground() {
        chainsawBatteryPausedForBackground = isChainsawEquipped;
        stopChainsawBatteryDrain();
        stopChainsawIdleSound();
      }

      function resumeChainsawAfterBackground() {
        if (document.visibilityState === "hidden") return;
        if (!isExploring && isChainsawEquipped && chainsawBatteryPercent > 0) {
          startChainsawBatteryDrain();
          startChainsawIdleSound();
        }
        chainsawBatteryPausedForBackground = false;
      }

      function applyInventoryState() {
        if (axeInventoryItem) {
          axeInventoryItem.hidden = !hasAxe;
          setInventoryValue(axeInventoryItem, hasAxe && isAxeEquipped ? "E" : "");
        }

        if (handgunInventoryItem) {
          handgunInventoryItem.hidden = !hasHandgun;
          setInventoryValue(handgunInventoryItem, hasHandgun && isHandgunEquipped ? "E" : "");
        }

        if (handgunAmmoInventoryItem) {
          handgunAmmoInventoryItem.hidden = !hasHandgunAmmo;
          setInventoryValue(handgunAmmoInventoryItem, `×${handgunAmmoCount}`);
        }

        if (shotgunInventoryItem) {
          shotgunInventoryItem.hidden = !hasShotgun;
          setInventoryValue(shotgunInventoryItem, hasShotgun && isShotgunEquipped ? "E" : "");
        }

        if (shotgunAmmoInventoryItem) {
          shotgunAmmoInventoryItem.hidden = !hasShotgunAmmo;
          setInventoryValue(shotgunAmmoInventoryItem, `×${shotgunAmmoCount}`);
        }

        if (rifleInventoryItem) {
          rifleInventoryItem.hidden = !hasRifle;
          setInventoryValue(rifleInventoryItem, hasRifle && isRifleEquipped ? "E" : "");
        }

        if (rifleAmmoInventoryItem) {
          rifleAmmoInventoryItem.hidden = !hasRifleAmmo;
          setInventoryValue(rifleAmmoInventoryItem, `×${rifleAmmoCount}`);
        }

        if (chainsawInventoryItem) {
          chainsawInventoryItem.hidden = !hasChainsaw;
          setInventoryValue(chainsawInventoryItem, hasChainsaw && isChainsawEquipped ? "E" : "");
        }

        if (chainsawBatteryInventoryItem) {
          chainsawBatteryInventoryItem.hidden = !hasChainsawBattery;
          setInventoryValue(chainsawBatteryInventoryItem, `${chainsawBatteryPercent}%`);
        }

        if (musicBoxInventoryItem) {
          musicBoxInventoryItem.hidden = !hasMusicBox;
          setInventoryValue(musicBoxInventoryItem, isMusicOn ? "ON" : "OFF");
        }

        if (strangerLetterInventoryItem) {
          strangerLetterInventoryItem.hidden = !hasStrangerLetter;
          setInventoryValue(strangerLetterInventoryItem, isStrangerLetterOn ? "ON" : "OFF");
        }

        if (compassInventoryItem) {
          compassInventoryItem.hidden = !hasCompass;
          setInventoryValue(compassInventoryItem, "");
        }

        if (carPartsInventoryItem) {
          carPartsInventoryItem.hidden = isCarRepaired() || carPartsCount <= 0;
          setInventoryValue(carPartsInventoryItem, `×${carPartsCount}`);
        }

        if (fuelInventoryItem) {
          fuelInventoryItem.hidden = fuelCount <= 0;
          setInventoryValue(fuelInventoryItem, `×${fuelCount}`);
        }

        if (repairKitInventoryItem) {
          repairKitInventoryItem.hidden = repairKitCount <= 0;
          setInventoryValue(repairKitInventoryItem, `×${repairKitCount}`);
        }

        if (mapInventoryItem) {
          mapInventoryItem.hidden = !hasMap;
          setInventoryValue(mapInventoryItem, "");
        }

        if (flowersInventoryItem) {
          flowersInventoryItem.hidden = flowerCount <= 0;
          setInventoryValue(flowersInventoryItem, `×${flowerCount}`);
        }

        for (const [itemType, item] of Object.entries(paintInventoryItems)) {
          if (!item) continue;
          const count = paintCounts[itemType] || 0;
          item.hidden = count <= 0;
          setInventoryValue(item, `×${count}`);
        }

        applyInventoryItemNewTagState();
        rebuildInventoryPages();
      }

      function applyInventoryItemNewTagState() {
        for (const item of inventoryItems) {
          const badge = item.querySelector(".inventory-item-new-badge");
          if (!badge) continue;
          badge.hidden = !newInventoryItemTypes.has(item.dataset.item || "");
        }
      }

      function markInventoryItemAsNew(itemType) {
        newInventoryItemTypes.add(itemType);
        viewedInventoryNewItemTypes.delete(itemType);
        hasNewInventoryItem = true;
        applyInventoryItemNewTagState();
        applyInventoryNewBadgeState();

        // 이미 열려 있고 현재 페이지에 있는 아이템이라면 그 페이지는 본 상태입니다.
        const currentPageItemTypes =
          inventoryPageItemTypes[inventoryCurrentPage] || [];
        if (isInventoryOpen && currentPageItemTypes.includes(itemType)) {
          viewedInventoryNewItemTypes.add(itemType);
        }
        updateInventoryPageDots();
      }

      function clearInventoryItemNewState(itemType) {
        const removedNewState = newInventoryItemTypes.delete(itemType);
        const removedViewedState = viewedInventoryNewItemTypes.delete(itemType);
        if (!removedNewState && !removedViewedState) return;
        applyInventoryItemNewTagState();
        updateInventoryPageDots();
        saveResourceState();
      }

      function applyInventoryNewBadgeState() {
        const animate = inventoryNewBadgeStateInitialized;
        setAnimatedNewBadgeVisibility(
          inventoryNewBadge,
          hasNewInventoryItem,
          animate
        );
        inventoryNewBadgeStateInitialized = true;
      }

      function stopBgmPlayback() {
        bgmFadeToken += 1;

        if (bgmStartTimerId !== null) {
          clearTimeout(bgmStartTimerId);
          bgmStartTimerId = null;
        }

        if (bgmFadeFrameId !== null) {
          cancelAnimationFrame(bgmFadeFrameId);
          bgmFadeFrameId = null;
        }

        for (const audio of bgmAudios) {
          audio.pause();
          audio.volume = 0;
          try {
            audio.currentTime = 0;
          } catch (_) {}
        }
        activeBgmAudio = null;
        bgmStartScheduled = false;
        bgmStarted = false;
      }

      async function startBgmPlayback() {
        if (
          !hasMusicBox ||
          !isMusicOn ||
          bgmStarted ||
          bgmStartScheduled
        ) {
          return;
        }

        bgmStartScheduled = true;
        const incomingAudio = getCurrentBgmAudio();

        for (const audio of bgmAudios) {
          audio.pause();
          audio.volume = audio === incomingAudio ? 1 : 0;
          try {
            audio.currentTime = 0;
          } catch (_) {}
        }

        try {
          await incomingAudio.play();
          activeBgmAudio = incomingAudio;
          bgmStarted = true;
        } catch (_) {
          // 저장 상태가 On이어도 자동 재생이 차단될 수 있습니다.
          // 이후 사용자 클릭에서 다시 재생을 시도합니다.
          activeBgmAudio = null;
          bgmStarted = false;
        } finally {
          bgmStartScheduled = false;
        }
      }

      function setMusicOn(enabled) {
        isMusicOn = hasMusicBox && enabled;
        applyInventoryState();
        saveResourceState();

        if (isMusicOn) {
          startBgmPlayback();
        } else {
          stopBgmPlayback();
        }
      }

      function awardMusicBox() {
        if (hasMusicBox) return;

        hasMusicBox = true;
        isMusicOn = true;
        applyInventoryState();
        saveResourceState();
        window.setTimeout(() => {
          showToast(MUSIC_BOX_FOUND_TOAST_MESSAGE);
        }, MUSIC_BOX_FOUND_TOAST_DELAY_MS);
        scheduleBgmAfterFirstPlayerKill();
      }

      function collectAxe(event) {
        if (isExploring) {
          showExploringBusyToast(event);
          return;
        }

        if (hasAxe) return;

        if (event) {
          event.preventDefault();
        }

        hasAxe = true;
        setEquippedWeapon("axe", { render: false, save: false });
        markInventoryItemAsNew("axe");
        applyAxeState();
        applyInventoryState();
        saveResourceState();
        playSound(GET_AXE_SOUND, 0.7);
      }

      function handleAxePickupKeydown(event) {
        if (event.key !== "Enter" && event.key !== " ") return;
        collectAxe(event);
      }


      function getTreePersistentVisualStage() {
        if (treeGrowthState === TREE_GROWTH_DEPLETED) return 3;
        if (
          treeGrowthState === TREE_GROWTH_REGROWING ||
          treeGrowthState === TREE_GROWTH_REGROWING_HOLD
        ) return 2;
        if (treeChopCount >= 2) return 3;
        if (treeChopCount >= 1) return 2;
        return 1;
      }

      function setTreeNightFrame(stage, frameIndex = TREE_DEFAULT_FRAME) {
        applyTreeFrameToVisuals(
          [treeNightVisual],
          getTreeDaySheetForStage(stage),
          frameIndex
        );
      }

      function getTreeDaySheetForStage(stage) {
        if (stage === 2) return TREE_DAY_STAGE_TWO_IMAGE;
        if (stage === 3) return TREE_DAY_STAGE_THREE_IMAGE;
        return TREE_DAY_SHEET;
      }

      function applyTreeFrameToVisuals(visuals, image, frameIndex) {
        const normalizedFrame = clamp(
          Math.round(Number(frameIndex) || 0),
          0,
          TREE_SHEET_COLUMNS * TREE_SHEET_COLUMNS - 1
        );
        const column = normalizedFrame % TREE_SHEET_COLUMNS;
        const row = Math.floor(normalizedFrame / TREE_SHEET_COLUMNS);
        const backgroundPosition =
          `${-column * TREE_FRAME_SIZE}px ${-row * TREE_FRAME_SIZE}px`;

        for (const visual of visuals) {
          visual.style.backgroundImage = `url("${image}")`;
          visual.style.backgroundSize = "1024px 1024px";
          visual.style.backgroundPosition = backgroundPosition;
        }
      }

      function applyTreeDayFrame(image, frameIndex) {
        applyTreeFrameToVisuals(
          [treeDayVisual],
          image,
          frameIndex
        );
      }

      function applyTreeVisualState() {
        const stage = getTreePersistentVisualStage();
        const image = getTreeDaySheetForStage(stage);
        applyTreeDayFrame(image, TREE_DEFAULT_FRAME);
        setTreeNightFrame(stage);
      }

      function setTreeAnimationFrameForStage(frameIndex, stage) {
        const image = getTreeDaySheetForStage(stage);
        applyTreeDayFrame(image, frameIndex);
        setTreeNightFrame(stage, frameIndex);
      }

      function setTreeAnimationFrame(frameIndex) {
        const stage = getTreePersistentVisualStage();
        setTreeAnimationFrameForStage(frameIndex, stage);
      }

      function randomBetween(min, max) {
        return min + Math.random() * (max - min);
      }

      function easeInCubic(progress) {
        const normalized = clamp(progress, 0, 1);
        return normalized * normalized * normalized;
      }

      function easeOutCubic(progress) {
        const normalized = clamp(progress, 0, 1);
        return 1 - Math.pow(1 - normalized, 3);
      }

      function spawnTreeFallingPart(hitNumber) {
        if (!treePartLayer || !treePartShadowLayer) return;

        // 이동용 부모 → 회전용 부모 → 이미지의 3단 구조입니다.
        // 이동과 회전을 같은 요소에서 처리하지 않아 회전축이 바닥으로 끌려가지 않습니다.
        const shadow = document.createElement("div");
        shadow.className = "tree-falling-part-shadow";
        shadow.setAttribute("aria-hidden", "true");
        shadow.style.width = `${TREE_PART_SHADOW_WIDTH}px`;
        shadow.style.height = `${TREE_PART_SHADOW_HEIGHT}px`;

        const part = document.createElement("div");
        part.className = "tree-falling-part";
        part.setAttribute("aria-hidden", "true");

        const rotator = document.createElement("div");
        rotator.className = "tree-falling-part-rotator";
        rotator.style.transformOrigin =
          `${TREE_PART_ROTATION_PIVOT_X}px ${TREE_PART_ROTATION_PIVOT_Y}px`;

        const image = document.createElement("div");
        image.className = "tree-falling-part-image";
        image.style.backgroundImage = `url("${TREE_PART_IMAGE}")`;

        rotator.appendChild(image);
        part.appendChild(rotator);

        const treeLeft = tree.offsetLeft;
        const treeTop = tree.offsetTop;
        const treeScale = getTreeRenderScale();
        const treeWidth = TREE_FRAME_SIZE * treeScale;
        const treeHeight = TREE_FRAME_SIZE * treeScale;
        const startAnchorX = treeLeft + treeWidth * TREE_PART_START_X_RATIO;
        const startAnchorY = treeTop + treeHeight * TREE_PART_START_Y_RATIO;
        const offsetIndex = clamp(
          Math.round(Number(hitNumber) || 1) - 1,
          0,
          TREE_PART_HIT_OFFSETS.length - 1
        );
        const hitOffset = TREE_PART_HIT_OFFSETS[offsetIndex];
        const hitScale = TREE_PART_HIT_SCALES[
          Math.min(offsetIndex, TREE_PART_HIT_SCALES.length - 1)
        ];
        const baseHitOffset = TREE_PART_HIT_OFFSETS[0] || { x: 0, y: 0 };
        const groundOffsetX = hitOffset.x - baseHitOffset.x;
        const groundOffsetY = hitOffset.y - baseHitOffset.y;

        // 두 번째 파츠만 이미지 자체를 좌우 반전합니다.
        // 회전용 부모와 분리되어 반전이 회전축 위치에 영향을 주지 않습니다.
        const horizontalFlip = offsetIndex === 1 ? -1 : 1;
        image.style.transform = `scaleX(${horizontalFlip})`;

        // 타격 직후 빠르게 튀어나온 뒤 높은 포물선을 그리며 더 멀리 날아갑니다.
        const startJitterX = randomBetween(-10, 10);
        const startJitterY = randomBetween(-6, 5);
        // 나무 파츠는 항상 오른쪽으로만 날아갑니다.
        const flightDistance = randomBetween(72, 122);
        const arcHeight = randomBetween(58, 96);
        const landingJitterX = randomBetween(-7, 7);
        const groundJitterY = randomBetween(-3, 3);
        // 비행 종료 회전은 한 가지 범위만 사용합니다.
        const dropEndRotation = randomBetween(250, 520);
        const dropDurationMs = randomBetween(560, 760);
        const toppleDurationMs = randomBetween(180, 290);

        const dropX = flightDistance * 0.9 - groundOffsetX;
        const dropY = TREE_PART_DROP_Y - groundOffsetY + groundJitterY;
        const desiredToppleGroundX =
          flightDistance - groundOffsetX + landingJitterX;
        const desiredToppleGroundY =
          TREE_PART_TOPPLE_Y - groundOffsetY + groundJitterY;

        // 회전용 부모 안에서 지정한 앵커가 현재 회전·스케일 후
        // 어느 로컬 좌표에 놓이는지 계산합니다. 바닥 위치 체크에만 사용합니다.
        const getTransformedAnchor = (anchorX, anchorY, rotation, scale) => {
          const radians = rotation * Math.PI / 180;
          const cos = Math.cos(radians);
          const sin = Math.sin(radians);
          const offsetX =
            (anchorX - TREE_PART_ROTATION_PIVOT_X) * scale;
          const offsetY =
            (anchorY - TREE_PART_ROTATION_PIVOT_Y) * scale;

          return {
            x:
              TREE_PART_ROTATION_PIVOT_X +
              offsetX * cos -
              offsetY * sin,
            y:
              TREE_PART_ROTATION_PIVOT_Y +
              offsetX * sin +
              offsetY * cos
          };
        };

        const initialGroundAnchor = getTransformedAnchor(
          TREE_PART_GROUND_CONTACT_X,
          TREE_PART_GROUND_CONTACT_Y,
          0,
          hitScale
        );
        const dropBottomAnchor = getTransformedAnchor(
          TREE_PART_GROUND_CONTACT_X,
          TREE_PART_GROUND_CONTACT_Y,
          dropEndRotation,
          hitScale
        );
        const dropTopAnchor = getTransformedAnchor(
          TREE_PART_TOP_CONTACT_X,
          TREE_PART_TOP_CONTACT_Y,
          dropEndRotation,
          hitScale
        );
        const activeContactAnchorAtDrop =
          dropBottomAnchor.y >= dropTopAnchor.y
            ? {
                key: "bottom",
                x: TREE_PART_GROUND_CONTACT_X,
                y: TREE_PART_GROUND_CONTACT_Y
              }
            : {
                key: "top",
                x: TREE_PART_TOP_CONTACT_X,
                y: TREE_PART_TOP_CONTACT_Y
              };

        const getNearestHorizontalRotation = (rotation) => {
          const candidates = [-270, -90, 90, 270, 450, 630];
          let nearest = candidates[0];
          let nearestDistance = Math.abs(rotation - nearest);

          for (let index = 1; index < candidates.length; index += 1) {
            const candidate = candidates[index];
            const distance = Math.abs(rotation - candidate);
            if (distance < nearestDistance) {
              nearest = candidate;
              nearestDistance = distance;
            }
          }

          return nearest;
        };

        const toppleRotation = getNearestHorizontalRotation(dropEndRotation);
        const startGroundX = startAnchorX + hitOffset.x + startJitterX;
        const startGroundY = startAnchorY + hitOffset.y + startJitterY;
        const startLeft = startGroundX - initialGroundAnchor.x;
        const startTop = startGroundY - initialGroundAnchor.y;

        // 비행이 끝나는 순간 실제로 바닥에 먼저 닿은 접지 앵커의 화면 좌표를 구합니다.
        // 이후 넘어질 때는 이 접지점이 회전 기준이 되며, 회전 중에도 같은 바닥 점에 붙어 있습니다.
        const dropContactAnchor = getTransformedAnchor(
          activeContactAnchorAtDrop.x,
          activeContactAnchorAtDrop.y,
          dropEndRotation,
          hitScale
        );
        const toppleGroundX = startLeft + dropX + dropContactAnchor.x;
        const toppleGroundY = startTop + dropY + dropContactAnchor.y;

        const getTopplePose = (rotation, scale) => {
          const currentContactAnchor = getTransformedAnchor(
            activeContactAnchorAtDrop.x,
            activeContactAnchorAtDrop.y,
            rotation,
            scale
          );

          return {
            x: toppleGroundX - startLeft - currentContactAnchor.x,
            y: toppleGroundY - startTop - currentContactAnchor.y
          };
        };

        const finalTopplePose = getTopplePose(toppleRotation, hitScale);
        const toppleTranslateX = finalTopplePose.x;
        const toppleTranslateY = finalTopplePose.y;
        // 그림자 오프셋은 바닥 접지점이 아니라 비행 때 사용하는 회전축을 기준으로 합니다.
        const toppleRotationPivotX =
          startLeft + toppleTranslateX + TREE_PART_ROTATION_PIVOT_X;
        const toppleRotationPivotY =
          startTop + toppleTranslateY + TREE_PART_ROTATION_PIVOT_Y;

        part.style.left = `${startLeft}px`;
        part.style.top = `${startTop}px`;
        part.style.opacity = "1";
        part.style.transform = "translate3d(0, 0, 0)";
        rotator.style.transform = `rotate(0deg) scale(${hitScale})`;

        // 그림자는 낙하 중에는 숨기고 최종 자세의 회전 중심축을 기준으로 배치합니다.
        shadow.style.left =
          `${toppleRotationPivotX + TREE_PART_SHADOW_OFFSET_X}px`;
        shadow.style.top =
          `${toppleRotationPivotY + TREE_PART_SHADOW_OFFSET_Y}px`;
        shadow.style.opacity = "0";

        treePartShadowLayer.appendChild(shadow);
        treePartLayer.appendChild(part);

        const setPartPose = (x, y, rotation, scale, opacity = 1) => {
          // 바깥 부모는 위치 이동만 담당합니다.
          part.style.transform = `translate3d(${x}px, ${y}px, 0)`;
          part.style.opacity = `${opacity}`;
          // 안쪽 부모는 중앙 회전축을 기준으로 회전과 크기만 담당합니다.
          rotator.style.transform = `rotate(${rotation}deg) scale(${scale})`;
        };

        const startTime = performance.now();
        const dropEndTime = startTime + dropDurationMs;
        const toppleEndTime = dropEndTime + toppleDurationMs;
        const holdEndTime = toppleEndTime + TREE_PART_HOLD_MS;
        const fadeEndTime = holdEndTime + TREE_PART_FADE_MS;
        let hasPlayedGroundHitSound = false;

        const step = (now) => {
          if (now < dropEndTime) {
            const rawProgress = clamp(
              (now - startTime) / dropDurationMs,
              0,
              1
            );
            // 가로 위치는 일정한 속도의 선형 그래프로 이동합니다.
            const currentX = dropX * rawProgress;
            const currentY =
              dropY * rawProgress -
              Math.sin(rawProgress * Math.PI) * arcHeight;
            // 회전 각도를 선형으로 증가시켜 반시계 방향 되감김이 생기지 않습니다.
            const currentRotation = dropEndRotation * rawProgress;

            setPartPose(
              currentX,
              currentY,
              currentRotation,
              hitScale,
              1
            );
            window.requestAnimationFrame(step);
            return;
          }

          if (!hasPlayedGroundHitSound) {
            hasPlayedGroundHitSound = true;
            shadow.style.opacity = `${TREE_PART_SHADOW_OPACITY}`;
            playSound(TREE_FALL_SOUND);
          }

          if (now < toppleEndTime) {
            const rawProgress = clamp(
              (now - dropEndTime) / toppleDurationMs,
              0,
              1
            );
            const currentRotation =
              dropEndRotation +
              (toppleRotation - dropEndRotation) * rawProgress;
            const currentTopplePose = getTopplePose(
              currentRotation,
              hitScale
            );

            setPartPose(
              currentTopplePose.x,
              currentTopplePose.y,
              currentRotation,
              hitScale,
              1
            );
            window.requestAnimationFrame(step);
            return;
          }

          if (now < holdEndTime) {
            setPartPose(
              toppleTranslateX,
              toppleTranslateY,
              toppleRotation,
              hitScale,
              1
            );
            window.requestAnimationFrame(step);
            return;
          }

          if (now < fadeEndTime) {
            const rawProgress = clamp(
              (now - holdEndTime) / TREE_PART_FADE_MS,
              0,
              1
            );
            const opacity = 1 - rawProgress;
            const currentScale =
              hitScale *
              (1 - (1 - TREE_PART_FADE_END_SCALE_MULTIPLIER) * rawProgress);
            shadow.style.opacity = `${TREE_PART_SHADOW_OPACITY * opacity}`;

            setPartPose(
              toppleTranslateX,
              toppleTranslateY,
              toppleRotation,
              currentScale,
              opacity
            );
            window.requestAnimationFrame(step);
            return;
          }

          shadow.remove();
          part.remove();
        };

        window.requestAnimationFrame(step);
      }

      function playTreeChopAnimation(event) {
        if (event) {
          event.preventDefault();
        }

        if (isExploring || document.body.classList.contains("is-night")) {
          return;
        }

        if (
          treeGrowthState !== TREE_GROWTH_READY ||
          treeChopCount >= TREE_MAX_CHOPS_PER_GROWTH
        ) {
          showToast(TREE_GROW_TOAST_MESSAGE);
          return;
        }

        if (!hasAxe || !isAxeEquipped) {
          showToast(TREE_NEEDS_AXE_TOAST_MESSAGE);
          return;
        }

        if (woodCount >= getMaxWoodCount()) {
          showToast(CARRY_FULL_TOAST_MESSAGE);
          return;
        }

        // 이전 흔들림이 재생 중이어도 새 입력을 받습니다.
        // 기존 타이머를 취소하고 현재 단계의 타격 애니메이션을 처음부터 다시 재생합니다.
        if (treeAnimationTimerId !== null) {
          clearTimeout(treeAnimationTimerId);
          treeAnimationTimerId = null;
        }

        isTreeAnimating = true;
        treeChopCount += 1;
        woodCount = Math.min(getMaxWoodCount(), woodCount + 2);

        if (treeChopCount >= TREE_MAX_CHOPS_PER_GROWTH) {
          treeGrowthState = TREE_GROWTH_DEPLETED;
        }

        const nextStage = getTreePersistentVisualStage();

        updateResourceHud();
        saveResourceState();
        playSound(TREE_CHOP_SOUND);
        spawnTreeFallingPart(treeChopCount);

        let sequenceIndex = 0;
        const firstFrameIndex = TREE_CHOP_SEQUENCE[sequenceIndex];

        // 새 단계 이미지의 첫 흔들림 프레임으로 즉시 교체합니다.
        setTreeAnimationFrameForStage(firstFrameIndex, nextStage);

        const advanceFrame = () => {
          sequenceIndex += 1;

          if (sequenceIndex >= TREE_CHOP_SEQUENCE.length) {
            treeAnimationTimerId = null;
            isTreeAnimating = false;
            applyTreeVisualState();
            return;
          }

          const frameIndex = TREE_CHOP_SEQUENCE[sequenceIndex];
          setTreeAnimationFrameForStage(frameIndex, nextStage);

          treeAnimationTimerId = window.setTimeout(
            advanceFrame,
            TREE_CHOP_FRAME_MS
          );
        };

        treeAnimationTimerId = window.setTimeout(
          advanceFrame,
          TREE_CHOP_FRAME_MS
        );
      }

      function handleTreeKeydown(event) {
        if (event.key !== "Enter" && event.key !== " ") return;
        playTreeChopAnimation(event);
      }

      function scheduleBgmAfterFirstPlayerKill() {
        if (
          !hasMusicBox ||
          !isMusicOn ||
          bgmStartScheduled ||
          bgmStarted ||
          bgmStartTimerId !== null
        ) {
          return;
        }

        bgmStartScheduled = true;
        bgmStartTimerId = window.setTimeout(() => {
          bgmStartTimerId = null;
          bgmStartScheduled = false;
          for (const audio of bgmAudios) {
            try {
              audio.currentTime = 0;
            } catch (_) {}
          }
          startBgmPlayback();
        }, FIRST_KILL_BGM_DELAY_MS);
      }

      function playBirdFlySound() {
        let candidateIndex = 0;

        const tryNext = () => {
          if (candidateIndex >= BIRD_FLY_SOUND_CANDIDATES.length) return;

          const audio = new Audio(
            BIRD_FLY_SOUND_CANDIDATES[candidateIndex]
          );
          candidateIndex += 1;
          audio.volume = 1;

          audio.addEventListener("error", tryNext, { once: true });
          audio.play().catch(() => {});
        };

        tryNext();
      }

      function playFallSound() {
        let candidateIndex = 0;

        const tryNext = () => {
          if (candidateIndex >= FALL_SOUND_CANDIDATES.length) return;

          const audio = new Audio(FALL_SOUND_CANDIDATES[candidateIndex]);
          candidateIndex += 1;
          audio.volume = 1;

          audio.addEventListener("error", tryNext, { once: true });
          audio.play().catch(() => {});
        };

        tryNext();
      }

      function setFacing(zombie) {
        if (zombie.direction.x > 0.000001) {
          zombie.facing = 1;
        } else if (zombie.direction.x < -0.000001) {
          zombie.facing = -1;
        }

        // 원본은 왼쪽을 향하므로 오른쪽 이동 시에만 반전합니다.
        const facingTransform =
          zombie.facing === 1 ? "scaleX(-1)" : "scaleX(1)";

        // 방향이 실제로 바뀐 경우에만 네 스프라이트 레이어를 갱신합니다.
        if (zombie.renderedFacingTransform === facingTransform) return;
        zombie.renderedFacingTransform = facingTransform;

        zombie.sprite.style.transform = facingTransform;
        zombie.overlay.style.transform = facingTransform;
        zombie.nightSprite.style.transform = facingTransform;
        zombie.nightOverlay.style.transform = facingTransform;
      }

      function getTreeRenderScale() {
        const value = parseFloat(
          getComputedStyle(document.documentElement)
            .getPropertyValue("--tree-scale")
        );
        return Number.isFinite(value) && value > 0 ? value : 1;
      }

      function isPointInsideDepthZone(pointX, pointY, zone) {
        return (
          pointX >= zone.left &&
          pointX < zone.right &&
          pointY >= zone.top &&
          pointY <= zone.bottom
        );
      }

      function isEntityInTreeFrontZone(worldX, worldGroundY) {
        const treeScale = getTreeRenderScale();
        const localX = (worldX - tree.offsetLeft) / treeScale;
        const localY = (worldGroundY - tree.offsetTop) / treeScale;

        const isInsideTreeBounds = (
          localX >= 0 &&
          localX <= TREE_FRAME_SIZE &&
          localY >= 0 &&
          localY <= TREE_FRAME_SIZE
        );

        if (!isInsideTreeBounds) return true;

        return (
          isPointInsideDepthZone(localX, localY, TREE_FRONT_ZONE_A) ||
          isPointInsideDepthZone(localX, localY, TREE_FRONT_ZONE_B)
        );
      }

      function updateEntityTreeDepth(element, worldX, worldGroundY, sortY) {
        const targetLayer = isEntityInTreeFrontZone(worldX, worldGroundY)
          ? entities
          : entitiesBehindTree;

        if (element.parentElement !== targetLayer) {
          targetLayer.appendChild(element);
        }

        // 같은 레이어 안에서는 기존처럼 아래쪽 엔티티가 앞에 표시됩니다.
        element.style.zIndex = String(Math.round(sortY));
      }

      function renderZombie(zombie) {
        zombie.element.style.left = `${zombie.x}px`;
        zombie.element.style.top = `${zombie.y}px`;
        updateEntityTreeDepth(
          zombie.element,
          zombie.x,
          zombie.y + ZOMBIE_DEPTH_POINT_OFFSET_Y,
          zombie.y
        );
      }

      function zombieSheetBackgroundSize(sheet) {
        return sheet === DEATH_NO_HEAD_SHEET ? "256px 128px" : "256px 256px";
      }

      function showSingleFrame(zombie, sheet, frameIndex) {
        const renderState = zombie.spriteRenderState;

        // 같은 단일 프레임이 유지되는 동안에는 DOM 스타일을 다시 쓰지 않습니다.
        if (
          renderState.mode === "single" &&
          renderState.sheet === sheet &&
          renderState.frameIndex === frameIndex
        ) {
          return;
        }

        const position = framePosition(frameIndex);
        const backgroundSize = zombieSheetBackgroundSize(sheet);
        const backgroundImage = `url("${sheet}")`;

        zombie.sprite.style.backgroundImage = backgroundImage;
        zombie.sprite.style.backgroundSize = backgroundSize;
        zombie.sprite.style.backgroundPosition = position;
        zombie.sprite.style.opacity = "1";
        zombie.overlay.style.opacity = "0";

        zombie.nightSprite.style.backgroundImage = backgroundImage;
        zombie.nightSprite.style.backgroundSize = backgroundSize;
        zombie.nightSprite.style.backgroundPosition = position;
        zombie.nightSprite.style.opacity = "1";
        zombie.nightOverlay.style.opacity = "0";

        renderState.mode = "single";
        renderState.sheet = sheet;
        renderState.frameIndex = frameIndex;
        renderState.crossfadeKey = "";
        renderState.fromOpacity = "1";
        renderState.toOpacity = "0";
      }

      function showCrossfade(
        zombie,
        fromSheet,
        fromFrameIndex,
        toSheet,
        toFrameIndex,
        progress
      ) {
        const clampedProgress = clamp(progress, 0, 1);
        const renderState = zombie.spriteRenderState;
        const crossfadeKey =
          `${fromSheet}|${fromFrameIndex}|${toSheet}|${toFrameIndex}`;
        const fromOpacity = String(1 - clampedProgress);
        const toOpacity = String(clampedProgress);

        // 전환에 사용되는 시트와 프레임은 바뀌는 순간에만 설정합니다.
        if (
          renderState.mode !== "crossfade" ||
          renderState.crossfadeKey !== crossfadeKey
        ) {
          const fromPosition = framePosition(fromFrameIndex);
          const toPosition = framePosition(toFrameIndex);
          const fromBackgroundSize = zombieSheetBackgroundSize(fromSheet);
          const toBackgroundSize = zombieSheetBackgroundSize(toSheet);
          const fromBackgroundImage = `url("${fromSheet}")`;
          const toBackgroundImage = `url("${toSheet}")`;

          zombie.sprite.style.backgroundImage = fromBackgroundImage;
          zombie.sprite.style.backgroundSize = fromBackgroundSize;
          zombie.sprite.style.backgroundPosition = fromPosition;
          zombie.overlay.style.backgroundImage = toBackgroundImage;
          zombie.overlay.style.backgroundSize = toBackgroundSize;
          zombie.overlay.style.backgroundPosition = toPosition;

          zombie.nightSprite.style.backgroundImage = fromBackgroundImage;
          zombie.nightSprite.style.backgroundSize = fromBackgroundSize;
          zombie.nightSprite.style.backgroundPosition = fromPosition;
          zombie.nightOverlay.style.backgroundImage = toBackgroundImage;
          zombie.nightOverlay.style.backgroundSize = toBackgroundSize;
          zombie.nightOverlay.style.backgroundPosition = toPosition;

          renderState.mode = "crossfade";
          renderState.crossfadeKey = crossfadeKey;
          renderState.sheet = "";
          renderState.frameIndex = -1;
          renderState.fromOpacity = "";
          renderState.toOpacity = "";
        }

        // 크로스페이드 중에는 실제로 달라지는 투명도만 갱신합니다.
        if (renderState.fromOpacity !== fromOpacity) {
          zombie.sprite.style.opacity = fromOpacity;
          zombie.nightSprite.style.opacity = fromOpacity;
          renderState.fromOpacity = fromOpacity;
        }
        if (renderState.toOpacity !== toOpacity) {
          zombie.overlay.style.opacity = toOpacity;
          zombie.nightOverlay.style.opacity = toOpacity;
          renderState.toOpacity = toOpacity;
        }
      }

      function setDeerFacing(deer) {
        const facingTransform =
          deer.facing === "left" ? "scaleX(-1)" : "scaleX(1)";

        // 방향이 실제로 바뀐 경우에만 네 스프라이트 레이어를 갱신합니다.
        if (deer.renderedFacingTransform === facingTransform) return;
        deer.renderedFacingTransform = facingTransform;

        deer.sprite.style.transform = facingTransform;
        deer.overlay.style.transform = facingTransform;
        deer.nightSprite.style.transform = facingTransform;
        deer.nightOverlay.style.transform = facingTransform;
      }

      function renderDeer(deer) {
        deer.element.style.left = `${deer.x}px`;
        deer.element.style.top = `${deer.y}px`;
        updateEntityTreeDepth(
          deer.element,
          deer.x,
          deer.y + DEER_DEPTH_POINT_OFFSET_Y,
          deer.y
        );
      }

      function getDogRenderSize() {
        const value = parseFloat(
          getComputedStyle(document.documentElement)
            .getPropertyValue("--dog-size")
        );
        return Number.isFinite(value) && value > 0 ? value : 96;
      }

      function normalizeDogAngle(angle) {
        let normalized = angle % (Math.PI * 2);
        if (normalized <= -Math.PI) normalized += Math.PI * 2;
        if (normalized > Math.PI) normalized -= Math.PI * 2;
        return normalized;
      }

      function getShortestDogAngleDelta(fromAngle, toAngle) {
        return normalizeDogAngle(toAngle - fromAngle);
      }

      function isDogPositionAllowed(x, y, size = getDogRenderSize()) {
        const halfSize = size / 2;

        if (
          x < GAME_ZONE.left + halfSize ||
          x > GAME_ZONE.right - halfSize ||
          y < GAME_ZONE.top + halfSize ||
          y > GAME_ZONE.bottom - halfSize
        ) {
          return false;
        }

        return !getZombieSafeZones().some((zone) =>
          isInsideInflatedZoneFor(zone, x, y, halfSize, halfSize)
        );
      }

      function getRandomDogPosition(options = {}) {
        const size = options.size || getDogRenderSize();
        const halfSize = size / 2;
        const minX = GAME_ZONE.left + halfSize;
        const maxX = GAME_ZONE.right - halfSize;
        const minY = GAME_ZONE.top + halfSize;
        const maxY = GAME_ZONE.bottom - halfSize;
        const originX = Number(options.originX);
        const originY = Number(options.originY);
        const minimumDistance = Math.max(
          0,
          Number(options.minimumDistance) || 0
        );
        let bestCandidate = null;
        let bestDistance = -1;

        for (let attempt = 0; attempt < 600; attempt += 1) {
          const x = randomBetween(minX, maxX);
          const y = randomBetween(minY, maxY);
          if (!isDogPositionAllowed(x, y, size)) continue;

          if (!Number.isFinite(originX) || !Number.isFinite(originY)) {
            return { x, y };
          }

          const distance = Math.hypot(x - originX, y - originY);
          if (distance >= minimumDistance) return { x, y };

          if (distance > bestDistance) {
            bestDistance = distance;
            bestCandidate = { x, y };
          }
        }

        return bestCandidate;
      }

      function getDogClearRunDistance(
        activeDog,
        angle,
        maximumDistance = DOG_MAX_STRAIGHT_DISTANCE
      ) {
        let clearDistance = 0;

        for (
          let distance = DOG_PATH_SCAN_STEP;
          distance <= maximumDistance;
          distance += DOG_PATH_SCAN_STEP
        ) {
          const x = activeDog.x + Math.cos(angle) * distance;
          const y = activeDog.y + Math.sin(angle) * distance;
          if (!isDogPositionAllowed(x, y, activeDog.size)) break;
          clearDistance = distance;
        }

        return clearDistance;
      }

      function chooseNextDogWaypoint(activeDog, forceTurn = false) {
        const currentAngle =
          Math.round(normalizeDogAngle(activeDog.angle) / DOG_TURN_STEP_RAD) *
          DOG_TURN_STEP_RAD;
        const currentClearDistance = getDogClearRunDistance(
          activeDog,
          currentAngle
        );
        let selectedAngle = null;
        let selectedDistance = 0;
        let selectedTurnDirection = 0;

        /*
          개는 정확히 8방향으로만 달립니다.
          평소에는 현재 방향을 높은 확률로 유지하고, 방향을 바꿀 때는
          시계 또는 반시계 방향의 인접한 방향으로 45도씩만 전환합니다.
          따라서 90~180도 방향도 한 번에 바뀌지 않고 여러 짧은 구간에 나뉩니다.
        */
        if (
          !forceTurn &&
          currentClearDistance >= DOG_WAYPOINT_MIN_DISTANCE &&
          Math.random() < DOG_CONTINUE_DIRECTION_CHANCE
        ) {
          selectedAngle = currentAngle;
          selectedDistance = currentClearDistance;
          activeDog.turnStepDirection = 0;
        } else {
          const savedTurnDirection =
            activeDog.turnStepDirection === -1 ||
            activeDog.turnStepDirection === 1
              ? activeDog.turnStepDirection
              : 0;
          const turnDirections = savedTurnDirection
            ? [savedTurnDirection]
            : Math.random() < 0.5
              ? [1, -1]
              : [-1, 1];
          let bestScore = -Infinity;

          for (const turnDirection of turnDirections) {
            const angle = normalizeDogAngle(
              currentAngle + turnDirection * DOG_TURN_STEP_RAD
            );
            const clearDistance = getDogClearRunDistance(activeDog, angle);
            const score = clearDistance + Math.random() * 12;

            if (score > bestScore) {
              bestScore = score;
              selectedAngle = angle;
              selectedDistance = clearDistance;
              selectedTurnDirection = turnDirection;
            }
          }
        }

        if (selectedAngle === null) return false;

        const isTurning = selectedTurnDirection !== 0;
        let runDistance = 0;

        if (isTurning) {
          activeDog.turnStepDirection = selectedTurnDirection;

          /*
            경계 바로 앞처럼 45도 방향으로도 움직일 공간이 없으면
            한 단계만 방향을 바꾼 뒤 잠깐 유지하고, 다음 단계에서 같은 방향으로
            다시 45도 회전합니다. 한 프레임에 여러 방향을 건너뛰지 않습니다.
          */
          if (selectedDistance < DOG_WAYPOINT_REACH_DISTANCE * 2) {
            activeDog.angle = selectedAngle;
            activeDog.waypointX = activeDog.x;
            activeDog.waypointY = activeDog.y;
            activeDog.turnHoldUntil =
              performance.now() + DOG_BLOCKED_TURN_HOLD_MS;
            return true;
          }

          runDistance = Math.min(
            selectedDistance * 0.95,
            randomBetween(
              DOG_TURN_SEGMENT_MIN_DISTANCE,
              DOG_TURN_SEGMENT_MAX_DISTANCE
            )
          );
        } else {
          const minimumRunDistance = Math.min(
            DOG_WAYPOINT_MIN_DISTANCE,
            selectedDistance
          );
          runDistance = randomBetween(
            Math.max(
              DOG_WAYPOINT_REACH_DISTANCE * 2,
              minimumRunDistance * 0.86
            ),
            Math.max(
              DOG_WAYPOINT_REACH_DISTANCE * 2,
              selectedDistance * 0.97
            )
          );
        }

        activeDog.turnHoldUntil = 0;
        activeDog.angle = selectedAngle;
        activeDog.waypointX =
          activeDog.x + Math.cos(selectedAngle) * runDistance;
        activeDog.waypointY =
          activeDog.y + Math.sin(selectedAngle) * runDistance;
        return true;
      }

      function dogFramePosition(frameIndex) {
        const normalized = clamp(
          Math.round(Number(frameIndex) || 0),
          0,
          DOG_SHEET_COLUMNS * DOG_SHEET_ROWS - 1
        );
        const column = normalized % DOG_SHEET_COLUMNS;
        const row = Math.floor(normalized / DOG_SHEET_COLUMNS);
        const xPercent = column / (DOG_SHEET_COLUMNS - 1) * 100;
        const yPercent = row / (DOG_SHEET_ROWS - 1) * 100;
        return `${xPercent}% ${yPercent}%`;
      }

      function getDogDirectionAnimation(angle) {
        const octant = (
          Math.round(normalizeDogAngle(angle) / (Math.PI / 4)) + 8
        ) % 8;
        return DOG_DIRECTION_ANIMATIONS[octant];
      }

      function showDogFrame(activeDog) {
        const animation = getDogDirectionAnimation(activeDog.angle);
        const frameIndex = animation.frameStart + activeDog.animationFrame;
        const position = dogFramePosition(frameIndex);
        const transform = animation.flipX ? "scaleX(-1)" : "scaleX(1)";
        const renderKey = `${frameIndex}|${transform}`;

        if (activeDog.renderKey === renderKey) return;
        activeDog.renderKey = renderKey;
        activeDog.sprite.style.backgroundPosition = position;
        activeDog.nightSprite.style.backgroundPosition = position;
        activeDog.sprite.style.transform = transform;
        activeDog.nightSprite.style.transform = transform;
      }

      function renderDog(activeDog) {
        activeDog.element.style.left = `${activeDog.x}px`;
        activeDog.element.style.top = `${activeDog.y}px`;
        updateEntityTreeDepth(
          activeDog.element,
          activeDog.x,
          activeDog.y + activeDog.size * 0.34,
          activeDog.y
        );
      }

      function getDogAvoidanceVector(activeDog) {
        const halfSize = activeDog.size / 2;
        const margin = DOG_AVOIDANCE_MARGIN;
        let pushX = 0;
        let pushY = 0;

        const minX = GAME_ZONE.left + halfSize;
        const maxX = GAME_ZONE.right - halfSize;
        const minY = GAME_ZONE.top + halfSize;
        const maxY = GAME_ZONE.bottom - halfSize;

        const leftDistance = activeDog.x - minX;
        const rightDistance = maxX - activeDog.x;
        const topDistance = activeDog.y - minY;
        const bottomDistance = maxY - activeDog.y;

        if (leftDistance < margin) pushX += (margin - leftDistance) / margin;
        if (rightDistance < margin) pushX -= (margin - rightDistance) / margin;
        if (topDistance < margin) pushY += (margin - topDistance) / margin;
        if (bottomDistance < margin) pushY -= (margin - bottomDistance) / margin;

        for (const zone of getZombieSafeZones()) {
          const inflated = {
            left: zone.left - halfSize,
            top: zone.top - halfSize,
            right: zone.right + halfSize,
            bottom: zone.bottom + halfSize
          };
          const nearestX = clamp(activeDog.x, inflated.left, inflated.right);
          const nearestY = clamp(activeDog.y, inflated.top, inflated.bottom);
          let dx = activeDog.x - nearestX;
          let dy = activeDog.y - nearestY;
          let distance = Math.hypot(dx, dy);

          if (distance < 0.0001) {
            dx = activeDog.x - (inflated.left + inflated.right) / 2;
            dy = activeDog.y - (inflated.top + inflated.bottom) / 2;
            distance = Math.max(0.0001, Math.hypot(dx, dy));
          }

          if (distance >= margin) continue;
          const strength = (margin - distance) / margin * 2.4;
          pushX += dx / distance * strength;
          pushY += dy / distance * strength;
        }

        return { x: pushX, y: pushY };
      }

      function findDogMovementAngle(activeDog, stepDistance, desiredAngle) {
        const candidates = [];
        const candidateCount = 24;

        for (let index = 0; index < candidateCount; index += 1) {
          const angle = -Math.PI + index * (Math.PI * 2 / candidateCount);
          const nextX = activeDog.x + Math.cos(angle) * stepDistance;
          const nextY = activeDog.y + Math.sin(angle) * stepDistance;
          if (!isDogPositionAllowed(nextX, nextY, activeDog.size)) continue;

          const desiredDifference = Math.abs(
            getShortestDogAngleDelta(angle, desiredAngle)
          );
          const currentDifference = Math.abs(
            getShortestDogAngleDelta(angle, activeDog.angle)
          );
          candidates.push({
            angle,
            score: desiredDifference + currentDifference * 0.35
          });
        }

        candidates.sort((a, b) => a.score - b.score);
        return candidates[0]?.angle ?? null;
      }

      function moveDog(activeDog, distance) {
        const stepCount = Math.max(1, Math.ceil(distance / 4));
        const stepDistance = distance / stepCount;

        for (let step = 0; step < stepCount; step += 1) {
          const nextX =
            activeDog.x + Math.cos(activeDog.angle) * stepDistance;
          const nextY =
            activeDog.y + Math.sin(activeDog.angle) * stepDistance;

          if (!isDogPositionAllowed(nextX, nextY, activeDog.size)) {
            /*
              경계나 안전영역 앞에서는 제자리에서 계속 회전하지 않고,
              현재 방향을 제외한 새로운 직선 경로를 한 번 선택합니다.
            */
            chooseNextDogWaypoint(activeDog, true);
            return false;
          }

          activeDog.x = nextX;
          activeDog.y = nextY;
        }

        return true;
      }

      function updateDog(activeDog, deltaMs, now) {
        const isHoldingTurn = now < activeDog.turnHoldUntil;

        if (!isHoldingTurn) {
          const distanceToWaypoint = Math.hypot(
            activeDog.waypointX - activeDog.x,
            activeDog.waypointY - activeDog.y
          );
          if (
            distanceToWaypoint <= DOG_WAYPOINT_REACH_DISTANCE ||
            !isDogPositionAllowed(
              activeDog.waypointX,
              activeDog.waypointY,
              activeDog.size
            )
          ) {
            chooseNextDogWaypoint(activeDog);
          }

          // 선택된 8방향 직선으로만 이동하며, 방향은 한 번에 45도씩만 바뀝니다.
          if (now >= activeDog.turnHoldUntil) {
            moveDog(activeDog, DOG_SPEED_PX_PER_MS * deltaMs);
          }
        }

        activeDog.animationElapsed += deltaMs;
        if (activeDog.animationElapsed >= DOG_FRAME_INTERVAL_MS) {
          const advancedFrames = Math.floor(
            activeDog.animationElapsed / DOG_FRAME_INTERVAL_MS
          );
          activeDog.animationElapsed %= DOG_FRAME_INTERVAL_MS;
          activeDog.animationFrame = (
            activeDog.animationFrame + advancedFrames
          ) % DOG_RUN_FRAME_COUNT;
        }

        showDogFrame(activeDog);
        renderDog(activeDog);
      }

      function createDog(forceEnabled = false) {
        if ((!DOG_ENABLED && !forceEnabled) || dog) return false;

        const size = getDogRenderSize();
        const position = getRandomDogPosition({ size });
        if (!position) return false;

        const element = document.createElement("div");
        element.className = "dog";
        element.setAttribute("aria-label", "Dog");

        const dayVisual = document.createElement("div");
        dayVisual.className = "dog-visual-layer dog-visual-day";

        const nightVisual = document.createElement("div");
        nightVisual.className = "dog-visual-layer dog-visual-night";

        const sprite = document.createElement("div");
        sprite.className = "dog-sprite";
        sprite.style.backgroundImage = `url("${DOG_SHEET}")`;

        const nightSprite = document.createElement("div");
        nightSprite.className = "dog-sprite";
        nightSprite.style.backgroundImage = `url("${DOG_SHEET}")`;

        dayVisual.appendChild(sprite);
        nightVisual.appendChild(nightSprite);
        element.appendChild(dayVisual);
        element.appendChild(nightVisual);
        entities.appendChild(element);

        dog = {
          element,
          sprite,
          nightSprite,
          size,
          x: position.x,
          y: position.y,
          waypointX: position.x,
          waypointY: position.y,
          angle: Math.floor(Math.random() * 8) * DOG_TURN_STEP_RAD,
          turnStepDirection: 0,
          turnHoldUntil: 0,
          animationElapsed: Math.random() * DOG_FRAME_INTERVAL_MS,
          animationFrame: Math.floor(Math.random() * DOG_RUN_FRAME_COUNT),
          wanderPhase: Math.random() * Math.PI * 2,
          renderKey: ""
        };

        chooseNextDogWaypoint(dog);

        showDogFrame(dog);
        renderDog(dog);
        return true;
      }

      function showSingleDeerFrame(deer, frameIndex) {
        const renderState = deer.spriteRenderState;

        // 같은 단일 프레임이 유지되는 동안에는 DOM 스타일을 다시 쓰지 않습니다.
        if (
          renderState.mode === "single" &&
          renderState.frameIndex === frameIndex
        ) {
          return;
        }

        const position = deerFramePosition(frameIndex);
        const backgroundImage = `url("${DEER_SHEET}")`;

        deer.sprite.style.backgroundImage = backgroundImage;
        deer.sprite.style.backgroundPosition = position;
        deer.sprite.style.opacity = "1";
        deer.overlay.style.opacity = "0";

        deer.nightSprite.style.backgroundImage = backgroundImage;
        deer.nightSprite.style.backgroundPosition = position;
        deer.nightSprite.style.opacity = "1";
        deer.nightOverlay.style.opacity = "0";

        renderState.mode = "single";
        renderState.frameIndex = frameIndex;
        renderState.crossfadeKey = "";
        renderState.fromOpacity = "1";
        renderState.toOpacity = "0";
      }

      function showDeerCrossfade(
        deer,
        fromFrameIndex,
        toFrameIndex,
        progress
      ) {
        const clampedProgress = clamp(progress, 0, 1);
        const renderState = deer.spriteRenderState;
        const crossfadeKey = `${fromFrameIndex}|${toFrameIndex}`;
        const fromOpacity = String(1 - clampedProgress);
        const toOpacity = String(clampedProgress);

        // 전환 프레임은 바뀌는 순간에만 설정합니다.
        if (
          renderState.mode !== "crossfade" ||
          renderState.crossfadeKey !== crossfadeKey
        ) {
          const fromPosition = deerFramePosition(fromFrameIndex);
          const toPosition = deerFramePosition(toFrameIndex);
          const backgroundImage = `url("${DEER_SHEET}")`;

          deer.sprite.style.backgroundImage = backgroundImage;
          deer.sprite.style.backgroundPosition = fromPosition;
          deer.overlay.style.backgroundImage = backgroundImage;
          deer.overlay.style.backgroundPosition = toPosition;
