      function renderRepairCategories() {
        for (const categoryButton of repairCategories) {
          const category = categoryButton.dataset.repairCategory || "";
          const isSelected = category === repairSelectedCategory;
          const badge = categoryButton.querySelector(".repair-category-new-badge");
          categoryButton.classList.toggle("is-selected", isSelected);
          categoryButton.setAttribute("aria-selected", isSelected ? "true" : "false");
          if (badge) badge.hidden = !getRepairCategoryHasNewItems(category);
        }
      }

      function renderRepairGrid() {
        repairGrid.replaceChildren();

        const selectedIndex = repairSelectedItemByCategory[repairSelectedCategory] || 0;
        const items = repairItemsByCategory[repairSelectedCategory];
        const definition = REPAIR_CATEGORY_DEFINITIONS[repairSelectedCategory];
        const isSectionedLayout = Array.isArray(definition.sections);

        repairGrid.classList.toggle("is-sectioned-layout", isSectionedLayout);
        repairGrid.style.gridTemplateRows = isSectionedLayout
          ? `repeat(${definition.sections.length * 2}, 28px)`
          : "";

        if (isSectionedLayout) {
          definition.sections.forEach((section, sectionIndex) => {
            const label = document.createElement("span");
            label.className = `repair-style-row-label repair-style-row-label--${section.key}`;
            label.textContent = section.label;
            label.style.gridRow = String(sectionIndex * 2 + 1);
            label.setAttribute("aria-hidden", "true");
            repairGrid.append(label);
          });
        }

        items.forEach((item, index) => {
          if (isSectionedLayout && !getRepairSectionDefinition(repairSelectedCategory, index)) {
            return;
          }
          if (isSectionedLayout && index >= definition.sections.length * REPAIR_SECTION_SPAN) return;

          const button = document.createElement("button");
          button.type = "button";
          button.className = "repair-grid-item";
          button.dataset.repairItemIndex = String(index);
          button.setAttribute("role", "gridcell");
          button.setAttribute(
            "aria-label",
            item.unlocked ? item.name || `Option ${index + 1}` : `Locked option ${index + 1}`
          );
          button.classList.toggle("is-selected", item.unlocked && index === selectedIndex);
          button.classList.toggle("is-disabled", !item.unlocked);
          button.classList.toggle("is-new", item.unlocked && item.isNew);
          button.classList.toggle(
            "is-applied",
            item.unlocked && item.built && index === getAppliedRepairItemIndex(repairSelectedCategory, index)
          );
          button.setAttribute("aria-disabled", item.unlocked ? "false" : "true");

          if (isSectionedLayout) {
            const section = getRepairSectionDefinition(repairSelectedCategory, index);
            const sectionOrder = definition.sections.findIndex((entry) => entry.key === section.key);
            button.style.gridColumn = String((index % REPAIR_SECTION_SPAN) + 1);
            button.style.gridRow = String(sectionOrder * 2 + 2);
          }

          repairGrid.append(button);
        });
      }

      function renderRepairItemInfo() {
        const selectedIndex = repairSelectedItemByCategory[repairSelectedCategory];
        const item = getSelectedRepairItem();

        if (!item) {
          const definition = REPAIR_CATEGORY_DEFINITIONS[repairSelectedCategory];
          repairItemName.textContent = definition.initialItemName || "None";
          repairItemMeta.textContent = "";
          repairItemMeta.removeAttribute("aria-label");
          repairItemDescription.textContent = definition.initialItemDescription || "";
          repairActionButton.textContent = repairSelectedCategory === "repair"
            ? "Repair"
            : "Applied";
          repairActionButton.disabled = true;
          return;
        }

        const appliedIndex = getAppliedRepairItemIndex(repairSelectedCategory, selectedIndex);
        const sectionDefinition = getRepairSectionDefinition(repairSelectedCategory, selectedIndex);

        repairItemName.textContent = item.name || "Unnamed";
        repairItemMeta.textContent = "";
        repairItemMeta.removeAttribute("aria-label");
        repairItemDescription.replaceChildren();

        if (item.built) {
          repairItemDescription.textContent = item.builtDescription || item.description || sectionDefinition?.initialItemDescription || REPAIR_CATEGORY_DEFINITIONS[repairSelectedCategory].initialItemDescription || "";
        } else {
          const labels = {
            wood: "Wood",
            food: "Food",
            carParts: "Car Parts",
            repairKit: "Repair Kit"
          };
          const materialEntries = Object.entries(item.materials);
          if (materialEntries.length === 0) {
            repairItemDescription.textContent = repairSelectedCategory === "repair"
              ? ""
              : item.description || "—";
          } else {
            for (const [resource, required] of materialEntries) {
              const current = getRepairResourceAmount(resource);
              const line = document.createElement("span");
              line.className = "repair-material-line";
              line.textContent = `${labels[resource] || resource} ${current}/${required}`;
              line.classList.toggle("is-complete", current >= required);
              repairItemDescription.append(line);
            }
            // 수리 항목 설명은 완료 전에는 숨기고, 재료 표시가 사라진 뒤 같은 위치에 표시합니다.
            if (repairSelectedCategory !== "repair" && item.description) {
              const desc = document.createElement("span");
              desc.className = "repair-material-line";
              desc.textContent = item.description;
              repairItemDescription.append(desc);
            }
          }
        }

        if (repairSelectedCategory === "repair") {
          repairActionButton.textContent = "Repair";
          repairActionButton.disabled = !item.unlocked || item.built || !canAffordRepairMaterials(item.materials);
          return;
        }

        if (!item.built) {
          repairActionButton.textContent = "Craft";
          repairActionButton.disabled = false;
          return;
        }
        if (selectedIndex === appliedIndex) {
          repairActionButton.textContent = "Applied";
          repairActionButton.disabled = true;
        } else {
          repairActionButton.textContent = "Apply";
          repairActionButton.disabled = false;
        }
      }

      function syncRepairCompletionLabels() {
        const shedRepairItem =
          repairItemsByCategory.repair?.[SHED_REPAIR_BLUEPRINT_INDEX];
        if (shedRepairItem?.unlocked) {
          shedRepairItem.name = shedRepairItem.built
            ? "Repaired Shed"
            : "Shed Repair";
          if (shedRepairItem.built) {
            shedRepairItem.builtDescription =
              "Get the old shed standing again.\nFood +2\nWood +5";
          }
        }
      }

      function updateInstalledStructureVisibility() {
        const appliedFenceIndex = repairAppliedItemBySection.outdoor.fence || 0;
        fenceObject.hidden = appliedFenceIndex === 0;
        applyMailboxVisibility();
        shedObject.style.setProperty(
          "--shed-frame-position",
          isShedRepaired() ? "right top" : "left top"
        );
      }

      function applyRepairState() {
        syncRepairCompletionLabels();
        updateInstalledStructureVisibility();
        renderRepairCategories();
        renderRepairGrid();
        renderRepairItemInfo();
        updateRepairNewBadgeState();
      }

      function selectRepairCategory(category) {
        if (!isRepairCategory(category)) return;

        repairSelectedCategory = category;
        applyRepairState();
        updateRepairCategoryLayout();
        saveResourceState();
      }

      function selectRepairItem(index) {
        const normalizedIndex = normalizeRepairItemIndex(index);
        const item = repairItemsByCategory[repairSelectedCategory][normalizedIndex];

        if (!item.unlocked) {
          showToast(REPAIR_BLOCKED_TOAST_MESSAGE);
          return;
        }

        repairSelectedItemByCategory[repairSelectedCategory] = normalizedIndex;
        clearRepairItemNewState(repairSelectedCategory, normalizedIndex);
        applyRepairState();
        saveResourceState();
      }

      function handleRepairAction() {
        if (isExploring) {
          showExploringBusyToast();
          return;
        }

        const selectedIndex = repairSelectedItemByCategory[repairSelectedCategory];
        const item = getSelectedRepairItem();
        if (!item) return;

        if (repairSelectedCategory === "repair") {
          if (!item.unlocked || item.built) return;
          if (!canAffordRepairMaterials(item.materials)) return;
          playSound(CRAFTING_SOUND);
          consumeRepairMaterials(item.materials);
          item.built = true;
          item.isNew = false;
          if (selectedIndex === SHED_REPAIR_BLUEPRINT_INDEX) {
            setTodoProgress(2, "item3", true);
          }
          if (selectedIndex === CAR_REPAIR_BLUEPRINT_INDEX) {
            setTodoProgress(3, "item3", true);
          }
          updateResourceHud();
          applyRepairState();
          applyInventoryState();
          saveResourceState();
          return;
        }

        if (!item.built) {
          if (!canAffordRepairMaterials(item.materials)) {
            showToast(REPAIR_MATERIALS_TOAST_MESSAGE);
            return;
          }

          playSound(CRAFTING_SOUND);
          consumeRepairMaterials(item.materials);
          item.built = true;
          item.isNew = false;
          updateResourceHud();
          applyRepairState();
          saveResourceState();
          return;
        }

        if (getAppliedRepairItemIndex(repairSelectedCategory, selectedIndex) === selectedIndex) {
          return;
        }

        playSound(CRAFTING_SOUND);
        setAppliedRepairItemIndex(repairSelectedCategory, selectedIndex);
        if (repairSelectedCategory === "outdoor" && selectedIndex !== 0) {
          setTodoProgress(2, "item1", true);
        }
        applyRepairState();
        saveResourceState();
      }

      function loadResourceState() {
        try {
          const saved = localStorage.getItem(RESOURCE_STORAGE_KEY);
          if (!saved) {
            applyAxeState();
            applyInventoryState();
            applyInventoryNewBadgeState();
            applyRepairState();
            applyTreeVisualState();
            updateResourceHud();
            updateDayStatus();
            restoreExplorationState();
            return;
          }

          const parsed = JSON.parse(saved);
          const savedGameVersion = String(parsed.version || "").trim();

          if (!GAME_VERSION || savedGameVersion !== GAME_VERSION) {
            localStorage.removeItem(RESOURCE_STORAGE_KEY);
            applyAxeState();
            applyInventoryState();
            applyInventoryNewBadgeState();
            applyRepairState();
            applyTreeVisualState();
            updateResourceHud();
            updateDayStatus();
            restoreExplorationState();
            return;
          }

          zombieKillRequirement = normalizeZombieKillRequirement(
            parsed.zombieKillRequirement
          );
          zombieCount = Math.min(
            normalizeStoredCount(parsed.zombies, MAX_ZOMBIE_COUNT),
            zombieKillRequirement
          );
          dayCount = normalizeDayCount(parsed.dayCount);
          foodCount = normalizeStoredCount(parsed.food, STORAGE_MAX_FOOD_COUNT);
          woodCount = normalizeStoredCount(parsed.wood, STORAGE_MAX_WOOD_COUNT);
          treeChopCount = clamp(
            Math.round(Number(parsed.treeChopCount) || 0),
            0,
            TREE_MAX_CHOPS_PER_GROWTH
          );
          treeGrowthState = [
            TREE_GROWTH_READY,
            TREE_GROWTH_DEPLETED,
            TREE_GROWTH_REGROWING
          ].includes(parsed.treeGrowthState)
            ? parsed.treeGrowthState
            : (treeChopCount >= TREE_MAX_CHOPS_PER_GROWTH
              ? TREE_GROWTH_DEPLETED
              : TREE_GROWTH_READY);
          if (treeGrowthState !== TREE_GROWTH_READY) {
            treeChopCount = TREE_MAX_CHOPS_PER_GROWTH;
          }
          hasAxe = parsed.hasAxe === true;
          hasHandgun = parsed.hasHandgun === true;
          hasHandgunAmmo = parsed.hasHandgunAmmo === true ||
            Number(parsed.handgunAmmo) > 0;
          handgunAmmoCount = normalizeStoredCount(
            parsed.handgunAmmo,
            MAX_INVENTORY_QUANTITY
          );
          isHandgunEquipped = hasHandgun &&
            parsed.isHandgunEquipped === true;
          isAxeEquipped = hasAxe && !isHandgunEquipped &&
            parsed.isAxeEquipped !== false;
          hasMusicBox = parsed.hasMusicBox === true;
          isMusicOn = hasMusicBox && parsed.isMusicOn !== false;
          hasNewInventoryItem = parsed.hasNewInventoryItem === true;
          const storedNewInventoryItems = Array.isArray(parsed.newInventoryItems)
            ? parsed.newInventoryItems
            : [];

          for (const itemType of storedNewInventoryItems) {
            if (
              typeof itemType === "string" &&
              inventoryItems.some(
                (item) => item.dataset.item === itemType
              )
            ) {
              newInventoryItemTypes.add(itemType);
            }
          }

          if (
            newInventoryItemTypes.size === 0 &&
            hasNewInventoryItem
          ) {
            if (hasHandgun) newInventoryItemTypes.add("handgun");
            if (hasHandgunAmmo) newInventoryItemTypes.add("handgunAmmo");
          }
          hasCompass = parsed.hasCompass === true;
          hasStrangerLetter = parsed.hasStrangerLetter === true;
          isStrangerLetterOn = hasStrangerLetter && parsed.isStrangerLetterOn !== false;
          carPartsCount = normalizeStoredCount(parsed.carParts, getMaxCarPartsCount());
          hasRepairKit = parsed.hasRepairKit === true;
          mailboxIntroTriggered = parsed.mailboxIntroTriggered === true;
          currentTodoListId = clamp(Math.round(Number(parsed.currentTodoListId) || 0), 0, 3);
          todoSubmittedListId = clamp(Math.round(Number(parsed.todoSubmittedListId) || 0), 0, 3);
          todoSubmittedDay = normalizeDayCount(parsed.todoSubmittedDay || 0);
          const storedTodoProgress = parsed.todoProgress && typeof parsed.todoProgress === "object"
            ? parsed.todoProgress
            : null;
          if (storedTodoProgress) {
            for (const [listId, tasks] of Object.entries(todoProgress)) {
              const storedTasks = storedTodoProgress[listId];
              if (!storedTasks || typeof storedTasks !== "object") continue;
              for (const key of Object.keys(tasks)) {
                tasks[key] = storedTasks[key] === true;
              }
            }
          }
          fuelCount = normalizeStoredCount(parsed.fuel, 10);
          // 이전 Repair Kit 보유 저장값은 새 Map 조건으로 이관합니다.
          hasMap = parsed.hasMap === true ||
            parsed.map === true ||
            Number(parsed.map) > 0 ||
            parsed.repairKit === true ||
            Number(parsed.repairKit) > 0;
          explorationDestination = typeof parsed.explorationDestination === "string"
            ? parsed.explorationDestination
            : "";
          explorationEndsAt = Number.isFinite(Number(parsed.explorationEndsAt))
            ? Math.max(0, Number(parsed.explorationEndsAt))
            : 0;

          const savedAt = Number.isFinite(Number(parsed.savedAt))
            ? Math.max(0, Number(parsed.savedAt))
            : Date.now();
          lastZombieSpawnAt = Number.isFinite(Number(parsed.lastZombieSpawnAt))
            ? Math.max(0, Number(parsed.lastZombieSpawnAt))
            : savedAt;
          lastDeerSpawnAt = Number.isFinite(Number(parsed.lastDeerSpawnAt))
            ? Math.max(0, Number(parsed.lastDeerSpawnAt))
            : savedAt;
          storedPopulationSnapshot = {
            savedAt,
            explorationEndsAt,
            activeZombies: normalizeStoredCount(
              parsed.activeZombies,
              MAX_ACTIVE_ZOMBIES
            ),
            activeDeer: normalizeStoredCount(
              parsed.activeDeer,
              MAX_ACTIVE_DEER
            )
          };

          // 첫 좀비 처치 새 떼 연출은 별도 저장해 게임 초기화 전까지 한 번만 재생합니다.
          firstKillBirdFlockPlayed =
            parsed.firstKillBirdFlockPlayed === true;
          loadRepairState(parsed.repairState);
        } catch (_) {
          // file:// 환경 등에서 저장소를 사용할 수 없어도 게임은 계속 동작합니다.
        }

        // 페이지를 처음 열 때 이미 Axe를 보유하고 있었다면 기존 튜토리얼성 시작 처리는 건너뜁니다.
        // 새 떼 연출 여부는 Axe 보유와 분리해 저장된 전용 플래그만 사용합니다.
        skipFirstStartSequence = hasAxe;

        applyAxeState();
        applyInventoryState();
        applyInventoryNewBadgeState();
        applyRepairState();
        applyTreeVisualState();
        updateTodoListUI();
        updateResourceHud();
        updateDayStatus();
        restoreExplorationState();
      }

      function saveResourceState() {
        if (isStateSaveSuppressed) return;

        try {
          localStorage.setItem(
            RESOURCE_STORAGE_KEY,
            JSON.stringify({
              version: GAME_VERSION,
              zombies: zombieCount,
              zombieKillRequirement,
              dayCount,
              food: foodCount,
              wood: woodCount,
              treeChopCount,
              treeGrowthState,
              hasAxe,
              isAxeEquipped,
              hasHandgun,
              isHandgunEquipped,
              hasHandgunAmmo,
              handgunAmmo: handgunAmmoCount,
              hasMusicBox,
              isMusicOn,
              hasNewInventoryItem,
              newInventoryItems: Array.from(newInventoryItemTypes),
              hasCompass,
              hasStrangerLetter,
              isStrangerLetterOn,
              carParts: carPartsCount,
              hasRepairKit,
              mailboxIntroTriggered,
              currentTodoListId,
              todoSubmittedListId,
              todoSubmittedDay,
              todoProgress,
              fuel: fuelCount,
              hasMap,
              repairState: serializeRepairState(),
              firstKillBirdFlockPlayed,
              explorationDestination,
              explorationEndsAt: isExploring ? explorationEndsAt : 0,
              activeZombies: getLivingZombieCount(),
              activeDeer: getLivingDeerCount(),
              lastZombieSpawnAt,
              lastDeerSpawnAt,
              savedAt: Date.now()
            })
          );
        } catch (_) {
          // 저장 실패는 게임 진행에 영향을 주지 않습니다.
        }
      }

      function getRequirementValue(requirement) {
        if (requirement === "zombies") return zombieCount;
        if (requirement === "food") return foodCount;
        if (requirement === "compass") return hasCompass ? 1 : 0;
        if (requirement === "fuel") return fuelCount;
        if (requirement === "map") return hasMap ? 1 : 0;
        return 0;
      }

      function updateExplorationRequirements() {
        for (const item of explorationRequirementItems) {
          const requirement = item.dataset.requirement || "";
          const required = requirement === "zombies"
            ? zombieKillRequirement
            : Math.max(0, Number(item.dataset.required) || 0);
          const current = getRequirementValue(requirement);
          const currentElement = item.querySelector(
            ".exploration-requirement-current"
          );
          const totalElement = item.querySelector(
            ".exploration-requirement-total"
          );

          if (currentElement) {
            currentElement.textContent = String(current);
          }

          if (totalElement) {
            totalElement.textContent = String(required);
          }

          item.classList.toggle("is-complete", current >= required);
        }
      }

      function updateResourceHud() {
        countElement.textContent = String(zombieCount);
        zombieGoalElement.textContent = String(zombieKillRequirement);
        foodCountElement.textContent = String(foodCount);
        woodCountElement.textContent = String(woodCount);
        const foodContainer = foodCountElement.parentElement;
        const woodContainer = woodCountElement.parentElement;
        if (foodContainer && foodContainer.lastChild) {
          foodContainer.lastChild.textContent = `/${getMaxFoodCount()}`;
        }
        if (woodContainer && woodContainer.lastChild) {
          woodContainer.lastChild.textContent = `/${getMaxWoodCount()}`;
        }
        updateExplorationRequirements();
      }

      function createDayNumberValue(value) {
        const element = document.createElement("span");
        element.className = "day-number-value";
        element.textContent = String(value);
        return element;
      }

      function setDayNumberImmediately(value) {
        dayNumberAnimationToken += 1;

        if (dayNumberAnimationTimerId !== null) {
          clearTimeout(dayNumberAnimationTimerId);
          dayNumberAnimationTimerId = null;
        }

        dayNumberTrack.classList.remove("is-rolling");
        dayNumberViewport.classList.remove("is-resizing");
        dayNumberTrack.replaceChildren(createDayNumberValue(value));
        dayNumberViewport.style.width = `${dayNumberTrack.scrollWidth}px`;
        renderedDayCount = value;
        dayNumber.setAttribute("aria-label", `DAY ${value}`);
      }

      function animateDayNumberTo(value) {
        if (value === renderedDayCount) {
          setDayNumberImmediately(value);
          return;
        }

        const animationToken = ++dayNumberAnimationToken;
        const previousValue = renderedDayCount;

        if (dayNumberAnimationTimerId !== null) {
          clearTimeout(dayNumberAnimationTimerId);
          dayNumberAnimationTimerId = null;
        }

        const previousValueElement = createDayNumberValue(previousValue);
        const nextValueElement = createDayNumberValue(value);

        dayNumberTrack.classList.remove("is-rolling");
        dayNumberViewport.classList.remove("is-resizing");
        dayNumberTrack.replaceChildren(
          previousValueElement,
          nextValueElement
        );

        const previousNumberWidth = previousValueElement.getBoundingClientRect().width;
        const nextNumberWidth = nextValueElement.getBoundingClientRect().width;
        dayNumberViewport.style.width = `${previousNumberWidth}px`;
        dayNumber.setAttribute("aria-label", `DAY ${value}`);

        const finishAnimation = () => {
          if (animationToken !== dayNumberAnimationToken) return;

          if (dayNumberAnimationTimerId !== null) {
            clearTimeout(dayNumberAnimationTimerId);
            dayNumberAnimationTimerId = null;
          }

          dayNumberTrack.classList.remove("is-rolling");
          dayNumberViewport.classList.remove("is-resizing");
          dayNumberTrack.replaceChildren(createDayNumberValue(value));
          dayNumberViewport.style.width = `${nextNumberWidth}px`;
          renderedDayCount = value;
        };

        nextValueElement.addEventListener("animationend", finishAnimation, {
          once: true
        });

        // 귀환 후 3초 대기한 다음 롤링을 시작합니다.
        dayNumberAnimationTimerId = window.setTimeout(() => {
          if (animationToken !== dayNumberAnimationToken) return;

          // 내용을 교체한 뒤에도 애니메이션이 확실히 재시작되게 합니다.
          void dayNumberTrack.offsetHeight;
          dayNumberViewport.classList.add("is-resizing");
          dayNumberTrack.classList.add("is-rolling");
          dayNumberViewport.style.width = `${nextNumberWidth}px`;

          dayNumberAnimationTimerId = window.setTimeout(
            finishAnimation,
            DAY_NUMBER_ROLL_FALLBACK_MS
          );
        }, DAY_NUMBER_ROLL_DELAY_MS);
      }

      function updateDayStatus(options = {}) {
        dayStatus.classList.toggle("is-hidden", isExploring);

        if (
          options.animateDay === true &&
          !isExploring &&
          dayCount !== renderedDayCount
        ) {
          animateDayNumberTo(dayCount);
        } else {
          setDayNumberImmediately(dayCount);
        }
      }

      function commitResourceState(options = {}) {
        updateResourceHud();
        updateDayStatus(options);
        saveResourceState();
      }

      function getLivingZombieCount() {
        let count = 0;

        for (const zombie of zombies.values()) {
          if (
            zombie.state !== "dying" &&
            zombie.state !== "removed"
          ) {
            count += 1;
          }
        }

        return count;
      }

      function getLivingDeerCount() {
        let count = 0;

        for (const deer of deerMap.values()) {
          if (
            deer.state !== "dying" &&
            deer.state !== "leaving" &&
            deer.state !== "removed"
          ) {
            count += 1;
          }
        }

        return count;
      }

      function restoreStoredPopulation() {
        if (!storedPopulationSnapshot) return;

        const now = Date.now();
        const snapshot = storedPopulationSnapshot;
        let targetZombieCount = snapshot.activeZombies;
        let targetDeerCount = snapshot.activeDeer;

        if (isExploring) {
          // 탐험 중 닫았다가 다시 열면 기존 개체 수만 복원하고,
          // 탐험 중 경과 시간은 필드 생성 시간으로 계산하지 않습니다.
          lastZombieSpawnAt = now;
          lastDeerSpawnAt = now;
        } else {
          const explorationFinishedWhileClosed =
            snapshot.explorationEndsAt > snapshot.savedAt;
          const zombieSpawnEligibleAt = explorationFinishedWhileClosed
            ? Math.max(
                lastZombieSpawnAt,
                snapshot.explorationEndsAt + 7_000
              )
            : lastZombieSpawnAt;
          const deerSpawnEligibleAt = explorationFinishedWhileClosed
            ? Math.max(lastDeerSpawnAt, snapshot.explorationEndsAt)
            : lastDeerSpawnAt;
          const elapsedZombieTicks = Math.max(
            0,
            Math.floor(
              (now - zombieSpawnEligibleAt) / SPAWN_INTERVAL_MS
            )
          );
          const elapsedDeerTicks = firstKillBirdFlockPlayed
            ? Math.max(
                0,
                Math.floor(
                  (now - deerSpawnEligibleAt) / DEER_SPAWN_INTERVAL_MS
                )
              )
            : 0;
          const remainingZombieCapacity = Math.max(
            0,
            Math.min(
              MAX_ACTIVE_ZOMBIES,
              zombieKillRequirement - zombieCount
            )
          );

          targetZombieCount = Math.min(
            remainingZombieCapacity,
            targetZombieCount + elapsedZombieTicks
          );
          targetDeerCount = firstKillBirdFlockPlayed
            ? Math.min(
                MAX_ACTIVE_DEER,
                targetDeerCount + elapsedDeerTicks
              )
            : 0;
          lastZombieSpawnAt = Math.min(
            now,
            zombieSpawnEligibleAt +
              elapsedZombieTicks * SPAWN_INTERVAL_MS
          );
          lastDeerSpawnAt = Math.min(
            now,
            deerSpawnEligibleAt +
              elapsedDeerTicks * DEER_SPAWN_INTERVAL_MS
          );
        }

        targetZombieCount = Math.min(
          targetZombieCount,
          MAX_ACTIVE_POPULATION
        );
        if (!firstKillBirdFlockPlayed) {
          targetDeerCount = 0;
        }
        targetDeerCount = Math.min(
          targetDeerCount,
          Math.max(0, MAX_ACTIVE_POPULATION - targetZombieCount)
        );

        for (let index = 0; index < targetZombieCount; index += 1) {
          if (!createZombie({
            force: true,
            silent: true,
            persist: false,
            skipBirth: true
          })) {
            break;
          }
        }

        for (let index = 0; index < targetDeerCount; index += 1) {
          if (!createDeer({
            force: true,
            persist: false,
            skipBirth: true
          })) {
            break;
          }
        }

        storedPopulationSnapshot = null;
        saveResourceState();
      }

      function getActivePopulationCount() {
        return zombies.size + deerMap.size;
      }

      function hasActivePopulationCapacity() {
        return getActivePopulationCount() < MAX_ACTIVE_POPULATION;
      }

      function canCreateZombie() {
        return (
          !isExploring &&
          Date.now() >= zombieSpawnBlockedUntil &&
          hasActivePopulationCapacity() &&
          zombieCount + getLivingZombieCount() < zombieKillRequirement
        );
      }

      function hasAnyInventoryItem() {

      function setInventoryTrackOffset(offset, animate) {
        inventoryTrack.classList.toggle("is-dragging", !animate);

      function updateInventoryPageDots() {
        inventoryPagination.replaceChildren();
        inventoryPagination.hidden = inventoryPageCount <= 1;

        if (inventoryPageCount <= 1) return;

        for (let index = 0; index < inventoryPageCount; index += 1) {
          const dot = document.createElement("button");
          dot.type = "button";
          dot.className = "inventory-page-dot";
          dot.classList.toggle("is-current", index === inventoryCurrentPage);
          dot.setAttribute("aria-label", `Bag page ${index + 1}`);
          dot.setAttribute(
            "aria-current",
            index === inventoryCurrentPage ? "page" : "false"
          );
          dot.addEventListener("click", () => {
            goToInventoryPage(index, true);
          });
          inventoryPagination.append(dot);
        }
      }

      function updateInventoryPagePosition(animate = true) {
        const offset = -inventoryCurrentPage * getInventoryPageWidth();
        setInventoryTrackOffset(offset, animate);
      }

      function goToInventoryPage(pageIndex, animate = true) {
        inventoryCurrentPage = clamp(
          Math.round(pageIndex),
          0,
          Math.max(0, inventoryPageCount - 1)
        );
        updateInventoryPageDots();
        updateInventoryPagePosition(animate);
      }

      function rebuildInventoryPages() {
        const visibleItems = inventoryItems.filter((item) => !item.hidden);
        inventoryEmptyState.hidden = visibleItems.length !== 0;
        const hiddenItems = inventoryItems.filter((item) => item.hidden);
        const pageCount = Math.max(
          1,
          Math.ceil(visibleItems.length / INVENTORY_ITEMS_PER_PAGE)
        );

        inventoryTrack.replaceChildren();
        inventoryItemPool.replaceChildren();

        for (let pageIndex = 0; pageIndex < pageCount; pageIndex += 1) {
          const page = document.createElement("div");
          page.className = "inventory-page";

          const start = pageIndex * INVENTORY_ITEMS_PER_PAGE;
          const pageItems = visibleItems.slice(
            start,
            start + INVENTORY_ITEMS_PER_PAGE
          );

          for (const item of pageItems) {
            page.append(item);
          }

          inventoryTrack.append(page);
        }

        for (const item of hiddenItems) {
          inventoryItemPool.append(item);
        }

        inventoryPageCount = pageCount;
        inventoryCurrentPage = clamp(
          inventoryCurrentPage,
          0,
          inventoryPageCount - 1
        );
        inventoryViewport.classList.toggle(
          "is-pageable",
          inventoryPageCount > 1
        );

      function openInventory() {

      function openExplorationMenu() {

        closeRepair(false);

      function openRepair() {

        closeInventory(false);
