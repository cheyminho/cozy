            "aria-current",
            index === inventoryCurrentPage ? "page" : "false"
          );
          dot.addEventListener("click", () => {
            goToInventoryPage(index, true);
          });
          inventoryPagination.append(dot);
        }
      }

      function updateInventoryPagePosition(animate = true) {
        const offset = -inventoryCurrentPage * getInventoryPageWidth();
        setInventoryTrackOffset(offset, animate);
      }

      function goToInventoryPage(pageIndex, animate = true) {
        inventoryCurrentPage = clamp(
          Math.round(pageIndex),
          0,
          Math.max(0, inventoryPageCount - 1)
        );
        acknowledgeInventoryPageNewState(inventoryCurrentPage);
        updateInventoryPageDots();
        updateInventoryPagePosition(animate);
      }

      function rebuildInventoryPages() {
        const visibleItems = sortInventoryItems(
          inventoryItems.filter((item) => !item.hidden)
        );
        inventoryEmptyState.hidden = visibleItems.length !== 0;
        const hiddenItems = inventoryItems.filter((item) => item.hidden);
        const pageCount = Math.max(
          1,
          Math.ceil(visibleItems.length / INVENTORY_ITEMS_PER_PAGE)
        );

        inventoryTrack.replaceChildren();
        inventoryItemPool.replaceChildren();
        inventoryPageItemTypes = [];

        for (let pageIndex = 0; pageIndex < pageCount; pageIndex += 1) {
          const page = document.createElement("div");
          page.className = "inventory-page";

          const start = pageIndex * INVENTORY_ITEMS_PER_PAGE;
          const pageItems = visibleItems.slice(
            start,
            start + INVENTORY_ITEMS_PER_PAGE
          );

          inventoryPageItemTypes[pageIndex] = pageItems.map(
            (item) => item.dataset.item || ""
          );

          for (const item of pageItems) {
            page.append(item);
          }

          inventoryTrack.append(page);
        }

        for (const item of hiddenItems) {
          inventoryItemPool.append(item);
        }

        inventoryPageCount = pageCount;
        inventoryCurrentPage = clamp(
          inventoryCurrentPage,
          0,
          inventoryPageCount - 1
        );
        inventoryViewport.classList.toggle(
          "is-pageable",
          inventoryPageCount > 1
        );
        if (isInventoryOpen) {
          acknowledgeInventoryPageNewState(inventoryCurrentPage);
        }
        updateInventoryPageDots();

        requestAnimationFrame(() => {
          updateInventoryPagePosition(false);
        });
      }

      function openInventory() {
        if (isInventoryOpen) return;

        closeExplorationMenu(false);
        closeRepair(false);
        inventoryCurrentPage = 0;
        rebuildInventoryPages();
        isInventoryOpen = true;
        acknowledgeInventoryPageNewState(inventoryCurrentPage);
        updateInventoryPageDots();
        inventoryOverlay.classList.add("is-open");
        inventoryOverlay.setAttribute("aria-hidden", "false");
        setHudActionMenuState(inventoryButton, true);
        syncMenuBackdrop();

        requestAnimationFrame(() => {
          updateInventoryPagePosition(false);
        });

        const firstItem = getFirstVisibleInventoryItem();
        if (firstItem) {
          window.setTimeout(() => firstItem.focus(), 0);
        }
      }

      function openExplorationMenu() {
        if (isExplorationMenuOpen) return;

        // 저장 복원·보상 획득·수리 완료 후에도 메뉴를 열 때 현재 조건을 다시 반영합니다.
        updateExplorationRequirements();
        closeInventory(false);
        closeRepair(false);
        isExplorationMenuOpen = true;
        explorationOverlay.classList.add("is-open");
        explorationOverlay.setAttribute("aria-hidden", "false");
        setHudActionMenuState(exploreButton, true);
        syncMenuBackdrop();

        const firstOption = explorationOptions[0];
        if (firstOption) {
          window.setTimeout(() => firstOption.focus(), 0);
        }
      }

      function openRepair() {
        if (isRepairOpen) return;
        hasRepairButtonNew = false;
        const didClearSelectedCategoryNew = clearRepairCategoryNewState(
          repairSelectedCategory
        );
        repairSelectedItemByCategory[repairSelectedCategory] = -1;
        updateRepairNewBadgeState();

        closeExplorationMenu(false);
        closeInventory(false);
        isRepairOpen = true;
        repairOverlay.classList.add("is-open");
        repairOverlay.setAttribute("aria-hidden", "false");
        setHudActionMenuState(repairButton, true);
        syncMenuBackdrop();
        applyRepairState();
        updateRepairCategoryLayout();
        if (didClearSelectedCategoryNew) {
          saveResourceState();
        }

        const selectedCategoryButton = repairCategories.find(
          (button) =>
            button.dataset.repairCategory === repairSelectedCategory
        );
        if (selectedCategoryButton) {
          window.setTimeout(() => selectedCategoryButton.focus(), 0);
        }
      }

      function updateExploringCountdown() {
        if (!isExploring) return;

        const remainingMs = Math.max(0, explorationEndsAt - Date.now());

        if (remainingMs <= 0) {
          finishExploration();
          return;
        }

        const totalSeconds = Math.max(0, Math.ceil(remainingMs / 1_000));
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;
        exploringTime.textContent = `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
      }

      function getCurrentBgmAudio() {
        const isNight = document.body.classList.contains("is-night");
        const isRainy = document.body.classList.contains("is-rainy");

        if (isRainy) {
          return isNight ? rainyNightBgmAudio : rainyDayBgmAudio;
        }
        return isNight ? nightBgmAudio : dayBgmAudio;
      }

      function animateBgmVolumes(targetAudio, targetVolume, durationMs, transitionToken) {
        return new Promise((resolve) => {
          const startVolumes = new Map(
            bgmAudios.map((audio) => [audio, audio.volume])
          );
          const startedAt = performance.now();

          if (bgmFadeFrameId !== null) {
            cancelAnimationFrame(bgmFadeFrameId);
            bgmFadeFrameId = null;
          }

          const updateFade = (now) => {
            if (transitionToken !== bgmFadeToken) {
              resolve(false);
              return;
            }

            const progress = clamp(
              (now - startedAt) / Math.max(1, durationMs),
              0,
              1
            );
            const easedProgress = 1 - Math.pow(1 - progress, 3);

            for (const audio of bgmAudios) {
              const startVolume = startVolumes.get(audio) || 0;
              const finalVolume = audio === targetAudio ? targetVolume : 0;
              audio.volume = clamp(
                startVolume +
                  (finalVolume - startVolume) * easedProgress,
                0,
                1
              );
            }

            if (progress < 1) {
              bgmFadeFrameId = requestAnimationFrame(updateFade);
            } else {
              bgmFadeFrameId = null;
              resolve(true);
            }
          };

          bgmFadeFrameId = requestAnimationFrame(updateFade);
        });
      }

      function waitForBgmTransition(durationMs, transitionToken) {
        return new Promise((resolve) => {
          window.setTimeout(() => {
            resolve(transitionToken === bgmFadeToken);
          }, durationMs);
        });
      }

      async function transitionBgmForCurrentState() {
        if (!isMusicOn || !bgmStarted) return;

        const incomingAudio = getCurrentBgmAudio();
        if (
          activeBgmAudio === incomingAudio &&
          !incomingAudio.paused &&
          incomingAudio.volume >= 0.999
        ) {
          return;
        }

        const transitionToken = ++bgmFadeToken;

        if (bgmFadeFrameId !== null) {
          cancelAnimationFrame(bgmFadeFrameId);
          bgmFadeFrameId = null;
        }

        if (incomingAudio !== activeBgmAudio) {
          // 새 곡이 조용한 구간 동안 미리 진행되지 않도록 멈춰 둡니다.
          incomingAudio.pause();
          try {
            incomingAudio.currentTime = 0;
          } catch (_) {}
        }

        const fadedOut = await animateBgmVolumes(
          null,
          0,
          BGM_FADE_OUT_MS,
          transitionToken
        );
        if (!fadedOut) return;

        const holdCompleted = await waitForBgmTransition(
          BGM_QUIET_HOLD_MS,
          transitionToken
        );
        if (!holdCompleted) return;

        for (const audio of bgmAudios) {
          if (audio === incomingAudio) continue;
          audio.pause();
          try {
            audio.currentTime = 0;
          } catch (_) {}
        }
        try {
          incomingAudio.currentTime = 0;
        } catch (_) {}

        try {
          await incomingAudio.play();
        } catch (_) {
          // 새 트랙 재생이 차단되면 다음 사용자 입력에서 다시 시도합니다.
          activeBgmAudio = null;
          bgmStarted = false;
          return;
        }

        if (transitionToken !== bgmFadeToken) {
          incomingAudio.pause();
          return;
        }

        activeBgmAudio = incomingAudio;
        const fadedIn = await animateBgmVolumes(
          incomingAudio,
          1,
          BGM_FADE_IN_MS,
          transitionToken
        );
        if (!fadedIn) return;
      }

      function applyRainAmbientDeckVolumes() {
        for (let index = 0; index < rainAmbientAudios.length; index += 1) {
          rainAmbientAudios[index].volume = clamp(
            rainAmbientMasterVolume * rainAmbientDeckGains[index],
            0,
            1
          );
        }
      }

      function cancelRainAmbientLoopSchedule() {
        rainAmbientLoopToken += 1;
        if (rainAmbientLoopTimerId !== null) {
          clearTimeout(rainAmbientLoopTimerId);
          rainAmbientLoopTimerId = null;
        }
        if (rainAmbientLoopFadeFrameId !== null) {
          cancelAnimationFrame(rainAmbientLoopFadeFrameId);
          rainAmbientLoopFadeFrameId = null;
        }
      }

      function resetRainAmbientDecks() {
        cancelRainAmbientLoopSchedule();
        for (const audio of rainAmbientAudios) {
          audio.pause();
          try {
            audio.currentTime = 0;
          } catch (_) {}
          audio.volume = 0;
        }
        rainAmbientActiveDeckIndex = 0;
        rainAmbientDeckGains = [1, 0];
      }

      function getRainAmbientPlayingDeckIndex() {
        let bestIndex = -1;
        let bestGain = -1;
        for (let index = 0; index < rainAmbientAudios.length; index += 1) {
          const audio = rainAmbientAudios[index];
          if (audio.paused || audio.ended) continue;
          if (rainAmbientDeckGains[index] > bestGain) {
            bestGain = rainAmbientDeckGains[index];
            bestIndex = index;
          }
        }
        return bestIndex;
      }

      function scheduleRainAmbientLoop(deckIndex, loopToken = rainAmbientLoopToken) {
        if (
          loopToken !== rainAmbientLoopToken ||
          !rainAmbientStarted ||
          !document.body.classList.contains("is-rainy")
        ) {
          return;
        }

        const audio = rainAmbientAudios[deckIndex];
        const scheduleFromDuration = () => {
          if (
            loopToken !== rainAmbientLoopToken ||
            audio.paused ||
            !Number.isFinite(audio.duration) ||
            audio.duration <= 0
          ) {
            return false;
          }

          const remainingMs = Math.max(
            0,
            (audio.duration - audio.currentTime) * 1_000 -
              RAIN_AMBIENT_LOOP_CROSSFADE_MS
          );
          rainAmbientLoopTimerId = window.setTimeout(() => {
            rainAmbientLoopTimerId = null;
            crossfadeRainAmbientLoop(deckIndex, loopToken);
          }, remainingMs);
          return true;
        };

        if (scheduleFromDuration()) return;

        const retrySchedule = () => {
          audio.removeEventListener("loadedmetadata", retrySchedule);
          audio.removeEventListener("durationchange", retrySchedule);
          if (!scheduleFromDuration() && loopToken === rainAmbientLoopToken) {
            rainAmbientLoopTimerId = window.setTimeout(() => {
              rainAmbientLoopTimerId = null;
              scheduleRainAmbientLoop(deckIndex, loopToken);
            }, 100);
          }
        };
        audio.addEventListener("loadedmetadata", retrySchedule, { once: true });
        audio.addEventListener("durationchange", retrySchedule, { once: true });
      }

      async function crossfadeRainAmbientLoop(fromDeckIndex, loopToken) {
        if (
          loopToken !== rainAmbientLoopToken ||
          !rainAmbientStarted ||
          !document.body.classList.contains("is-rainy")
        ) {
          return;
        }

        const toDeckIndex = fromDeckIndex === 0 ? 1 : 0;
        const fromAudio = rainAmbientAudios[fromDeckIndex];
        const toAudio = rainAmbientAudios[toDeckIndex];

        toAudio.pause();
        try {
          toAudio.currentTime = 0;
        } catch (_) {}
        rainAmbientDeckGains[toDeckIndex] = 0;
        applyRainAmbientDeckVolumes();

        try {
          await toAudio.play();
        } catch (_) {
          // 다음 재생이 일시적으로 막히면 현재 트랙의 끝에서 즉시 다시 시도합니다.
          const retry = () => {
            fromAudio.removeEventListener("ended", retry);
            if (loopToken !== rainAmbientLoopToken) return;
            crossfadeRainAmbientLoop(fromDeckIndex, loopToken);
          };
          fromAudio.addEventListener("ended", retry, { once: true });
          return;
        }

        if (loopToken !== rainAmbientLoopToken) {
          toAudio.pause();
          return;
        }

        const startedAt = performance.now();
        const updateLoopFade = (now) => {
          if (loopToken !== rainAmbientLoopToken) return;
          const progress = clamp(
            (now - startedAt) / Math.max(1, RAIN_AMBIENT_LOOP_CROSSFADE_MS),
            0,
            1
          );
          // 같은 소리 두 개가 겹쳐도 체감 음량이 꺼지지 않도록 equal-power 곡선을 사용합니다.
          rainAmbientDeckGains[fromDeckIndex] = Math.cos(
            progress * Math.PI * 0.5
          );
          rainAmbientDeckGains[toDeckIndex] = Math.sin(
            progress * Math.PI * 0.5
          );
          applyRainAmbientDeckVolumes();

          if (progress < 1) {
            rainAmbientLoopFadeFrameId = requestAnimationFrame(updateLoopFade);
            return;
          }

          rainAmbientLoopFadeFrameId = null;
          fromAudio.pause();
          try {
            fromAudio.currentTime = 0;
          } catch (_) {}
          rainAmbientDeckGains[fromDeckIndex] = 0;
          rainAmbientDeckGains[toDeckIndex] = 1;
          rainAmbientActiveDeckIndex = toDeckIndex;
          applyRainAmbientDeckVolumes();
          scheduleRainAmbientLoop(toDeckIndex, loopToken);
        };

        rainAmbientLoopFadeFrameId = requestAnimationFrame(updateLoopFade);
      }

      function normalizeRainAmbientPlaybackForResume() {
        const playingDeckIndex = getRainAmbientPlayingDeckIndex();
        if (playingDeckIndex < 0) return -1;

        cancelRainAmbientLoopSchedule();
        rainAmbientActiveDeckIndex = playingDeckIndex;
        rainAmbientDeckGains = rainAmbientAudios.map((_, index) =>
          index === playingDeckIndex ? 1 : 0
        );
        for (let index = 0; index < rainAmbientAudios.length; index += 1) {
          if (index === playingDeckIndex) continue;
          rainAmbientAudios[index].pause();
          try {
            rainAmbientAudios[index].currentTime = 0;
          } catch (_) {}
        }
        applyRainAmbientDeckVolumes();
        return playingDeckIndex;
      }

      function animateRainAmbientVolume(targetVolume, durationMs, transitionToken) {
        return new Promise((resolve) => {
          const startVolume = rainAmbientMasterVolume;
          const startedAt = performance.now();

          if (rainAmbientFadeFrameId !== null) {
            cancelAnimationFrame(rainAmbientFadeFrameId);
            rainAmbientFadeFrameId = null;
          }

          const updateFade = (now) => {
            if (transitionToken !== rainAmbientFadeToken) {
              resolve(false);
              return;
            }

            const progress = clamp(
              (now - startedAt) / Math.max(1, durationMs),
              0,
              1
            );
            const easedProgress = 1 - Math.pow(1 - progress, 3);
            rainAmbientMasterVolume = clamp(
              startVolume +
                (targetVolume - startVolume) * easedProgress,
              0,
              1
            );
            applyRainAmbientDeckVolumes();

            if (progress < 1) {
              rainAmbientFadeFrameId = requestAnimationFrame(updateFade);
            } else {
              rainAmbientFadeFrameId = null;
              resolve(true);
            }
          };

          rainAmbientFadeFrameId = requestAnimationFrame(updateFade);
        });
      }

      async function startRainAmbientPlayback() {
        if (
          !document.body.classList.contains("is-rainy") ||
          rainAmbientStartScheduled
        ) {
          return;
        }

        const transitionToken = ++rainAmbientFadeToken;
        if (rainAmbientFadeFrameId !== null) {
          cancelAnimationFrame(rainAmbientFadeFrameId);
          rainAmbientFadeFrameId = null;
        }

        // 페이드아웃 도중 다시 비가 오면 더 크게 들리던 재생기를 유지해 자연스럽게 복귀합니다.
        const resumedDeckIndex = normalizeRainAmbientPlaybackForResume();
        if (resumedDeckIndex >= 0) {
          rainAmbientStarted = true;
          const loopToken = rainAmbientLoopToken;
          scheduleRainAmbientLoop(resumedDeckIndex, loopToken);
          await animateRainAmbientVolume(
            RAIN_AMBIENT_VOLUME,
            RAIN_AMBIENT_FADE_IN_MS,
            transitionToken
          );
          return;
        }

        rainAmbientStartScheduled = true;
        resetRainAmbientDecks();
        rainAmbientMasterVolume = 0;
        applyRainAmbientDeckVolumes();

        const firstAudio = rainAmbientAudios[rainAmbientActiveDeckIndex];
        try {
          await firstAudio.play();
        } catch (_) {
          rainAmbientStarted = false;
          rainAmbientStartScheduled = false;
          return;
        }

        if (
          transitionToken !== rainAmbientFadeToken ||
          !document.body.classList.contains("is-rainy")
        ) {
          resetRainAmbientDecks();
          rainAmbientStartScheduled = false;
          return;
        }

        rainAmbientStarted = true;
        rainAmbientStartScheduled = false;
        const loopToken = rainAmbientLoopToken;
        scheduleRainAmbientLoop(rainAmbientActiveDeckIndex, loopToken);
        await animateRainAmbientVolume(
          RAIN_AMBIENT_VOLUME,
          RAIN_AMBIENT_FADE_IN_MS,
          transitionToken
        );
      }

      async function stopRainAmbientPlayback() {
        const transitionToken = ++rainAmbientFadeToken;
        rainAmbientStartScheduled = false;
        cancelRainAmbientLoopSchedule();

        if (rainAmbientFadeFrameId !== null) {
          cancelAnimationFrame(rainAmbientFadeFrameId);
          rainAmbientFadeFrameId = null;
        }

        if (getRainAmbientPlayingDeckIndex() < 0 && !rainAmbientStarted) {
          rainAmbientMasterVolume = 0;
          applyRainAmbientDeckVolumes();
          return;
        }

        const fadedOut = await animateRainAmbientVolume(
          0,
          RAIN_AMBIENT_FADE_OUT_MS,
          transitionToken
        );
        if (!fadedOut) return;

        resetRainAmbientDecks();
        rainAmbientMasterVolume = 0;
        applyRainAmbientDeckVolumes();
        rainAmbientStarted = false;
      }

      function syncRainAmbientForWeather() {
        if (document.body.classList.contains("is-rainy")) {
          startRainAmbientPlayback();
        } else {
          stopRainAmbientPlayback();
        }
      }

      function getCloudShadowBaseOpacity(now = performance.now()) {
        const elapsed = now - cloudShadowOpacityTransitionStartedAt;

        if (elapsed >= CLOUD_SHADOW_NIGHT_TRANSITION_MS) {
          cloudShadowBaseOpacity = cloudShadowOpacityTarget;
          return cloudShadowBaseOpacity;
        }

        const progress = clamp(
          elapsed / CLOUD_SHADOW_NIGHT_TRANSITION_MS,
          0,
          1
        );
        const easedProgress = 1 - Math.pow(1 - progress, 3);

        cloudShadowBaseOpacity =
          cloudShadowOpacityStart +
          (cloudShadowOpacityTarget - cloudShadowOpacityStart) *
            easedProgress;

        return cloudShadowBaseOpacity;
      }

      function transitionCloudShadowOpacity(enabled) {
        const now = performance.now();
        cloudShadowOpacityStart = getCloudShadowBaseOpacity(now);
        cloudShadowOpacityTarget = enabled
          ? CLOUD_SHADOW_NIGHT_OPACITY
          : CLOUD_SHADOW_DAY_OPACITY;
        cloudShadowOpacityTransitionStartedAt = now;
      }

      function updateTreeInteractivity() {
        const isTreeInteractive = !isExploring;

        treeHitArea.tabIndex = isTreeInteractive ? 0 : -1;
        treeHitArea.setAttribute(
          "aria-disabled",
          isTreeInteractive ? "false" : "true"
        );

        if (!isTreeInteractive && treeAnimationTimerId !== null) {
          clearTimeout(treeAnimationTimerId);
          treeAnimationTimerId = null;
          isTreeAnimating = false;
          applyTreeVisualState();
        }
      }

      function updateStructureInteractivity() {
        const isStructureInteractive =
          !isExploring && !document.body.classList.contains("is-night");

        [shedObject, carObject, mailboxObject].forEach((element) => {
          const isElementInteractive =
            isStructureInteractive &&
            !(element === carObject && isCarTraveling);
          element.tabIndex = isElementInteractive ? 0 : -1;
          element.setAttribute(
            "aria-disabled",
            isElementInteractive ? "false" : "true"
          );
        });
      }

      function startOneDeerLeavingForLightChange() {
        const candidates = Array.from(deerMap.values()).filter(
          (deer) =>
            deer.state !== "dying" &&
            deer.state !== "leaving" &&
            deer.state !== "removed"
        );

        if (candidates.length === 0) return false;

        const deer = candidates[
          Math.floor(Math.random() * candidates.length)
        ];
        const direction = deer.facing === "left" ? -1 : 1;

        beginDeerRunInDirection(deer, direction, "leaving");
        deer.element.style.opacity = "1";
        deer.hitbox.style.pointerEvents = "none";
        deer.hitbox.tabIndex = -1;
        showSingleDeerFrame(deer, DEER_RUN_INTRO_FRAME_START);
        renderDeer(deer);
        saveResourceState();
        return true;
      }

      function getRandomRainValue(min, max) {
        return min + Math.random() * (max - min);
      }

      function getTargetRainDropCount() {
        const viewportArea = Math.max(1, window.innerWidth * window.innerHeight);
        const targetCount = Math.round(
          viewportArea / 10_000 * RAIN_DROP_LAYOUT.densityPer10kPx2
        );

        return Math.max(
          RAIN_DROP_LAYOUT.minimumCount,
          Math.min(RAIN_DROP_LAYOUT.maximumCount, targetCount)
        );
      }

      function createRainDropElement() {
        const drop = document.createElement("span");
        const lengthPx = getRandomRainValue(
          RAIN_DROP_STYLE.lengthMinPx,
          RAIN_DROP_STYLE.lengthMaxPx
        );
        const lengthRange = Math.max(
          1,
          RAIN_DROP_STYLE.lengthMaxPx - RAIN_DROP_STYLE.lengthMinPx
        );
        const sizeProgress = Math.max(
          0,
          Math.min(1, (lengthPx - RAIN_DROP_STYLE.lengthMinPx) / lengthRange)
        );

        drop.className = "rain-drop";
        drop.dataset.rainFallSpeed = getRandomRainValue(
          RAIN_DROP_FALL_SPEED_RANGE_PX_PER_SECOND.min,
          RAIN_DROP_FALL_SPEED_RANGE_PX_PER_SECOND.max
        ).toFixed(3);
        drop.dataset.rainHorizontalTravelRatio = getRandomRainValue(
          RAIN_DROP_HORIZONTAL_TRAVEL_RATIO_RANGE.min,
          RAIN_DROP_HORIZONTAL_TRAVEL_RATIO_RANGE.max
        ).toFixed(4);
        drop.dataset.rainDelayProgress = Math.random().toFixed(4);
        drop.dataset.rainLengthPx = lengthPx.toFixed(3);
        drop.dataset.rainSizeProgress = sizeProgress.toFixed(4);
        drop.style.setProperty(
          "--rain-left",
          `${getRandomRainValue(-18, 100).toFixed(2)}%`
        );
        drop.style.setProperty(
          "--rain-thickness",
          `${getRandomRainValue(
            RAIN_DROP_STYLE.thicknessMinPx,
            RAIN_DROP_STYLE.thicknessMaxPx
          ).toFixed(2)}px`
        );
        drop.style.setProperty("--rain-length", `${lengthPx.toFixed(2)}px`);
        const baseOpacity = getRandomRainValue(
          RAIN_DROP_STYLE.opacityMin,
          RAIN_DROP_STYLE.opacityMax
        );
        drop.style.setProperty(
          "--rain-drop-day-opacity",
          Math.max(0, Math.min(1, baseOpacity * RAIN_DROP_STYLE.dayAlpha))
            .toFixed(3)
        );
        drop.style.setProperty(
          "--rain-drop-night-opacity",
          Math.max(0, Math.min(1, baseOpacity * RAIN_DROP_STYLE.nightAlpha))
            .toFixed(3)
        );
        drop.style.setProperty(
          "--rain-angle",
          `${getRandomRainValue(
            RAIN_DROP_ANGLE_RANGE_DEG.min,
            RAIN_DROP_ANGLE_RANGE_DEG.max
          ).toFixed(2)}deg`
        );

        return drop;
      }

      function syncRainDropCount() {
        if (!rainLayer) return;

        const targetCount = getTargetRainDropCount();
        const currentCount = rainLayer.childElementCount;

        if (currentCount < targetCount) {
          const fragment = document.createDocumentFragment();
          for (let index = currentCount; index < targetCount; index += 1) {
            fragment.appendChild(createRainDropElement());
          }
          rainLayer.appendChild(fragment);
        } else if (currentCount > targetCount) {
          for (let index = currentCount; index > targetCount; index -= 1) {
            rainLayer.lastElementChild?.remove();
          }
        }
      }

      function updateRainDropViewportMotion() {
        if (!rainLayer) return;

        const viewportHeight = Math.max(1, window.innerHeight);
        const startTranslateYPx =
          viewportHeight * RAIN_DROP_LAYOUT.startYViewportRatio;
        const layerTopPx =
          viewportHeight * RAIN_DROP_LAYOUT.layerTopViewportRatio;

        for (const drop of rainLayer.children) {
          const fallSpeedPxPerSecond = Number(drop.dataset.rainFallSpeed);
          const horizontalTravelRatio = Number(
            drop.dataset.rainHorizontalTravelRatio
          );
          const delayProgress = Number(drop.dataset.rainDelayProgress);
          const lengthPx = Number(drop.dataset.rainLengthPx);
          const sizeProgress = Number(drop.dataset.rainSizeProgress);
          const safeFallSpeed = Number.isFinite(fallSpeedPxPerSecond)
            ? fallSpeedPxPerSecond
            : RAIN_DROP_FALL_SPEED_RANGE_PX_PER_SECOND.min;
          const safeHorizontalTravelRatio = Number.isFinite(
            horizontalTravelRatio
          )
            ? horizontalTravelRatio
            : RAIN_DROP_HORIZONTAL_TRAVEL_RATIO_RANGE.min;
          const safeDelayProgress = Number.isFinite(delayProgress)
            ? delayProgress
            : 0;
          const safeLengthPx = Number.isFinite(lengthPx)
            ? lengthPx
            : RAIN_DROP_STYLE.lengthMinPx;
          const safeSizeProgress = Number.isFinite(sizeProgress)
            ? Math.max(0, Math.min(1, sizeProgress))
            : 0;
          const landingYRatio =
            RAIN_DROP_LAYOUT.landingYMinViewportRatio +
            (RAIN_DROP_LAYOUT.landingYMaxViewportRatio -
              RAIN_DROP_LAYOUT.landingYMinViewportRatio) *
              safeSizeProgress;
          const landingPointYPx = viewportHeight * landingYRatio;
          const endTranslateYPx = Math.max(
            startTranslateYPx + 1,
            landingPointYPx - layerTopPx - safeLengthPx
          );
          const verticalTravelDistancePx = Math.max(
            1,
            endTranslateYPx - startTranslateYPx
          );
          const durationMs =
            verticalTravelDistancePx / safeFallSpeed * 1_000;

          drop.style.setProperty(
            "--rain-start-y",
            `${startTranslateYPx.toFixed(2)}px`
          );
          drop.style.setProperty(
            "--rain-travel-y",
            `${endTranslateYPx.toFixed(2)}px`
          );
          drop.style.setProperty(
            "--rain-duration",
            `${durationMs.toFixed(0)}ms`
          );
          drop.style.setProperty(
            "--rain-delay",
            `${(-durationMs * safeDelayProgress).toFixed(0)}ms`
          );
          drop.style.setProperty(
            "--rain-travel-x",
            `${(
              verticalTravelDistancePx * safeHorizontalTravelRatio
            ).toFixed(2)}px`
          );
        }
      }

      function initializeRainDrops() {
        if (!rainLayer) return;

        syncRainDropCount();
        updateRainDropViewportMotion();
      }

      function applyRainColorMatrix(matrixElement, colorBalance) {
        if (!matrixElement || !colorBalance) return;

        matrixElement.setAttribute(
          "values",
          [
            `${colorBalance.red} 0 0 0 0`,
            `0 ${colorBalance.green} 0 0 0`,
            `0 0 ${colorBalance.blue} 0 0`,
            "0 0 0 1 0"
          ].join(" ")
        );
      }

      function applyWeatherState() {
        const rootStyle = document.documentElement.style;
        const rainDayColorMatrix = document.getElementById(
          "rainDayColorMatrix"
        );
        const rainNightColorMatrix = document.getElementById(
          "rainNightColorMatrix"
        );

        applyRainColorMatrix(
          rainDayColorMatrix,
          RAIN_DAY_TONE.colorBalance
        );
        applyRainColorMatrix(
          rainNightColorMatrix,
          RAIN_NIGHT_TONE.colorBalance
        );

        rootStyle.setProperty(
          "--rain-day-brightness",
          String(RAIN_DAY_TONE.brightness)
        );
        rootStyle.setProperty(
          "--rain-day-saturation",
          String(RAIN_DAY_TONE.saturation)
        );
        rootStyle.setProperty(
          "--rain-day-contrast",
          String(RAIN_DAY_TONE.contrast)
        );
        rootStyle.setProperty("--rain-day-tint", RAIN_DAY_TONE.tint);
        rootStyle.setProperty(
          "--rain-day-opacity",
          String(RAIN_DAY_TONE.opacity)
        );

        rootStyle.setProperty(
          "--rain-night-brightness",
          String(RAIN_NIGHT_TONE.brightness)
        );
        rootStyle.setProperty(
          "--rain-night-saturation",
          String(RAIN_NIGHT_TONE.saturation)
        );
        rootStyle.setProperty(
          "--rain-night-contrast",
          String(RAIN_NIGHT_TONE.contrast)
        );
        rootStyle.setProperty("--rain-night-tint", RAIN_NIGHT_TONE.tint);
        rootStyle.setProperty(
          "--rain-night-opacity",
          String(RAIN_NIGHT_TONE.opacity)
        );

        const shouldRain = dayCount > 1 && isRainyToday;
        const wasRainy = document.body.classList.contains("is-rainy");
        document.body.classList.toggle("is-rainy", shouldRain);
        if (weatherLabel) {
          weatherLabel.textContent = shouldRain ? "Rainy" : "Sunny";
        }

        syncRainAmbientForWeather();
        if (wasRainy !== shouldRain) {
          transitionBgmForCurrentState();
        }
      }

      function setCarFramePosition(position) {
        carObject.style.setProperty("--car-frame-position", position);
      }

      function setCarIdleFrame() {
        setCarFramePosition(isCarRepaired() ? "right top" : "left top");
      }

      function stopCarDriveFrameLoop({ restoreIdleFrame = true } = {}) {
        if (carDriveFrameTimerId !== null) {
          clearInterval(carDriveFrameTimerId);
          carDriveFrameTimerId = null;
        }
        if (restoreIdleFrame) {
          setCarIdleFrame();
        }
      }

      function startCarDriveFrameLoop() {
        stopCarDriveFrameLoop({ restoreIdleFrame: false });
        let frameIndex = 0;
        setCarFramePosition(CAR_DRIVE_FRAME_POSITIONS[frameIndex]);
        carDriveFrameTimerId = window.setInterval(() => {
          frameIndex = (frameIndex + 1) % CAR_DRIVE_FRAME_POSITIONS.length;
          setCarFramePosition(CAR_DRIVE_FRAME_POSITIONS[frameIndex]);
        }, CAR_DRIVE_FRAME_INTERVAL_MS);
      }

      function setCarTravelTransform(x, y) {
        carObject.style.transform = `translate3d(${x}px, ${y}px, 0)`;
      }

      function cancelCarTravelAnimation({ restoreIdleFrame = true } = {}) {
        carTravelAnimationToken += 1;
        if (carTravelAnimationFrameId !== null) {
          cancelAnimationFrame(carTravelAnimationFrameId);
          carTravelAnimationFrameId = null;
        }
        stopCarDriveFrameLoop({ restoreIdleFrame });
        isCarTraveling = false;
        carObject.classList.remove("is-traveling");
      }

      function animateCarTravel({
        fromX,
        fromY,
        toX,
        toY,
        easing,
        hideWhenComplete = false
      }) {
        cancelCarTravelAnimation({ restoreIdleFrame: false });
        const animationToken = carTravelAnimationToken;
        const startedAt = performance.now();

        isCarTraveling = true;
        carObject.classList.add("is-traveling");
        carObject.style.visibility = "visible";
        setCarTravelTransform(fromX, fromY);
        startCarDriveFrameLoop();
        updateStructureInteractivity();

        const step = (now) => {
          if (animationToken !== carTravelAnimationToken) return;

          const progress = Math.min(
            1,
            Math.max(0, (now - startedAt) / CAR_TRAVEL_DURATION_MS)
          );
          const easedProgress = easing(progress);
          setCarTravelTransform(
            fromX + (toX - fromX) * easedProgress,
            fromY + (toY - fromY) * easedProgress
          );

          if (progress < 1) {
            carTravelAnimationFrameId = requestAnimationFrame(step);
            return;
          }

          carTravelAnimationFrameId = null;
          stopCarDriveFrameLoop();
          isCarTraveling = false;
          carObject.classList.remove("is-traveling");
          carObject.style.visibility = hideWhenComplete ? "hidden" : "visible";
          updateStructureInteractivity();
        };

        carTravelAnimationFrameId = requestAnimationFrame(step);
      }

      function makeNearbyDeerFleeFromCar() {
        const carCenterX = carObject.offsetLeft + carObject.offsetWidth / 2;
        const carCenterY = carObject.offsetTop + carObject.offsetHeight / 2;

        for (const deer of deerMap.values()) {
          if (
            deer.state === "dying" ||
            deer.state === "leaving" ||
            deer.state === "removed"
          ) {
            continue;
          }

          const deerCenterX = deer.x + DEER_HALF_W;
          const deerCenterY = deer.y + DEER_HALF_H;
          const isNearCar =
            Math.abs(deerCenterX - carCenterX) <= DEER_ALERT_HALF_SIZE &&
            Math.abs(deerCenterY - carCenterY) <= DEER_ALERT_HALF_SIZE;
          if (!isNearCar) continue;

          // 자동차 왼쪽의 사슴은 왼쪽으로, 오른쪽의 사슴은 오른쪽으로 도망갑니다.
          const escapeDirection = deerCenterX < carCenterX ? -1 : 1;
          beginDeerRunInDirection(deer, escapeDirection, "leaving");
          deer.element.style.opacity = "1";
          deer.hitbox.style.pointerEvents = "none";
          deer.hitbox.tabIndex = -1;
          showSingleDeerFrame(deer, DEER_RUN_INTRO_FRAME_START);
          renderDeer(deer);
        }
      }

      function startCityCarDeparture() {
        makeNearbyDeerFleeFromCar();
        animateCarTravel({
          fromX: 0,
          fromY: 0,
          toX: CAR_CITY_DEPARTURE_OFFSET_X,
          toY: CAR_CITY_DEPARTURE_OFFSET_Y,
          easing: (progress) => progress * progress,
          hideWhenComplete: true
        });
      }

      function startCityCarReturn() {
        animateCarTravel({
          fromX: CAR_CITY_RETURN_START_OFFSET_X,
          fromY: CAR_CITY_RETURN_START_OFFSET_Y,
          toX: 0,
          toY: 0,
          easing: (progress) => 1 - (1 - progress) * (1 - progress)
        });
      }

      function setCarAwayForRestoredCityExploration() {
        cancelCarTravelAnimation();
        setCarTravelTransform(
          CAR_CITY_DEPARTURE_OFFSET_X,
          CAR_CITY_DEPARTURE_OFFSET_Y
        );
        carObject.style.visibility = "hidden";
      }

      function resetCarToHomePosition() {
        cancelCarTravelAnimation();
        setCarTravelTransform(0, 0);
        carObject.style.visibility = "visible";
      }

      function setNightMode(enabled) {
        const wasNight = document.body.classList.contains("is-night");

        if (wasNight !== enabled) {
          startOneDeerLeavingForLightChange();
        }

        document.body.classList.toggle("is-night", enabled);
        updateTreeInteractivity();
        updateStructureInteractivity();
        transitionCloudShadowOpacity(enabled);
        transitionBgmForCurrentState();
      }

      function startExploration(destination) {
        if (isChainsawEquipped) {
          setEquippedWeapon("", { render: true, save: false });
        }
        closeExplorationMenu();
        closeInventory();

        if (explorationCompleteToastTimerId !== null) {
          clearTimeout(explorationCompleteToastTimerId);
          explorationCompleteToastTimerId = null;
        }

        if (returnZombieSpawnTimerId !== null) {
          clearTimeout(returnZombieSpawnTimerId);
          returnZombieSpawnTimerId = null;
        }

        const isCityExploration = destination === "city";
        playSound(
          isCityExploration
            ? CITY_EXPLORATION_START_SOUND
            : EXPLORING_FOOTSTEPS_SOUND
        );

        const requiredFood = getDestinationFoodRequirement(destination);
        foodCount = Math.max(0, foodCount - requiredFood);
        zombieCount = 0;
        isExploring = true;
        explorationDestination = destination;
        explorationEndsAt = Date.now() + getExplorationDurationMs(destination);
        if (isCityExploration) {
          startCityCarDeparture();
        }
        commitResourceState();
        setNightMode(true);
        exploringStatus.classList.add("is-visible");
        updateDayStatus();
        updateExploringCountdown();

        if (explorationTimerId !== null) {
          clearInterval(explorationTimerId);
        }

        explorationTimerId = window.setInterval(
          updateExploringCountdown,
          1_000
        );
      }

      function restoreExplorationState() {
        if (explorationEndsAt <= Date.now()) {
          if (explorationEndsAt > 0) {
            // 페이지가 닫혀 있는 동안 탐험이 끝난 경우에도 귀환 1회로 처리합니다.
            isExploring = true;
            finishExploration();
            return;
          }

          isExploring = false;
          explorationDestination = "";
          explorationEndsAt = 0;
          resetCarToHomePosition();
          setNightMode(false);
          updateDayStatus();
          saveResourceState();
          return;
        }

        isExploring = true;
        if (explorationDestination === "city") {
          setCarAwayForRestoredCityExploration();
        } else {
          resetCarToHomePosition();
        }
        setNightMode(true);
        exploringStatus.classList.add("is-visible");
        updateDayStatus();
        updateExploringCountdown();

        if (explorationTimerId !== null) {
          clearInterval(explorationTimerId);
        }

        explorationTimerId = window.setInterval(
          updateExploringCountdown,
          1_000
        );
      }

      function tryAwardExplorationBlueprint(destination) {
        const dropChance = EXPLORATION_BLUEPRINT_DROP_CHANCE[destination] || 0;
        const candidates = EXPLORATION_BLUEPRINT_REWARDS.filter((reward) => {
          if (!reward.destinations?.includes(destination)) return false;
          if (reward.category === "repair" && reward.blueprintId) {
            return getRepairBlueprintItem(reward.blueprintId)?.unlocked !== true;
          }
          if (reward.category === "outdoor" && reward.blueprintId) {
            return getOutdoorBlueprintItem(reward.blueprintId)?.unlocked !== true;
          }
          if (reward.category === "buildings" && reward.blueprintId) {
            return getBuildingBlueprintItem(reward.blueprintId)?.unlocked !== true;
          }
          return repairItemsByCategory[reward.category]?.[reward.index]?.unlocked !== true;
        });

        // 탐험 한 번당 설계도 확률은 여기서 정확히 한 번만 판정합니다.
        if (dropChance <= 0 || candidates.length === 0 || Math.random() >= dropChance) {
          return false;
        }

        const reward = candidates[Math.floor(Math.random() * candidates.length)];
        const awarded = reward.category === "repair" && reward.blueprintId
          ? unlockRepairBlueprint(reward.blueprintId)
          : reward.category === "outdoor" && reward.blueprintId
            ? unlockOutdoorBlueprint(reward.blueprintId)
            : reward.category === "buildings" && reward.blueprintId
              ? unlockBuildingBlueprint(reward.blueprintId)
              : markRepairBlueprintAsNew(reward.category, reward.index);
        if (awarded) {
          applyRepairState();
        }
        return awarded;
      }

      function getExplorationItemQuantityRange(itemType) {
        const configuredRange = EXPLORATION_ITEM_QUANTITY_RANGES[itemType];
        const min = Math.max(1, Math.round(Number(configuredRange?.min) || 1));
        const max = Math.max(min, Math.round(Number(configuredRange?.max) || min));
        return { min, max };
      }

      function rollExplorationItemQuantity(itemType, multiplier = 1) {
        const { min, max } = getExplorationItemQuantityRange(itemType);
        const rolledQuantity = min + Math.floor(Math.random() * (max - min + 1));
        return rolledQuantity * Math.max(1, Math.round(Number(multiplier) || 1));
      }

      function rollStarterSupplyQuantity(range) {
        const min = Math.max(0, Math.round(Number(range?.min) || 0));
        const max = Math.max(min, Math.round(Number(range?.max) || min));
        return min + Math.floor(Math.random() * (max - min + 1));
      }

      /*
        무기를 처음 획득했을 때 함께 지급하는 시작 탄약 / 배터리입니다.
        총기: 1~5발, 체인소우: 5~10%
      */
      function grantStarterSupplyForWeapon(weaponType) {
        if (weaponType === "handgun") {
          const previous = handgunAmmoCount;
          handgunAmmoCount = Math.min(
            MAX_INVENTORY_QUANTITY,
            handgunAmmoCount + rollStarterSupplyQuantity(WEAPON_STARTER_AMMO_RANGE)
          );
          hasHandgunAmmo = handgunAmmoCount > 0;
          if (handgunAmmoCount > previous) markInventoryItemAsNew("handgunAmmo");
          return;
        }

        if (weaponType === "shotgun") {
          const previous = shotgunAmmoCount;
          shotgunAmmoCount = Math.min(
            MAX_INVENTORY_QUANTITY,
            shotgunAmmoCount + rollStarterSupplyQuantity(WEAPON_STARTER_AMMO_RANGE)
          );
          hasShotgunAmmo = shotgunAmmoCount > 0;
          if (shotgunAmmoCount > previous) markInventoryItemAsNew("shotgunAmmo");
          return;
        }

        if (weaponType === "rifle") {
          const previous = rifleAmmoCount;
          rifleAmmoCount = Math.min(
            MAX_INVENTORY_QUANTITY,
            rifleAmmoCount + rollStarterSupplyQuantity(WEAPON_STARTER_AMMO_RANGE)
          );
          hasRifleAmmo = rifleAmmoCount > 0;
          if (rifleAmmoCount > previous) markInventoryItemAsNew("rifleAmmo");
          return;
        }

        if (weaponType === "chainsaw") {
          const previous = chainsawBatteryPercent;
          chainsawBatteryPercent = Math.min(
            MAX_CHAINSAW_BATTERY,
            chainsawBatteryPercent + rollStarterSupplyQuantity(CHAINSAW_STARTER_BATTERY_RANGE)
          );
          hasChainsawBattery = chainsawBatteryPercent > 0;
          if (chainsawBatteryPercent > previous) {
            markInventoryItemAsNew("chainsawBattery");
          }
        }
      }

      function awardExplorationItem(destination) {
        const candidates = [];

        if (!hasHandgun) candidates.push("handgun");
        if (handgunAmmoCount < MAX_INVENTORY_QUANTITY) candidates.push("handgunAmmo");
        if (!hasShotgun) candidates.push("shotgun");
        if (shotgunAmmoCount < MAX_INVENTORY_QUANTITY) candidates.push("shotgunAmmo");
        if (rifleAmmoCount < MAX_INVENTORY_QUANTITY) candidates.push("rifleAmmo");
        if (!hasChainsaw) candidates.push("chainsaw");
        if (chainsawBatteryPercent < MAX_CHAINSAW_BATTERY) candidates.push("chainsawBattery");
        if (!isCarRepaired() && carPartsCount < getMaxCarPartsCount()) {
          candidates.push("carParts");
        }
        if (repairKitCount < MAX_INVENTORY_QUANTITY) candidates.push("repairKit");
        if (fuelCount < MAX_INVENTORY_QUANTITY) candidates.push("fuel");
        for (const itemType of Object.keys(paintCounts)) {
          if (paintCounts[itemType] < MAX_INVENTORY_QUANTITY) {
            candidates.push(itemType);
          }
        }

        if (candidates.length === 0) return false;

        const reward = candidates[Math.floor(Math.random() * candidates.length)];
        const quantityMultiplier = destination === "city" ? 2 : 1;
        if (reward === "handgun") {
          hasHandgun = true;
          grantStarterSupplyForWeapon("handgun");
        } else if (reward === "handgunAmmo") {
          hasHandgunAmmo = true;
          handgunAmmoCount = Math.min(
            MAX_INVENTORY_QUANTITY,
            handgunAmmoCount + rollExplorationItemQuantity(reward, quantityMultiplier)
          );
        } else if (reward === "shotgun") {
          hasShotgun = true;
          grantStarterSupplyForWeapon("shotgun");
        } else if (reward === "shotgunAmmo") {
          hasShotgunAmmo = true;
          shotgunAmmoCount = Math.min(
            MAX_INVENTORY_QUANTITY,
            shotgunAmmoCount + rollExplorationItemQuantity(reward, quantityMultiplier)
          );
        } else if (reward === "rifleAmmo") {
          hasRifleAmmo = true;
          rifleAmmoCount = Math.min(
            MAX_INVENTORY_QUANTITY,
            rifleAmmoCount + rollExplorationItemQuantity(reward, quantityMultiplier)
          );
        } else if (reward === "chainsaw") {
          hasChainsaw = true;
          grantStarterSupplyForWeapon("chainsaw");
        } else if (reward === "chainsawBattery") {
          hasChainsawBattery = true;
          chainsawBatteryPercent = Math.min(
            MAX_CHAINSAW_BATTERY,
            chainsawBatteryPercent + rollExplorationItemQuantity(reward, quantityMultiplier)
          );
        } else if (reward === "carParts") {
          carPartsCount = Math.min(
            getMaxCarPartsCount(),
            carPartsCount + rollExplorationItemQuantity(reward, quantityMultiplier)
          );
        } else if (reward === "repairKit") {
          repairKitCount = Math.min(
            MAX_INVENTORY_QUANTITY,
            repairKitCount + rollExplorationItemQuantity(reward, quantityMultiplier)
          );
        } else if (reward === "fuel") {
          fuelCount = Math.min(
            MAX_INVENTORY_QUANTITY,
            fuelCount + rollExplorationItemQuantity(reward, quantityMultiplier)
          );
          if (fuelCount >= 10) {
            setTodoProgress(4, "item2", true);
          }
        } else if (reward in paintCounts) {
          paintCounts[reward] = Math.min(
            MAX_INVENTORY_QUANTITY,
            paintCounts[reward] + rollExplorationItemQuantity(reward, quantityMultiplier)
          );
        }

        markInventoryItemAsNew(reward);
        applyInventoryState();
        return true;
      }

      function awardForestFlower() {
        if (flowerCount >= MAX_INVENTORY_QUANTITY) return false;

        flowerCount = Math.min(
          MAX_INVENTORY_QUANTITY,
          flowerCount + 1
        );
        markInventoryItemAsNew("flowers");
        applyInventoryState();
        return true;
      }

      function awardExplorationRewards(destination) {
        configureExplorationBlueprintDefinitions();
        if (tryAwardExplorationBlueprint(destination)) {
          // 설계도를 얻은 탐험에서는 아이템을 함께 얻지 않습니다.
          return;
        }

        if (destination === "forest") {
          // 숲은 화단 설계도를 얻지 못한 경우에만 꽃 1개를 줍니다.
          awardForestFlower();
          return;
        }

        awardExplorationItem(destination);
      }

      function finishExploration() {
        if (!isExploring) return;

        const completedDestination = explorationDestination;
        playSound(
          completedDestination === "city"
            ? CITY_EXPLORATION_STOP_SOUND
            : EXPLORING_FOOTSTEPS_SOUND
        );
        if (completedDestination === "city") {
          startCityCarReturn();
        } else {
          resetCarToHomePosition();
        }

        isExploring = false;
        explorationDestination = "";
        explorationEndsAt = 0;
        dayCount += 1;
        const shouldResetZombieRequirementToday =
          zombieKillRequirementResetPending;
        const isNewDayRainy = rollWeatherForNewDay();

        // 비가 내린 당일에는 기존 증가 규칙을 유지하고,
        // 비가 온 날의 다음 날 낮이 시작될 때 2마리로 초기화합니다.
        zombieKillRequirement = shouldResetZombieRequirementToday
          ? INITIAL_ZOMBIE_KILL_REQUIREMENT
          : getNextPrime(zombieKillRequirement);
        zombieKillRequirementResetPending = isNewDayRainy;

        if (treeGrowthState === TREE_GROWTH_DEPLETED) {
          // 3번 베어 고갈된 뒤 첫 탐험 완료: 부분 회복
          treeGrowthState = TREE_GROWTH_REGROWING;
          treeChopCount = TREE_MAX_CHOPS_PER_GROWTH;
        } else if (treeGrowthState === TREE_GROWTH_REGROWING) {
          // 두 번째 탐험 완료: 부분 회복 상태에서 하루 더 머뭅니다.
          treeGrowthState = TREE_GROWTH_REGROWING_HOLD;
          treeChopCount = TREE_MAX_CHOPS_PER_GROWTH;
        } else if (treeGrowthState === TREE_GROWTH_REGROWING_HOLD) {
          // 고갈 후 세 번째 탐험 완료: 완전 회복 + 투두 완료
          treeGrowthState = TREE_GROWTH_READY;
          treeChopCount = 0;
          setTodoProgress(2, "item2", true);
        } else if (
          treeGrowthState === TREE_GROWTH_READY &&
          treeChopCount >= 1
        ) {
          // 1~2번만 벤 나무는 다음 날 완전히 회복하지만 투두는 완료하지 않습니다.
          treeChopCount = 0;
        }
        applyTreeVisualState();

        if (completedDestination === "village") {
          setTodoProgress(1, "item3", true);
        } else if (completedDestination === "forest") {
          woodCount = Math.min(getMaxWoodCount(), woodCount + 10);
          setTodoProgress(3, "item3", true);
        }

        awardExplorationRewards(completedDestination);
        applyWeatherState();
        setNightMode(false);
        commitResourceState({ animateDay: true });
        exploringStatus.classList.remove("is-visible");
        scheduleEmptyFieldDeerSpawn();

        if (explorationTimerId !== null) {
          clearInterval(explorationTimerId);
          explorationTimerId = null;
        }

        if (explorationCompleteToastTimerId !== null) {
          clearTimeout(explorationCompleteToastTimerId);
        }

        explorationCompleteToastTimerId = window.setTimeout(() => {
          explorationCompleteToastTimerId = null;
          showToast(EXPLORATION_COMPLETE_TOAST_MESSAGE);
        }, 4_200);

        zombieSpawnBlockedUntil = Date.now() + 7_000;

        if (returnZombieSpawnTimerId !== null) {
          clearTimeout(returnZombieSpawnTimerId);
        }

        returnZombieSpawnTimerId = window.setTimeout(() => {
          returnZombieSpawnTimerId = null;
          if (canCreateZombie()) {
            createZombie({ preferVisible: true, forceVisibleWhenExpanded: true });
          }
          scheduleEmptyFieldZombieSpawn();
        }, 7_000);
      }

      function hasDestinationItems(destination) {
        if (destination === "forest") {

        }

        if (destination === "city") {

        }

      }

      function getDestinationFoodRequirement(destination) {
        if (destination === "village") return 1;
        if (destination === "forest") return 3;
        if (destination === "city") return 5;
        return 0;
      }


      function getExplorationDurationMs(destination) {
        if (destination === "village") return VILLAGE_EXPLORATION_DURATION_MS;
        if (destination === "forest") return FOREST_EXPLORATION_DURATION_MS;
        if (destination === "city") return CITY_EXPLORATION_DURATION_MS;

      function handleExplorationDestination(destination) {

        if (zombieCount < zombieKillRequirement) {

          return;
        }

        const requiredFood = getDestinationFoodRequirement(destination);

      function configureAllBlueprintDefinitionsForTest() {
        // Decor 설계도는 각 하위 카테고리의 첫 빈칸부터 등록합니다.
        for (const blueprintId of Object.keys(OUTDOOR_BLUEPRINT_DEFINITIONS)) {
          ensureOutdoorBlueprintSlot(blueprintId);
        }

        // House 설계도도 각 하위 카테고리의 Basic 다음 첫 빈칸부터 등록합니다.
        for (const blueprintId of Object.keys(BUILDING_BLUEPRINT_DEFINITIONS)) {
          ensureBuildingBlueprintSlot(blueprintId);
        }

        // Restore 설계도는 획득 순서형 슬롯이므로 빈 슬롯부터 등록합니다.
        for (const blueprintId of Object.keys(REPAIR_BLUEPRINT_DEFINITIONS)) {
          ensureRepairBlueprintSlot(blueprintId);
        }
      }

      function getCraftableBlueprintItemsForTest() {
        configureAllBlueprintDefinitionsForTest();

        return REPAIR_CATEGORY_ORDER.flatMap((category) =>
          (repairItemsByCategory[category] || []).filter(
            (item) =>
              item &&
              item.name &&
              Object.keys(item.materials || {}).length > 0
          )
        );
      }

      function unlockAllBlueprintsForTest() {
        let changed = false;

        for (const item of getCraftableBlueprintItemsForTest()) {
          if (!item.unlocked) {
            item.unlocked = true;
            changed = true;
          }

          // 실제 획득과 동일하게 아직 제작하지 않은 설계도에는 NEW를 표시합니다.
          if (!item.built && !item.isNew) {
            item.isNew = true;
            changed = true;
          }
        }

        if (changed) {
          for (const category of REPAIR_CATEGORY_ORDER) {
            if (
              (repairItemsByCategory[category] || []).some(
                (item) => item.unlocked && item.isNew
              )
            ) {
              repairCategoryNewByCategory[category] = true;
            }
          }
          hasRepairButtonNew = true;
        }

        return changed;
      }

      function getRemainingBlueprintMaterialTotalsForTest() {
        const totals = {};

        for (const item of getCraftableBlueprintItemsForTest()) {
          if (!item.unlocked || item.built) continue;

          for (const [resource, amount] of Object.entries(item.materials || {})) {
            totals[resource] = (totals[resource] || 0) + amount;
          }
        }

        return totals;
      }

      function hasAllBlueprintsUnlockedForTest() {
        return getCraftableBlueprintItemsForTest().every(

        );
      }

      function hasAllObtainableItemsForTest() {
        return hasAxe &&
          hasHandgun &&
          hasHandgunAmmo &&
          handgunAmmoCount >= TEST_AMMO_QUANTITY &&
          hasShotgun &&
          hasShotgunAmmo &&
          shotgunAmmoCount >= TEST_AMMO_QUANTITY &&
          hasRifle &&
          hasRifleAmmo &&
          rifleAmmoCount >= TEST_AMMO_QUANTITY &&
          hasChainsaw &&
          hasChainsawBattery &&
          chainsawBatteryPercent >= TEST_CHAINSAW_BATTERY_PERCENT &&
          hasMusicBox &&
          hasStrangerLetter &&
          hasCompass &&
          (isCarRepaired() || carPartsCount >= getMaxCarPartsCount()) &&
          flowerCount > 0 &&

      function grantAllObtainableItemsForTest() {
        const newlyObtainedItemTypes = new Set();
        const markNewIfMissing = (itemType, wasOwned) => {
          if (!wasOwned) newlyObtainedItemTypes.add(itemType);
        };

        markNewIfMissing("axe", hasAxe);
        hasAxe = true;

        markNewIfMissing("handgun", hasHandgun);
        hasHandgun = true;

        markNewIfMissing("handgunAmmo", hasHandgunAmmo && handgunAmmoCount > 0);
        hasHandgunAmmo = true;
        handgunAmmoCount = TEST_AMMO_QUANTITY;

        markNewIfMissing("shotgun", hasShotgun);
        hasShotgun = true;
        markNewIfMissing("shotgunAmmo", hasShotgunAmmo && shotgunAmmoCount > 0);
        hasShotgunAmmo = true;
        shotgunAmmoCount = TEST_AMMO_QUANTITY;

        markNewIfMissing("rifle", hasRifle);
        hasRifle = true;
        markNewIfMissing("rifleAmmo", hasRifleAmmo && rifleAmmoCount > 0);
        hasRifleAmmo = true;
        rifleAmmoCount = TEST_AMMO_QUANTITY;

        markNewIfMissing("chainsaw", hasChainsaw);
        hasChainsaw = true;
        markNewIfMissing("chainsawBattery", hasChainsawBattery && chainsawBatteryPercent > 0);
        hasChainsawBattery = true;
        chainsawBatteryPercent = TEST_CHAINSAW_BATTERY_PERCENT;

        markNewIfMissing("musicBox", hasMusicBox);
        hasMusicBox = true;

        markNewIfMissing("strangerLetter", hasStrangerLetter);
        hasStrangerLetter = true;

        markNewIfMissing("compass", hasCompass);
        hasCompass = true;

        if (isCarRepaired()) {
          clearCarPartsAfterRepair();
        } else {
          markNewIfMissing("carParts", carPartsCount > 0);
          carPartsCount = Math.max(carPartsCount, getMaxCarPartsCount());
        }

        markNewIfMissing("flowers", flowerCount > 0);
        flowerCount = Math.max(flowerCount, 1);

        for (const itemType of Object.keys(paintCounts)) {
          markNewIfMissing(itemType, paintCounts[itemType] > 0);
          paintCounts[itemType] = Math.max(paintCounts[itemType], 1);
        }

        markNewIfMissing("repairKit", repairKitCount > 0);
        repairKitCount = Math.max(repairKitCount, 1);

        markNewIfMissing("fuel", fuelCount > 0);
        fuelCount = Math.max(fuelCount, 10);

        markNewIfMissing("map", hasMap);
        hasMap = true;
        syncTodoProgressFromCurrentState(3);
        syncTodoProgressFromCurrentState(4);

        if (newlyObtainedItemTypes.size > 0) {
          for (const itemType of newlyObtainedItemTypes) {
            newInventoryItemTypes.add(itemType);
            viewedInventoryNewItemTypes.delete(itemType);
          }
          hasNewInventoryItem = true;
        }

      function areTestResourcesFull() {
        if (!hasAllBlueprintsUnlockedForTest()) return false;
        if (!hasAllObtainableItemsForTest()) return false;

        const requiredMaterials = getRemainingBlueprintMaterialTotalsForTest();
        const hasAllCraftingMaterials = Object.entries(requiredMaterials).every(
          ([resource, amount]) => getRepairResourceAmount(resource) >= amount
        );

        return hasAllCraftingMaterials &&
          zombieCount >= zombieKillRequirement &&
          foodCount >= getMaxFoodCount() &&
          woodCount >= getMaxWoodCount();
      }

      function fillResourcesForTest() {
        if (!TEST_MODE || isExploring) return;

        unlockAllBlueprintsForTest();
        grantAllObtainableItemsForTest();

        const requiredMaterials = getRemainingBlueprintMaterialTotalsForTest();
        for (const [resource, amount] of Object.entries(requiredMaterials)) {
          setRepairResourceAmount(
            resource,
            Math.max(getRepairResourceAmount(resource), amount)
          );
        }

        zombieCount = zombieKillRequirement;
        foodCount = getMaxFoodCount();
        woodCount = Math.max(
          woodCount,
          getMaxWoodCount(),
          requiredMaterials.wood || 0
        );

        applyAxeState();
        applyInventoryState();
        applyInventoryNewBadgeState();
        applyRepairState();

        // 테스트 모드에서 자원을 충전한 뒤에만 개를 등장시킵니다.
        createDog(true);

        commitResourceState();
      }

      function handleVersionLabelTestAction(event) {
        if (!TEST_MODE) return;

        if (event) {
          event.preventDefault();
          event.stopPropagation();
        }

        const now = performance.now();
        if (
          now - versionTestLastClickAt >
          TEST_BUTTON_TRIPLE_CLICK_MAX_GAP_MS
        ) {
          versionTestClickCount = 0;
        }

        versionTestLastClickAt = now;
        versionTestClickCount += 1;

        if (versionTestClickCount < 3) return;

        versionTestClickCount = 0;
        versionTestLastClickAt = -Infinity;

        if (isExploring) {
          shortenExplorationForTest();

        }

        if (areTestResourcesFull()) {
          resetAllSavedStateForTest();
          return;
        }

      }

      function easeOutSine(progress) {

      function preloadImage(path) {
        return new Promise((resolve) => {
          const image = new Image();
          PRELOADED_ZOMBIE_IMAGES.set(path, image);

          const finish = () => resolve();

          image.addEventListener(
            "load",
            async () => {
              try {
                if (typeof image.decode === "function") {
                  await image.decode();
                }
              } catch (_) {
                // decode 실패 시에도 이미 로드된 이미지는 그대로 사용합니다.
              }

              finish();
            },
            { once: true }
          );

          image.addEventListener("error", finish, { once: true });
          image.src = path;
        });
      }

      function applyWorldTransform() {
        world.style.left = `calc(50% + ${panX}px)`;
        world.style.top = `calc(50% + ${panY}px)`;
        world.style.transform =
          `translate(-50%, -50%) scale(${worldScale})`;
      }

      function updatePanBounds() {
        const viewportWidth = window.innerWidth;
        const viewportHeight = window.innerHeight;
        const renderedWorldSize = WORLD_SIZE * worldScale;

        /*
          브라우저 내부 크기는 정사각형 창에서도 주소창·테두리 등의 영향으로
          몇 px 차이가 날 수 있으므로, 긴 쪽 대비 1% 이내의 차이는 1:1로 봅니다.
        */
        const aspectDifference =
          Math.abs(viewportWidth - viewportHeight);
        const squareTolerance =
          Math.max(viewportWidth, viewportHeight) * 0.01;
        const isSquare =
          aspectDifference <= squareTolerance;
        const isWide =
          !isSquare && viewportWidth > viewportHeight;
        const isTall =
          !isSquare && viewportHeight > viewportWidth;

        /*
          화면 비율에 따라 실제로 잘린 방향만 드래그합니다.

          - 가로형 화면: 세로 방향만 드래그
          - 세로형 화면: 가로 방향만 드래그
          - 1:1에 가까운 화면: 드래그하지 않음

          배경 끝이 화면 끝에 닿는 지점까지만 이동합니다.
        */
        maxPanX = 0;
        maxPanY = 0;

        if (isWide) {
          /*
            가로형 화면에서는 가로 길이와 같은 정사각형 영역까지만
            위아래로 이동합니다.
            예: 1600×900 화면 → 세로 이동 범위는 ±350px
          */
          maxPanY = Math.max(
            0,
            (viewportWidth - viewportHeight) / 2
          );
        } else if (isTall) {
          /*
            세로형 화면에서는 세로 길이와 같은 정사각형 영역까지만
            좌우로 이동합니다.
            예: 900×1600 화면 → 가로 이동 범위는 ±350px
          */
          maxPanX = Math.max(
            0,
            (viewportHeight - viewportWidth) / 2
          );
        }

        panX = maxPanX > 0
          ? clamp(panX, -maxPanX, maxPanX)
          : 0;

        panY = maxPanY > 0
          ? clamp(panY, -maxPanY, maxPanY)
          : 0;

        viewport.classList.toggle(
          "can-pan",
          maxPanX > 0 || maxPanY > 0
        );
      }

      function updateWorldScale() {
        const viewportWidth = window.innerWidth;
        const viewportHeight = window.innerHeight;

        const baseWidth = clamp(viewportWidth, 1024, 2048);
        const baseHeight = clamp(viewportHeight, 1024, 2048);

        // 1024 미만과 2048 초과에서는 긴 쪽을 fit하고 반대쪽을 crop합니다.
        worldScale = Math.max(
          viewportWidth / baseWidth,
          viewportHeight / baseHeight
        );

        updatePanBounds();
        applyWorldTransform();
      }

      function startBackgroundDrag(event) {
        if (event.button !== undefined && event.button !== 0) return;
        if (maxPanX <= 0 && maxPanY <= 0) return;

        event.preventDefault();
        dragState.active = true;
        dragState.moved = false;
        dragState.pointerId = event.pointerId;
        dragState.captureTarget =
          event.target instanceof Element ? event.target : viewport;
        dragState.startX = event.clientX;
        dragState.startY = event.clientY;
        dragState.startPanX = panX;
        dragState.startPanY = panY;

        try {
          dragState.captureTarget.setPointerCapture(event.pointerId);
        } catch (_) {
          dragState.captureTarget = viewport;
          viewport.setPointerCapture(event.pointerId);
        }
      }

      function moveBackgroundDrag(event) {
        if (
          !dragState.active ||
          event.pointerId !== dragState.pointerId
        ) {
          return;
        }

        const deltaX = event.clientX - dragState.startX;
        const deltaY = event.clientY - dragState.startY;

        if (!dragState.moved && Math.hypot(deltaX, deltaY) >= 4) {
          dragState.moved = true;
          viewport.classList.add("is-panning");
        }

        if (!dragState.moved) return;

        panX = clamp(
          dragState.startPanX + deltaX,
          -maxPanX,
          maxPanX
        );

        panY = clamp(
          dragState.startPanY + deltaY,
          -maxPanY,
          maxPanY
        );

        applyWorldTransform();
        event.preventDefault();
      }

      function endBackgroundDrag(event) {
        if (
          !dragState.active ||
          event.pointerId !== dragState.pointerId
        ) {
          return;
        }

        const didMove = dragState.moved;
        const captureTarget = dragState.captureTarget;
        if (
          captureTarget &&
          typeof captureTarget.hasPointerCapture === "function" &&
          captureTarget.hasPointerCapture(event.pointerId)
        ) {
          try {
            captureTarget.releasePointerCapture(event.pointerId);
          } catch (_) {
            // 포인터 해제가 이미 끝난 경우에도 드래그 상태는 정상 정리합니다.
          }
        }

        dragState.active = false;
        dragState.moved = false;
        dragState.pointerId = null;
        dragState.captureTarget = null;
        viewport.classList.remove("is-panning");

        if (didMove) {
          scheduleEmptyFieldZombieSpawn();
          scheduleEmptyFieldDeerSpawn();
        }

        // 대상 요소에서 pointerup을 받지 못한 예외 상황에도 눌림 상태를 남기지 않습니다.
        clearFieldEntityPressState(event.pointerId);
      }

      function shouldActivateFieldObject(event, element = event?.currentTarget) {
        if (!event) return true;
        if (dragState.moved) return false;

        if (
          dragState.active &&
          event.pointerId !== dragState.pointerId
        ) {
          return false;
        }

        if (!(element instanceof Element)) return true;

        const rect = element.getBoundingClientRect();
        return (
          event.clientX >= rect.left &&
          event.clientX <= rect.right &&
          event.clientY >= rect.top &&
          event.clientY <= rect.bottom
        );
      }

      function framePosition(frameIndex) {
        const col = frameIndex % 4;
        const row = Math.floor(frameIndex / 4);
        return `${-col * ZOMBIE_WIDTH}px ${-row * ZOMBIE_HEIGHT}px`;
      }

      function deerFramePosition(frameIndex) {
        const normalizedIndex = Math.max(0, frameIndex);
        const col = normalizedIndex % DEER_SHEET_COLUMNS;
        const row = Math.floor(normalizedIndex / DEER_SHEET_COLUMNS);
        return `${-col * DEER_FRAME_SIZE}px ${-row * DEER_FRAME_SIZE}px`;
      }

      function getRandomDeerIdleDelay() {
        return randomBetween(
          DEER_IDLE_MIN_DELAY_MS,
          DEER_IDLE_MAX_DELAY_MS
        );
      }

      function randomCloudCount(minCount, maxCount) {
        return Math.floor(
          randomBetween(minCount, maxCount + 1)
        );
      }

      function getVisibleWorldBounds() {
        const screenCenterX = window.innerWidth / 2 + panX;
        const screenCenterY = window.innerHeight / 2 + panY;
        const worldCenter = WORLD_SIZE / 2;

        return {
          left: worldCenter + (0 - screenCenterX) / worldScale,
          top: worldCenter + (0 - screenCenterY) / worldScale,
          right:
            worldCenter +
            (window.innerWidth - screenCenterX) / worldScale,
          bottom:
            worldCenter +
            (window.innerHeight - screenCenterY) / worldScale
        };
      }

      function getCloudHalfSize(scale) {
        return (CLOUD_FRAME_SIZE * scale) / 2;
      }

      function getCloudBounds(x, y, scale, padding = 0) {
        const halfSize = getCloudHalfSize(scale) + padding;

        return {
          left: x - halfSize,
          top: y - halfSize,
          right: x + halfSize,
          bottom: y + halfSize
        };
      }

      function doCloudBoundsOverlap(a, b) {
        return !(
          a.right <= b.left ||
          a.left >= b.right ||
          a.bottom <= b.top ||
          a.top >= b.bottom
        );
      }

      function overlapsCloudGroup(x, y, scale, group) {
        const candidateBounds = getCloudBounds(
          x,
          y,
          scale,
          CLOUD_OVERLAP_PADDING
        );

        return group.some((otherCloud) => {
          const otherBounds = getCloudBounds(
            otherCloud.x,
            otherCloud.y,
            otherCloud.scale,
            CLOUD_OVERLAP_PADDING
          );

          return doCloudBoundsOverlap(candidateBounds, otherBounds);
        });
      }

      function lineIntersectsRectOnCloudPath(lineSum, rect) {
        const minLineSum = rect.left + rect.top;
        const maxLineSum = rect.right + rect.bottom;

        return lineSum >= minLineSum && lineSum <= maxLineSum;
      }

      function wouldCloudPathIntrudeSafeZone(
        x,
        y,
        scale,
        intrusionRatio
      ) {
        const halfSize = getCloudHalfSize(scale);
        const clampedIntrusionRatio = clamp(
          intrusionRatio,
          0,
          1
        );
        // 1 이상이면 safe zone 경로 제한을 사용하지 않습니다.
        if (clampedIntrusionRatio >= 1) {
          return false;
        }

        const protectedMargin =
          halfSize * (1 - clampedIntrusionRatio);

        const protectedZone = {
          left: SAFE_ZONE.left - protectedMargin,
          top: SAFE_ZONE.top - protectedMargin,
          right: SAFE_ZONE.right + protectedMargin,
          bottom: SAFE_ZONE.bottom + protectedMargin
        };

        // 구름과 그림자는 x + y 값이 일정한 대각선 경로로 이동합니다.
        // 이 경로가 보호 구역을 지나면 해당 생성 위치를 사용하지 않습니다.
        return lineIntersectsRectOnCloudPath(x + y, protectedZone);
      }

      function getRandomCloudPosition(kind, scale, group, initialInside) {
        const visibleBounds = getVisibleWorldBounds();
        const halfSize = getCloudHalfSize(scale);
        const centerX = (visibleBounds.left + visibleBounds.right) / 2;
        const centerY = (visibleBounds.top + visibleBounds.bottom) / 2;
        const isShadow = kind === "shadow";

        for (let attempt = 0; attempt < 120; attempt += 1) {
          let x;
          let y;

          if (initialInside) {
            const minX = visibleBounds.left + halfSize * 0.55;
            const maxX = visibleBounds.right - halfSize * 0.55;
            const minY = visibleBounds.top + halfSize * 0.55;
            const maxY = visibleBounds.bottom - halfSize * 0.55;

            x = minX <= maxX
              ? randomBetween(minX, maxX)
              : centerX;
            y = minY <= maxY
              ? randomBetween(minY, maxY)
              : centerY;
          } else if (Math.random() < 0.5) {
            // 화면 왼쪽의 아래쪽 구간에서 들어옵니다.
            x = visibleBounds.left - halfSize * 0.82;
            y = randomBetween(
              centerY,
              visibleBounds.bottom + halfSize * 0.15
            );
          } else {
            // 화면 아래쪽의 왼쪽 구간에서 들어옵니다.
            x = randomBetween(
              visibleBounds.left - halfSize * 0.15,
              centerX
            );
            y = visibleBounds.bottom + halfSize * 0.82;
          }

          if (overlapsCloudGroup(x, y, scale, group)) {
            continue;
          }

          const safeZoneIntrusionRatio = isShadow
            ? CLOUD_SHADOW_SAFE_ZONE_INTRUSION_RATIO
            : CLOUD_SAFE_ZONE_INTRUSION_RATIO;

          if (
            wouldCloudPathIntrudeSafeZone(
              x,
              y,
              scale,
              safeZoneIntrusionRatio
            )
          ) {
            continue;
          }

          return { x, y };
        }

        return null;
      }

      function applyCloudVariant(element, variant, isShadow) {
        const col = variant % CLOUD_SHEET_COLUMNS;
        const row = Math.floor(variant / CLOUD_SHEET_COLUMNS);
        const position =
          `${-col * CLOUD_FRAME_SIZE}px ` +
          `${-row * CLOUD_FRAME_SIZE}px`;

        // 낮/밤 구름 레이어가 동일한 스프라이트 위치를 사용합니다.
        element.style.setProperty("--cloud-position", position);
      }

      function renderCloud(cloud) {
        let renderX = cloud.x;
        let renderY = cloud.y;

        if (cloud.kind === "sky") {
          renderX += (-panX / worldScale) * CLOUD_DRAG_PARALLAX_FACTOR;
          renderY += (-panY / worldScale) * CLOUD_DRAG_PARALLAX_FACTOR;
        }

        cloud.element.style.left = `${renderX}px`;
        cloud.element.style.top = `${renderY}px`;
        cloud.element.style.transform =
          `translate(-50%, -50%) scale(${cloud.scale})`;
      }

      function applyCloudOpacity(cloud, opacityFactor) {
        cloud.opacityFactor = clamp(opacityFactor, 0, 1);
        cloud.element.style.opacity = String(
          cloud.baseOpacity * cloud.opacityFactor
        );
      }

      function updateCloudOpacity(cloud, now) {
        if (cloud.isFadingOut) {
          const fadeProgress = clamp(
            (now - cloud.fadeOutStartedAt) /
              CLOUD_FADE_DURATION_MS,
            0,
            1
          );

          applyCloudOpacity(
            cloud,
            cloud.fadeOutStartOpacity * (1 - fadeProgress)
          );
          return;
        }

        const fadeInProgress = clamp(
          (now - cloud.createdAt) / CLOUD_FADE_DURATION_MS,
          0,
          1
        );

        applyCloudOpacity(cloud, fadeInProgress);
      }

      function startCloudFadeOut(cloud, now) {
        if (cloud.isFadingOut) return;

        updateCloudOpacity(cloud, now);
        cloud.isFadingOut = true;
        cloud.fadeOutStartedAt = now;
        cloud.fadeOutStartOpacity = cloud.opacityFactor;
      }

      function getCloudTimeUntilOutside(
        cloud,
        visibleBounds,
        worldSpeed
      ) {
        const halfSize = getCloudHalfSize(cloud.scale);
        const velocityX = CLOUD_DIRECTION.x * worldSpeed;
        const velocityY = CLOUD_DIRECTION.y * worldSpeed;
        const exitCenterX =
          visibleBounds.right + CLOUD_EXIT_MARGIN + halfSize;
        const exitCenterY =
          visibleBounds.top - CLOUD_EXIT_MARGIN - halfSize;

        const timeUntilRightExit = velocityX > 0
          ? (exitCenterX - cloud.x) / velocityX
          : Infinity;
        const timeUntilTopExit = velocityY < 0
          ? (cloud.y - exitCenterY) / -velocityY
          : Infinity;

        return Math.min(
          timeUntilRightExit,
          timeUntilTopExit
        );
      }

      function createCloud(kind, initialInside = false) {
        const isShadow = kind === "shadow";
        const group = isShadow ? shadowClouds : skyClouds;
        const layer = isShadow ? cloudShadowsLayer : cloudsLayer;
        const scale = isShadow
          ? randomBetween(
              CLOUD_SHADOW_MIN_SCALE,
              CLOUD_SHADOW_MAX_SCALE
            )
          : randomBetween(
              CLOUD_MIN_SCALE,
              CLOUD_MAX_SCALE
            );
        const position = getRandomCloudPosition(
          kind,
          scale,
          group,
          initialInside
        );

        if (!position) return false;

        const variant = Math.floor(
          Math.random() * CLOUD_VARIANT_COUNT
        );
        const element = document.createElement("div");
        element.className = isShadow
          ? "cloud-visual cloud-shadow"
          : "cloud-visual cloud-sprite";

        applyCloudVariant(element, variant, isShadow);
        layer.appendChild(element);

        const now = performance.now();
        const initialOpacityFactor = initialInside ? 1 : 0;

        const cloud = {
          id: nextCloudId++,
          kind,
          element,
          x: position.x,
          y: position.y,
          scale,
          variant,
          baseOpacity: isShadow
            ? getCloudShadowBaseOpacity(now)
            : 1,
          opacityFactor: initialOpacityFactor,
          /*
            페이지 최초 로드 시 화면 안에 배치되는 구름과 그림자는
            즉시 보이도록 페이드인 완료 상태로 시작합니다.
            이후 새로 생성되는 구름만 1초 페이드인을 사용합니다.
          */
          createdAt: initialInside
            ? now - CLOUD_FADE_DURATION_MS
            : now,
          isFadingOut: false,
          fadeOutStartedAt: 0,
          fadeOutStartOpacity: 1
        };

        group.push(cloud);
        renderCloud(cloud);
        applyCloudOpacity(cloud, initialOpacityFactor);
        return true;
      }

      function removeCloud(cloud, group) {
        cloud.element.remove();
        const index = group.indexOf(cloud);

        if (index >= 0) {
          group.splice(index, 1);
        }
      }

      function isCloudOutsideVisibleArea(cloud, visibleBounds) {
        const halfSize = getCloudHalfSize(cloud.scale);

        return (
          cloud.x - halfSize > visibleBounds.right + CLOUD_EXIT_MARGIN ||
          cloud.y + halfSize < visibleBounds.top - CLOUD_EXIT_MARGIN
        );
      }

      function updateCloudGroup(kind, deltaMs, now) {
        const isShadow = kind === "shadow";
        const group = isShadow ? shadowClouds : skyClouds;
        const visibleBounds = getVisibleWorldBounds();
        const currentShadowOpacity = isShadow
          ? getCloudShadowBaseOpacity(now)
          : 1;

        // 화면에서 보이는 속도가 확대 배율과 관계없이 같도록 보정합니다.
        const worldSpeed =
          CLOUD_SPEED_SCREEN_PX_PER_MS / worldScale;

        for (const cloud of [...group]) {
          if (isShadow) {
            cloud.baseOpacity = currentShadowOpacity;
          }

          cloud.x += CLOUD_DIRECTION.x * worldSpeed * deltaMs;
          cloud.y += CLOUD_DIRECTION.y * worldSpeed * deltaMs;
          renderCloud(cloud);

          if (!cloud.isFadingOut) {
