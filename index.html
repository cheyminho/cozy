<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>CoZy</title>
  <style>
    @font-face {
      font-family: "Montserrat";
      src: url("fonts/Montserrat-VariableFont_wght.ttf") format("truetype");
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --world-size: 2048px;
      --zombie-width: 64px;
      --zombie-height: 128px;
      --deer-width: 85.3333px;
      --deer-height: 85.3333px;
    }

    * {
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #111;
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      touch-action: none;
    }

    body {
      font-family: "Montserrat", Arial, Helvetica, sans-serif;
      touch-action: none;
    }

    #viewport {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #111;
      touch-action: none;
    }

    #viewport.can-pan {
      cursor: grab;
    }

    #viewport.is-panning {
      cursor: grabbing;
    }

    #world {
      position: absolute;
      left: 50%;
      top: 50%;
      width: var(--world-size);
      height: var(--world-size);
      transform-origin: center center;
      background-image: url("images/bg_field_default_day.png");
      background-repeat: no-repeat;
      background-position: center;
      background-size: 2048px 2048px;
      will-change: transform;
    }

    /* 탐험 중에는 밤 배경을 3초 동안 페이드인하고, 귀환 시 반대로 전환합니다. */
    #world::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      background-image: url("images/bg_field_default_nigth.png");
      background-repeat: no-repeat;
      background-position: center;
      background-size: 2048px 2048px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 3s ease;
    }

    body.is-night #world::after {
      opacity: 1;
    }

    #cloudShadows,
    #clouds {
      position: absolute;
      inset: 0;
      overflow: visible;
      pointer-events: none;
    }

    /* 구름 그림자는 배경 위, 좀비 아래에 표시합니다. */
    #cloudShadows {
      z-index: 1;
      /*
        자식 그림자 요소가 아니라 레이어 전체를 배경과 곱합니다.
        z-index로 생성된 별도 합성 레이어 안에서 blend가 갇히는 문제를 방지합니다.
      */
      mix-blend-mode: multiply;
    }

    /* 도끼가 꽂힌 나무 밑동은 배경 오브젝트로 좀비보다 아래에 표시합니다. */
    #props {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    #axeStump {
      position: absolute;
      /* 이전 버전에서 오른쪽으로 20px 추가 이동 */
      left: 733px;
      top: 672px;
      width: 179.2px;
      height: 179.2px;
      background-image: url("images/bg_stump_axe.png");
      background-repeat: no-repeat;
      background-position: left top;
      background-size: 179.2px 179.2px;
      transform-origin: left top;
      pointer-events: none;
    }

    /* 탐험 중 빈 그루터기도 3초 동안 밤 이미지로 전환합니다. */
    #axeStump::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      background-image: url("images/bg_stump_night.png");
      background-repeat: no-repeat;
      background-position: left top;
      background-size: 179.2px 179.2px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 3s ease;
    }

    body.is-night #axeStump::after {
      opacity: 1;
    }

    /* 이미지와 같은 70% 비율로 축소된 89.6×89.6 영역을 정중앙에 배치합니다. */
    #axePickupHitArea {
      position: absolute;
      left: 44.8px;
      top: 44.8px;
      width: 89.6px;
      height: 89.6px;
      z-index: 1;
      cursor: pointer;
      pointer-events: auto;
      touch-action: none;
      outline: none;
    }

    #entities {
      position: absolute;
      inset: 0;
      z-index: 10;
      /* 빈 엔티티 레이어가 아래의 도끼 터치 영역을 가리지 않도록 합니다. */
      pointer-events: none;
    }

    /* 실제 구름은 좀비보다 높은 상공 레이어에 표시합니다. */
    #clouds {
      z-index: 20;
    }

    /* 새 떼는 배경 위 상공 레이어에서 날아가며, 화면 드래그에도 함께 반응합니다. */
    #birds {
      position: absolute;
      inset: 0;
      z-index: 19;
      overflow: visible;
      pointer-events: none;
    }

    .bird {
      position: absolute;
      width: 42.6667px;
      height: 42.6667px;
      background-color: #f1efe4;
      -webkit-mask-image: url("images/bird_fly.png");
      mask-image: url("images/bird_fly.png");
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-size: 128px 128px;
      mask-size: 128px 128px;
      -webkit-mask-position: 0 0;
      mask-position: 0 0;
      transform-origin: center center;
      image-rendering: auto;
      will-change: left, top, transform, opacity, -webkit-mask-position, mask-position;
      pointer-events: none;
    }

    .cloud-visual {
      position: absolute;
      width: 512px;
      height: 512px;
      transform-origin: center center;
      will-change: left, top, transform, opacity;
      pointer-events: none;
    }

    .cloud-visual::before,
    .cloud-visual::after {
      content: "";
      position: absolute;
      inset: 0;
      background-repeat: no-repeat;
      background-position: var(--cloud-position, 0 0);
      background-size: 1024px 1024px;
      pointer-events: none;
      transition: opacity 3s ease;
    }

    .cloud-visual::before {
      background-image: url("images/bg_field_default_clouds.png");
      opacity: 1;
    }

    .cloud-visual::after {
      background-image: url("images/bg_field_default_clouds_night.png");
      opacity: 0;
    }

    body.is-night .cloud-visual::before {
      opacity: 0;
    }

    body.is-night .cloud-visual::after {
      opacity: 1;
    }

    .cloud-shadow {
      opacity: 0.3;
      /* 실제 multiply 합성은 부모 #cloudShadows 레이어에서 처리합니다. */
      mix-blend-mode: normal;

      /*
        원본 구름 PNG의 투명도를 그대로 사용하면서
        그림자를 어두운 남청색(#303a72에 가까운 색)으로 변환합니다.
        mask-image를 사용하지 않으므로 file:// 로 직접 열어도 CORS에 막히지 않습니다.
      */
      filter:
        brightness(0)
        saturate(100%)
        invert(22%)
        sepia(18%)
        saturate(1780%)
        hue-rotate(193deg)
        brightness(88%)
        contrast(88%);
    }

    #hud {
      position: fixed;
      top: max(30px, calc(env(safe-area-inset-top) + 16px));
      left: 50%;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 100px;
      transform: translateX(-50%);
      color: #fff;
      font-size: 16px;
      font-weight: 500;
      line-height: 1;
      letter-spacing: 0.01em;
      text-align: center;
      white-space: nowrap;
      pointer-events: none;
    }

    .hud-resource {
      display: inline-flex;
      align-items: baseline;
      gap: 5px;
    }

    @media (max-width: 560px) {
      #hud {
        gap: 28px;
        font-size: 14px;
      }
    }

    #toastLayer {
      position: fixed;
      top: 20vh;
      left: 50%;
      z-index: 140;
      width: min(90vw, 420px);
      height: 1px;
      transform: translateX(-50%);
      pointer-events: none;
    }

    .toast-message {
      position: absolute;
      left: 50%;
      top: 0;
      color: #fff;
      font-size: 18px;
      font-weight: 350;
      line-height: 1.3;
      white-space: nowrap;
      text-align: center;
      transform: translate(-50%, 18px);
      will-change: transform;
      animation: toast-rise 3s linear forwards;
    }

    .toast-message-text {
      display: block;
      opacity: 0;
      will-change: opacity;
      animation: toast-fade 3s linear forwards;
    }

    /*
      새 토스트가 나타날 때 기존 토스트는 이동을 계속하면서
      현재 위치에서 0.2초 동안 빠르게 사라집니다.
    */
    .toast-message.is-replaced .toast-message-text {
      animation: toast-replaced-fade 0.2s linear forwards;
    }

    @keyframes toast-rise {
      0% {
        transform: translate(-50%, 18px);
      }
      100% {
        transform: translate(-50%, -24px);
      }
    }

    @keyframes toast-fade {
      0% {
        opacity: 0;
      }
      16.6667% {
        opacity: 0.9;
      }
      66.6667% {
        opacity: 0.9;
      }
      100% {
        opacity: 0;
      }
    }

    @keyframes toast-replaced-fade {
      from {
        opacity: var(--toast-current-opacity, 0.9);
      }
      to {
        opacity: 0;
      }
    }

    #versionLabel {
      position: fixed;
      right: max(10px, env(safe-area-inset-right));
      bottom: max(10px, env(safe-area-inset-bottom));
      z-index: 140;
      color: #fff;
      font-size: 11px;
      font-weight: 400;
      line-height: 1;
      text-align: right;
      opacity: 0.7;
      pointer-events: none;
    }

    #versionLabel.is-test-active {
      cursor: pointer;
      pointer-events: auto;
    }

    #exploreButton,
    #inventoryButton,
    #repairButton {
      --collapsed-width: 56px;
      --expanded-width: 120px;
      position: fixed;
      left: max(24px, calc(env(safe-area-inset-left) + 16px));
      z-index: 120;
      display: flex;
      align-items: center;
      width: var(--collapsed-width);
      height: 56px;
      padding: 0 16px 0 12px;
      overflow: hidden;
      border: 0;
      border-radius: 28px;
      appearance: none;
      -webkit-appearance: none;
      outline: none;
      background: #181818;
      box-shadow: none;
      cursor: pointer;
      touch-action: manipulation;
      transform-origin: left center;
      transition:
        width 280ms cubic-bezier(0.215, 0.61, 0.355, 1),
        transform 90ms ease-out;
    }

    .hud-action-button__icon {
      flex: 0 0 32px;
      width: 32px;
      height: 32px;
      object-fit: contain;
      pointer-events: none;
    }

    .hud-action-button__label {
      flex: 0 0 auto;
      margin-left: 10px;
      color: #fff;
      font-size: 16px;
      font-weight: 500;
      line-height: 1;
      text-align: left;
      white-space: nowrap;
      opacity: 0;
      transform: translateX(-6px);
      pointer-events: none;
      transition:
        opacity 140ms ease-out,
        transform 280ms cubic-bezier(0.215, 0.61, 0.355, 1);
    }

    @media (hover: hover) and (pointer: fine) {
      #exploreButton:hover,
      #inventoryButton:hover,
      #repairButton:hover {
        width: var(--expanded-width);
      }

      #exploreButton:hover .hud-action-button__label,
      #inventoryButton:hover .hud-action-button__label,
      #repairButton:hover .hud-action-button__label {
        opacity: 1;
        transform: translateX(0);
      }
    }

    #exploreButton:focus-visible,
    #inventoryButton:focus-visible,
    #repairButton:focus-visible {
      width: var(--expanded-width);
    }

    #exploreButton:focus-visible .hud-action-button__label,
    #inventoryButton:focus-visible .hud-action-button__label,
    #repairButton:focus-visible .hud-action-button__label {
      opacity: 1;
      transform: translateX(0);
    }

    #exploreButton.is-menu-open,
    #inventoryButton.is-menu-open {
      z-index: 140;
      width: var(--expanded-width);
    }

    #exploreButton.is-menu-open .hud-action-button__label,
    #inventoryButton.is-menu-open .hud-action-button__label {
      opacity: 1;
      transform: translateX(0);
    }

    #exploreButton {
      bottom: max(24px, calc(env(safe-area-inset-bottom) + 16px));
    }

    #inventoryButton {
      bottom: max(92px, calc(env(safe-area-inset-bottom) + 84px));
    }

    #repairButton {
      bottom: max(160px, calc(env(safe-area-inset-bottom) + 152px));
    }

    #exploreButton:active,
    #inventoryButton:active,
    #repairButton:active {
      transform: scale(0.94);
    }

    #exploreButton:focus,
    #inventoryButton:focus,
    #repairButton:focus {
      outline: none;
      box-shadow: none;
    }

    #explorationOverlay,
    #inventoryOverlay {
      position: fixed;
      inset: 0;
      z-index: 130;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.52);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition:
        opacity 180ms ease-out,
        visibility 0s linear 180ms;
    }

    #explorationOverlay.is-open,
    #inventoryOverlay.is-open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transition-delay: 0s;
    }

    #explorationMenu {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 42px;
    }

    #inventoryMenu {
      width: min(82vw, 420px);
      max-height: calc(100vh - 160px);
      padding: 18px 8px;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
    }

    #inventoryList {
      display: flex;
      flex-direction: column;
      gap: 18px;
      width: min(100%, 240px);
      margin: 0 auto;
    }

    .inventory-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 6px 4px;
      border: 0;
      appearance: none;
      -webkit-appearance: none;
      outline: none;
      background: transparent;
      color: #fff;
      font: inherit;
      font-size: 16px;
      font-weight: 350;
      line-height: 1.2;
      cursor: pointer;
    }

    .inventory-item__name {
      display: inline-flex;
      align-items: center;
      min-width: 0;
      text-align: left;
      white-space: nowrap;
    }

    .inventory-item__equipped {
      display: inline-block;
      flex: 0 0 20px;
      width: 20px;
      margin-right: 6px;
      text-align: left;
    }

    .inventory-item[hidden] {
      display: none;
    }

    .inventory-item__label {
      display: inline-block;
      font-weight: 350;
      transform: scale(1);
      transform-origin: left center;
      transition:
        font-weight 120ms ease-out,
        transform 120ms ease-out;
    }

    .inventory-item__quantity {
      text-align: right;
      white-space: nowrap;
    }

    @media (hover: hover) and (pointer: fine) {
      .inventory-item:hover .inventory-item__label {
        font-weight: 600;
      }
    }

    .inventory-item:active .inventory-item__label {
      transform: scale(0.95);
      transition-duration: 70ms;
    }

    .inventory-item:focus-visible .inventory-item__label {
      font-weight: 600;
    }

    .exploration-destination {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .exploration-option {
      padding: 4px 12px;
      border: 0;
      appearance: none;
      -webkit-appearance: none;
      outline: none;
      background: transparent;
      color: #fff;
      font: inherit;
      font-size: 24px;
      font-weight: 350;
      line-height: 1;
      cursor: pointer;
      transform: scale(1);
      transition:
        transform 160ms cubic-bezier(0.215, 0.61, 0.355, 1),
        font-weight 160ms cubic-bezier(0.215, 0.61, 0.355, 1);
    }

    .exploration-requirement {
      color: rgba(255, 255, 255, 0.62);
      font-size: 12px;
      font-weight: 350;
      line-height: 1.45;
      text-align: center;
      pointer-events: none;
    }

    .exploration-requirement-item {
      display: flex;
      flex-wrap: nowrap;
      align-items: baseline;
      gap: 4px;
      width: max-content;
      margin: 0 auto;
      white-space: nowrap;
    }

    .exploration-requirement-item::before {
      content: "";
      flex: 0 0 12px;
      width: 12px;
      text-align: center;
    }

    .exploration-requirement-item.is-complete::before {
      content: "✓";
    }

    @media (hover: hover) and (pointer: fine) {
      .exploration-option:hover {
        font-weight: 500;
        transform: scale(1.07);
      }
    }

    .exploration-option:active {
      transform: scale(0.94);
      transition-duration: 70ms;
    }

    .exploration-option:focus-visible {
      font-weight: 500;
      transform: scale(1.07);
    }

    #exploringStatus {
      position: fixed;
      right: max(24px, calc(env(safe-area-inset-right) + 16px));
      bottom: max(34px, calc(env(safe-area-inset-bottom) + 26px));
      z-index: 120;
      display: none;
      color: #fff;
      text-align: right;
      pointer-events: none;
    }

    #exploringStatus.is-visible {
      display: block;
    }

    #exploringLabel {
      margin-bottom: 10px;
      font-size: 16px;
      font-weight: 450;
      line-height: 1;
    }

    #exploringTime {
      font-size: 59px;
      font-weight: 500;
      line-height: 0.9;
      letter-spacing: -0.03em;
    }

    #exploringTime.is-test-active {
      cursor: pointer;
      pointer-events: auto;
    }

    .zombie {
      position: absolute;
      width: var(--zombie-width);
      height: var(--zombie-height);
      cursor: pointer;
      transform: translate(-50%, -50%);
      transform-origin: center center;
      will-change: left, top, opacity;
      touch-action: none;
      /* 부모 엔티티 레이어는 클릭을 통과시키고 좀비만 직접 입력을 받습니다. */
      pointer-events: auto;
    }

    /*
      좀비 그림자 수정 위치
      - width / height: 그림자의 가로·세로 크기
      - left / bottom: 그림자 위치
      - transform: 오른쪽으로 기울어진 정도와 납작한 정도
      - opacity: 검정 투명도
      - filter blur(): 블러 강도
    */
    .zombie::before {
      content: "";
      position: absolute;
      left: 20px;
      bottom: 25px;
      width: 70px;
      height: 16px;
      background: #000;
      border-radius: 50%;
      opacity: 0.2;
      filter: blur(5px);
      transform: skewX(-28deg) scaleY(0.4);
      transform-origin: left center;
      pointer-events: none;
      z-index: 0;
    }

    .zombie.is-dead {
      cursor: default;
      pointer-events: none;
    }

    .zombie-sprite {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      background-repeat: no-repeat;
      background-size: 256px 256px;
      background-position: 0 0;
      image-rendering: auto;
      transform-origin: center center;
      will-change: transform, opacity, background-position;
    }

    .zombie-sprite-overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      width: 100%;
      height: 100%;
      background-repeat: no-repeat;
      background-size: 256px 256px;
      background-position: 0 0;
      image-rendering: auto;
      transform-origin: center center;
      will-change: transform, opacity, background-position;
      pointer-events: none;
      opacity: 0;
    }

    .deer {
      position: absolute;
      width: var(--deer-width);
      height: var(--deer-height);
      transform: translate(-50%, -50%);
      transform-origin: center center;
      will-change: left, top, opacity;
      touch-action: none;
      pointer-events: none;
    }

    .deer::before {
      content: "";
      position: absolute;
      left: 17.8333px;
      bottom: 15px;
      width: 73.3333px;
      height: 12px;
      background: #000;
      border-radius: 50%;
      opacity: 0.2;
      filter: blur(5px);
      transform: skewX(-28deg) scaleY(0.42);
      transform-origin: left center;
      pointer-events: none;
      z-index: 0;
    }

    .deer.is-dead {
      cursor: default;
    }

    .deer-sprite {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      background-repeat: no-repeat;
      background-size: 512px 512px;
      background-position: 0 0;
      image-rendering: auto;
      transform-origin: center center;
      will-change: transform, opacity, background-position;
      pointer-events: none;
    }

    .deer-sprite-overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      width: 100%;
      height: 100%;
      background-repeat: no-repeat;
      background-size: 512px 512px;
      background-position: 0 0;
      image-rendering: auto;
      transform-origin: center center;
      will-change: transform, opacity, background-position;
      pointer-events: none;

      // Safari는 기기·버전에 따라 두 번째 touchend가 아니라
      // 두 번째 touchstart 또는 dblclick 단계에서 확대를 확정할 수 있으므로
      // 세 경로를 모두 차단합니다.
      const preventZoomGesture = (event) => {
        if (event.cancelable) {
          event.preventDefault();
        }
      };

      document.addEventListener(
        "gesturestart",
        preventZoomGesture,
        { passive: false }
      );
      document.addEventListener(
        "gesturechange",
        preventZoomGesture,
        { passive: false }
      );
      document.addEventListener(
        "gestureend",
        preventZoomGesture,
        { passive: false }
      );

      // Safari가 합성하는 더블클릭 확대도 별도로 차단합니다.
      document.addEventListener(
        "dblclick",
        preventZoomGesture,
        { passive: false, capture: true }
      );

      document.addEventListener(
        "touchmove",
        (event) => {
          if (event.touches.length > 1) {
            preventZoomGesture(event);
          }
        },
        { passive: false, capture: true }
      );

      const DOUBLE_TAP_BLOCK_MS = 500;
      const DOUBLE_TAP_MAX_DISTANCE_PX = 80;
      let lastTapStartedAt = -Infinity;
      let lastTapX = 0;
      let lastTapY = 0;
      let blockCurrentTapZoom = false;

      document.addEventListener(
        "touchstart",
        (event) => {
          if (event.touches.length > 1) {
            blockCurrentTapZoom = true;
            preventZoomGesture(event);
            return;
          }

          const touch = event.changedTouches[0];
          if (!touch) return;

          const now = performance.now();
          const elapsed = now - lastTapStartedAt;
          const distance = Math.hypot(
            touch.clientX - lastTapX,
            touch.clientY - lastTapY
          );

          blockCurrentTapZoom =
            elapsed <= DOUBLE_TAP_BLOCK_MS &&
            distance <= DOUBLE_TAP_MAX_DISTANCE_PX;

          if (blockCurrentTapZoom) {
            preventZoomGesture(event);
          }

          lastTapStartedAt = now;
          lastTapX = touch.clientX;
          lastTapY = touch.clientY;
        },
        { passive: false, capture: true }
      );

      document.addEventListener(
        "touchend",
        (event) => {
          if (blockCurrentTapZoom) {
            preventZoomGesture(event);
          }

          if (event.touches.length === 0) {
            blockCurrentTapZoom = false;
          }
        },
        { passive: false, capture: true }
      );

      let zombieCount = 0;

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function normalizeStoredCount(value, maxValue) {
        const number = Number(value);
        return Number.isFinite(number)
          ? Math.round(clamp(number, 0, maxValue))
          : 0;
      }

      function normalizeZombieKillRequirement(value) {
        const number = Number(value);
        return Number.isFinite(number)
          ? Math.round(
              clamp(
                number,
                INITIAL_ZOMBIE_KILL_REQUIREMENT,
                MAX_ZOMBIE_COUNT
              )
            )
          : INITIAL_ZOMBIE_KILL_REQUIREMENT;

      function loadResourceState() {
        try {
          const saved = localStorage.getItem(RESOURCE_STORAGE_KEY);
          if (!saved) {
            updateResourceHud();
            return;
          }

          const parsed = JSON.parse(saved);
          zombieKillRequirement = normalizeZombieKillRequirement(
            parsed.zombieKillRequirement
          );
          zombieCount = Math.min(
            normalizeStoredCount(parsed.zombies, MAX_ZOMBIE_COUNT),
            zombieKillRequirement
          );
          foodCount = normalizeStoredCount(parsed.food, MAX_FOOD_COUNT);
          woodCount = normalizeStoredCount(parsed.wood, MAX_WOOD_COUNT);
          hasAxe = parsed.hasAxe === true;
          isAxeEquipped = hasAxe && parsed.isAxeEquipped !== false;
          hasMusicBox = parsed.hasMusicBox === true;
          isMusicOn = hasMusicBox && parsed.isMusicOn !== false;
          hasCompass = parsed.hasCompass === true;
          fuelCount = normalizeStoredCount(parsed.fuel, 1);
          repairKitCount = normalizeStoredCount(parsed.repairKit, 1);
          explorationDestination = typeof parsed.explorationDestination === "string"
            ? parsed.explorationDestination
            : "";
          explorationEndsAt = Number.isFinite(Number(parsed.explorationEndsAt))
            ? Math.max(0, Number(parsed.explorationEndsAt))
            : 0;
        } catch (_) {
          // file:// 환경 등에서 저장소를 사용할 수 없어도 게임은 계속 동작합니다.
        }

        // 페이지를 처음 열 때 이미 Axe를 보유하고 있었다면 튜토리얼성 첫 연출은 건너뜁니다.
        // 같은 세션에서 방금 Axe를 얻은 경우에는 첫 처치 연출이 정상적으로 재생됩니다.
        skipFirstStartSequence = hasAxe;
        firstKillBirdFlockPlayed = skipFirstStartSequence;
        firstKillDeerSpawned = skipFirstStartSequence;

        applyAxeState();
        applyInventoryState();
        updateResourceHud();
        restoreExplorationState();
      }

      function saveResourceState() {
        try {
          localStorage.setItem(
            RESOURCE_STORAGE_KEY,
            JSON.stringify({
              zombies: zombieCount,
              zombieKillRequirement,
              food: foodCount,
              wood: woodCount,
              hasAxe,
              isAxeEquipped,
              hasMusicBox,
              isMusicOn,
              hasCompass,
              fuel: fuelCount,
              repairKit: repairKitCount,
              explorationDestination,
              explorationEndsAt: isExploring ? explorationEndsAt : 0
            })
          );

          // 저장 실패는 게임 진행에 영향을 주지 않습니다.
        }

      function getRequirementValue(requirement) {
        if (requirement === "food") return foodCount;
        if (requirement === "compass") return hasCompass ? 1 : 0;
        if (requirement === "fuel") return fuelCount;
        if (requirement === "repairKit") return repairKitCount;
        return 0;
      }

      function updateExplorationRequirements() {
        for (const item of explorationRequirementItems) {
          const requirement = item.dataset.requirement || "";
          const required = Math.max(0, Number(item.dataset.required) || 0);
          const current = getRequirementValue(requirement);
          const currentElement = item.querySelector(
            ".exploration-requirement-current"
          );

          if (currentElement) {
            currentElement.textContent = String(current);
          }

          item.classList.toggle("is-complete", current >= required);
        }
      }

      function updateResourceHud() {
        countElement.textContent = String(zombieCount);
        zombieGoalElement.textContent = String(zombieKillRequirement);
        foodCountElement.textContent = String(foodCount);

        updateExplorationRequirements();

      function commitResourceState() {
        updateResourceHud();
        saveResourceState();

      function getLivingZombieCount() {
        let count = 0;

        for (const zombie of zombies.values()) {
          if (
            zombie.state !== "dying" &&
            zombie.state !== "removed"
          ) {
            count += 1;

        return count;

      function updateExploringCountdown() {
        if (!isExploring) return;

        const remainingMs = Math.max(0, explorationEndsAt - Date.now());

        if (remainingMs <= 0) {
          finishExploration();
          return;
        }

        if (remainingMs <= 60_000) {
          const remainingSeconds = Math.max(

            Math.ceil(remainingMs / 1_000)

          return;
        }

        const remainingMinutes = Math.ceil(remainingMs / 60_000);
        exploringTime.textContent = `${remainingMinutes}m`;
      }

      function animateBgmVolumes(
        targetDayVolume,
        targetNightVolume,
        durationMs,
        transitionToken
      ) {
        return new Promise((resolve) => {
          const dayStartVolume = dayBgmAudio.volume;
          const nightStartVolume = nightBgmAudio.volume;
          const startedAt = performance.now();

          if (bgmFadeFrameId !== null) {
            cancelAnimationFrame(bgmFadeFrameId);
            bgmFadeFrameId = null;
          }

          const updateFade = (now) => {
            if (transitionToken !== bgmFadeToken) {
              resolve(false);
              return;
            }

            const progress = clamp(
              (now - startedAt) / Math.max(1, durationMs),
              0,
              1
            );
            const easedProgress = 1 - Math.pow(1 - progress, 3);

            dayBgmAudio.volume = clamp(
              dayStartVolume +
                (targetDayVolume - dayStartVolume) * easedProgress,
              0,
              1
            );
            nightBgmAudio.volume = clamp(
              nightStartVolume +
                (targetNightVolume - nightStartVolume) * easedProgress,
              0,
              1
            );

            if (progress < 1) {
              bgmFadeFrameId = requestAnimationFrame(updateFade);
            } else {
              bgmFadeFrameId = null;
              resolve(true);
            }
          };

          bgmFadeFrameId = requestAnimationFrame(updateFade);
        });
      }

      function waitForBgmTransition(durationMs, transitionToken) {
        return new Promise((resolve) => {
          window.setTimeout(() => {
            resolve(transitionToken === bgmFadeToken);
          }, durationMs);
        });
      }

      async function transitionBgmForNightMode(enabled) {
        if (!isMusicOn || !bgmStarted) return;

        const transitionToken = ++bgmFadeToken;
        const incomingAudio = enabled ? nightBgmAudio : dayBgmAudio;
        const outgoingAudio = enabled ? dayBgmAudio : nightBgmAudio;

        if (bgmFadeFrameId !== null) {
          cancelAnimationFrame(bgmFadeFrameId);
          bgmFadeFrameId = null;
        }

        try {
          if (incomingAudio.paused) {
            await incomingAudio.play();
          }
        } catch (_) {
          // 새 트랙 재생이 차단되면 현재 재생 상태를 유지합니다.
          return;
        }

        // 두 트랙을 먼저 0까지 낮춰 전환 중 조용한 여백을 만듭니다.
        const fadedOut = await animateBgmVolumes(
          0,
          0,
          BGM_FADE_OUT_MS,
          transitionToken
        );
        if (!fadedOut) return;

        const holdCompleted = await waitForBgmTransition(
          BGM_QUIET_HOLD_MS,
          transitionToken
        );
        if (!holdCompleted) return;

        const fadedIn = await animateBgmVolumes(
          enabled ? 0 : 1,
          enabled ? 1 : 0,
          BGM_FADE_IN_MS,
          transitionToken
        );
        if (!fadedIn) return;

        outgoingAudio.pause();
      }

      function getCloudShadowBaseOpacity(now = performance.now()) {
        const elapsed = now - cloudShadowOpacityTransitionStartedAt;

        if (elapsed >= CLOUD_SHADOW_NIGHT_TRANSITION_MS) {
          cloudShadowBaseOpacity = cloudShadowOpacityTarget;
          return cloudShadowBaseOpacity;
        }

        const progress = clamp(
          elapsed / CLOUD_SHADOW_NIGHT_TRANSITION_MS,
          0,
          1
        );
        const easedProgress = 1 - Math.pow(1 - progress, 3);

        cloudShadowBaseOpacity =
          cloudShadowOpacityStart +
          (cloudShadowOpacityTarget - cloudShadowOpacityStart) *
            easedProgress;

        return cloudShadowBaseOpacity;
      }

      function transitionCloudShadowOpacity(enabled) {
        const now = performance.now();
        cloudShadowOpacityStart = getCloudShadowBaseOpacity(now);
        cloudShadowOpacityTarget = enabled
          ? CLOUD_SHADOW_NIGHT_OPACITY
          : CLOUD_SHADOW_DAY_OPACITY;
        cloudShadowOpacityTransitionStartedAt = now;
      }

      function setNightMode(enabled) {
        document.body.classList.toggle("is-night", enabled);
        transitionCloudShadowOpacity(enabled);
        transitionBgmForNightMode(enabled);
      }

      function startExploration(destination) {
        closeExplorationMenu();
        closeInventory();

        if (explorationCompleteToastTimerId !== null) {
          clearTimeout(explorationCompleteToastTimerId);
          explorationCompleteToastTimerId = null;
        }

        if (returnZombieSpawnTimerId !== null) {
          clearTimeout(returnZombieSpawnTimerId);
          returnZombieSpawnTimerId = null;
        }

        const requiredFood = getDestinationFoodRequirement(destination);
        foodCount = Math.max(0, foodCount - requiredFood);
        zombieCount = 0;
        isExploring = true;
        explorationDestination = destination;
        explorationEndsAt = Date.now() + EXPLORATION_DURATION_MS;
        commitResourceState();
        setNightMode(true);
        exploringStatus.classList.add("is-visible");
        updateExploringCountdown();

        if (explorationTimerId !== null) {
          clearInterval(explorationTimerId);
        }

        explorationTimerId = window.setInterval(
          updateExploringCountdown,
          1_000
        );
      }

      function restoreExplorationState() {
        if (explorationEndsAt <= Date.now()) {
          if (explorationEndsAt > 0) {
            // 페이지가 닫혀 있는 동안 탐험이 끝난 경우에도 귀환 1회로 처리합니다.
            isExploring = true;
            finishExploration();
            return;
          }

          isExploring = false;
          explorationDestination = "";
          explorationEndsAt = 0;
          setNightMode(false);
          saveResourceState();
          return;
        }

        isExploring = true;
        setNightMode(true);
        exploringStatus.classList.add("is-visible");
        updateExploringCountdown();

        if (explorationTimerId !== null) {
          clearInterval(explorationTimerId);
        }

        explorationTimerId = window.setInterval(
          updateExploringCountdown,
          1_000
        );
      }

      function finishExploration() {
        if (!isExploring) return;

        isExploring = false;
        explorationDestination = "";
        explorationEndsAt = 0;
        zombieKillRequirement = Math.min(
          MAX_ZOMBIE_COUNT,
          zombieKillRequirement + 1
        );
        commitResourceState();
        setNightMode(false);
        exploringStatus.classList.remove("is-visible");

        if (explorationTimerId !== null) {
          clearInterval(explorationTimerId);
          explorationTimerId = null;
        }

        // 귀환 메시지는 화면이 낮으로 돌아오기 시작한 뒤 2초 후 표시합니다.
        if (explorationCompleteToastTimerId !== null) {
          clearTimeout(explorationCompleteToastTimerId);
        }

        explorationCompleteToastTimerId = window.setTimeout(() => {
          explorationCompleteToastTimerId = null;
          showToast(EXPLORATION_COMPLETE_TOAST_MESSAGE);
        }, 2_000);

        // 정기 생성 타이머도 귀환 후 7초 동안 좀비를 생성하지 못하게 합니다.
        zombieSpawnBlockedUntil = Date.now() + 7_000;

        if (returnZombieSpawnTimerId !== null) {
          clearTimeout(returnZombieSpawnTimerId);
        }

        returnZombieSpawnTimerId = window.setTimeout(() => {
          returnZombieSpawnTimerId = null;

          if (canCreateZombie()) {
            createZombie();
          }
        }, 7_000);
      }

      function hasDestinationItems(destination) {
        if (destination === "forest") {
          return hasCompass;
        }

        if (destination === "city") {
          return fuelCount >= 1 && repairKitCount >= 1;
        }

        return true;
      }

      function getDestinationFoodRequirement(destination) {
        if (destination === "village") return 1;
        if (destination === "forest") return 3;
        if (destination === "city") return 5;
        return 0;
      }

      function handleExplorationDestination(destination) {
        if (!hasDestinationItems(destination)) {
          if (destination === "forest") {
            showToast(FOREST_BLOCKED_TOAST_MESSAGE);
          } else if (destination === "city") {
            showToast(CITY_BLOCKED_TOAST_MESSAGE);
          }
          return;
        }

        const requiredFood = getDestinationFoodRequirement(destination);
        if (foodCount < requiredFood) {
          showToast(NO_FOOD_TOAST_MESSAGE);
          return;
        }

        startExploration(destination);
      }

      function resetAllSavedStateForTest(event) {
        if (!TEST_MODE) return;

        if (event) {
          event.preventDefault();
          event.stopPropagation();
        }

        try {
          // 이 게임에서 저장하는 모든 진행 상태를 제거합니다.
          localStorage.removeItem(RESOURCE_STORAGE_KEY);
        } catch (_) {
          // 저장소 접근이 막힌 환경에서도 새로고침은 계속 진행합니다.
        }

        // 실행 중인 개체·타이머·첫 연출 플래그까지 모두 처음 상태로 만들기 위해
        // 저장 데이터를 지운 뒤 페이지를 새로 불러옵니다.
        location.reload();
      }

      function shortenExplorationForTest(event) {
        if (!TEST_MODE || !isExploring) return;

        event.preventDefault();
        event.stopPropagation();
        explorationEndsAt = Date.now() + 3_000;
        updateExploringCountdown();
      }

      function easeOutSine(progress) {
        return Math.sin((clamp(progress, 0, 1) * Math.PI) / 2);
      }

      function preloadImage(path) {
        return new Promise((resolve) => {
          const image = new Image();
          PRELOADED_ZOMBIE_IMAGES.set(path, image);

          const finish = () => resolve();

          image.addEventListener(
            "load",
            async () => {
              try {
                if (typeof image.decode === "function") {
                  await image.decode();
                }
              } catch (_) {
                // decode 실패 시에도 이미 로드된 이미지는 그대로 사용합니다.
              }

              finish();
            },
            { once: true }
          );

          image.addEventListener("error", finish, { once: true });
          image.src = path;
        });
      }

      function preloadGameSprites() {
        return Promise.all([
          preloadImage(WALK_SHEET),
          preloadImage(DEAD_SHEET),
          preloadImage(BIRTH_DEATH_SHEET),
          preloadImage(DEER_SHEET),
          preloadImage(STUMP_WITH_AXE_IMAGE),
          preloadImage(STUMP_EMPTY_IMAGE),
          preloadImage(NIGHT_BACKGROUND_IMAGE),
          preloadImage(NIGHT_CLOUD_SHEET),
          preloadImage(NIGHT_STUMP_IMAGE)
        ]);
      }

      function applyWorldTransform() {
        world.style.left = `calc(50% + ${panX}px)`;
        world.style.top = `calc(50% + ${panY}px)`;
        world.style.transform =
          `translate(-50%, -50%) scale(${worldScale})`;
      }

      function updatePanBounds() {
        const viewportWidth = window.innerWidth;
        const viewportHeight = window.innerHeight;
        const renderedWorldSize = WORLD_SIZE * worldScale;

        /*
          브라우저 내부 크기는 정사각형 창에서도 주소창·테두리 등의 영향으로
          몇 px 차이가 날 수 있으므로, 긴 쪽 대비 1% 이내의 차이는 1:1로 봅니다.
        */
        const aspectDifference =
          Math.abs(viewportWidth - viewportHeight);
        const squareTolerance =
          Math.max(viewportWidth, viewportHeight) * 0.01;
        const isSquare =
          aspectDifference <= squareTolerance;
        const isWide =
          !isSquare && viewportWidth > viewportHeight;
        const isTall =
          !isSquare && viewportHeight > viewportWidth;

        /*
          화면 비율에 따라 실제로 잘린 방향만 드래그합니다.

          - 가로형 화면: 세로 방향만 드래그
          - 세로형 화면: 가로 방향만 드래그
          - 1:1에 가까운 화면: 드래그하지 않음

          배경 끝이 화면 끝에 닿는 지점까지만 이동합니다.
        */
        maxPanX = 0;
        maxPanY = 0;

        if (isWide) {
          /*
            가로형 화면에서는 가로 길이와 같은 정사각형 영역까지만
            위아래로 이동합니다.
            예: 1600×900 화면 → 세로 이동 범위는 ±350px
          */
          maxPanY = Math.max(
            0,
            (viewportWidth - viewportHeight) / 2
          );
        } else if (isTall) {
          /*
            세로형 화면에서는 세로 길이와 같은 정사각형 영역까지만
            좌우로 이동합니다.
            예: 900×1600 화면 → 가로 이동 범위는 ±350px
          */
          maxPanX = Math.max(
            0,
            (viewportHeight - viewportWidth) / 2
          );
        }

        panX = maxPanX > 0
          ? clamp(panX, -maxPanX, maxPanX)
          : 0;

        panY = maxPanY > 0
          ? clamp(panY, -maxPanY, maxPanY)
          : 0;

        viewport.classList.toggle(
          "can-pan",
          maxPanX > 0 || maxPanY > 0
        );
      }

      function updateWorldScale() {
        const viewportWidth = window.innerWidth;
        const viewportHeight = window.innerHeight;

        const baseWidth = clamp(viewportWidth, 1024, 2048);
        const baseHeight = clamp(viewportHeight, 1024, 2048);

        // 1024 미만과 2048 초과에서는 긴 쪽을 fit하고 반대쪽을 crop합니다.
        worldScale = Math.max(
          viewportWidth / baseWidth,
          viewportHeight / baseHeight
        );

        updatePanBounds();
        applyWorldTransform();
      }

      function startBackgroundDrag(event) {
        if (event.button !== undefined && event.button !== 0) return;

        if (
          event.target instanceof Element &&
          event.target.closest(".zombie, .deer-hitbox, .world-interactive")
        ) {
          return;
        }

        if (maxPanX <= 0 && maxPanY <= 0) return;

        event.preventDefault();
        dragState.active = true;
        dragState.moved = false;
        dragState.pointerId = event.pointerId;
        dragState.startX = event.clientX;
        dragState.startY = event.clientY;
        dragState.startPanX = panX;
        dragState.startPanY = panY;

        viewport.setPointerCapture(event.pointerId);
      }

      function moveBackgroundDrag(event) {
        if (
          !dragState.active ||
          event.pointerId !== dragState.pointerId
        ) {
          return;
        }

        const deltaX = event.clientX - dragState.startX;
        const deltaY = event.clientY - dragState.startY;

        if (!dragState.moved && Math.hypot(deltaX, deltaY) >= 4) {
          dragState.moved = true;
          viewport.classList.add("is-panning");
        }

        if (!dragState.moved) return;

        panX = clamp(
          dragState.startPanX + deltaX,
          -maxPanX,
          maxPanX
        );

        panY = clamp(
          dragState.startPanY + deltaY,
          -maxPanY,
          maxPanY
        );

        applyWorldTransform();
        event.preventDefault();
      }

      function endBackgroundDrag(event) {
        if (
          !dragState.active ||
          event.pointerId !== dragState.pointerId
        ) {
          return;
        }

        if (viewport.hasPointerCapture(event.pointerId)) {
          viewport.releasePointerCapture(event.pointerId);
        }

        dragState.active = false;
        dragState.pointerId = null;
        viewport.classList.remove("is-panning");
      }

      function framePosition(frameIndex) {
        const col = frameIndex % 4;
        const row = Math.floor(frameIndex / 4);
        return `${-col * ZOMBIE_WIDTH}px ${-row * ZOMBIE_HEIGHT}px`;
      }

      function deerFramePosition(frameIndex) {
        const normalizedIndex = Math.max(0, frameIndex);
        const col = normalizedIndex % DEER_SHEET_COLUMNS;
        const row = Math.floor(normalizedIndex / DEER_SHEET_COLUMNS);
        return `${-col * DEER_FRAME_SIZE}px ${-row * DEER_FRAME_SIZE}px`;
      }

      function getRandomDeerIdleDelay() {
        return randomBetween(
          DEER_IDLE_MIN_DELAY_MS,
          DEER_IDLE_MAX_DELAY_MS
        );
      }

      function randomBetween(min, max) {
        return min + Math.random() * (max - min);
      }

      function randomCloudCount(minCount, maxCount) {
        return Math.floor(
          randomBetween(minCount, maxCount + 1)
        );
      }

      function getVisibleWorldBounds() {
        const screenCenterX = window.innerWidth / 2 + panX;
        const screenCenterY = window.innerHeight / 2 + panY;
        const worldCenter = WORLD_SIZE / 2;

        return {
          left: worldCenter + (0 - screenCenterX) / worldScale,
          top: worldCenter + (0 - screenCenterY) / worldScale,
          right:
            worldCenter +
            (window.innerWidth - screenCenterX) / worldScale,
          bottom:
            worldCenter +
            (window.innerHeight - screenCenterY) / worldScale
        };
      }

      function getCloudHalfSize(scale) {
        return (CLOUD_FRAME_SIZE * scale) / 2;
      }

      function getCloudBounds(x, y, scale, padding = 0) {
        const halfSize = getCloudHalfSize(scale) + padding;

        return {
          left: x - halfSize,
          top: y - halfSize,
          right: x + halfSize,
          bottom: y + halfSize
        };
      }

      function doCloudBoundsOverlap(a, b) {
        return !(
          a.right <= b.left ||
          a.left >= b.right ||
          a.bottom <= b.top ||
          a.top >= b.bottom
        );
      }

      function overlapsCloudGroup(x, y, scale, group) {
        const candidateBounds = getCloudBounds(
          x,
          y,
          scale,
          CLOUD_OVERLAP_PADDING
        );

        return group.some((otherCloud) => {
          const otherBounds = getCloudBounds(
            otherCloud.x,
            otherCloud.y,
            otherCloud.scale,
            CLOUD_OVERLAP_PADDING
          );

          return doCloudBoundsOverlap(candidateBounds, otherBounds);
        });
      }

      function lineIntersectsRectOnCloudPath(lineSum, rect) {
        const minLineSum = rect.left + rect.top;
        const maxLineSum = rect.right + rect.bottom;

        return lineSum >= minLineSum && lineSum <= maxLineSum;
      }

      function wouldCloudPathIntrudeSafeZone(
        x,
        y,
        scale,
        intrusionRatio
      ) {
        const halfSize = getCloudHalfSize(scale);
        const clampedIntrusionRatio = clamp(
          intrusionRatio,
          0,
          1
        );
        // 1 이상이면 safe zone 경로 제한을 사용하지 않습니다.
        if (clampedIntrusionRatio >= 1) {
          return false;
        }

        const protectedMargin =
          halfSize * (1 - clampedIntrusionRatio);

        const protectedZone = {
          left: SAFE_ZONE.left - protectedMargin,
          top: SAFE_ZONE.top - protectedMargin,
          right: SAFE_ZONE.right + protectedMargin,
          bottom: SAFE_ZONE.bottom + protectedMargin
        };

        // 구름과 그림자는 x + y 값이 일정한 대각선 경로로 이동합니다.
        // 이 경로가 보호 구역을 지나면 해당 생성 위치를 사용하지 않습니다.
        return lineIntersectsRectOnCloudPath(x + y, protectedZone);
      }

      function getRandomCloudPosition(kind, scale, group, initialInside) {
        const visibleBounds = getVisibleWorldBounds();
        const halfSize = getCloudHalfSize(scale);
        const centerX = (visibleBounds.left + visibleBounds.right) / 2;
        const centerY = (visibleBounds.top + visibleBounds.bottom) / 2;
        const isShadow = kind === "shadow";

        for (let attempt = 0; attempt < 120; attempt += 1) {
          let x;
          let y;

          if (initialInside) {
            const minX = visibleBounds.left + halfSize * 0.55;
            const maxX = visibleBounds.right - halfSize * 0.55;
            const minY = visibleBounds.top + halfSize * 0.55;
            const maxY = visibleBounds.bottom - halfSize * 0.55;

            x = minX <= maxX
              ? randomBetween(minX, maxX)
              : centerX;
            y = minY <= maxY
              ? randomBetween(minY, maxY)
              : centerY;
          } else if (Math.random() < 0.5) {
            // 화면 왼쪽의 아래쪽 구간에서 들어옵니다.
            x = visibleBounds.left - halfSize * 0.82;
            y = randomBetween(
              centerY,
              visibleBounds.bottom + halfSize * 0.15
            );
          } else {
            // 화면 아래쪽의 왼쪽 구간에서 들어옵니다.
            x = randomBetween(
              visibleBounds.left - halfSize * 0.15,
              centerX
            );
            y = visibleBounds.bottom + halfSize * 0.82;
          }

          if (overlapsCloudGroup(x, y, scale, group)) {
            continue;
          }

          const safeZoneIntrusionRatio = isShadow
            ? CLOUD_SHADOW_SAFE_ZONE_INTRUSION_RATIO
            : CLOUD_SAFE_ZONE_INTRUSION_RATIO;

          if (
            wouldCloudPathIntrudeSafeZone(
              x,
              y,
              scale,
              safeZoneIntrusionRatio
            )
          ) {
            continue;
          }

          return { x, y };
        }

        return null;
      }

      function applyCloudVariant(element, variant, isShadow) {
        const col = variant % CLOUD_SHEET_COLUMNS;
        const row = Math.floor(variant / CLOUD_SHEET_COLUMNS);
        const position =
          `${-col * CLOUD_FRAME_SIZE}px ` +
          `${-row * CLOUD_FRAME_SIZE}px`;

        // 낮/밤 구름 레이어가 동일한 스프라이트 위치를 사용합니다.
        element.style.setProperty("--cloud-position", position);
      }

      function renderCloud(cloud) {
        let renderX = cloud.x;
        let renderY = cloud.y;

        if (cloud.kind === "sky") {
          renderX += (-panX / worldScale) * CLOUD_DRAG_PARALLAX_FACTOR;
          renderY += (-panY / worldScale) * CLOUD_DRAG_PARALLAX_FACTOR;
        }

        cloud.element.style.left = `${renderX}px`;
        cloud.element.style.top = `${renderY}px`;
        cloud.element.style.transform =
          `translate(-50%, -50%) scale(${cloud.scale})`;
      }

      function applyCloudOpacity(cloud, opacityFactor) {
        cloud.opacityFactor = clamp(opacityFactor, 0, 1);
        cloud.element.style.opacity = String(
          cloud.baseOpacity * cloud.opacityFactor
        );
      }

      function updateCloudOpacity(cloud, now) {
        if (cloud.isFadingOut) {
          const fadeProgress = clamp(
            (now - cloud.fadeOutStartedAt) /
              CLOUD_FADE_DURATION_MS,
            0,
            1
          );

          applyCloudOpacity(
            cloud,
            cloud.fadeOutStartOpacity * (1 - fadeProgress)
          );
          return;
        }

        const fadeInProgress = clamp(
          (now - cloud.createdAt) / CLOUD_FADE_DURATION_MS,
          0,
          1
        );

        applyCloudOpacity(cloud, fadeInProgress);
      }

      function startCloudFadeOut(cloud, now) {
        if (cloud.isFadingOut) return;

        updateCloudOpacity(cloud, now);
        cloud.isFadingOut = true;
        cloud.fadeOutStartedAt = now;
        cloud.fadeOutStartOpacity = cloud.opacityFactor;
      }

      function getCloudTimeUntilOutside(
        cloud,
        visibleBounds,
        worldSpeed
      ) {
        const halfSize = getCloudHalfSize(cloud.scale);
        const velocityX = CLOUD_DIRECTION.x * worldSpeed;
        const velocityY = CLOUD_DIRECTION.y * worldSpeed;
        const exitCenterX =
          visibleBounds.right + CLOUD_EXIT_MARGIN + halfSize;
        const exitCenterY =
          visibleBounds.top - CLOUD_EXIT_MARGIN - halfSize;

        const timeUntilRightExit = velocityX > 0
          ? (exitCenterX - cloud.x) / velocityX
          : Infinity;
        const timeUntilTopExit = velocityY < 0
          ? (cloud.y - exitCenterY) / -velocityY
          : Infinity;

        return Math.min(
          timeUntilRightExit,
          timeUntilTopExit
        );
      }

      function createCloud(kind, initialInside = false) {
        const isShadow = kind === "shadow";
        const group = isShadow ? shadowClouds : skyClouds;
        const layer = isShadow ? cloudShadowsLayer : cloudsLayer;
        const scale = isShadow
          ? randomBetween(
              CLOUD_SHADOW_MIN_SCALE,
              CLOUD_SHADOW_MAX_SCALE
            )
          : randomBetween(
              CLOUD_MIN_SCALE,
              CLOUD_MAX_SCALE
            );
        const position = getRandomCloudPosition(
          kind,
          scale,
          group,
          initialInside
        );

        if (!position) return false;

        const variant = Math.floor(
          Math.random() * CLOUD_VARIANT_COUNT
        );
        const element = document.createElement("div");
        element.className = isShadow
          ? "cloud-visual cloud-shadow"
          : "cloud-visual cloud-sprite";

        applyCloudVariant(element, variant, isShadow);
        layer.appendChild(element);

        const now = performance.now();
        const initialOpacityFactor = initialInside ? 1 : 0;

        const cloud = {
          id: nextCloudId++,
          kind,
          element,
          x: position.x,
          y: position.y,
          scale,
          variant,
          baseOpacity: isShadow
            ? getCloudShadowBaseOpacity(now)
            : 1,
          opacityFactor: initialOpacityFactor,
          /*
            페이지 최초 로드 시 화면 안에 배치되는 구름과 그림자는
            즉시 보이도록 페이드인 완료 상태로 시작합니다.
            이후 새로 생성되는 구름만 1초 페이드인을 사용합니다.
          */
          createdAt: initialInside
            ? now - CLOUD_FADE_DURATION_MS
            : now,
          isFadingOut: false,
          fadeOutStartedAt: 0,
          fadeOutStartOpacity: 1
        };

        group.push(cloud);
        renderCloud(cloud);
        applyCloudOpacity(cloud, initialOpacityFactor);
        return true;
      }

      function removeCloud(cloud, group) {
        cloud.element.remove();
        const index = group.indexOf(cloud);

        if (index >= 0) {
          group.splice(index, 1);
        }
      }

      function isCloudOutsideVisibleArea(cloud, visibleBounds) {
        const halfSize = getCloudHalfSize(cloud.scale);

        return (
          cloud.x - halfSize > visibleBounds.right + CLOUD_EXIT_MARGIN ||
          cloud.y + halfSize < visibleBounds.top - CLOUD_EXIT_MARGIN
        );
      }

      function updateCloudGroup(kind, deltaMs, now) {
        const isShadow = kind === "shadow";
        const group = isShadow ? shadowClouds : skyClouds;
        const visibleBounds = getVisibleWorldBounds();
        const currentShadowOpacity = isShadow
          ? getCloudShadowBaseOpacity(now)
          : 1;

        // 화면에서 보이는 속도가 확대 배율과 관계없이 같도록 보정합니다.
        const worldSpeed =
          CLOUD_SPEED_SCREEN_PX_PER_MS / worldScale;

        for (const cloud of [...group]) {
          if (isShadow) {
            cloud.baseOpacity = currentShadowOpacity;
          }

          cloud.x += CLOUD_DIRECTION.x * worldSpeed * deltaMs;
          cloud.y += CLOUD_DIRECTION.y * worldSpeed * deltaMs;
          renderCloud(cloud);

          if (!cloud.isFadingOut) {
            const timeUntilOutside = getCloudTimeUntilOutside(
              cloud,
              visibleBounds,
              worldSpeed
            );

            /*
              완전히 화면 밖으로 나가기 약 1초 전부터 페이드아웃합니다.
              화면 이동으로 이미 경계를 넘은 경우에도 즉시 제거하지 않고
              같은 1초 페이드아웃을 적용합니다.
            */
            if (
              timeUntilOutside <= CLOUD_FADE_DURATION_MS ||
              isCloudOutsideVisibleArea(cloud, visibleBounds)
            ) {
              startCloudFadeOut(cloud, now);
            }
          }

          updateCloudOpacity(cloud, now);

          if (
            cloud.isFadingOut &&
            now - cloud.fadeOutStartedAt >= CLOUD_FADE_DURATION_MS
          ) {
            removeCloud(cloud, group);
          }
        }

        if (
          group.length < cloudTargetCounts[kind] &&
          now >= nextCloudSpawnAt[kind]
        ) {
          const created = createCloud(kind, false);
          nextCloudSpawnAt[kind] = now + (created ? 1_500 : 2_500);
        }
      }

      function initializeClouds() {
        cloudTargetCounts.sky = randomCloudCount(
          CLOUD_MIN_COUNT,
          CLOUD_MAX_COUNT
        );
        cloudTargetCounts.shadow = randomCloudCount(
          CLOUD_SHADOW_MIN_COUNT,
          CLOUD_SHADOW_MAX_COUNT
        );

        for (
          let index = 0;
          index < cloudTargetCounts.sky;
          index += 1
        ) {
          createCloud("sky", true);
        }

        for (
          let index = 0;
          index < cloudTargetCounts.shadow;
          index += 1
        ) {
          createCloud("shadow", true);
        }
      }

      function setBirdFrame(bird, frameIndex) {
        const normalizedFrame =
          frameIndex % BIRD_FRAME_COUNT;
        const col =
          normalizedFrame % BIRD_SHEET_COLUMNS;
        const row = Math.floor(
          normalizedFrame / BIRD_SHEET_COLUMNS
        );
        const position = `${col * 50}% ${row * 50}%`;

        // 3×3 스프라이트 시트는 각 축의 0% / 50% / 100% 위치를 사용합니다.
        bird.element.style.webkitMaskPosition = position;
        bird.element.style.maskPosition = position;
      }

      function createBirdFlock(count, isFirstKillFlock = false) {
        const visibleBounds = getVisibleWorldBounds();
        const visibleWidth = visibleBounds.right - visibleBounds.left;
        const visibleHeight = visibleBounds.bottom - visibleBounds.top;
        const margin = Math.max(
          220 / worldScale,
          Math.min(visibleWidth, visibleHeight) * 0.12
        );

        // 모든 새는 현재 화면 기준의 좌하단 바깥에서 우상단 바깥으로 이동합니다.
        // birds 레이어가 world 내부에 있으므로, 드래그 시 배경과 함께 자연스럽게 이동합니다.
        const verticalMargin =
          margin * BIRD_PATH_VERTICAL_MARGIN_FACTOR;

        // 간헐적 출현 무리는 전체 경로를 위아래로 조금씩 옮겨서
        // 같은 높이에서만 지나가지 않도록 합니다.
        const flockVerticalShift = isFirstKillFlock
          ? 0
          : randomBetween(
              -AMBIENT_BIRD_FLOCK_VERTICAL_SHIFT_PX,
              AMBIENT_BIRD_FLOCK_VERTICAL_SHIFT_PX
            );

        const baseStart = {
          x: visibleBounds.left - margin,
          y: visibleBounds.bottom + verticalMargin + flockVerticalShift
        };
        const baseEnd = {
          x: visibleBounds.right + margin,
          y: visibleBounds.top - verticalMargin + flockVerticalShift
        };
        const pathX = baseEnd.x - baseStart.x;
        const pathY = baseEnd.y - baseStart.y;
        const pathLength = Math.hypot(pathX, pathY);
        const direction = {
          x: pathX / pathLength,
          y: pathY / pathLength
        };
        const perpendicular = {
          x: -direction.y,
          y: direction.x
        };
        const speed = isFirstKillFlock
          ? FIRST_KILL_BIRD_SPEED_SCREEN_PX_PER_MS
          : AMBIENT_BIRD_SPEED_SCREEN_PX_PER_MS;
        const baseDuration = pathLength / speed;
        const now = performance.now();

        const flockSlots = [];

        for (let index = 0; index < count; index += 1) {
          const element = document.createElement("div");
          element.className = "bird";
          birdsLayer.appendChild(element);

          // 진행 방향 앞뒤 간격과 대각선에 수직인 간격을 섞어 자연스러운 무리를 만듭니다.
          // 이미 뽑힌 새들과 너무 가까운 경로는 다시 뽑아 겹침을 줄입니다.
          let trailOffset = 0;
          let lateralOffset = 0;
          let slotAccepted = false;

          for (let attempt = 0; attempt < 40; attempt += 1) {
            const candidateTrailOffset = randomBetween(-80, 130);
            const candidateLateralOffset = randomBetween(-72, 72);

            const overlapsExistingSlot = flockSlots.some((slot) => {
              const trailGap = Math.abs(
                candidateTrailOffset - slot.trailOffset
              );
              const lateralGap = Math.abs(
                candidateLateralOffset - slot.lateralOffset
              );
              const pathDistance = Math.hypot(trailGap, lateralGap);

              return (
                pathDistance < BIRD_MIN_PATH_DISTANCE_PX ||
                (trailGap < BIRD_MIN_TRAIL_GAP_PX &&
                  lateralGap < BIRD_MIN_LATERAL_GAP_PX)
              );
            });

            if (overlapsExistingSlot) {
              continue;
            }

            trailOffset = candidateTrailOffset;
            lateralOffset = candidateLateralOffset;
            slotAccepted = true;
            break;
          }

          if (!slotAccepted) {
            trailOffset = randomBetween(-80, 130);
            lateralOffset = randomBetween(-72, 72);
          }

          flockSlots.push({
            trailOffset,
            lateralOffset
          });

          const startX =
            baseStart.x +
            direction.x * trailOffset +
            perpendicular.x * lateralOffset;
          const startY =
            baseStart.y +
            direction.y * trailOffset +
            perpendicular.y * lateralOffset;
          const endX =
            baseEnd.x +
            direction.x * trailOffset +
            perpendicular.x * lateralOffset;
          const endY =
            baseEnd.y +
            direction.y * trailOffset +
            perpendicular.y * lateralOffset;
          const scale = randomBetween(
            BIRD_MIN_SCALE,
            BIRD_MAX_SCALE
          );
          const delay = randomBetween(0, isFirstKillFlock ? 240 : 180);
          const duration = baseDuration * randomBetween(0.92, 1.08);
          const frameOffset = Math.floor(
            Math.random() * BIRD_FRAME_COUNT
          );

          const bird = {
            element,
            startX,
            startY,
            endX,
            endY,
            scale,
            startedAt: now + delay,
            duration,
            frameOffset,
            fps: isFirstKillFlock ? FIRST_KILL_BIRD_FPS : BIRD_FPS
          };

          birds.push(bird);
          element.style.left = `${startX}px`;
          element.style.top = `${startY}px`;
          element.style.opacity = "0";
          element.style.transform =
            `translate(-50%, -50%) scale(${scale})`;
          setBirdFrame(bird, frameOffset);
        }
      }

      function updateBirds(now) {
        for (let index = birds.length - 1; index >= 0; index -= 1) {
          const bird = birds[index];
          const elapsed = now - bird.startedAt;

          if (elapsed < 0) {
            continue;
          }

          const progress = clamp(elapsed / bird.duration, 0, 1);
          const x = bird.startX + (bird.endX - bird.startX) * progress;
          const y = bird.startY + (bird.endY - bird.startY) * progress;
          const frameDuration = 1000 / bird.fps;
          const frameIndex =
            bird.frameOffset + Math.floor(elapsed / frameDuration);

          bird.element.style.left = `${x}px`;
          bird.element.style.top = `${y}px`;
          bird.element.style.opacity = "1";
          setBirdFrame(bird, frameIndex);

          if (progress >= 1) {
            bird.element.remove();
            birds.splice(index, 1);
          }
        }
      }

      function scheduleNextAmbientBirdFlock() {
        if (ambientBirdTimer !== null) {
          clearTimeout(ambientBirdTimer);
        }

        const delay = randomBetween(
          AMBIENT_BIRD_MIN_INTERVAL_MS,
          AMBIENT_BIRD_MAX_INTERVAL_MS
        );

        ambientBirdTimer = window.setTimeout(() => {
          const count = Math.floor(
            randomBetween(
              AMBIENT_BIRD_MIN_COUNT,
              AMBIENT_BIRD_MAX_COUNT + 1
            )
          );

          createBirdFlock(count, false);
          scheduleNextAmbientBirdFlock();
        }, delay);
      }

      function triggerFirstKillBirdFlock() {
        if (firstKillBirdFlockPlayed) return;

        firstKillBirdFlockPlayed = true;
        createBirdFlock(FIRST_KILL_BIRD_COUNT, true);
        playBirdFlySound();
        scheduleNextAmbientBirdFlock();
      }

      function randomDirection() {
        const angle = Math.random() * Math.PI * 2;
        return {
          x: Math.cos(angle),
          y: Math.sin(angle)
        };
      }

      function randomDeathStartFrame() {
        return Math.random() < 0.5 ? 0 : 4;
      }

      function isInsideInflatedSafeZoneFor(x, y, halfWidth, halfHeight) {
        return (
          x > SAFE_ZONE.left - halfWidth &&
          x < SAFE_ZONE.right + halfWidth &&
          y > SAFE_ZONE.top - halfHeight &&
          y < SAFE_ZONE.bottom + halfHeight
        );
      }

      function isInsideInflatedSafeZone(x, y) {
        return isInsideInflatedSafeZoneFor(x, y, HALF_W, HALF_H);
      }

      function getRandomSpawnPosition() {
        const minX = GAME_ZONE.left + HALF_W;
        const maxX = GAME_ZONE.right - HALF_W;
        const minY = GAME_ZONE.top + HALF_H;
        const maxY = GAME_ZONE.bottom - HALF_H;

        let bestCandidate = null;
        let bestMinimumDistance = -1;

        for (let attempt = 0; attempt < 500; attempt += 1) {
          const x = minX + Math.random() * (maxX - minX);
          const y = minY + Math.random() * (maxY - minY);

          if (isInsideInflatedSafeZone(x, y)) {
            continue;
          }

          let minimumDistance = Infinity;

          for (const otherZombie of zombies.values()) {
            if (otherZombie.state === "removed") continue;

            const distance = Math.hypot(
              x - otherZombie.x,
              y - otherZombie.y
            );

            minimumDistance = Math.min(minimumDistance, distance);
          }

          // 다른 좀비가 없거나 충분히 멀리 떨어진 위치면 바로 사용합니다.
          if (minimumDistance >= MIN_SPAWN_DISTANCE) {
            return { x, y };
          }

          // 충분한 위치를 못 찾을 경우를 대비해 가장 멀었던 후보를 기억합니다.
          if (minimumDistance > bestMinimumDistance) {
            bestMinimumDistance = minimumDistance;
            bestCandidate = { x, y };
          }
        }

        if (bestCandidate) {
          return bestCandidate;
        }

        // 극히 드문 예외 상황의 안전한 기본 위치
        return {
          x: GAME_ZONE.left + HALF_W + 8,
          y: GAME_ZONE.top + HALF_H + 8
        };
      }

      function getRandomDeerSpawnPosition(options = {}) {
        const minX = GAME_ZONE.left + DEER_HALF_W;
        const maxX = GAME_ZONE.right - DEER_HALF_W;
        const minY = GAME_ZONE.top + DEER_HALF_H;
        const maxY = GAME_ZONE.bottom - DEER_HALF_H;
        const avoidX = Number.isFinite(options.avoidX)
          ? options.avoidX
          : null;
        const avoidY = Number.isFinite(options.avoidY)
          ? options.avoidY
          : null;
        const minAvoidDistance = Number.isFinite(options.minAvoidDistance)
          ? options.minAvoidDistance
          : 0;

        let bestCandidate = null;
        let bestMinimumDistance = -1;
        let bestAvoidDistance = -1;

        for (let attempt = 0; attempt < 500; attempt += 1) {
          const x = minX + Math.random() * (maxX - minX);
          const y = minY + Math.random() * (maxY - minY);

          if (isInsideInflatedSafeZoneFor(x, y, DEER_HALF_W, DEER_HALF_H)) {
            continue;
          }

          // 사슴은 좌우로 도망가므로, 수평 이동 경로가 중앙 안전 구역을
          // 가로지르지 않도록 안전 구역과 같은 세로 높이에는 생성하지 않습니다.
          const safePathTop = SAFE_ZONE.top - DEER_HALF_H;
          const safePathBottom = SAFE_ZONE.bottom + DEER_HALF_H;

          if (y > safePathTop && y < safePathBottom) {
            continue;
          }

          let minimumDistance = Infinity;

          for (const otherZombie of zombies.values()) {
            if (otherZombie.state === "removed") continue;

            const distance = Math.hypot(
              x - otherZombie.x,
              y - otherZombie.y
            );

            minimumDistance = Math.min(minimumDistance, distance);
          }

          for (const otherDeer of deerMap.values()) {
            if (otherDeer.state === "removed") continue;

            const distance = Math.hypot(
              x - otherDeer.x,
              y - otherDeer.y
            );

            minimumDistance = Math.min(minimumDistance, distance);
          }

          const avoidDistance =
            avoidX !== null && avoidY !== null
              ? Math.hypot(x - avoidX, y - avoidY)
              : Infinity;

          if (
            minimumDistance >= MIN_DEER_SPAWN_DISTANCE &&
            avoidDistance >= minAvoidDistance
          ) {
            return { x, y };
          }

          const isBetterAvoidDistance = avoidDistance > bestAvoidDistance;
          const isSameAvoidDistance =
            Math.abs(avoidDistance - bestAvoidDistance) < 0.001;

          if (
            isBetterAvoidDistance ||
            (isSameAvoidDistance && minimumDistance > bestMinimumDistance)
          ) {
            bestAvoidDistance = avoidDistance;
            bestMinimumDistance = minimumDistance;
            bestCandidate = { x, y };
          }
        }

        if (bestCandidate) {
          return bestCandidate;
        }

        return {
          x: GAME_ZONE.left + DEER_HALF_W + 8,
          y: GAME_ZONE.top + DEER_HALF_H + 8
        };
      }

      function playSound(path, volume = 1) {
        try {
          const audio = new Audio(path);
          audio.volume = volume;
          audio.play().catch(() => {});
        } catch (_) {
          // 오디오 재생 실패는 게임 진행에 영향을 주지 않습니다.
        }
      }

      function removeToast(toast) {
        if (!toast) return;

        if (toast.removeTimer !== null) {
          clearTimeout(toast.removeTimer);
          toast.removeTimer = null;
        }

        if (toast.replacedRemoveTimer !== null) {
          clearTimeout(toast.replacedRemoveTimer);
          toast.replacedRemoveTimer = null;
        }

        toast.element.remove();

        if (activeToast === toast) {
          activeToast = null;
        }
      }

      function fadeOutReplacedToast(toast) {
        if (!toast || !toast.element.isConnected) return;

        if (toast.removeTimer !== null) {
          clearTimeout(toast.removeTimer);
          toast.removeTimer = null;
        }

        const currentOpacity = getComputedStyle(
          toast.textElement
        ).opacity;

        toast.textElement.style.setProperty(
          "--toast-current-opacity",
          currentOpacity
        );
        toast.element.classList.add("is-replaced");

        toast.replacedRemoveTimer = window.setTimeout(() => {
          removeToast(toast);
        }, TOAST_REPLACED_FADE_MS);
      }

      function showToast(message) {
        // 새 메시지가 출력되면 기존 토스트는 이동을 유지한 채
        // 현재 투명도에서 0.2초 동안 빠르게 사라집니다.
        if (activeToast !== null) {
          const previousToast = activeToast;
          activeToast = null;
          fadeOutReplacedToast(previousToast);
        }

        const element = document.createElement("div");
        element.className = "toast-message";

        const textElement = document.createElement("span");
        textElement.className = "toast-message-text";
        textElement.textContent = message;
        element.appendChild(textElement);

        toastLayer.appendChild(element);

        const toast = {
          element,
          textElement,
          removeTimer: null,
          replacedRemoveTimer: null
        };

        activeToast = toast;

        toast.removeTimer = window.setTimeout(() => {
          removeToast(toast);
        }, TOAST_DURATION_MS + 100);
      }

      function handleRepairButton(event) {
        playSound(EXPLORE_BUTTON_SOUND);

        if (isExploring) {
          showExploringBusyToast(event);
          return;
        }

        showToast(REPAIR_BLOCKED_TOAST_MESSAGE);
      }

      function handleInventoryButton(event) {
        playSound(EXPLORE_BUTTON_SOUND);

        if (!hasAnyInventoryItem()) {
          showToast(INVENTORY_EMPTY_TOAST_MESSAGE);
          return;
        }

        if (isInventoryOpen) {
          closeInventory();
          return;
        }

        openInventory();
      }

      function handleExploreButton(event) {
        playSound(EXPLORE_BUTTON_SOUND);

        if (isExploring) {
          showExploringBusyToast(event);
          return;
        }

        if (isExplorationMenuOpen) {
          closeExplorationMenu();
          return;
        }

        if (zombieCount < zombieKillRequirement) {
          showToast(EXPLORE_BLOCKED_TOAST_MESSAGE);
          return;
        }

        openExplorationMenu();
      }

      function applyAxeState() {
        axeStump.style.backgroundImage = hasAxe
          ? `url("${STUMP_EMPTY_IMAGE}")`
          : `url("${STUMP_WITH_AXE_IMAGE}")`;
        axeStump.setAttribute("aria-hidden", hasAxe ? "true" : "false");
        axePickupHitArea.hidden = hasAxe;
        axePickupHitArea.style.pointerEvents = hasAxe ? "none" : "auto";
        axePickupHitArea.tabIndex = hasAxe ? -1 : 0;
      }

      function setInventoryCheck(item, checked, ariaLabel) {
        if (!item) return;

        const check = item.querySelector(".inventory-item__equipped");
        if (!check) return;

        check.textContent = checked ? "✓" : "";
        check.setAttribute("aria-label", ariaLabel);
      }

      function applyInventoryState() {
        if (axeInventoryItem) {
          axeInventoryItem.hidden = !hasAxe;
          setInventoryCheck(
            axeInventoryItem,
            hasAxe && isAxeEquipped,
            isAxeEquipped ? "Equipped" : "Unequipped"
          );
        }

        if (musicBoxInventoryItem) {
          musicBoxInventoryItem.hidden = !hasMusicBox;
          setInventoryCheck(
            musicBoxInventoryItem,
            hasMusicBox && isMusicOn,
            isMusicOn ? "Music on" : "Music off"
          );
        }
      }

      function stopBgmPlayback() {
        bgmFadeToken += 1;

        if (bgmStartTimerId !== null) {
          clearTimeout(bgmStartTimerId);
          bgmStartTimerId = null;
        }

        if (bgmFadeFrameId !== null) {
          cancelAnimationFrame(bgmFadeFrameId);
          bgmFadeFrameId = null;
        }

        dayBgmAudio.pause();
        nightBgmAudio.pause();
        dayBgmAudio.volume = document.body.classList.contains("is-night")
          ? 0
          : 1;
        nightBgmAudio.volume = document.body.classList.contains("is-night")
          ? 1
          : 0;
        bgmStartScheduled = false;
        bgmStarted = false;
      }

      async function startBgmPlayback() {
        if (
          !hasMusicBox ||
          !isMusicOn ||
          bgmStarted ||
          bgmStartScheduled
        ) {
          return;
        }

        bgmStartScheduled = true;
        const isNight = document.body.classList.contains("is-night");
        const incomingAudio = isNight ? nightBgmAudio : dayBgmAudio;
        const outgoingAudio = isNight ? dayBgmAudio : nightBgmAudio;

        dayBgmAudio.volume = isNight ? 0 : 1;
        nightBgmAudio.volume = isNight ? 1 : 0;
        outgoingAudio.pause();

        try {
          await incomingAudio.play();
          bgmStarted = true;
        } catch (_) {
          // 저장 상태가 On이어도 자동 재생이 차단될 수 있습니다.
          // 이후 사용자 클릭에서 다시 재생을 시도합니다.
          bgmStarted = false;
        } finally {
          bgmStartScheduled = false;
        }
      }

      function setMusicOn(enabled) {
        isMusicOn = hasMusicBox && enabled;
        applyInventoryState();
        saveResourceState();

        if (isMusicOn) {
          startBgmPlayback();
        } else {
          stopBgmPlayback();
        }
      }

      function awardMusicBox() {
        if (hasMusicBox) return;

        hasMusicBox = true;
        isMusicOn = true;
        applyInventoryState();
        saveResourceState();
        window.setTimeout(() => {
          showToast(MUSIC_BOX_FOUND_TOAST_MESSAGE);
        }, MUSIC_BOX_FOUND_TOAST_DELAY_MS);
        scheduleBgmAfterFirstPlayerKill();
      }

      function collectAxe(event) {
        if (isExploring) {
          showExploringBusyToast(event);
          return;
        }

        if (hasAxe) return;

        if (event) {
          event.preventDefault();
          event.stopPropagation();
        }

        hasAxe = true;
        isAxeEquipped = true;
        applyAxeState();
        applyInventoryState();
        saveResourceState();
        playSound(GET_AXE_SOUND, 0.7);
      }

      function handleAxePickupKeydown(event) {
        if (event.key !== "Enter" && event.key !== " ") return;
        collectAxe(event);
      }

      function scheduleBgmAfterFirstPlayerKill() {
        if (
          !hasMusicBox ||
          !isMusicOn ||
          bgmStartScheduled ||
          bgmStarted ||
          bgmStartTimerId !== null
        ) {
          return;
        }

        bgmStartScheduled = true;
        bgmStartTimerId = window.setTimeout(() => {
          bgmStartTimerId = null;
          bgmStartScheduled = false;
          dayBgmAudio.currentTime = 0;
          nightBgmAudio.currentTime = 0;
          startBgmPlayback();
        }, FIRST_KILL_BGM_DELAY_MS);
      }

      function triggerFirstKillDeer(zombie) {
        if (firstKillDeerSpawned) return;

        const created = createDeer({
          avoidX: zombie.x,
          avoidY: zombie.y,
          minAvoidDistance: FIRST_KILL_DEER_MIN_DISTANCE_FROM_KILL_PX
        });

        if (created) {
          firstKillDeerSpawned = true;
        }
      }

      function playBirdFlySound() {
        let candidateIndex = 0;

        const tryNext = () => {
          if (candidateIndex >= BIRD_FLY_SOUND_CANDIDATES.length) return;

          const audio = new Audio(
            BIRD_FLY_SOUND_CANDIDATES[candidateIndex]
          );
          candidateIndex += 1;
          audio.volume = 1;

          audio.addEventListener("error", tryNext, { once: true });
          audio.play().catch(() => {});
        };

        tryNext();
      }

      function playFallSound() {
        let candidateIndex = 0;

        const tryNext = () => {
          if (candidateIndex >= FALL_SOUND_CANDIDATES.length) return;

          const audio = new Audio(FALL_SOUND_CANDIDATES[candidateIndex]);
          candidateIndex += 1;
          audio.volume = 1;

          audio.addEventListener("error", tryNext, { once: true });
          audio.play().catch(() => {});
        };

        tryNext();
      }

      function setFacing(zombie) {
        if (zombie.direction.x > 0.000001) {
          zombie.facing = 1;
        } else if (zombie.direction.x < -0.000001) {
          zombie.facing = -1;
        }

        // 원본은 왼쪽을 향하므로 오른쪽 이동 시에만 반전합니다.
        const facingTransform =
          zombie.facing === 1 ? "scaleX(-1)" : "scaleX(1)";

        zombie.sprite.style.transform = facingTransform;
        zombie.overlay.style.transform = facingTransform;
      }

      function renderZombie(zombie) {
        zombie.element.style.left = `${zombie.x}px`;
        zombie.element.style.top = `${zombie.y}px`;

        // 화면 아래쪽에 있는 좀비일수록 앞에 보이도록
        // 세로 위치(y)를 기준으로 개별 뎁스를 갱신합니다.
        zombie.element.style.zIndex = String(
          Math.round(zombie.y)
        );
      }

      function showSingleFrame(zombie, sheet, frameIndex) {
        zombie.sprite.style.backgroundImage = `url("${sheet}")`;
        zombie.sprite.style.backgroundPosition =
          framePosition(frameIndex);
        zombie.sprite.style.opacity = "1";

        zombie.overlay.style.opacity = "0";
      }

      function showCrossfade(
        zombie,
        fromSheet,
        fromFrameIndex,
        toSheet,
        toFrameIndex,
        progress
      ) {
        const clampedProgress = clamp(progress, 0, 1);

        zombie.sprite.style.backgroundImage = `url("${fromSheet}")`;
        zombie.sprite.style.backgroundPosition =
          framePosition(fromFrameIndex);
        zombie.sprite.style.opacity =
          String(1 - clampedProgress);

        zombie.overlay.style.backgroundImage = `url("${toSheet}")`;
        zombie.overlay.style.backgroundPosition =
          framePosition(toFrameIndex);
        zombie.overlay.style.opacity =
          String(clampedProgress);
      }

      function setDeerFacing(deer) {
        const facingTransform =
          deer.facing === "left" ? "scaleX(-1)" : "scaleX(1)";
